<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pythagoras’ Theorem Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year8_pythagoras_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Pythagoras’ Theorem</h1><p>Answer all eight questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"prompt":"Right triangle legs 6 and 8 cm. Hypotenuse?","answer":"10 cm","options":["10 cm","14 cm","7 cm","12 cm"],"solution":"√(36 + 64) = 10.","skill":"Hypotenuse","id":"VM-PYT-025"},{"prompt":"Hypotenuse 13 cm, one leg 5 cm. Other leg?","answer":"12 cm","options":["12 cm","8 cm","18 cm","√194 cm"],"solution":"√(169 − 25) = 12.","skill":"Shorter side","id":"VM-PYT-026"},{"prompt":"Which triple forms a right triangle?","answer":"7, 24, 25","options":["7, 24, 25","5, 6, 7","4, 5, 6","8, 9, 10"],"solution":"49 + 576 = 625.","skill":"Converse","id":"VM-PYT-027"},{"prompt":"Rectangle 9 m by 12 m. Diagonal?","answer":"15 m","options":["15 m","21 m","18 m","10 m"],"solution":"√(81 + 144) = 15.","skill":"Applications","id":"VM-PYT-028"},{"prompt":"Which side is the hypotenuse?","answer":"Opposite the right angle","options":["Opposite the right angle","Adjacent to the right angle","Shortest side","Vertical side"],"solution":"The hypotenuse is opposite the 90° angle.","skill":"Identification","id":"VM-PYT-029"},{"prompt":"Right triangle legs 1 cm and 2 cm. Exact hypotenuse?","answer":"√5 cm","options":["√5 cm","3 cm","5 cm","√3 cm"],"solution":"√(1 + 4) = √5.","skill":"Hypotenuse","id":"VM-PYT-030"},{"prompt":"A 10 m ladder reaches 8 m up a wall. Distance from wall?","answer":"6 m","options":["6 m","2 m","18 m","√164 m"],"solution":"√(100 − 64) = 6.","skill":"Applications","id":"VM-PYT-031"},{"prompt":"Do sides 6, 8 and 11 form a right triangle?","answer":"No","options":["No","Yes","Only if rotated","Cannot determine"],"solution":"36 + 64 ≠ 121.","skill":"Converse","id":"VM-PYT-032"},{"skill":"Hypotenuse","prompt":"A right triangle has perpendicular sides 6 cm and 8 cm. Find its hypotenuse.","answer":"10","options":["10","14","12","2"],"solution":"√(6² + 8²) = 10.","level":"Foundation","id":"VM-PYT-038"},{"skill":"Shorter side","prompt":"A right triangle has hypotenuse 26 m and one leg 10 m. Find the other leg.","answer":"24 m","options":["24 m","16","36","20"],"solution":"√(26² − 10²) = 24.","level":"Intermediate","id":"VM-PYT-039"},{"skill":"Applications","prompt":"A rectangular courtyard measures 16 m by 30 m. Find the diagonal.","answer":"34 m","options":["34 m","46","14","32"],"solution":"√(16² + 30²) = 34.","level":"Intermediate","id":"VM-PYT-040"},{"skill":"Converse","prompt":"Which set of lengths forms a right triangle? (All lengths in cm.)","answer":"14, 48, 50","options":["14, 48, 50","14, 48, 52","14, 48, 46","14, 48, 48"],"solution":"7² + 24² = 25²; scaling all sides by 2 preserves equality.","level":"Intermediate","id":"VM-PYT-041"},{"skill":"Hypotenuse","prompt":"A right triangle has perpendicular sides 9 cm and 12 cm. Find its hypotenuse.","answer":"15","options":["15","21","18","3"],"solution":"√(9² + 12²) = 15.","level":"Foundation","id":"VM-PYT-042"},{"skill":"Shorter side","prompt":"A right triangle has hypotenuse 39 m and one leg 15 m. Find the other leg.","answer":"36","options":["36","24","54","30"],"solution":"√(39² − 15²) = 36.","level":"Intermediate","id":"VM-PYT-043"},{"skill":"Applications","prompt":"A rectangular courtyard measures 24 m by 45 m. Find the diagonal.","answer":"51","options":["51","69","21","48"],"solution":"√(24² + 45²) = 51.","level":"Intermediate","id":"VM-PYT-044"},{"skill":"Converse","prompt":"Which set of lengths forms a right triangle? (All lengths in cm.)","answer":"21, 72, 75","options":["21, 72, 75","21, 72, 78","21, 72, 69","21, 72, 72"],"solution":"7² + 24² = 25²; scaling all sides by 3 preserves equality.","level":"Intermediate","id":"VM-PYT-045"},{"skill":"Hypotenuse","prompt":"A right triangle has perpendicular sides 12 cm and 16 cm. Find its hypotenuse.","answer":"20","options":["20","28","24","4"],"solution":"√(12² + 16²) = 20.","level":"Foundation","id":"VM-PYT-046"},{"skill":"Shorter side","prompt":"A right triangle has hypotenuse 52 m and one leg 20 m. Find the other leg.","answer":"48","options":["48","32","72","40"],"solution":"√(52² − 20²) = 48.","level":"Intermediate","id":"VM-PYT-047"},{"skill":"Applications","prompt":"A rectangular courtyard measures 32 m by 60 m. Find the diagonal.","answer":"68","options":["68","92","28","64"],"solution":"√(32² + 60²) = 68.","level":"Intermediate","id":"VM-PYT-048"},{"skill":"Converse","prompt":"Which set of lengths forms a right triangle? (All lengths in cm.)","answer":"28, 96, 100","options":["28, 96, 100","28, 96, 104","28, 96, 92","28, 96, 96"],"solution":"7² + 24² = 25²; scaling all sides by 4 preserves equality.","level":"Intermediate","id":"VM-PYT-049"},{"skill":"Hypotenuse","prompt":"A right triangle has perpendicular sides 15 cm and 20 cm. Find its hypotenuse.","answer":"25","options":["25","35","30","5"],"solution":"√(15² + 20²) = 25.","level":"Foundation","id":"VM-PYT-050"},{"skill":"Shorter side","prompt":"A right triangle has hypotenuse 65 m and one leg 25 m. Find the other leg.","answer":"60","options":["60","40","90","50"],"solution":"√(65² − 25²) = 60.","level":"Intermediate","id":"VM-PYT-051"},{"skill":"Applications","prompt":"A rectangular courtyard measures 40 m by 75 m. Find the diagonal.","answer":"85","options":["85","115","35","80"],"solution":"√(40² + 75²) = 85.","level":"Intermediate","id":"VM-PYT-052"},{"skill":"Converse","prompt":"Which set of lengths forms a right triangle? (All lengths in cm.)","answer":"35, 120, 125","options":["35, 120, 125","35, 120, 130","35, 120, 115","35, 120, 120"],"solution":"7² + 24² = 25²; scaling all sides by 5 preserves equality.","level":"Intermediate","id":"VM-PYT-053"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
