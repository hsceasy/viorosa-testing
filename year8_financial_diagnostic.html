<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Mathematics Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-hei icycle costs $640. Find the original price.","answer":"$800.00","solution":"The sale price is 80% of the original. Divide 640 by 0.8.","options":["$800.00","$512.00","$768.00","$660.00"],"level":"Core","id":"VM-FIN-024"},{"skill":"Discounts","prompt":"A jacket costs $180. Find its price after a 10% discount.","answer":"$162.00","solution":"Multiply 180 by 0.90.","options":["$162.00","$18.00","$342.00","$167.00"],"level":"Core","id":"VM-FIN-025"},{"skill":"GST","prompt":"A service costs $180 before 10% GST. Find the total.","answer":"$198.00","solution":"GST is $18.00; add it to the original price.","options":["$198.00","$18.00","$162.00","$193.00"],"level":"Core","id":"VM-FIN-026"},{"skill":"Profit and loss","prompt":"A shop buys an item for $200 and sells it for $300. Find the profit as a percentage of cost.","answer":"50%","solution":"Profit = $100; divide by $200 and multiply by 100%.","options":["50%","33<span class=\"frac\"><span>1</span><span>3</span></span>%","150%","25%"],"level":"Core","id":"VM-FIN-031"},{"skill":"Reverse percentages","prompt":"After a 20% discount a bicycle costs $800. Find the original price.","answer":"$1000.00","solution":"The sale price is 80% of the original. Divide 800 by 0.8.","options":["$1000.00","$640.00","$960.00","$820.00"],"level":"Core","id":"VM-FIN-032"},{"skill":"Discounts","prompt":"A jacket costs $220. Find its price after a 20% discount.","answer":"$176.00","solution":"Multiply 220 by 0.80.","options":["$176.00","$44.00","$396.00","$181.00"],"level":"Extension","id":"VM-FIN-033"},{"skill":"GST","prompt":"A service costs $220 before 10% GST. Find the total.","answer":"$242.00","solution":"GST is $22.00; add it to the original price.","options":["$242.00","$22.00","$198.00","$233.00"],"level":"Extension","id":"VM-FIN-034"},{"skill":"Profit and loss","prompt":"A shop buys an item for $240 and sells it for $360. Find the profit as a percentage of cost.","answer":"50%","solution":"Profit = $120; divide by $240 and multiply by 100%.","options":["50%","33<span class=\"frac\"><span>1</span><span>3</span></span>%","150%","25%"],"level":"Extension","id":"VM-FIN-039"},{"skill":"Reverse percentages","prompt":"After a 20% discount a bicycle costs $960. Find the original price.","answer":"$1200.00","solution":"The sale price is 80% of the original. Divide 960 by 0.8.","options":["$1200.00","$768.00","$1152.00","$980.00"],"level":"Extension","id":"VM-FIN-040"},{"skill":"Discounts","prompt":"A jacket costs $260. Find its price after a 5% discount.","answer":"$247.00","solution":"Multiply 260 by 0.95.","options":["$247.00","$13.00","$507.00","$252.00"],"level":"Extension","id":"VM-FIN-041"},{"skill":"GST","prompt":"A service costs $260 before 10% GST. Find the total.","answer":"$286.00","solution":"GST is $26.00; add it to the original price.","options":["$286.00","$26.00","$234.00","$273.00"],"level":"Extension","id":"VM-FIN-042"},{"skill":"Profit and loss","prompt":"A shop buys an item for $280 and sells it for $420. Find the profit as a percentage of cost.","answer":"50%","solution":"Profit = $140; divide by $280 and multiply by 100%.","options":["50%","33<span class=\"frac\"><span>1</span><span>3</span></span>%","150%","25%"],"level":"Extension","id":"VM-FIN-047"},{"skill":"Reverse percentages","prompt":"After a 20% discount a bicycle costs $1120. Find the original price.","answer":"$1400.00","solution":"The sale price is 80% of the original. Divide 1120 by 0.8.","options":["$1400.00","$896.00","$1344.00","$1140.00"],"level":"Extension","id":"VM-FIN-048"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
