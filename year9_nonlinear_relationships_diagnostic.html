ex is at the origin and substitution of x = 1 gives coefficient 101.", "level": "Intermediate", "source_paragraph": 247, "options": ["y = x² + 101", "y = −101x²", "y = 101x²", "y = 101x"]}, {"id": "VM-NLI-085", "skill": "Exponential contexts", "prompt": "A population starts at 18 and doubles each hour. Find its size after 3 hours.", "answer": "144", "solution": "Multiply the starting population by 2³ = 8: 144.", "level": "Intermediate", "source_paragraph": 248, "options": ["144", "146", "143", "145"]}, {"id": "VM-NLI-086", "skill": "Tables of values", "prompt": "For y = x², calculate y at x = 19.", "answer": "361", "solution": "Substitute 19 for x and evaluate to get 361.", "level": "Intermediate", "source_paragraph": 242, "options": ["363", "361", "360", "362"]}, {"id": "VM-NLI-087", "skill": "Tables of values", "prompt": "For y = 2<sup>x</sup>, calculate y at x = 19.", "answer": "524288", "solution": "Substitute 19 for x and evaluate to get 524288.", "level": "Intermediate", "source_paragraph": 244, "options": ["524290", "524287", "524289", "524288"]}, {"id": "VM-NLI-088", "skill": "Parabolas", "prompt": "Identify the shape of y = x² + 19.", "answer": "Parabola", "solution": "A quadratic graph is a parabola; adding a constant translates it vertically.", "level": "Intermediate", "source_paragraph": 246, "options": ["Circle", "Exponential curve", "Parabola", "Straight line"]}, {"id": "VM-NLI-089", "skill": "Recognising graphs", "prompt": "A curve passes through (0, 0), (1, 102) and (−1, 102) and is a parabola. Which equation matches it?", "answer": "y = 102x²", "solution": "The vertex is at the origin and substitution of x = 1 gives coefficient 102.", "level": "Intermediate", "source_paragraph": 247, "options": ["y = 102x²", "y = −102x²", "y = 102x", "y = x² + 102"]}, {"id": "VM-NLI-090", "skill": "Exponential contexts", "prompt": "A population starts at 19 and doubles each hour. Find its size after 3 hours.", "answer": "152", "solution": "Multiply the starting population by 2³ = 8: 152.", "level": "Intermediate", "source_paragraph": 248, "options": ["154", "151", "152", "153"]}, {"id": "VM-NLI-091", "skill": "Tables of values", "prompt": "For y = x², calculate y at x = 20.", "answer": "400", "solution": "Substitute 20 for x and evaluate to get 400.", "level": "Intermediate", "source_paragraph": 242, "options": ["400", "402", "399", "401"]}, {"id": "VM-NLI-092", "skill": "Tables of values", "prompt": "For y = 2<sup>x</sup>, calculate y at x = 20.", "answer": "1048576", "solution": "Substitute 20 for x and evaluate to get 1048576.", "level": "Intermediate", "source_paragraph": 244, "options": ["1048576", "1048577", "1048575", "1048578"]}, {"id": "VM-NLI-093", "skill": "Parabolas", "prompt": "Identify the shape of y = x² + 20.", "answer": "Parabola", "solution": "A quadratic graph is a parabola; adding a constant translates it vertically.", "level": "Intermediate", "source_paragraph": 246, "options": ["Exponential curve", "Straight line", "Circle", "Parabola"]}, {"id": "VM-NLI-094", "skill": "Recognising graphs", "prompt": "A curve passes through (0, 0), (1, 103) and (−1, 103) and is a parabola. Which equation matches it?", "answer": "y = 103x²", "solution": "The vertex is at the origin and substitution of x = 1 gives coefficient 103.", "level": "Intermediate", "source_paragraph": 247, "options": ["y = −103x²", "y = 103x", "y = x² + 103", "y = 103x²"]}, {"id": "VM-NLI-095", "skill": "Exponential contexts", "prompt": "A population starts at 20 and doubles each hour. Find its size after 3 hours.", "answer": "160", "solution": "Multiply the starting population by 2³ = 8: 160.", "level": "Intermediate", "source_paragraph": 248, "options": ["161", "160", "162", "159"]}, {"id": "VM-NLI-096", "skill": "Tables of values", "prompt": "For y = x², calculate y at x = 21.", "answer": "441", "solution": "Substitute 21 for x and evaluate to get 441.", "level": "Intermediate", "source_paragraph": 242, "options": ["441", "443", "440", "442"]}, {"id": "VM-NLI-097", "skill": "Tables of values", "prompt": "For y = 2<sup>x</sup>, calculate y at x = 21.", "answer": "2097152", "solution": "Substitute 21 for x and evaluate to get 2097152.", "level": "Intermediate", "source_paragraph": 244, "options": ["2097154", "2097153", "2097151", "2097152"]}, {"id": "VM-NLI-098", "skill": "Parabolas", "prompt": "Identify the shape of y = x² + 21.", "answer": "Parabola", "solution": "A quadratic graph is a parabola; adding a constant translates it vertically.", "level": "Intermediate", "source_paragraph": 246, "options": ["Exponential curve", "Circle", "Straight line", "Parabola"]}, {"id": "VM-NLI-099", "skill": "Recognising graphs", "prompt": "A curve passes through (0, 0), (1, 104) and (−1, 104) and is a parabola. Which equation matches it?", "answer": "y = 104x²", "solution": "The vertex is at the origin and substitution of x = 1 gives coefficient 104.", "level": "Intermediate", "source_paragraph": 247, "options": ["y = −104x²", "y = 104x", "y = x² + 104", "y = 104x²"]}, {"id": "VM-NLI-100", "skill": "Exponential contexts", "prompt": "A population starts at 21 and doubles each hour. Find its size after 3 hours.", "answer": "168", "solution": "Multiply the starting population by 2³ = 8: 168.", "level": "Intermediate", "source_paragraph": 248, "options": ["169", "167", "170", "168"]}, {"id": "VM-NLI-101", "skill": "Tables of values", "prompt": "For y = x², calculate y at x = 22.", "answer": "484", "solution": "Substitute 22 for x and evaluate to get 484.", "level": "Intermediate", "source_paragraph": 242, "options": ["483", "484", "486", "485"]}, {"id": "VM-NLI-102", "skill": "Tables of values", "prompt": "For y = 2<sup>x</sup>, calculate y at x = 22.", "answer": "4194304", "solution": "Substitute 22 for x and evaluate to get 4194304.", "level": "Intermediate", "source_paragraph": 244, "options": ["4194304", "4194303", "4194306", "4194305"]}, {"id": "VM-NLI-103", "skill": "Parabolas", "prompt": "Identify the shape of y = x² + 22.", "answer": "Parabola", "solution": "A quadratic graph is a parabola; adding a constant translates it vertically.", "level": "Intermediate", "source_paragraph": 246, "options": ["Straight line", "Parabola", "Exponential curve", "Circle"]}, {"id": "VM-NLI-104", "skill": "Recognising graphs", "prompt": "A curve passes through (0, 0), (1, 105) and (−1, 105) and is a parabola. Which equation matches it?", "answer": "y = 105x²", "solution": "The vertex is at the origin and substitution of x = 1 gives coefficient 105.", "level": "Intermediate", "source_paragraph": 247, "options": ["y = −105x²", "y = 105x", "y = x² + 105", "y = 105x²"]}, {"skill": "Quadratic relationships", "kind": "Fluency", "prompt": "Find y at x = 4.", "answer": "17", "options": ["17", "8", "16", "9"], "solution": "y = 4² + 1<br>= 16 + 1<br>= 17", "id": "Y9-nonlinear_relationships-25", "level": "s5"}, {"skill": "Quadratic tables", "kind": "Fluency", "prompt": "Find y = x² at x = −3.", "answer": "9", "options": ["9", "−9", "6", "−6"], "solution": "y = (−3)²<br>= 9", "id": "Y9-nonlinear_relationships-26", "level": "s5"}, {"skill": "Plotting parabolas", "kind": "Fluency", "prompt": "Find y at x = 3.", "answer": "8", "options": ["8", "9", "6", "−8"], "solution": "y = 3² − 1<br>= 9 − 1<br>= 8", "id": "Y9-nonlinear_relationships-27", "level": "s5"}, {"skill": "Recognising parabolas", "kind": "Fluency", "prompt": "Which way does y = 2x² open?", "answer": "Upwards", "options": ["Upwards", "Downwards", "Horizontal", "Straight"], "solution": "Coefficient = 2 > 0<br>Upwards.", "id": "Y9-nonlinear_relationships-28", "level": "s5"}, {"skill": "Exponential tables", "kind": "Fluency", "prompt": "Find y = 3ˣ at x = 2.", "answer": "9", "options": ["9", "6", "8", "3"], "solution": "y = 3²<br>= 3 × 3<br>= 9", "id": "Y9-nonlinear_relationships-29", "level": "s5"}, {"skill": "Exponential decay", "kind": "Fluency", "prompt": "Find Q after 2 hours.", "answer": "16", "options": ["16", "32", "8", "48"], "solution": "Q = 64 × (0.5)²<br>= 64 × 0.25<br>= 16", "id": "Y9-nonlinear_relationships-30", "level": "s5"}, {"skill": "Quadratics in context", "kind": "Fluency", "prompt": "Find area for side 7 cm.", "answer": "49 cm²", "options": ["49 cm²", "14 cm²", "28 cm²", "49 cm"], "solution": "A = 7²<br>= 49 cm²", "id": "Y9-nonlinear_relationships-31", "level": "s5"}, {"skill": "Digital graphing", "kind": "Fluency", "prompt": "Does (3,8) lie on y = 2ˣ?", "answer": "Yes", "options": ["Yes", "No", "Only if x = 2", "Undefined"], "solution": "RHS = 2³<br>= 8<br>Yes.", "id": "Y9-nonlinear_relationships-32", "level": "s5"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
