IN-166", "skill": "Short-term borrowing", "prompt": "Loan A charges $80 in fees. Loan B charges $135 for the same amount and term. How much cheaper is A?", "answer": "$55.00", "solution": "Subtract the fee for A from the fee for B. Answer: $55.00", "level": "Intermediate", "source_paragraph": 101, "options": ["$60.00", "$50.00", "$65.00", "$55.00"]}, {"id": "VM-FIN-167", "skill": "Penalty rates", "prompt": "A worker earns $29 per hour for 8 ordinary hours and 9 overtime hours at time-and-a-half. Find gross pay.", "answer": "$623.50", "solution": "Ordinary pay: $232.00. Overtime: 9 × $43.50. Add both amounts. Answer: $623.50", "level": "Intermediate", "source_paragraph": 86, "options": ["$618.50", "$633.50", "$628.50", "$623.50"]}, {"id": "VM-FIN-168", "skill": "Non-wage earnings", "prompt": "A salesperson earns 9% commission on $12000 in sales. Find commission.", "answer": "$1,080.00", "solution": "Multiply sales by 9/100. Answer: $1,080.00", "level": "Intermediate", "source_paragraph": 88, "options": ["$1,090.00", "$1,080.00", "$1,075.00", "$1,085.00"]}, {"id": "VM-FIN-169", "skill": "Pay periods", "prompt": "A worker earns $1200 weekly. Find annual earnings using 52 weeks.", "answer": "$62,400.00", "solution": "Multiply weekly pay by 52. Answer: $62,400.00", "level": "Intermediate", "source_paragraph": 89, "options": ["$62,405.00", "$62,410.00", "$62,395.00", "$62,400.00"]}, {"id": "VM-FIN-170", "skill": "Leave loading", "prompt": "Eligible leave pay is $1200. Calculate additional leave loading at 17.5%.", "answer": "$210.00", "solution": "Multiply eligible pay by 0.175. Answer: $210.00", "level": "Intermediate", "source_paragraph": 90, "options": ["$215.00", "$210.00", "$205.00", "$220.00"]}, {"id": "VM-FIN-171", "skill": "PAYG deductions", "prompt": "A supplied example payroll table lists weekly gross pay $1200 and PAYG withholding $90. What is the withholding for two identical weeks?", "answer": "$180.00", "solution": "Add two weekly withholding amounts of $90. These are illustrative figures. Answer: $180.00", "level": "Intermediate", "source_paragraph": 91, "options": ["$190.00", "$185.00", "$180.00", "$175.00"]}, {"id": "VM-FIN-172", "skill": "Taxable income", "prompt": "Annual income is $120000 and allowable deductions total $900. Find taxable income.", "answer": "$119,100.00", "solution": "Subtract allowable deductions from income. Answer: $119,100.00", "level": "Intermediate", "source_paragraph": 92, "options": ["$119,095.00", "$119,110.00", "$119,100.00", "$119,105.00"]}, {"id": "VM-FIN-173", "skill": "Net earnings", "prompt": "Gross weekly pay is $1200. Tax is $90 and other deductions are $45. Find net pay.", "answer": "$1,065.00", "solution": "Subtract both deductions from gross pay. Answer: $1,065.00", "level": "Intermediate", "source_paragraph": 93, "options": ["$1,075.00", "$1,065.00", "$1,070.00", "$1,060.00"]}, {"id": "VM-FIN-174", "skill": "Simple interest", "prompt": "An investment of $1200 earns 9% simple interest annually for 3 years. Find total interest.", "answer": "$324.00", "solution": "Use I = Prt: 1200 × 0.09 × 3. Answer: $324.00", "level": "Intermediate", "source_paragraph": 95, "options": ["$334.00", "$324.00", "$329.00", "$319.00"]}, {"id": "VM-FIN-175", "skill": "Simple interest", "prompt": "An investment of $1200 earns 9% simple interest annually for 2 years. Find total interest.", "answer": "$216.00", "solution": "Use I = Prt: 1200 × 0.09 × 2. Answer: $216.00", "level": "Intermediate", "source_paragraph": 96, "options": ["$211.00", "$226.00", "$221.00", "$216.00"]}, {"id": "VM-FIN-176", "skill": "Buying on terms", "prompt": "A purchase requires a $900 deposit and 12 payments of $120. Find total cost.", "answer": "$2,340.00", "solution": "Add the deposit and all 12 repayments. Answer: $2,340.00", "level": "Intermediate", "source_paragraph": 98, "options": ["$2,335.00", "$2,350.00", "$2,340.00", "$2,345.00"]}, {"id": "VM-FIN-177", "skill": "Buy now pay later", "prompt": "A $1200 purchase is paid in four equal instalments. Two late fees of $9 are charged. Find total paid.", "answer": "$1,218.00", "solution": "Add both late fees to the purchase price. Answer: $1,218.00", "level": "Intermediate", "source_paragraph": 99, "options": ["$1,213.00", "$1,223.00", "$1,218.00", "$1,228.00"]}, {"id": "VM-FIN-178", "skill": "Short-term borrowing", "prompt": "Loan A charges $90 in fees. Loan B charges $150 for the same amount and term. How much cheaper is A?", "answer": "$60.00", "solution": "Subtract the fee for A from the fee for B. Answer: $60.00", "level": "Intermediate", "source_paragraph": 101, "options": ["$55.00", "$60.00", "$70.00", "$65.00"]}, {"id": "VM-FIN-179", "skill": "Penalty rates", "prompt": "A worker earns $30 per hour for 8 ordinary hours and 10 overtime hours at time-and-a-half. Find gross pay.", "answer": "$690.00", "solution": "Ordinary pay: $240.00. Overtime: 10 × $45.00. Add both amounts. Answer: $690.00", "level": "Intermediate", "source_paragraph": 86, "options": ["$685.00", "$695.00", "$700.00", "$690.00"]}, {"id": "VM-FIN-180", "skill": "Non-wage earnings", "prompt": "A salesperson earns 10% commission on $13000 in sales. Find commission.", "answer": "$1,300.00", "solution": "Multiply sales by 10/100. Answer: $1,300.00", "level": "Intermediate", "source_paragraph": 88, "options": ["$1,295.00", "$1,300.00", "$1,305.00", "$1,310.00"]}, {"id": "VM-FIN-181", "skill": "Pay periods", "prompt": "A worker earns $1300 weekly. Find annual earnings using 52 weeks.", "answer": "$67,600.00", "solution": "Multiply weekly pay by 52. Answer: $67,600.00", "level": "Intermediate", "source_paragraph": 89, "options": ["$67,605.00", "$67,600.00", "$67,610.00", "$67,595.00"]}, {"id": "VM-FIN-182", "skill": "Leave loading", "prompt": "Eligible leave pay is $1300. Calculate additional leave loading at 17.5%.", "answer": "$227.50", "solution": "Multiply eligible pay by 0.175. Answer: $227.50", "level": "Intermediate", "source_paragraph": 90, "options": ["$227.50", "$232.50", "$237.50", "$222.50"]}, {"id": "VM-FIN-183", "skill": "PAYG deductions", "prompt": "A supplied example payroll table lists weekly gross pay $1300 and PAYG withholding $100. What is the withholding for two identical weeks?", "answer": "$200.00", "solution": "Add two weekly withholding amounts of $100. These are illustrative figures. Answer: $200.00", "level": "Intermediate", "source_paragraph": 91, "options": ["$195.00", "$200.00", "$210.00", "$205.00"]}, {"id": "VM-FIN-184", "skill": "Taxable income", "prompt": "Annual income is $130000 and allowable deductions total $1000. Find taxable income.", "answer": "$129,000.00", "solution": "Subtract allowable deductions from income. Answer: $129,000.00", "level": "Intermediate", "source_paragraph": 92, "options": ["$128,995.00", "$129,010.00", "$129,005.00", "$129,000.00"]}, {"id": "VM-FIN-185", "skill": "Net earnings", "prompt": "Gross weekly pay is $1300. Tax is $100 and other deductions are $50. Find net pay.", "answer": "$1,150.00", "solution": "Subtract both deductions from gross pay. Answer: $1,150.00", "level": "Intermediate", "source_paragraph": 93, "options": ["$1,150.00", "$1,155.00", "$1,160.00", "$1,145.00"]}, {"id": "VM-FIN-186", "skill": "Simple interest", "prompt": "An investment of $1300 earns 10% simple interest annually for 3 years. Find total interest.", "answer": "$390.00", "solution": "Use I = Prt: 1300 × 0.1 × 3. Answer: $390.00", "level": "Intermediate", "source_paragraph": 95, "options": ["$395.00", "$390.00", "$385.00", "$400.00"]}, {"skill": "Wages and penalty rates", "kind": "Fluency", "prompt": "Work 20 hours at $25 and 4 hours at double time.", "answer": "$700", "options": ["$700", "$600", "$500", "$800"], "solution": "Double rate = 25 × 2 = $50<br>Total = 20 × 25 + 4 × 50<br>= 500 + 200<br>= $700", "id": "Y9-financial_mathematics-25", "level": "s5"}, {"skill": "Commission, piecework and royalties", "kind": "Fluency", "prompt": "Earn 5% royalties on $6000 sales.", "answer": "$300", "options": ["$300", "$30", "$1200", "$600"], "solution": "Royalty = <span class=\"frac\"><span>5</span><span>100</span></span> × 6000<br>= 0.05 × 6000<br>= $300", "id": "Y9-financial_mathematics-26", "level": "s5"}, {"skill": "Pay periods", "kind": "Fluency", "prompt": "Convert $1200 fortnightly to annual.", "answer": "$31,200", "options": ["$31,200", "$62,400", "$14,400", "$24,000"], "solution": "Annual = 1200 × 26<br>= $31,200", "id": "Y9-financial_mathematics-27", "level": "s5"}, {"skill": "Leave loading", "kind": "Fluency", "prompt": "Find loading on $2000 at 17.5%.", "answer": "$350", "options": ["$350", "$175", "$2350", "$35"], "solution": "Loading = <span class=\"frac\"><span>17.5</span><span>100</span></span> × 2000<br>= 0.175 × 2000<br>= $350", "id": "Y9-financial_mathematics-28", "level": "s5"}, {"skill": "Taxable income and tax", "kind": "Fluency", "prompt": "Income $40,000 and allowable deductions $1000. Find taxable income.", "answer": "$39000", "options": ["$39000", "$41000", "$40000", "$1000"], "solution": "40000 − 1000<br>= $39000", "id": "Y9-financial_mathematics-29", "level": "s5"}, {"skill": "Simple interest", "kind": "Fluency", "prompt": "Invest $1500 at 6% p.a. for 2 years. Find interest.", "answer": "$180", "options": ["$180", "$90", "$1680", "$18"], "solution": "I = 1500 × 0.06 × 2<br>= 90 × 2<br>= $180", "id": "Y9-financial_mathematics-30", "level": "s5"}, {"skill": "Buying on terms", "kind": "Fluency", "prompt": "Deposit $100 and 10 payments of $60. Find total.", "answer": "$700", "options": ["$700", "$600", "$160", "$1000"], "solution": "Total = 100 + 10 × 60<br>= 100 + 600<br>= $700", "id": "Y9-financial_mathematics-31", "level": "s5"}, {"skill": "Short-term loans", "kind": "Fluency", "prompt": "Borrow $300 and repay $345 including fees. Find cost.", "answer": "$45", "options": ["$45", "$345", "$300", "$15"], "solution": "Cost = 345 − 300<br>= $45", "id": "Y9-financial_mathematics-32", "level": "s5"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
