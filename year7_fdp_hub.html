option></select></label></div><button id="newtest" hidden>New mini-test</button><div id="questions"></div></main><script>const bank=[{"id":"VM-FDP-001","section":"Skill practice","group":"Fractions","skill":"Visual fractions","prompt":"What fraction of this bar is shaded? Give your answer in simplest form.<svg class=\"question-diagram\" viewBox=\"0 0 300 52\" role=\"img\" aria-label=\"Eight equal cells, six shaded\"><title>Eight equal cells, six shaded</title><rect x=\"10.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"45.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"80.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"115.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"150.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"185.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"220.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"255.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/></svg>","answer":"<span class=\"frac\"><span>3</span><span>4</span></span>","solution":"Six of eight equal parts are shaded. Simplify <span class=\"frac\"><span>6</span><span>8</span></span> by dividing both terms by 2.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-002","section":"Skill practice","group":"Fractions","skill":"Addition and subtraction","prompt":"Calculate <span class=\"frac\"><span>2</span><span>5</span></span> + <span class=\"frac\"><span>1</span><span>3</span></span>.","answer":"<span class=\"frac\"><span>11</span><span>15</span></span>","solution":"Use a common denominator: <span class=\"frac\"><span>6</span><span>15</span></span> + <span class=\"frac\"><span>5</span><span>15</span></span> = <span class=\"frac\"><span>11</span><span>15</span></span>.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-003","section":"Skill practice","group":"Fractions","skill":"Fraction multiplication","prompt":"Calculate <span class=\"frac\"><span>2</span><span>3</span></span> × <span class=\"frac\"><span>3</span><span>5</span></span>. Simplify your answer.","answer":"<span class=\"frac\"><span>2</span><span>5</span></span>","solution":"Multiply numerators and denominators, then simplify <span class=\"frac\"><span>6</span><span>15</span></span> to <span class=\"frac\"><span>2</span><span>5</span></span>.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-004","section":"Skill practice","group":"Fractions","skill":"Mixed numbers","prompt":"Write <span class=\"frac\"><span>12</span><span>5</span></span> as a mixed number.","answer":"2 <span class=\"frac\"><span>2</span><span>5</span></span>","solution":"Divide 12 by 5: quotient 2, remainder 2. Simplify the fractional part.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-005","section":"Skill practice","group":"Decimals","skill":"Decimal operations","prompt":"Calculate 0.3 − 0.07.","answer":"0.23","solution":"Align decimal places and subtract: 0.23.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-006","section":"Skill practice","group":"Decimals","skill":"Decimal division","prompt":"Calculate 2.52 ÷ 0.12.","answer":"21","solution":"Multiply both numbers by 100: 252 ÷ 12 = 21.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-007","section":"Skill practice","group":"Decimals","skill":"Rounding","prompt":"Round 1.176 to one decimal place.","answer":"1.2","solution":"The hundredths digit is 7, so round the tenths digit up.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-008","section":"Skill practice","group":"Percentages","skill":"Percentage of a quantity","prompt":"Find 10% of 20.","answer":"2","solution":"Multiply 20 by <span class=\"frac\"><span>1</span><span>10</span></span> to obtain 2.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-009","section":"Skill practice","group":"Percentages","skill":"Percentage change","prompt":"A $20 bag is discounted by 10%. Find the sale price.","answer":"$18.00","solution":"Pay 90% of the original price: 20 × 0.9.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-010","section":"Skill practice","group":"Mixed","skill":"Conversions","prompt":"Write 10% as a simplified fraction and a decimal.","answer":"<span class=\"frac\"><span>1</span><span>10</span></span> and 0.1","solution":"10% means <span class=\"frac\"><span>10</span><span>100</span></span>. Simplify the fraction and divide by 100 for the decimal.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-011","section":"Skill practice","group":"Mixed","skill":"Comparing representations","prompt":"Which is larger: <span class=\"frac\"><span>2</span><span>5</span></span> or 0.1? If equal, say so.","answer":"<span class=\"frac\"><span>2</span><span>5</span></span>","solution":"Write the decimal as <span class=\"frac\"><span>1</span><span>10</span></span>. Cross multiply: 2 × 10 = 20 and 1 × 5 = 5. Since 20 &gt; 5, <span class=\"frac\"><span>2</span><span>5</span></span> is larger.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-012","section":"Skill practice","group":"Mixed","skill":"Applications","prompt":"A tank contains 100 L. First <span class=\"frac\"><span>1</span><span>5</span></span> of the water is used, then 10% of the remainder is used. How much remains?","answer":"72 L","solution":"After the first use, 80 L remain. Multiply this by 0.9 to find the final volume.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-013","section":"Skill practice","group":"Fractions","skill":"Equivalent fractions","prompt":"Do these equal-length bars show equivalent fractions?<svg class=\"question-diagram\" viewBox=\"0 0 300 52\" role=\"img\" aria-label=\"Three equal cells, two shaded\"><title>Three equal cells, two shaded</title><rect x=\"10.000\" y=\"8\" width=\"93.333\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"103.333\" y=\"8\" width=\"93.333\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"196.667\" y=\"8\" width=\"93.333\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/></svg><svg class=\"question-diagram\" viewBox=\"0 0 300 52\" role=\"img\" aria-label=\"Nine equal cells, six shaded\"><title>Nine equal cells, six shaded</title><rect x=\"10.000\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"41.111\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"72.222\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"103.333\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"134.444\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"165.556\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"196.667\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"227.778\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"258.889\" y=\"8\" width=\"31.111\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/></svg>","answer":"Yes","solution":"<span class=\"frac\"><span>2</span><span>3</span></span> = <span class=\"frac\"><span>6</span><span>9</span></span> because both terms are multiplied by 3.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-014","section":"Skill practice","group":"Fractions","skill":"Addition and subtraction","prompt":"Calculate <span class=\"frac\"><span>1</span><span>2</span></span> + <span class=\"frac\"><span>2</span><span>7</span></span>.","answer":"<span class=\"frac\"><span>11</span><span>14</span></span>","solution":"Use a common denominator: <span class=\"frac\"><span>7</span><span>14</span></span> + <span class=\"frac\"><span>4</span><span>14</span></span> = <span class=\"frac\"><span>11</span><span>14</span></span>.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-015","section":"Skill practice","group":"Fractions","skill":"Fraction multiplication","prompt":"Calculate <span class=\"frac\"><span>3</span><span>4</span></span> × <span class=\"frac\"><span>3</span><span>5</span></span>. Simplify your answer.","answer":"<span class=\"frac\"><span>9</span><span>20</span></span>","solution":"Multiply the numerators and denominators to obtain <span class=\"frac\"><span>9</span><span>20</span></span>. The numerator and denominator have no common factor greater than 1, so this is already in simplest form.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-016","section":"Skill practice","group":"Fractions","skill":"Mixed numbers","prompt":"Write <span class=\"frac\"><span>15</span><span>6</span></span> as a mixed number.","answer":"2 <span class=\"frac\"><span>1</span><span>2</span></span>","solution":"Divide 15 by 6: quotient 2, remainder 3. Simplify the fractional part.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-017","section":"Skill practice","group":"Decimals","skill":"Decimal operations","prompt":"Calculate 0.4 − 0.08.","answer":"0.32","solution":"Align decimal places and subtract: 0.32.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-018","section":"Skill practice","group":"Decimals","skill":"Decimal division","prompt":"Calculate 3.36 ÷ 0.12.","answer":"28","solution":"Multiply both numbers by 100: 336 ÷ 12 = 28.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-019","section":"Skill practice","group":"Decimals","skill":"Terminating and recurring decimals","prompt":"Write <span class=\"frac\"><span>3</span><span>8</span></span> as a decimal. Does it terminate or recur?","answer":"0.375; terminating","solution":"Divide 3 by 8. The remainder becomes zero after three decimal places.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-020","section":"Skill practice","group":"Percentages","skill":"Percentage of a quantity","prompt":"Find 15% of 24.","answer":"3.6","solution":"Multiply 24 by <span class=\"frac\"><span>3</span><span>20</span></span> to obtain 3.6.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-021","section":"Skill practice","group":"Percentages","skill":"Percentage change","prompt":"A $24 bag is discounted by 15%. Find the sale price.","answer":"$20.40","solution":"Pay 85% of the original price: 24 × 0.85.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-022","section":"Skill practice","group":"Mixed","skill":"Conversions","prompt":"Express the shaded part as a decimal and a percentage.<svg class=\"question-diagram\" viewBox=\"0 0 300 52\" role=\"img\" aria-label=\"Eight equal cells, three shaded\"><title>Eight equal cells, three shaded</title><rect x=\"10.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"45.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"80.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#a86d99\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"115.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"150.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"185.000\" y=\"8\" width=\"35.000\" height=\"36\" fill=\"#ffffff\" stroke=\"#50404b\" stroke-width=\"1.5\"/><rect x=\"220.000\" y=\" versions","prompt":"A student writes 0.07 = 70%. Correct the conversion.","answer":"7%","solution":"Multiply 0.07 by 100 to express it as a percentage.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-119","section":"Spot the mistake","group":"Mixed","skill":"Comparing representations","prompt":"Which is larger: <span class=\"frac\"><span>11</span><span>14</span></span> or 0.55? If equal, say so. A student suggests this method: “Compare the numerator directly with the decimal.” Explain why it is unreliable and show the correct method.","answer":"<span class=\"frac\"><span>11</span><span>14</span></span>","solution":"Compare 220 and 154 by cross multiplication.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-120","section":"Spot the mistake","group":"Mixed","skill":"Applications","prompt":"A tank contains 280 L. First <span class=\"frac\"><span>1</span><span>5</span></span> of the water is used, then 55% of the remainder is used. How much remains? A student suggests this method: “Apply both reductions to the original amount.” Explain why it is unreliable and show the correct method.","answer":"100.8 L","solution":"After the first use, 224 L remain. Multiply this by 0.45 to find the final volume.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-121","section":"Challenge questions","group":"Fractions","skill":"Equivalent fractions","prompt":"Find the smallest positive denominator greater than 9 for a fraction equivalent to <span class=\"frac\"><span>2</span><span>9</span></span>. Give the fraction and explain.","answer":"<span class=\"frac\"><span>4</span><span>18</span></span>","solution":"The fraction is in simplest form because 9 is odd. Denominators must be multiples of 9; the next is 18.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-122","section":"Challenge questions","group":"Fractions","skill":"Fraction reasoning","prompt":"A ribbon is 3 m long. Two pieces measuring <span class=\"frac\"><span>3</span><span>4</span></span> m and <span class=\"frac\"><span>5</span><span>6</span></span> m are removed. How much remains?","answer":"<span class=\"frac\"><span>17</span><span>12</span></span> m","solution":"The removed length is <span class=\"frac\"><span>9</span><span>12</span></span> + <span class=\"frac\"><span>5</span><span>6</span></span> = <span class=\"frac\"><span>19</span><span>12</span></span> m. Subtract this from 3 m.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-123","section":"Challenge questions","group":"Fractions","skill":"Fraction multiplication","prompt":"A garden has 72 plants. <span class=\"frac\"><span>3</span><span>8</span></span> are herbs and <span class=\"frac\"><span>2</span><span>3</span></span> of the herbs are mint. How many mint plants are there?","answer":"18","solution":"Herbs: 72 × <span class=\"frac\"><span>3</span><span>8</span></span> = 27. Mint: 27 × <span class=\"frac\"><span>2</span><span>3</span></span> = 18.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-124","section":"Challenge questions","group":"Fractions","skill":"Fraction division","prompt":"A container holds 3 <span class=\"frac\"><span>1</span><span>2</span></span> L. Each bottle holds <span class=\"frac\"><span>3</span><span>4</span></span> L. How many full bottles can be filled, and how much remains?","answer":"4 bottles; <span class=\"frac\"><span>1</span><span>2</span></span> L","solution":"Divide <span class=\"frac\"><span>7</span><span>2</span></span> by <span class=\"frac\"><span>3</span><span>4</span></span> to obtain <span class=\"frac\"><span>14</span><span>3</span></span>. Take the whole-number part, then subtract the volume of the full bottles.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-125","section":"Challenge questions","group":"Decimals","skill":"Decimal division","prompt":"A 3.75 m cord is cut into pieces of length 0.35 m. Find the maximum number of complete pieces and the leftover length.","answer":"10 pieces; 0.25 m","solution":"Convert to centimetres: 375 ÷ 35 gives 10 whole pieces and 25 cm remaining.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-126","section":"Challenge questions","group":"Decimals","skill":"Decimal applications","prompt":"A shop sells 3 notebooks at $2.85 each and a pen for $1.65. How much change from $30?","answer":"$19.80","solution":"Total cost = 3 × $2.85 + $1.65 = $10.20. Subtract from $30.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-127","section":"Challenge questions","group":"Decimals","skill":"Rounding reasoning","prompt":"A length rounded to one decimal place is 3.4 m. What is the smallest possible length if it was originally recorded to two decimal places?","answer":"3.35 m","solution":"3.35 rounds up to 3.4; 3.34 rounds down to 3.3.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — fractions, decimals and percentages (candidate)"],"review_status":"draft"},{"id":"VM-FDP-128","section":"Challenge questions","group":"Percentages","skill":"Reverse percentages","prompt":"After a 20% discount, a jacket costs $48. Find the original price.","answer":"$60","solution":"The sale price is 80% let a=pool().filter(q=>q.section!=='Spot the mistake');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}test=a.slice(0,10);}function render(){for(const b of $('nav').children)b.setAttribute('aria-pressed',b.textContent===section);$('newtest').hidden=section!=='Mini-tests';let qs=section==='Mini-tests'?test:pool().filter(q=>q.section===section);$('questions').replaceChildren();for(const q of qs){let a=document.createElement('article');let h=document.createElement('small');h.textContent=q.skill+' · '+q.difficulty;let p=document.createElement('p');p.innerHTML=q.prompt;let d=document.createElement('details');let sm=document.createElement('summary');sm.textContent='Show worked solution';let w=document.createElement('p');w.innerHTML=q.solution+' <strong>Answer:</strong> '+q.answer;d.append(sm,w);if(section==='Worked examples')d.open=true;a.append(h,p,d);$('questions').append(a);}if(!qs.length)$('questions').textContent='No questions match these filters.';}for(const s of sections){let b=document.createElement('button');b.textContent=s;b.onclick=()=>{section=s;if(s==='Mini-tests')sample();render();};$('nav').append(b);}for(const s of ['All',...new Set(bank.map(q=>q.skill))])$('skill').add(new Option(s,s));for(const id of ['skill','difficulty','group'])$(id).onchange=()=>{if(section==='Mini-tests')sample();render();};$('newtest').onclick=()=>{sample();render();};$('move').onclick=draw;draw();render();</script></html>
