<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratios and Rates Diagnostic | Viorosa Maths</title><style>body{margin:0;background:#fff9f4;color:#493843;font:17px system-ui}main{max-width:900px;margin:auto;padding:24px}h1{font-family:Georgia;color:#a45070}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:10px 16px;border:1px solid #d9b4bc;border-radius:12px;background:#fbe6df;color:inherit;cursor:pointer}select{font:inherit;max-width:100%;padding:8px}article{overflow-wrap:anywhere}button[aria-pressed=true]{background:#f4dda0}article{background:white;border:1px solid #ecd8d0;border-radius:16px;padding:20px;margin:16px 0}label{display:block;padding:8px}summary{cursor:pointer} .notice{background:#f9edc9;padding:12px;border-radius:10px}img,svg{max-width:100%} .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac>*:first-child{border-bottom:1px solid} .filters{display:flex;flex-wrap:wrap;gap:8px} button:focus-visible,select:focus-visible{outline:3px solid #8563a6} .choices{display:flex;flex-wrap:wrap;gap:8px} article small{color:#854661} h2{font-family:Georgia} .score{font-weight:bold} *{box-sizing:border-box}body{background:linear-gradient(#fff8f2,#fff);line-height:1.55}main{max-width:1220px;padding:22px 20px 80px}.hero{background:linear-gradient(112deg,#ffe4d8,#f9edc9 55%,#f0e6f5);border-radius:30px;padding:38px 40px}.hero h1{font:800 clamp(2.5rem,5vw,4.5rem)/1.1 system-ui;letter-spacing:-.055em;margin:12px 0;color:#50404b}.eyebrow{font-size:.84rem;letter-spacing:.15em;font-weight:800;color:#87465a}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:26px 0}nav button{min-height:64px;background:white;font-weight:750;border-radius:17px}nav button[aria-pressed=true]{background:#a64e65;color:white;border-color:#a64e65}article{border-radius:20px;padding:23px 25px;box-shadow:0 3px 14px #6755890a}article details{background:#f9f1e5;border-radius:12px;padding:12px;margin-top:14px} .choices{display:grid;grid-template-columns:1fr}.choices button{text-align:left;background:white}.choices button[aria-pressed=true]{background:#f0e6f5;border:2px solid #a64e65}.guide{border:1px solid #eadbd3;border-radius:18px;background:white;padding:18px;margin:20px 0}.guide summary{font-weight:750;color:#87465a}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.formula-grid section{background:#fff9f4;border:1px solid #ecd8d0;border-radius:12px;padding:14px}.formula-grid h3{font-size:1rem;margin:0;color:#87465a}.formula-grid p{margin:8px 0}.frac{line-height:1.2;margin:0 .15em}.frac>span{padding:2px 4px}article svg{height:auto}article table{max-width:100%;border-collapse:collapse}article td,article th{border:1px solid #eadbd3;padding:6px}article div{overflow-x:auto} @media(max-width:650px){main{padding:12px}.hero{padding:28px 22px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}nav button{font-size:.9rem;padding:10px 5px}article{padding:18px}.formula-grid{grid-template-columns:1fr}.filters label{max-width:100%}}.frac{line-height:1.15;margin:0 .15em;white-space:nowrap}.frac>span{padding:0 .2em}article svg{display:block;height:auto;max-width:100%;margin:12px auto}article svg text{font-family:system-ui,sans-serif}[hidden]{display:none!important}.network-scroll{overflow-x:auto;max-width:100%}.network-scroll svg{min-width:680px;width:100%;max-width:none} @media(min-width:850px){.network-scroll svg{min-width:0;max-width:100%}}input{font:inherit;display:block;width:150px;max-width:100%;padding:8px;border:1px solid #d9b4bc;border-radius:8px}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #eadbd3;white-space:nowrap}caption{font-weight:bold} .links{display:flex;flex-wrap:wrap;gap:12px}.links a{background:#e9eee3;padding:12px;border-radius:12px;color:#493843} .line{width:100%;height:auto} .question-diagram{display:block;width:min(100%,300px);height:auto;margin:12px 0}</style><main><a href="year7_ratios_rates_hub.html">← Ratios and Rates Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>Ratios and Rates Diagnostic</h1></header><p>Choose one answer for each of the 16 questions. Submit for a topic-by-topic breakdown.</p><div id="quiz"></div><button id="mark">Mark diagnostic</button><article id="feedback" aria-live="polite"></article></main><script>const bank=[["Simplify 18:30.", "3:5", ["9:15", "5:3", "6:10"], "Divide both terms by 6.", "Ratios"], ["Complete 7:9 = 28: __.", "36", ["30", "32", "42"], "Multiply both terms by 4.", "Ratios"], ["Share $84 in the ratio 3:4. What is the smaller share?", "$36", ["$21", "$28", "$48"], "Seven parts; $84 ÷ 7 × 3 = $36.", "Ratios"], ["Simplify 750 mL : 2 L.", "3:8", ["375:1", "3:2", "8:3"], "Convert 2 L to 2000 mL, then divide both by 250.", "Ratios"], ["There are 8 red and 12 blue beads. What fraction of all beads is red?", "2/5", ["2/3", "3/5", "1/4"], "8 out of 20 simplifies to 2 out of 5.", "Ratios"], ["A 6 kg bag costs $15. Find the cost per kilogram.", "$2.50", ["$0.40", "$9", "$90"], "15 ÷ 6 = 2.50.", "Rates"], ["Which is cheaper per litre: 2 L for $5.60 or 3 L for $7.80?", "3 L pack", ["2 L pack", "Same price per litre", "Cannot determine"], "Unit prices are $2.80 and $2.60 respectively.", "Rates"], ["A runner covers 9 km in 45 minutes. Find the average speed.", "12 km/h", ["9 km/h", "20 km/h", "6.75 km/h"], "45 minutes = 0.75 hours; 9 ÷ 0.75 = 12.", "Rates"], ["Convert 72 km/h to metres per second.", "20 m/s", ["259.2 m/s", "72 m/s", "2 m/s"], "Divide by 3.6.", "Rates"], ["A tap delivers 18 L in 3 minutes. How much in 8 minutes at the same rate?", "48 L", ["24 L", "54 L", "144 L"], "18 ÷ 3 × 8 = 48.", "Rates"], ["Four notebooks cost $14. What do ten cost at the same unit price?", "$35", ["$24", "$56", "$140"], "Each costs $3.50.", "Proportion"], ["A recipe for 6 uses 240 g flour. How much for 9?", "360 g", ["243 g", "160 g", "480 g"], "240 ÷ 6 × 9 = 360.", "Proportion"], ["Which rule describes direct proportion?", "y = 4x", ["y = x + 4", "y = 4 − x", "y = x²"], "The ratio y to x is constant for y = 4x.", "Proportion"], ["A map scale is 1:50 000. What actual distance is 6 cm?", "3 km", ["300 m", "30 km", "300 km"], "6 × 50 000 cm = 300 000 cm = 3 km.", "Scale"], ["A 12 m wall is drawn at 1:200. Find the drawing length.", "6 cm", ["0.06 cm", "24 cm", "60 cm"], "1200 cm ÷ 200 = 6 cm.", "Scale"], ["A model has scale 1:5. Its rectangular base is 3 cm by 4 cm. Find the actual base area.", "300 cm²", ["60 cm²", "12 cm²", "150 cm²"], "Actual dimensions are 15 cm and 20 cm.", "Scale"]];const picks=[];const root=document.getElementById('quiz');bank.forEach((q,i)=>{let a=document.createElement('article');let h=document.createElement('h3');h.textContent=(i+1)+'. '+q[0];a.append(h);let opts=[q[1],...q[2]];opts=opts.slice(i%4).concat(opts.slice(0,i%4));opts.forEach(v=>{let l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=v;r.onchange=()=>picks[i]=v;l.append(r,' ');if(/^\d+\/\d+$/.test(v)){let f=document.createElement('span');f.className='frac';v.split('/').forEach(n=>{let s=document.createElement('span');s.textContent=n;f.append(s)});l.append(f)}else l.append(v);a.append(l)});root.append(a)});document.getElementById('mark').onclick=()=>{if(bank.some((q,i)=>picks[i]===undefined)){document.getElementById('feedback').textContent='Please answer every question first.';return}let score=0,groups={};bank.forEach((q,i)=>{let ok=picks[i]===q[1];score+=ok;let g=groups[q[4]]??=[0,0];g[0]+=ok;g[1]++;});let f=document.getElementById('feedback');f.replaceChildren();let h=document.createElement('h2');h.textContent=score+' / '+bank.length;f.append(h);Object.entries(groups).forEach(([k,v])=>{let p=document.createElement('p');p.textContent=k+': '+v.join(' / ');f.append(p)});bank.forEach((q,i)=>{let p=document.createElement('p');p.append((i+1)+'. '+(picks[i]===q[1]?'Correct. ':'Review: '));if(/^\d+\/\d+$/.test(q[1])){let f=document.createElement('span');f.className='frac';q[1].split('/').forEach(n=>{let t=document.createElement('span');t.textContent=n;f.append(t)});p.append(f)}else p.append(q[1]);p.append('. '+q[3]);f.append(p)});f.scrollIntoView()};</script></html>
