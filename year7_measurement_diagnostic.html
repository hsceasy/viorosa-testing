<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Length, Area and Volume Diagnostic | Viorosa Maths</title><style>body{margin:0;background:#fff9f4;color:#493843;font:17px system-ui}main{max-width:900px;margin:auto;padding:24px}h1{font-family:Georgia;color:#a45070}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:10px 16px;border:1px solid #d9b4bc;border-radius:12px;background:#fbe6df;color:inherit;cursor:pointer}select{font:inherit;max-width:100%;padding:8px}article{overflow-wrap:anywhere}button[aria-pressed=true]{background:#f4dda0}article{background:white;border:1px solid #ecd8d0;border-radius:16px;padding:20px;margin:16px 0}label{display:block;padding:8px}summary{cursor:pointer} .notice{background:#f9edc9;padding:12px;border-radius:10px}img,svg{max-width:100%} .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac>*:first-child{border-bottom:1px solid} .filters{display:flex;flex-wrap:wrap;gap:8px} button:focus-visible,select:focus-visible{outline:3px solid #8563a6} .choices{display:flex;flex-wrap:wrap;gap:8px} article small{color:#854661} h2{font-family:Georgia} .score{font-weight:bold} *{box-sizing:border-box}body{background:linear-gradient(#fff8f2,#fff);line-height:1.55}main{max-width:1220px;padding:22px 20px 80px}.hero{background:linear-gradient(112deg,#ffe4d8,#f9edc9 55%,#f0e6f5);border-radius:30px;padding:38px 40px}.hero h1{font:800 clamp(2.5rem,5vw,4.5rem)/1.1 system-ui;letter-spacing:-.055em;margin:12px 0;color:#50404b}.eyebrow{font-size:.84rem;letter-spacing:.15em;font-weight:800;color:#87465a}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:26px 0}nav button{min-height:64px;background:white;font-weight:750;border-radius:17px}nav button[aria-pressed=true]{background:#a64e65;color:white;border-color:#a64e65}article{border-radius:20px;padding:23px 25px;box-shadow:0 3px 14px #6755890a}article details{background:#f9f1e5;border-radius:12px;padding:12px;margin-top:14px} .choices{display:grid;grid-template-columns:1fr}.choices button{text-align:left;background:white}.choices button[aria-pressed=true]{background:#f0e6f5;border:2px solid #a64e65}.guide{border:1px solid #eadbd3;border-radius:18px;background:white;padding:18px;margin:20px 0}.guide summary{font-weight:750;color:#87465a}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.formula-grid section{background:#fff9f4;border:1px solid #ecd8d0;border-radius:12px;padding:14px}.formula-grid h3{font-size:1rem;margin:0;color:#87465a}.formula-grid p{margin:8px 0}.frac{line-height:1.2;margin:0 .15em}.frac>span{padding:2px 4px}article svg{height:auto}article table{max-width:100%;border-collapse:collapse}article td,article th{border:1px solid #eadbd3;padding:6px}article div{overflow-x:auto} @media(max-width:650px){main{padding:12px}.hero{padding:28px 22px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}nav button{font-size:.9rem;padding:10px 5px}article{padding:18px}.formula-grid{grid-template-columns:1fr}.filters label{max-width:100%}}.frac{line-height:1.15;margin:0 .15em;white-space:nowrap}.frac>span{padding:0 .2em}article svg{display:block;height:auto;max-width:100%;margin:12px auto}article svg text{font-family:system-ui,sans-serif}[hidden]{display:none!important}.network-scroll{overflow-x:auto;max-width:100%}.network-scroll svg{min-width:680px;width:100%;max-width:none} @media(min-width:850px){.network-scroll svg{min-width:0;max-width:100%}}input{font:inherit;display:block;width:150px;max-width:100%;padding:8px;border:1px solid #d9b4bc;border-radius:8px}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #eadbd3;white-space:nowrap}caption{font-weight:bold} .links{display:flex;flex-wrap:wrap;gap:12px}.links a{background:#e9eee3;padding:12px;border-radius:12px;color:#493843} .line{width:100%;height:auto} .question-diagram{display:block;width:min(100%,300px);height:auto;margin:12px 0}label:has(input[type=radio]){border:1px solid #eadbd3;border-radius:10px;margin:8px 0;cursor:pointer}input[type=radio]{display:inline;width:auto;margin-right:10px}fieldset{border:0;padding:0;min-width:0}legend{font-weight:650}label:has(input:checked){background:#f0e6f5}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac span:first-child{border-bottom:1px solid}</style><main><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7 · STAGE 4</p><h1>Length, Area and Volume Diagnostic</h1><p>Confidence that grows.</p></header><p>Choose one answer for each question, then mark your diagnostic to find your revision priorities.</p><form id="quiz"></form><p id="progress" aria-live="polite"></p><button id="mark">Mark diagnostic</button> <button id="reset">Start again</button><article id="feedback" hidden aria-live="polite"></article></main><script>const questions=[{"skill": "Length conversions", "prompt": "Convert 3.6 m to cm.", "options": ["36 cm", "360 cm", "3600 cm", "0.036 cm"], "correct": 1, "why": "Multiply metres by 100."}, {"skill": "Length conversions", "prompt": "Convert 4500 m to km.", "options": ["4.5 km", "45 km", "450 km", "0.45 km"], "correct": 0, "why": "Divide by 1000."}, {"skill": "Perimeter", "prompt": "A rectangle is 9 cm long and 4 cm wide. Find its perimeter.", "options": ["36 cm", "13 cm", "26 cm", "18 cm"], "correct": 2, "why": "Add all four sides: 2 × (9 + 4) = 26 cm."}, {"skill": "Perimeter", "prompt": "A 12 m by 8 m rectangle has a rectangular notch 2 m deep and 3 m wide cut into the middle of its top edge. Find its perimeter.", "options": ["40 m", "34 m", "46 m", "44 m"], "correct": 3, "why": "The notch replaces 3 m of edge with 3 m plus two 2 m edges. 40 + 4 = 44 m."}, {"skill": "Area conversions", "prompt": "Convert 2 m² to cm².", "options": ["200 cm²", "20 000 cm²", "2000 cm²", "0.02 cm²"], "correct": 1, "why": "Square the length conversion factor: 2 × 100 × 100."}, {"skill": "Area conversions", "prompt": "Convert 3500 mm² to cm².", "options": ["35 cm²", "350 cm²", "3.5 cm²", "350 000 cm²"], "correct": 0, "why": "Divide by 100 because 1 cm² = 100 mm²."}, {"skill": "Area of polygons", "prompt": "A triangle has base 12 cm and perpendicular height 5 cm. Find its area.", "options": ["60 cm²", "17 cm²", "30 cm²", "34 cm²"], "correct": 2, "why": "Half of 12 × 5 is 30 cm²."}, {"skill": "Area of polygons", "prompt": "A parallelogram has base 9 cm, sloping side 6 cm and perpendicular height 4 cm. Find its area.", "options": ["54 cm²", "18 cm²", "30 cm²", "36 cm²"], "correct": 3, "why": "Use the perpendicular height: 9 × 4 = 36 cm²."}, {"skill": "Composite areas", "prompt": "A 10 cm by 7 cm rectangle has a 3 cm by 2 cm corner removed. Find the remaining area.", "options": ["64 cm²", "76 cm²", "70 cm²", "34 cm²"], "correct": 0, "why": "Subtract the removed area: 70 − 6 = 64 cm²."}, {"skill": "Composite areas", "prompt": "A 6 m by 4 m rectangle has a triangle attached along its 6 m side. The triangle has perpendicular height 3 m. Find the combined area.", "options": ["42 m²", "33 m²", "24 m²", "27 m²"], "correct": 1, "why": "Add 24 and half of 6 × 3 to obtain 33 m²."}, {"skill": "Circles", "prompt": "A circle has diameter 10 cm. Find its circumference in terms of π.", "options": ["5π cm", "25π cm", "10π cm", "100π cm"], "correct": 2, "why": "Circumference = π × diameter."}, {"skill": "Circles", "prompt": "A circle has radius 4 cm. Find its area in terms of π.", "options": ["8π cm²", "4π cm²", "64π cm²", "16π cm²"], "correct": 3, "why": "Area = π × 4² = 16π cm²."}, {"skill": "Volume and capacity conversions", "prompt": "Convert 2500 cm³ to litres.", "options": ["2.5 L", "25 L", "250 L", "0.25 L"], "correct": 0, "why": "1000 cm³ = 1 L, so divide by 1000."}, {"skill": "Volume and capacity conversions", "prompt": "Convert 3 m³ to cm³.", "options": ["300 cm³", "3 000 000 cm³", "30 000 cm³", "3000 cm³"], "correct": 1, "why": "Cube the conversion factor: 3 × 100³."}, {"skill": "Volume of prisms", "prompt": "A rectangular prism measures 8 cm by 5 cm by 3 cm. Find its volume.", "options": ["40 cm³", "16 cm³", "120 cm³", "158 cm³"], "correct": 2, "why": "Multiply the three dimensions: 8 × 5 × 3."}, {"skill": "Volume of prisms", "prompt": "A triangular prism has a triangular cross-section with base 6 cm and perpendicular height 4 cm. Its length is 10 cm. Find its volume.", "options": ["240 cm³", "12 cm³", "60 cm³", "120 cm³"], "correct": 3, "why": "Cross-sectional area = 12 cm². Multiply by 10 to obtain 120 cm³."}, {"skill": "Length conversions", "prompt": "Convert 0.85 km to m.", "options": ["85 m", "850 m", "8500 m", "0.085 m"], "correct": 1, "why": "0.85 × 1000 = 850 m."}, {"skill": "Perimeter", "prompt": "A square has perimeter 36 cm. Find its side.", "options": ["6 cm", "9 cm", "12 cm", "18 cm"], "correct": 1, "why": "36 ÷ 4 = 9 cm."}, {"skill": "Area conversions", "prompt": "Convert 2 m² to cm².", "options": ["200", "2000", "20000", "200000"], "correct": 2, "why": "2 × 100² = 20 000 cm²."}, {"skill": "Area conversions", "prompt": "Convert 600 mm² to cm².", "options": ["6", "60", "0.6", "6000"], "correct": 0, "why": "600 ÷ 100 = 6 cm²."}, {"skill": "Area", "prompt": "Triangle base 12 cm, height 7 cm. Find area.", "options": ["84", "42", "19", "38"], "correct": 1, "why": "½ × 12 × 7 = 42 cm²."}, {"skill": "Area", "prompt": "Parallelogram base 8 m, height 3 m. Find area.", "options": ["11", "22", "12", "24"], "correct": 3, "why": "8 × 3 = 24 m²."}, {"skill": "Area", "prompt": "Kite diagonals 10 cm and 6 cm. Find area.", "options": ["60", "30", "16", "32"], "correct": 1, "why": "½ × 10 × 6 = 30 cm²."}, {"skill": "Area", "prompt": "Trapezium parallel sides 5 and 9 cm, height 4 cm. Find area.", "options": ["28", "56", "20", "36"], "correct": 0, "why": "½ × (5 + 9) × 4 = 28 cm²."}, {"skill": "Composite area", "prompt": "A 9 by 8 cm rectangle has a 2 by 3 cm corner removed. Find area.", "options": ["72", "78", "66", "60"], "correct": 2, "why": "9 × 8 − 2 × 3 = 72 − 6 = 66 cm²."}, {"skill": "Circles", "prompt": "Circle diameter 14 cm. Find radius.", "options": ["28 cm", "7 cm", "14 cm", "49 cm"], "correct": 1, "why": "14 ÷ 2 = 7 cm."}, {"skill": "Circles", "prompt": "Radius 3 cm. Find circumference exactly.", "options": ["3π cm", "9π cm", "6π cm", "12π cm"], "correct": 2, "why": "2 × π × 3 = 6π cm."}, {"skill": "Volume and capacity conversions", "prompt": "Convert 4.2 L to mL.", "options": ["42", "420", "4200", "42000"], "correct": 2, "why": "4.2 × 1000 = 4200 mL."}, {"skill": "Volume of prisms", "prompt": "Prism cross-sectional area 15 cm², length 8 cm. Find volume.", "options": ["23", "120", "60", "150"], "correct": 1, "why": "15 × 8 = 120 cm³."}, {"skill": "Volume of prisms", "prompt": "Volume 96 cm³, base area 12 cm². Find height.", "options": ["8 cm", "12 cm", "84 cm", "108 cm"], "correct": 0, "why": "96 ÷ 12 = 8 cm."}, {"skill": "Multi-step measurement", "prompt": "Rectangle 2 m by 50 cm. Find area in m².", "options": ["100", "10", "1", "0.1"], "correct": 2, "why": "50 cm = 0.5 m; 2 × 0.5 = 1 m²."}, {"skill": "Multi-step measurement", "prompt": "Tank 20 × 10 × 15 cm internally. Find capacity in litres.", "options": ["30 L", "3 L", "0.3 L", "300 L"], "correct": 1, "why": "20 × 10 × 15 = 3000 cm³ = 3 L."}];const quiz=document.getElementById('quiz'), feedback=document.getElementById('feedback'),progress=document.getElementById('progress');function render(){quiz.innerHTML=questions.map((q,i)=>`<article><fieldset><legend>Question ${i+1} · ${q.skill}</legend><p>${q.prompt}</p>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</fieldset></article>`).join('');update()}function update(){progress.textContent=quiz.querySelectorAll('input:checked').length+' of 32 answered';feedback.hidden=true}quiz.addEventListener('change',update);quiz.addEventListener('submit',e=>e.preventDefault());document.getElementById('mark').onclick=()=>{let answers=questions.map((q,i)=>quiz.querySelector(`input[name=q${i}]:checked`));feedback.hidden=false;if(answers.some(a=>!a)){feedback.textContent='Please answer all 32 questions before marking.';return}let total=0,skills={};let review=questions.map((q,i)=>{let ok=Number(answers[i].value)===q.correct;total+=Number(ok);let a=skills[q.skill]??=[0,0];a[0]+=Number(ok);a[1]++;return `<p><strong>Q${i+1}: ${ok?'Correct':'Incorrect'}</strong> — ${q.options[q.correct]}. ${q.why}</p>`});feedback.innerHTML=`<h2>Score: ${total}/32 (${Math.round(total/32*100)}%)</h2><h3>Revision priorities</h3>${Object.entries(skills).map(([k,[a,b]])=>`<p><strong>${k}: ${a}/${b}</strong> — ${a===b?'Keep practising to consolidate.':'Revisit this skill in the hub using the Skill filter.'}</p>`).join('')}<h3>Answer review</h3>${review.join('')}`;feedback.scrollIntoView({block:'start'})};document.getElementById('reset').onclick=()=>{quiz.reset();update();window.scrollTo(0,0)};render();</script></html>
