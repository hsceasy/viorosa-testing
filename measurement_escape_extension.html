</head><body><main><a href="year7_measurement_hub.html">← Length, Area and Volume Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>The Geometry Vault</h1><p>Confidence that grows</p></header><p>Unlock six rooms by entering numerical answers in the requested units. Hints are available at every lock.</p><article id="room"><h2 id="progress"></h2><h3 id="name"></h3><p id="question"></p><form id="lock"><label>Numerical code <input id="code" type="number" step="any" required inputmode="decimal"></label><button>Unlock</button> <button type="button" id="help">Show hint</button></form><p id="hint" aria-live="polite"></p><p id="feedback" aria-live="polite"></p><button id="next" hidden>Next room →</button></article><article id="done" hidden><h2>You escaped!</h2><p>All six rooms unlocked.</p><button id="restart">Play again</button></article></main><script>const rooms=[["The courtyard", "A 15 m by 9 m rectangle has a 4 m wide, 3 m deep rectangular notch cut into the middle of one long edge. Find the remaining perimeter in metres.", 54, "The notch adds two edges of length 3 m.", "2 × (15 + 9) + 2 × 3 = 54 m."], ["The missing panel", "A trapezium has area 84 cm², perpendicular height 7 cm and one parallel side 10 cm. Find the other parallel side in cm.", 14, "Double the area, divide by the height, then subtract 10.", "84 × 2 ÷ 7 − 10 = 14 cm."], ["The circular seal", "A circular seal has diameter 12 cm. Find its area in cm², using π = 3.14.", 113.04, "The radius is half the diameter.", "3.14 × 6² = 113.04 cm²."], ["The mosaic", "A 12 m by 8 m floor has a 3 m by 2 m section that needs no tiles. Tiles cover 0.5 m² each. How many tiles are needed, assuming no waste?", 180, "Subtract the untiled area before dividing by the area per tile.", "(12 × 8 − 3 × 2) ÷ 0.5 = 180 tiles."], ["The prism lock", "A triangular prism has volume 360 cm³. Its triangular cross-section has base 10 cm and perpendicular height 6 cm. Find the prism length in cm.", 12, "Find the triangular area first.", "360 ÷ (10 × 6 ÷ 2) = 12 cm."], ["The reservoir", "A tank with internal dimensions 80 cm by 50 cm by 40 cm is filled to 75% of capacity. How many litres of water does it contain?", 120, "Find volume in cm³, take 75%, then divide by 1000.", "80 × 50 × 40 × 0.75 ÷ 1000 = 120 L."]];let i=0;const e=id=>document.getElementById(id);function draw(){e('room').hidden=i===rooms.length;e('done').hidden=i!==rooms.length;if(i===rooms.length)return;let r=rooms[i];e('progress').textContent=`Room ${i+1} of ${rooms.length}`;e('name').textContent=r[0];e('question').textContent=r[1];e('code').value='';e('hint').textContent='';e('feedback').textContent='';e('lock').hidden=false;e('next').hidden=true;}e('lock').onsubmit=ev=>{ev.preventDefault();let v=e('code').valueAsNumber;if(!Number.isFinite(v))return;if(Math.abs(v-rooms[i][2])<1e-8){e('feedback').textContent='Unlocked! '+rooms[i][4];e('lock').hidden=true;e('next').hidden=false;e('next').focus()}else e('feedback').textContent='Not quite. Check your calculation and units.'};e('help').onclick=()=>e('hint').textContent=rooms[i][3];e('next').onclick=()=>{i++;draw();if(i<rooms.length)e('code').focus();else e('restart').focus()};e('restart').onclick=()=>{i=0;draw();e('code').focus()};draw();</script></body></html>
