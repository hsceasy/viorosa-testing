eat(3,minmax(0,1fr));gap:12px;margin:22px 0 26px}main #vm-tabs button{min-height:64px;background:#fff;color:#493843;font:750 1rem system-ui;border:1px solid #d9b4bc;border-radius:17px;padding:10px 12px;cursor:pointer;white-space:normal}main #vm-tabs button[aria-pressed="true"]{background:#a64e65;color:white;border-color:#a64e65}main #vm-tabs button:focus-visible{outline:3px solid #8563a6;outline-offset:2px}[hidden]{display:none!important}@media(max-width:650px){main #vm-tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}main #vm-tabs button{font-size:.9rem;padding:10px 5px}}</style><main><a href="nsw.html">← NSW Mathematics</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · STAGE 4</p><h1>Integers</h1><p>Positive and negative numbers · Confidence that grows.</p></header><div id="vm-tabs"><nav id="nav" aria-label="Learning sections" style="display:contents"></nav></div><article><h2>Start here</h2><div class="links"><a href="year7_integers_diagnostic.html">Year 7 diagnostic test</a><a href="locked_laboratory_seven_rooms%20EASY.html">Locked Laboratory</a><a href="locked_laboratory_gifted_extension.html">Extension escape room</a></div></article><article><h2>Explore a number line</h2><label>Starting integer <input id="start" type="number" min="-10" max="10" value="-3"></label><label>Change <input id="change" type="number" min="-10" max="10" value="5"></label><button id="move">Show movement</button><div id="line"></div><p id="result" aria-live="polite"></p></article><div class="filters"><label>Skill <select id="skill"></select></label><label>Difficulty <select id="difficulty"><option>All</option><option>Foundation</option><option>Core</option><option>Extension</option></select></label></div><button id="newtest" hidden>New mini-test</button><div id="questions"></div></main><script>const bank=[{"id":"VM-INT-001","section":"Skill practice","skill":"Ordering","prompt":"Order 4, 11, −4, 0 from least to greatest.","answer":"−4, 0, 4, 11","solution":"Numbers increase from left to right on a number line: −4, 0, 4, 11.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-002","section":"Skill practice","skill":"Addition","prompt":"Calculate −13 + (−10).","answer":"−23","solution":"Start at −13; move 10 places left to −23.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-003","section":"Skill practice","skill":"Subtraction","prompt":"Calculate 11 − (−12).","answer":"23","solution":"Add the opposite: 11 + (12) = 23.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-004","section":"Skill practice","skill":"Multiplication","prompt":"Calculate −24 × (7).","answer":"−168","solution":"Multiply magnitudes: 24 × 7 = 168. Different signs give a negative. Answer: −168.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-005","section":"Skill practice","skill":"Division","prompt":"Calculate −56 ÷ (−4).","answer":"14","solution":"14 × (−4) = −56, so the quotient is 14.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-006","section":"Skill practice","skill":"Order of operations","prompt":"Calculate −24 + (−5) × 9.","answer":"−69","solution":"Multiply first: −5 × 9 = −45. Then −24 + (−45) = −69.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-007","section":"Skill practice","skill":"Number lines","prompt":"Start at 2 on a number line. Move 9 units left, then 3 units right. Where do you finish?","answer":"−4","solution":"2 − 9 = −7; then add 3 to obtain −4.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-008","section":"Skill practice","skill":"Applications","prompt":"A freezer is at −11°C. Its temperature rises by 3°C and then falls by 7°C. Find the final temperature.","answer":"−15°C","solution":"−11 + 3 − 7 = −15°C.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-009","section":"Skill practice","skill":"Missing numbers","prompt":"Find the integer that satisfies □ + (−2) = 23.","answer":"25","solution":"Subtract −2 from both sides: 23 − (−2) = 25.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-010","section":"Skill practice","skill":"Opposites and distance","prompt":"How far apart are −10 and 6 on a number line?","answer":"16","solution":"The distance is the absolute difference: |−10 − (6)| = 16.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-011","section":"Skill practice","skill":"Ordering","prompt":"Order 13, −5, 7, 0 from least to greatest.","answer":"−5, 0, 7, 13","solution":"Numbers increase from left to right on a number line: −5, 0, 7, 13.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-012","section":"Skill practice","skill":"Addition","prompt":"Calculate −17 + (−12).","answer":"−29","solution":"Start at −17; move 12 places left to −29.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-013","section":"Skill practice","skill":"Subtraction","prompt":"In 8 − (−3), explain the role of each minus sign and calculate the result.","answer":"11; subtraction, then negative sign","solution":"The first minus sign denotes subtraction. The second indicates that 3 is negative. Subtracting −3 is adding 3: 8 + 3 = 11.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-014","section":"Skill practice","skill":"Multiplication","prompt":"Calculate −24 × (−4).","answer":"96","solution":"Multiply magnitudes: 24 × 4 = 96. Matching signs give a positive. Answer: 96.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-015","section":"Skill practice","skill":"Division","prompt":"Calculate −165 ÷ (−11).","answer":"15","solution":"15 × (−11) = −165, so the quotient is 15.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-016","section":"Skill practice","skill":"Order of operations","prompt":"Calculate −6 + (9) × 5.","answer":"39","solution":"Multiply first: 9 × 5 = 45. Then −6 + (45) = 39.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-017","section":"Skill practice","skill":"Number lines","prompt":"Start at 3 on a number line. Move 2 units left, then 7 units right. Where do you finish?","answer":"8","solution":"3 − 2 = 1; then add 7 to obtain 8.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-018","section":"Skill practice","skill":"Applications","prompt":"A lift starts on floor −4, rises 7 floors and descends 5 floors. Write a directed number sentence and find its final floor.","answer":"−4 + 7 − 5 = −2","solution":"Start at −4; upward movement is +7 and downward movement is −5. The final floor is −2.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-019","section":"Skill practice","skill":"Missing numbers","prompt":"Find the integer that satisfies □ + (4) = 8.","answer":"4","solution":"Subtract 4 from both sides: 8 − (4) = 4.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-020","section":"Skill practice","skill":"Opposites and distance","prompt":"How far apart are −3 and −9 on a number line?","answer":"6","solution":"The distance is the absolute difference: |−3 − (−9)| = 6.","difficulty":"Foundation","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-021","section":"Skill practice","skill":"Ordering","prompt":"Order 3, −12, 9, 0 from least to greatest.","answer":"−12, 0, 3, 9","solution":"Numbers increase from left to right on a number line: −12, 0, 3, 9.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-022","section":"Skill practice","skill":"Addition","prompt":"Calculate −19 + (8).","answer":"−11","solution":"Start at −19; move 8 places right to −11.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-023","section":"Skill practice","skill":"Subtraction","prompt":"Calculate 5 − (−9).","answer":"14","solution":"Add the opposite: 5 + (9) = 14.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-024","section":"Skill practice","skill":"Multiplication","prompt":"Use a calculator to evaluate (−4) × 3, (−4) × 2, (−4) × 1, (−4) × 0 and (−4) × (−1). Describe the pattern and predict (−4) × (−2).","answer":"−12, −8, −4, 0, 4; next 8","solution":"Each time the second factor decreases by 1, the product increases by 4. The next product is 8.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-025","section":"Skill practice","skill":"Division","prompt":"Calculate 34 ÷ (2).","answer":"17","solution":"17 × (2) = 34, so the quotient is 17.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-026","section":"Skill practice","skill":"Order of operations","prompt":"Calculate −11 + (−12) × 6.","answer":"−83","solution":"Multiply first: −12 × 6 = −72. Then −11 + (−72) = −83.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-027","section":"Skill practice","skill":"Number lines","prompt":"Start at 24 on a number line. Move 7 units left, then 5 units right. Where do you finish?","answer":"22","solution":"24 − 7 = 17; then add 5 to obtain 22.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-028","section":"Skill practice","skill":"Applications","prompt":"A diver is 9 m below sea level and descends another 6 m. Write a directed number sentence for the final position.","answer":"−9 + (−6) = −15","solution":"Below sea level is negative; descending adds a negative change. The diver is 15 m below sea level.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-029","section":"Skill practice","skill":"Missing numbers","prompt":"Find the integer that satisfies □ + (−3) = 3.","answer":"6","solution":"Subtract −3 from both sides: 3 − (−3) = 6.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-030","section":"Skill practice","skill":"Opposites and distance","prompt":"How far apart are −23 and −2 on a number line?","answer":"21","solution":"The distance is the absolute difference: |−23 − (−2)| = 21.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-031","section":"Skill practice","skill":"Ordering","prompt":"Order 22, 9, 5, 0 from least to greatest.","answer":"0, 5, 9, 22","solution":"Numbers increase from left to right on a number line: 0, 5, 9, 22.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-032","section":"Skill practice","skill":"Addition","prompt":"Calculate −38 + 17 + 38 − 7 mentally by rearranging or grouping terms. Explain your strategy.","answer":"10","solution":"Group −38 and 38 to obtain zero, then calculate 17 − 7 = 10.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-033","section":"Skill practice","skill":"Subtraction","prompt":"Calculate 8 − (−11).","answer":"19","solution":"Add the opposite: 8 + (11) = 19.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-034","section":"Skill practice","skill":"Multiplication","prompt":"Calculate −5 × (7).","answer":"−35","solution":"Multiply magnitudes: 5 × 7 = 35. Different signs give a negative. Answer: −35.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-035","section":"Skill practice","skill":"Division","prompt":"Calculate −63 ÷ (−7).","answer":"9","solution":"9 × (−7) = −63, so the quotient is 9.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-036","section":"Skill practice","skill":"Order of operations","prompt":"Calculate −2 + (−10) × 9.","answer":"−92","solution":"Multiply first: −10 × 9 = −90. Then −2 + (−90) = −92.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-037","section":"Skill practice","skill":"Number lines","prompt":"Draw a number line to represent −3 − (−5). Mark the starting point, direction, distance and endpoint.","answer":"Start −3; right 5 units; finish 2","solution":"Subtracting a negative means moving right. Draw an arrow from −3 to 2 spanning five units.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-038","section":"Skill practice","skill":"Applications","prompt":"A freezer is at −21°C. Its temperature rises by 12°C and then falls by 7°C. Find the final temperature.","answer":"−16°C","solution":"−21 + 12 − 7 = −16°C.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-039","section":"Skill practice","skill":"Missing numbers","prompt":"Find the integer that satisfies □ + (−6) = 18.","answer":"24","solution":"Subtract −6 from both sides: 18 − (−6) = 24.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-040","section":"Skill practice","skill":"Opposites and distance","prompt":"How far apart are −20 and 4 on a number line?","answer":"24","solution":"The distance is the absolute difference: |−20 − (4)| = 24.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-041","section":"Skill practice","skill":"Order of operations","prompt":"Calculate 2 × [−4 − 3] + 6 ÷ (−3).","answer":"−16","solution":"Brackets give −7. Multiply to get −14; 6 ÷ (−3) = −2. Add to obtain −16.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-042","section":"Skill practice","skill":"Coordinates","prompt":"Point (−4, 4) moves 8 units right and 7 units down. Find its new coordinates.","answer":"(4, −3)","solution":"x = −4 + 8 = 4; y = 4 − 7 = −3.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — Cartesian plane (candidate)","Ontario spatial sense — grade to verify"]},{"id":"VM-INT-043","section":"Skill practice","skill":"Missing numbers","prompt":"A number is multiplied by −5, then 5 is added. The result is −25. Find the original number.","answer":"6","solution":"Reverse the steps: −25 − 5 = −30; divide by −5 to get 6.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-044","section":"Skill practice","skill":"Applications","prompt":" ifficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-124","section":"Challenge questions","skill":"Multiplication","prompt":"Calculate −15 × (−6).","answer":"90","solution":"Multiply magnitudes: 15 × 6 = 90. Matching signs give a positive. Answer: 90.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-125","section":"Challenge questions","skill":"Division","prompt":"Calculate 70 ÷ (7).","answer":"10","solution":"10 × (7) = 70, so the quotient is 10.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-126","section":"Challenge questions","skill":"Powers","prompt":"Calculate (−3)² − 2³.","answer":"1","solution":"9 − 8 = 1.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — powers and order of operations (candidate)","Ontario number — powers enrichment / grade to verify"]},{"id":"VM-INT-127","section":"Challenge questions","skill":"Number lines","prompt":"Start at 4 on a number line. Move 2 units left, then 8 units right. Where do you finish?","answer":"10","solution":"4 − 2 = 2; then add 8 to obtain 10.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-128","section":"Challenge questions","skill":"Applications","prompt":"A quiz awards 4 points per correct answer and deducts 3 per incorrect answer. Find the score for 5 correct and 4 incorrect answers.","answer":"8","solution":"5 × 4 − 4 × 3 = 8.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-129","section":"Challenge questions","skill":"Missing numbers","prompt":"Find the integer that satisfies □ + (−11) = −1.","answer":"10","solution":"Subtract −11 from both sides: −1 − (−11) = 10.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-130","section":"Challenge questions","skill":"Opposites and distance","prompt":"How far apart are −5 and −8 on a number line?","answer":"3","solution":"The distance is the absolute difference: |−5 − (−8)| = 3.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-131","section":"Challenge questions","skill":"Coordinates","prompt":"Reflect (−5, −2) in the y-axis.","answer":"(5, −2)","solution":"Change the sign of x only.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — Cartesian plane (candidate)","Ontario spatial sense — grade to verify"]},{"id":"VM-INT-132","section":"Challenge questions","skill":"Addition","prompt":"Calculate −10 + (−8).","answer":"−18","solution":"Start at −10; move 8 places left to −18.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-133","section":"Challenge questions","skill":"Subtraction","prompt":"Calculate 21 − (−11).","answer":"32","solution":"Add the opposite: 21 + (11) = 32.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-134","section":"Challenge questions","skill":"Multiplication","prompt":"Calculate −3 × (6).","answer":"−18","solution":"Multiply magnitudes: 3 × 6 = 18. Different signs give a negative. Answer: −18.","difficulty":"Core","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-135","section":"Challenge questions","skill":"Reasoning","prompt":"Find two integers with sum −3 and product −28.","answer":"−7 and 4","solution":"Factor pairs of 28 are 1 and 28, 2 and 14, 4 and 7. Opposite signs and sum −3 require −7 and 4.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-136","section":"Challenge questions","skill":"Reasoning","prompt":"Find all integers whose distance from −3 is 8.","answer":"−11 and 5","solution":"Move 8 units in either direction from −3.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario — integer reasoning / enrichment (grade to verify)"]},{"id":"VM-INT-137","section":"Challenge questions","skill":"Reasoning","prompt":"Can three negative integers have a positive product? Explain.","answer":"No","solution":"Two negative factors give a positive product; multiplying by the third negative makes it negative.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-138","section":"Challenge questions","skill":"Applications","prompt":"A game has 8 rounds, each ending in a win or a loss. A win earns 5 points and a loss costs 3 points. Can the final score be 17? Justify your answer.","answer":"No","solution":"Starting with eight losses gives −24. Each win replacing a loss adds 8. The required increase 41 is not divisible by 8.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-139","section":"Challenge questions","skill":"Missing numbers","prompt":"Three consecutive integers sum to −27. Find them.","answer":"−10, −9, −8","solution":"The middle integer is −27 ÷ 3 = −9.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 7 — additive integer practice (candidate)"]},{"id":"VM-INT-140","section":"Challenge questions","skill":"Reasoning","prompt":"Choose three different numbers from −7, −4, −2, 3, 5 to obtain the greatest product.","answer":"140","solution":"A positive product requires two negative factors and one positive factor, since only two positive numbers are available. The largest negative magnitudes are 7 and 4, and the largest positive factor is 5. Their product is 140, which exceeds every negative product.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-141","section":"Challenge questions","skill":"Ordering","prompt":"Find every integer x satisfying −5 < x ≤ 0.","answer":"−4, −3, −2, −1, 0","solution":"Exclude −5 and include 0.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 6–7 — integer representation (candidate)"]},{"id":"VM-INT-142","section":"Challenge questions","skill":"Reasoning","prompt":"Two integers have sum 0 and product −81. Find them.","answer":"−9 and 9","solution":"They are opposites; their common magnitude squared is 81.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-143","section":"Challenge questions","skill":"Powers","prompt":"Insert brackets into −3² + 4 to obtain 13.","answer":"(−3)² + 4","solution":"Squaring −3 gives 9; adding 4 gives 13.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — powers and order of operations (candidate)","Ontario number — powers enrichment / grade to verify"]},{"id":"VM-INT-144","section":"Challenge questions","skill":"Reasoning","prompt":"Find all unordered integer pairs with product −12 and positive sum.","answer":"(−1, 12), (−2, 6), (−3, 4)","solution":"List positive factor pairs of 12; assign the negative sign to the smaller magnitude.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-145","section":"Challenge questions","skill":"Applications","prompt":"A lift starts at floor −3. It makes four identical upward moves and finishes at floor 9. How many floors per move?","answer":"3","solution":"Total rise is 9 − (−3) = 12; divide by 4.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-146","section":"Challenge questions","skill":"Order of operations","prompt":"Use brackets in 8 − 3 × 2 to make 10.","answer":"(8 − 3) × 2","solution":"Subtract first to obtain 5, then multiply by 2.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-147","section":"Challenge questions","skill":"Coordinates","prompt":"A quadrilateral has vertices (−4, −2), (3, −2), (3, 5), (−4, 5), joined in that order. Find its perimeter.","answer":"28 units","solution":"Horizontal and vertical side lengths are both 7 units, so the shape is a square. Its perimeter is 4 × 7 = 28 units.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — Cartesian plane (candidate)","Ontario spatial sense — grade to verify"]},{"id":"VM-INT-148","section":"Challenge questions","skill":"Applications","prompt":"A team starts at zero. In each of six rounds, it either wins and earns 7 points or loses and loses 2 points. How many wins give a final score of 15 points?","answer":"3","solution":"Six losses give −12. Each win adds 9 relative to a loss; (15 + 12) ÷ 9 = 3.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-149","section":"Challenge questions","skill":"Reasoning","prompt":"Find the smallest integer n for which −3 × n < −10.","answer":"4","solution":"For n = 3 the product is −9; for n = 4 it is −12. Smaller integers give larger products.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]},{"id":"VM-INT-150","section":"Challenge questions","skill":"Reasoning","prompt":"Find two distinct negative integers whose sum is −11 and whose product is greatest.","answer":"−5 and −6","solution":"The possible magnitude pairs are (1, 10), (2, 9), (3, 8), (4, 7) and (5, 6). Their products are 10, 18, 24, 28 and 30 respectively. The greatest is 30, achieved by −5 and −6.","difficulty":"Extension","curriculum_candidates":["NSW Stage 4 — integer practice (candidate)","Ontario Grade 8 — multiplicative integer practice (candidate)"]}];let section='Skill practice',test=[];const $=id=>document.getElementById(id);const sections=['Skill practice','Worked examples','Spot the mistake','Challenge questions','Mini-tests'];function draw(){let a=Number($('start').value),b=Number($('change').value);if($('start').value.trim()===''||$('change').value.trim()===''||!Number.isInteger(a)||!Number.isInteger(b)||Math.abs(a)>10||Math.abs(b)>10){$('result').textContent='Enter integers from −10 to 10.';$('line').replaceChildren();return;}let lo=Math.min(-10,a+b),hi=Math.max(10,a+b),pos=x=>25+(x-lo)*550/(hi-lo);let ticks='';for(let i=lo;i<=hi;i++)ticks+=`<path d="M${pos(i)} 55v10" stroke="#50404b"/><text x="${pos(i)}" y="82" text-anchor="middle" font-size="10">${i}</text>`;$('line').innerHTML=`<svg class="line" viewBox="0 0 600 100" role="img" aria-label="Number line: start ${a}, change ${b}, finish ${a+b}"><path d="M25 60H575" stroke="#50404b"/>${ticks}<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#a64e65"/></marker></defs>${b===0?'':`<path d="M${pos(a)} 45 Q${(pos(a)+pos(a+b))/2} 5 ${pos(a+b)} 45" fill="none" stroke="#a64e65" stroke-width="3" marker-end="url(#arrow)"/>`}<circle cx="${pos(a)}" cy="60" r="5" fill="#8563a6"/><circle cx="${pos(a+b)}" cy="60" r="6" fill="#a64e65"/></svg>`;$('result').textContent=`${a} + (${b}) = ${a+b}`;}function pool(){return bank.filter(q=>($('skill').value==='All'||q.skill===$('skill').value)&&($('difficulty').value==='All'||q.difficulty===$('difficulty').value));}function sample(){let a=pool().filter(q=>q.section!=='Spot the mistake');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}test=a.slice(0,10);}function render(){for(const b of $('nav').children)b.setAttribute('aria-pressed',b.textContent===section);$('newtest').hidden=section!=='Mini-tests';let qs=section==='Mini-tests'?test:pool().filter(q=>q.section===section);$('questions').replaceChildren();for(const q of qs){let a=document.createElement('article');let h=document.createElement('small');h.textContent=q.skill+' · '+q.difficulty;let p=document.createElement('p');p.textContent=q.prompt;let d=document.createElement('details');let sm=document.createElement('summary');sm.textContent='Show worked solution';let w=document.createElement('p');w.textContent=q.solution+' Answer: '+q.answer;d.append(sm,w);if(section==='Worked examples')d.open=true;a.append(h,p,d);$('questions').append(a);}if(!qs.length)$('questions').textContent='No questions match these filters.';}for(const s of sections){let b=document.createElement('button');b.textContent=s;b.onclick=()=>{section=s;if(s==='Mini-tests')sample();render();};$('nav').append(b);}for(const s of ['All',...new Set(bank.map(q=>q.skill))])$('skill').add(new Option(s,s));for(const id of ['skill','difficulty'])$(id).onchange=()=>{if(section==='Mini-tests')sample();render();};$('newtest').onclick=()=>{sample();render();};$('move').onclick=draw;draw();render();</script></html>
