<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trigonometry A Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year9_trigonometry_hub.html">← Learning hub</a><header><span class="pill">YEAR 9 · DIAGNOSTIC</span><h1>Trigonometry A</h1><p>Answer all 24 questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"id": "VM-TRG-081", "skill": "Practical trigonometry", "prompt": "A 18 m ladder makes an angle of 44° with level ground. Find its vertical reach to 2 decimal places.", "answer": "12.5", "solution": "Opposite = 18 × sin 44°. Answer: 12.5", "level": "Intermediate", "source_paragraph": 318, "options": ["13.5", "12.5", "11.5", "14.5"]}, {"id": "VM-TRG-082", "skill": "Triangle sides", "prompt": "In right triangle ABC, angle B is 90° and AB = 11 cm. Which side is opposite angle A?", "answer": "BC", "solution": "The opposite side does not touch angle A. Answer: BC", "level": "Intermediate", "source_paragraph": 307, "options": ["None", "BC", "AB", "AC"]}, {"id": "VM-TRG-083", "skill": "Ratio definitions", "prompt": "A right triangle has opposite side 33, adjacent side 44 and hypotenuse 55. Find sin θ.", "answer": "0.6", "solution": "Opposite ÷ hypotenuse. Answer: 0.6", "level": "Intermediate", "source_paragraph": 308, "options": ["0.59", "0.62", "0.61", "0.6"]}, {"id": "VM-TRG-084", "skill": "Ratio calculations", "prompt": "A right triangle has opposite side 33, adjacent side 44 and hypotenuse 55. Find cos θ.", "answer": "0.8", "solution": "Adjacent ÷ hypotenuse. Answer: 0.8", "level": "Intermediate", "source_paragraph": 309, "options": ["0.81", "0.82", "0.79", "0.8"]}, {"id": "VM-TRG-085", "skill": "Similar triangles", "prompt": "A right triangle has opposite side 33, adjacent side 44 and hypotenuse 55. Find tan θ.", "answer": "0.75", "solution": "Opposite ÷ adjacent. Scaling all sides preserves the ratio. Answer: 0.75", "level": "Intermediate", "source_paragraph": 310, "options": ["0.74", "0.76", "0.75", "0.77"]}, {"id": "VM-TRG-086", "skill": "Calculator ratios", "prompt": "Use degree mode to find sin 42° to 3 decimal places.", "answer": "0.669", "solution": "Enter sine of the angle in degree mode. Answer: 0.669", "level": "Intermediate", "source_paragraph": 312, "options": ["0.689", "0.679", "0.659", "0.669"]}, {"id": "VM-TRG-087", "skill": "Inverse ratios", "prompt": "Find θ to the nearest degree if tan θ = 11/14, where θ is acute.", "answer": "38", "solution": "Use inverse tangent of the ratio. Answer: 38", "level": "Intermediate", "source_paragraph": 313, "options": ["37", "38", "40", "39"]}, {"id": "VM-TRG-088", "skill": "Unknown sides", "prompt": "A right triangle has hypotenuse 19 cm and angle 44° 30′. Find the opposite side to 2 decimal places.", "answer": "13.32", "solution": "Opposite = 19 × sin 44.5°. Answer: 13.32", "level": "Intermediate", "source_paragraph": 316, "options": ["12.32", "15.32", "13.32", "14.32"]}, {"id": "VM-TRG-089", "skill": "Angles in degrees and minutes", "prompt": "Find the acute angle with tangent 11/14, to the nearest minute.", "answer": "38° 9′", "solution": "Use inverse tangent, multiply decimal degrees by 60 and round to the nearest minute. Answer: 38° 9′", "level": "Intermediate", "source_paragraph": 317, "options": ["38° 9′", "39° 9′", "37° 9′", "38° 24′"]}, {"id": "VM-TRG-090", "skill": "Practical trigonometry", "prompt": "A 19 m ladder makes an angle of 46° with level ground. Find its vertical reach to 2 decimal places.", "answer": "13.67", "solution": "Opposite = 19 × sin 46°. Answer: 13.67", "level": "Intermediate", "source_paragraph": 318, "options": ["15.67", "14.67", "13.67", "12.67"]}, {"id": "VM-TRG-091", "skill": "Triangle sides", "prompt": "In right triangle ABC, angle B is 90° and AB = 12 cm. Which side is opposite angle A?", "answer": "BC", "solution": "The opposite side does not touch angle A. Answer: BC", "level": "Intermediate", "source_paragraph": 307, "options": ["AB", "None", "BC", "AC"]}, {"id": "VM-TRG-092", "skill": "Ratio definitions", "prompt": "A right triangle has opposite side 36, adjacent side 48 and hypotenuse 60. Find sin θ.", "answer": "0.6", "solution": "Opposite ÷ hypotenuse. Answer: 0.6", "level": "Intermediate", "source_paragraph": 308, "options": ["0.62", "0.59", "0.6", "0.61"]}, {"id": "VM-TRG-093", "skill": "Ratio calculations", "prompt": "A right triangle has opposite side 36, adjacent side 48 and hypotenuse 60. Find cos θ.", "answer": "0.8", "solution": "Adjacent ÷ hypotenuse. Answer: 0.8", "level": "Intermediate", "source_paragraph": 309, "options": ["0.81", "0.8", "0.82", "0.79"]}, {"id": "VM-TRG-094", "skill": "Similar triangles", "prompt": "A right triangle has opposite side 36, adjacent side 48 and hypotenuse 60. Find tan θ.", "answer": "0.75", "solution": "Opposite ÷ adjacent. Scaling all sides preserves the ratio. Answer: 0.75", "level": "Intermediate", "source_paragraph": 310, "options": ["0.74", "0.76", "0.77", "0.75"]}, {"id": "VM-TRG-095", "skill": "Calculator ratios", "prompt": "Use degree mode to find sin 44° to 3 decimal places.", "answer": "0.695", "solution": "Enter sine of the angle in degree mode. Answer: 0.695", "level": "Intermediate", "source_paragraph": 312, "options": ["0.715", "0.685", "0.695", "0.705"]}, {"id": "VM-TRG-096", "skill": "Inverse ratios", "prompt": "Find θ to the nearest degree if tan θ = 12/15, where θ is acute.", "answer": "39", "solution": "Use inverse tangent of the ratio. Answer: 39", "level": "Intermediate", "source_paragraph": 313, "options": ["39", "40", "41", "38"]}, {"id": "VM-TRG-097", "skill": "Unknown sides", "prompt": "A right triangle has hypotenuse 20 cm and angle 46° 30′. Find the opposite side to 2 decimal places.", "answer": "14.51", "solution": "Opposite = 20 × sin 46.5°. Answer: 14.51", "level": "Intermediate", "source_paragraph": 316, "options": ["16.51", "15.51", "13.51", "14.51"]}, {"id": "VM-TRG-098", "skill": "Angles in degrees and minutes", "prompt": "Find the acute angle with tangent 12/15, to the nearest minute.", "answer": "38° 40′", "solution": "Use inverse tangent, multiply decimal degrees by 60 and round to the nearest minute. Answer: 38° 40′", "level": "Intermediate", "source_paragraph": 317, "options": ["38° 40′", "38° 55′", "39° 40′", "37° 40′"]}, {"id": "VM-TRG-099", "skill": "Practical trigonometry", "prompt": "A 20 m ladder makes an angle of 48° with level ground. Find its vertical reach to 2 decimal places.", "answer": "14.86", "solution": "Opposite = 20 × sin 48°. Answer: 14.86", "level": "Intermediate", "source_paragraph": 318, "options": ["15.86", "13.86", "16.86", "14.86"]}, {"id": "VM-TRG-100", "skill": "Triangle sides", "prompt": "In right triangle ABC, angle B is 90° and AB = 13 cm. Which side is opposite angle A?", "answer": "BC", "solution": "The opposite side does not touch angle A. Answer: BC", "level": "Intermediate", "source_paragraph": 307, "options": ["AB", "None", "AC", "BC"]}, {"id": "VM-TRG-101", "skill": "Ratio definitions", "prompt": "A right triangle has opposite side 39, adjacent side 52 and hypotenuse 65. Find sin θ.", "answer": "0.6", "solution": "Opposite ÷ hypotenuse. Answer: 0.6", "level": "Intermediate", "source_paragraph": 308, "options": ["0.59", "0.62", "0.61", "0.6"]}, {"id": "VM-TRG-102", "skill": "Ratio calculations", "prompt": "A right triangle has opposite side 39, adjacent side 52 and hypotenuse 65. Find cos θ.", "answer": "0.8", "solution": "Adjacent ÷ hypotenuse. Answer: 0.8", "level": "Intermediate", "source_paragraph": 309, "options": ["0.82", "0.79", "0.81", "0.8"]}, {"id": "VM-TRG-103", "skill": "Similar triangles", "prompt": "A right triangle has opposite side 39, adjacent side 52 and hypotenuse 65. Find tan θ.", "answer": "0.75", "solution": "Opposite ÷ adjacent. Scaling all sides preserves the ratio. Answer: 0.75", "level": "Intermediate", "source_paragraph": 310, "options": ["0.75", "0.76", "0.74", "0.77"]}, {"id": "VM-TRG-104", "skill": "Calculator ratios", "prompt": "Use degree mode to find sin 46° to 3 decimal places.", "answer": "0.719", "solution": "Enter sine of the angle in degree mode. Answer: 0.719", "level": "Intermediate", "source_paragraph": 312, "options": ["0.739", "0.719", "0.709", "0.729"]}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
