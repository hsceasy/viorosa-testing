eight:auto;margin:12px 0}</style><main><a href="year7_linear_relationships_hub.html">← Linear Relationships Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>The Linear Labyrinth</h1></header><p>Unlock each room by entering its numerical code. Use the units specified in each question.</p><article id="room"><h2 id="progress"></h2><div id="question"></div><label>Code <input id="code" inputmode="decimal"></label><button id="check">Unlock</button> <button id="help">Show hint</button><p id="hint" aria-live="polite"></p><p id="feedback" aria-live="polite"></p></article><article id="done" hidden><h2>You escaped!</h2><p>All six rooms unlocked.</p><button id="restart">Play again</button></article></main><script>const rooms=[["Find the gradient of the line shown.<svg viewBox=\"0 0 280 280\" role=\"img\" aria-label=\"Cartesian graph\" style=\"width:280px\"><path d=\"M30 30 V250 M30 250 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"30\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">-5</text><text x=\"130\" y=\"254\" font-size=\"10\" text-anchor=\"end\">-5</text><path d=\"M52 30 V250 M30 228 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"52\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">-4</text><text x=\"130\" y=\"232\" font-size=\"10\" text-anchor=\"end\">-4</text><path d=\"M74 30 V250 M30 206 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"74\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">-3</text><text x=\"130\" y=\"210\" font-size=\"10\" text-anchor=\"end\">-3</text><path d=\"M96 30 V250 M30 184 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"96\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">-2</text><text x=\"130\" y=\"188\" font-size=\"10\" text-anchor=\"end\">-2</text><path d=\"M118 30 V250 M30 162 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"118\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">-1</text><text x=\"130\" y=\"166\" font-size=\"10\" text-anchor=\"end\">-1</text><path d=\"M140 30 V250 M30 140 H250\" stroke=\"#574953\" fill=\"none\"/><path d=\"M162 30 V250 M30 118 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"162\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">1</text><text x=\"130\" y=\"122\" font-size=\"10\" text-anchor=\"end\">1</text><path d=\"M184 30 V250 M30 96 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"184\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">2</text><text x=\"130\" y=\"100\" font-size=\"10\" text-anchor=\"end\">2</text><path d=\"M206 30 V250 M30 74 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"206\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">3</text><text x=\"130\" y=\"78\" font-size=\"10\" text-anchor=\"end\">3</text><path d=\"M228 30 V250 M30 52 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"228\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">4</text><text x=\"130\" y=\"56\" font-size=\"10\" text-anchor=\"end\">4</text><path d=\"M250 30 V250 M30 30 H250\" stroke=\"#ded6df\" fill=\"none\"/><text x=\"250\" y=\"154\" font-size=\"10\" text-anchor=\"middle\">5</text><text x=\"130\" y=\"34\" font-size=\"10\" text-anchor=\"end\">5</text><text x=\"258\" y=\"136\">x</text><text x=\"148\" y=\"24\">y</text><polyline fill=\"none\" stroke=\"#986ba8\" stroke-width=\"3\" points=\"96,30 140,118 206,250\"/><circle cx=\"96\" cy=\"30\" r=\"4\" fill=\"#986ba8\"/><circle cx=\"140\" cy=\"118\" r=\"4\" fill=\"#986ba8\"/><circle cx=\"206\" cy=\"250\" r=\"4\" fill=\"#986ba8\"/></svg>", "-2", "Divide the change in y by the change in x."], ["A linear relationship contains (2, 9) and (5, 21). Find its y-intercept.", "1", "The gradient is 4; substitute into y = 4x + c."], ["Figure 1 uses 8 tiles, Figure 2 uses 13, and Figure 3 uses 18. The pattern grows by 5 tiles each time. Which figure uses 68 tiles?", "13", "Solve 5n + 3 = 68."], ["A tank contains 54 L and loses 3 L each minute. Another contains 18 L and gains 3 L each minute. After how many minutes are the volumes equal?", "6", "Set 54 − 3t equal to 18 + 3t."], ["A
