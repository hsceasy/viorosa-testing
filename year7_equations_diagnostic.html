\"><span>x</span><span>3</span></span> − 4 = 2.", "18", ["6", "−6", "2"], "Add 4, then multiply by 3.", "Two-step equations"], ["Solve −3x + 8 = 20.", "−4", ["4", "−12", "−9.33"], "Subtract 8, then divide by −3.", "Two-step equations"], ["Solve 3(x + 4) = 27.", "5", ["9", "13", "23"], "Divide by 3, then subtract 4.", "Applications and extension"], ["Solve 7x − 5 = 3x + 15.", "5", ["2", "−5", "10"], "Subtract 3x, add 5, then divide by 4.", "Applications and extension"], ["A $6 booking fee and 4 identical tickets cost $50 altogether. What is the price of one ticket?", "$11", ["$14", "$12.50", "$44"], "4x + 6 = 50, so x = 11.", "Applications and extension"], ["Two consecutive integers sum to 37. What is the smaller integer?", "18", ["19", "17", "18.5"], "x + (x + 1) = 37, so 2x = 36.", "Applications and extension"]];const picks=[];const root=document.getElementById('quiz');bank.forEach((q,i)=>{let a=document.createElement('article');let h=document.createElement('h3');h.innerHTML=(i+1)+'. '+q[0];a.append(h);let opts=[q[1],...q[2]];opts=opts.slice(i%4).concat(opts.slice(0,i%4));opts.forEach(v=>{let l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=v;r.onchange=()=>picks[i]=v;l.append(r,' ');if(/^\d+\/\d+$/.test(v)){let f=document.createElement('span');f.className='frac';v.split('/').forEach(n=>{let s=document.createElement('span');s.textContent=n;f.append(s)});l.append(f)}else {let s=document.createElement('span');s.innerHTML=v;l.append(s)};a.append(l)});root.append(a)});document.getElementById('mark').onclick=()=>{if(bank.some((q,i)=>picks[i]===undefined)){document.getElementById('feedback').textContent='Please answer every question first.';return}let score=0,groups={};bank.forEach((q,i)=>{let ok=picks[i]===q[1];score+=ok;let g=groups[q[4]]??=[0,0];g[0]+=ok;g[1]++;});let f=document.getElementById('feedback');f.replaceChildren();let h=document.createElement('h2');h.textContent=score+' / '+bank.length;f.append(h);Object.entries(groups).forEach(([k,v])=>{let p=document.createElement('p');p.textContent=k+': '+v.join(' / ');f.append(p)});bank.forEach((q,i)=>{let p=document.createElement('p');p.innerHTML=(i+1)+'. '+(picks[i]===q[1]?'Correct. ':'Review: ')+q[1]+'. '+q[3];f.append(p)});f.scrollIntoView()};</script></html>
