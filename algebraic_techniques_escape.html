ght:auto;margin:12px 0}</style><main><a href="year7_algebraic_techniques_hub.html">← Algebraic Techniques Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>The Notation Vault</h1></header><p>Unlock each room by entering its numerical code. Use the units specified in each question.</p><article id="room"><h2 id="progress"></h2><p id="question"></p><label>Code <input id="code" inputmode="decimal"></label><button id="check">Unlock</button> <button id="help">Show hint</button><p id="hint"></p><p id="feedback" aria-live="polite"></p></article><article id="done" hidden><h2>You escaped!</h2><p>All six rooms unlocked.</p><button onclick="location.reload()">Play again</button></article></main><script>const rooms=[["Write 4n + 9 when n = 6. Enter its value.", "33", "Multiply 4 by 6, then add 9."], ["Simplify 12x − 5x + 3x. Enter the coefficient.", "10", "Combine 12 − 5 + 3."], ["Simplify 8a × 3a. Enter the coefficient.", "24", "Multiply 8 and 3."], ["Evaluate 2y² when y = −4.", "32", "Square −4 first."], ["Expand 7(p + 5). Enter the constant term.", "35", "Multiply 7 by 5."], ["Factorise 18m + 30 fully. Enter the common factor.", "6", "Find the highest common factor of 18 and 30."]];let i=0;const el=id=>document.getElementById(id);function show(){el('progress').textContent='Room '+(i+1)+' of '+rooms.length;el('question').textContent=rooms[i][0];el('code').value='';el('feedback').textContent='';el('hint').textContent=''}el('check').onclick=()=>{if(el('code').value.trim()===''||Number(el('code').value)!==Number(rooms[i][1])){el('feedback').textContent='Not quite. Check your calculation.';return}i++;if(i===rooms.length){el('room').hidden=true;el('done').hidden=false}else show()};el('help').onclick=()=>el('hint').textContent=rooms[i][2];el('code').addEventListener('keydown',e=>{if(e.key==='Enter')el('check').click()});show();</script></html>
