 href="https://www.viorosamaths.com/year7_properties_of_geometrical_figures_hub.html"><script async src="https://www.googletagmanager.com/gtag/js?id=G-180BGJQCSL"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-180BGJQCSL");</script></head><body><main><p class="tag">NSW Stage 4 • MA4-GEO-C-01 • Polygon angle rules and symmetry are supplementary enrichment.</p><nav><a href="nsw.html">← NSW Maths</a></nav><header class="hero"><p>VIOROSA MATHS · Confidence that grows</p><h1>Properties of Geometrical Figures</h1><p>Year 7 · Stage 4 · 208 questions</p></header><nav id="vm-tabs" aria-label="Learning sections"></nav><section id="content" aria-live="polite"></section></main><script id="bank" type="application/json">[{"topic": "Triangles", "section": "practice", "question": "Classify a triangle by its side lengths: 5, 5, 8 cm.", "answer": "Isosceles", "solution": "Exactly two sides are equal.", "id": "VM-PGF-001"}, {"topic": "Triangles", "section": "practice", "question": "Classify a triangle by its angles: 35°, 55°, 90°.", "answer": "Right-angled", "solution": "One angle is 90°.", "id": "VM-PGF-002"}, {"topic": "Triangles", "section": "practice", "question": "Can sides 3, 4, 8 cm form a triangle?", "answer": "No", "solution": "3 + 4 < 8, so the sides cannot close.", "id": "VM-PGF-003"}, {"topic": "Triangles", "section": "practice", "question": "Find each angle of an equilateral triangle.", "answer": "60°", "solution": "180° divided by 3 is 60°.", "id": "VM-PGF-004"}, {"topic": "Triangles", "section": "practice", "question": "An isosceles triangle has vertex angle 44°. Find its base angles.", "answer": "68° each", "solution": "(180° − 44°) divided by 2 = 68°.", "id": "VM-PGF-005"}, {"topic": "Triangles", "section": "practice", "question": "Classify a triangle by its side lengths: 6, 7, 9 cm.", "answer": "Scalene", "solution": "All three lengths differ.", "id": "VM-PGF-006"}, {"topic": "Triangles", "section": "practice", "question": "Classify a triangle by its angles: 20°, 40°, 120°.", "answer": "Obtuse", "solution": "120° exceeds 90°.", "id": "VM-PGF-007"}, {"topic": "Triangles", "section": "practice", "question": "Classify a triangle by its angles: 50°, 60°, 70°.", "answer": "Acute", "solution": "Every angle is less than 90°.", "id": "VM-PGF-008"}, {"topic": "Triangles", "section": "practice", "question": "Can an equilateral triangle be right-angled?", "answer": "No", "solution": "All its angles are 60°.", "id": "VM-PGF-009"}, {"topic": "Triangles", "section": "practice", "question": "Find the missing angle if two angles are 37° and 81°.", "answer": "62°", "solution": "180° − 37° − 81° = 62°.", "id": "VM-PGF-010"}, {"topic": "Triangles", "section": "practice", "question": "A triangle has two 45° angles. Classify by sides and angles.", "answer": "Isosceles right-angled", "solution": "Equal angles imply equal opposite sides; the third angle is 90°.", "id": "VM-PGF-011"}, {"topic": "Triangles", "section": "practice", "question": "A triangle has perimeter 25 cm and equal sides 9 cm. Find the base.", "answer": "7 cm", "solution": "25 − 18 = 7.", "id": "VM-PGF-012"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Name a quadrilateral with four equal sides and four right angles.", "answer": "Square", "solution": "Both conditions define a square.", "id": "VM-PGF-013"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Name a parallelogram with four right angles.", "answer": "Rectangle", "solution": "A parallelogram with right angles is a rectangle (possibly a square).", "id": "VM-PGF-014"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Name a parallelogram with four equal sides.", "answer": "Rhombus", "solution": "All four sides are equal (possibly a square).", "id": "VM-PGF-015"}, {"topic": "Quadrilaterals", "section": "practice", "question": "How many pairs of opposite parallel sides does a parallelogram have?", "answer": "2", "solution": "Both opposite side pairs are parallel.", "id": "VM-PGF-016"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Are opposite angles of a parallelogram equal?", "answer": "Yes", "solution": "Parallel opposite sides imply equal opposite angles.", "id": "VM-PGF-017"}, {"topic": "Quadrilaterals", "section": "practice", "question": "What is the angle sum of a quadrilateral?", "answer": "360°", "solution": "A diagonal divides it into two triangles.", "id": "VM-PGF-018"}, {"topic": "Quadrilaterals", "section": "practice", "question": "A parallelogram has an angle of 73°. Find an adjacent angle.", "answer": "107°", "solution": "Adjacent angles sum to 180°.", "id": "VM-PGF-019"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Do rectangle diagonals have equal lengths?", "answer": "Yes", "solution": "The diagonals of every rectangle are equal.", "id": "VM-PGF-020"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Do rhombus diagonals meet at right angles?", "answer": "Yes", "solution": "Rhombus diagonals are perpendicular.", "id": "VM-PGF-021"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Is every square a rectangle?", "answer": "Yes", "solution": "Every square has four right angles.", "id": "VM-PGF-022"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Is every rectangle a square?", "answer": "No", "solution": "A 3 cm by 5 cm rectangle has unequal adjacent sides.", "id": "VM-PGF-023"}, {"topic": "Quadrilaterals", "section": "practice", "question": "Name a quadrilateral with exactly one pair of parallel sides.", "answer": "Trapezium", "solution": "It satisfies the exactly-one-pair convention used here.", "id": "VM-PGF-024"}, {"topic": "Polygons", "section": "practice", "question": "Name a polygon with five sides.", "answer": "Pentagon", "solution": "Penta denotes five.", "id": "VM-PGF-025"}, {"topic": "Polygons", "section": "practice", "question": "Name a polygon with eight sides.", "answer": "Octagon", "solution": "Octa denotes eight.", "id": "VM-PGF-026"}, {"topic": "Polygons", "section": "practice", "question": "What makes a polygon regular?", "answer": "Equal sides and equal angles", "solution": "Both conditions must hold.", "id": "VM-PGF-027"}, {"topic": "Polygons", "section": "practice", "question": "Is a non-square rectangle regular?", "answer": "No", "solution": "Its adjacent sides differ in length.", "id": "VM-PGF-028"}, {"topic": "Polygons", "section": "practice", "question": "How many diagonals does a quadrilateral have?", "answer": "2", "solution": "Each joins opposite vertices.", "id": "VM-PGF-029"}, {"topic": "Polygons", "section": "practice", "question": "How many triangles are formed by drawing all diagonals from one vertex of a convex hexagon?", "answer": "4", "solution": "Subtract 2 from 6.", "id": "VM-PGF-030"}, {"topic": "Polygons", "section": "practice", "question": "Find the interior angle sum of a pentagon.", "answer": "540°", "solution": "3 × 180° = 540°.", "id": "VM-PGF-031"}, {"topic": "Polygons", "section": "practice", "question": "Find the interior angle of a regular hexagon.", "answer": "120°", "solution": "720° divided by 6 = 120°.", "id": "VM-PGF-032"}, {"topic": "Polygons", "section": "practice", "question": "Find the exterior turning angle of a regular octagon.", "answer": "45°", "solution": "360° divided by 8 = 45°.", "id": "VM-PGF-033"}, {"topic": "Polygons", "section": "practice", "question": "Can a polygon have a curved side?", "answer": "No", "solution": "A polygon is bounded by straight segments.", "id": "VM-PGF-034"}, {"topic": "Polygons", "section": "practice", "question": "What is a concave polygon?", "answer": "A polygon with an interior angle greater than 180°", "solution": "A concave simple polygon has an inward corner.", "id": "VM-PGF-035"}, {"topic": "Polygons", "section": "practice", "question": "Name a polygon with ten sides.", "answer": "Decagon", "solution": "Deca denotes ten.", "id": "VM-PGF-036"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a non-square rectangle have?", "answer": "2", "solution": "The two lines joining midpoints of opposite sides are reflection axes; the diagonals are not.", "id": "VM-PGF-037"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a square have?", "answer": "4", "solution": "Two midlines and two diagonals.", "id": "VM-PGF-038"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a scalene triangle have?", "answer": "0", "solution": "No pair of sides is equal.", "id": "VM-PGF-039"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does an equilateral triangle have?", "answer": "3", "solution": "Each joins a vertex to the opposite midpoint.", "id": "VM-PGF-040"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a non-equilateral isosceles triangle have?", "answer": "1", "solution": "The axis joins the apex and base midpoint.", "id": "VM-PGF-041"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a non-square rhombus have?", "answer": "2", "solution": "Its two diagonals are reflection axes.", "id": "VM-PGF-042"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a circle have?", "answer": "Infinitely many", "solution": "Every diameter is an axis.", "id": "VM-PGF-043"}, {"topic": "Line symmetry", "section": "practice", "question": "Reflect (3, 2) in the y-axis.", "answer": "(−3, 2)", "solution": "Reverse the x-coordinate.", "id": "VM-PGF-044"}, {"topic": "Line symmetry", "section": "practice", "question": "Reflect (−4, 1) in the x-axis.", "answer": "(−4, −1)", "solution": "Reverse the y-coordinate.", "id": "VM-PGF-045"}, {"topic": "Line symmetry", "section": "practice", "question": "Is a diagonal of a non-square rectangle a reflection axis?", "answer": "No", "solution": "Reflection across it does not match the rectangle.", "id": "VM-PGF-046"}, {"topic": "Line symmetry", "section": "practice", "question": "How many reflection axes does a regular pentagon have?", "answer": "5", "solution": "Each vertex aligns with the opposite side midpoint.", "id": "VM-PGF-047"}, {"topic": "Line symmetry", "section": "practice", "question": "A point lies on a reflection axis. Where is its image?", "answer": "At the same point", "solution": "Points on the axis are fixed.", "id": "VM-PGF-048"}, {"topic": "Rotational symmetry", "section": "practice", "question": "State the rotational order of a non-square rectangle.", "answer": "2", "solution": "It matches at 180° and 360°.", "id": "VM-PGF-049"}, {"topic": "Rotational symmetry", "section": "practice", "question": "State the rotational order of a square.", "answer": "4", "solution": "It matches every 90°.", "id": "VM-PGF-050"}, {"topic": "Rotational symmetry", "section": "practice", "question": "State the rotational order of a scalene triangle.", "answer": "1", "solution": "Only a full turn matches.", "id": "VM-PGF-051"}, {"topic": "Rotational symmetry", "section": "practice", "question": "State the rotational order of an equilateral triangle.", "answer": "3", "solution": "It matches every 120°.", "id": "VM-PGF-052"}, {"topic": "Rotational symmetry", "section": "practice", "question": "State the rotational order of a regular pentagon.", "answer": "5", "solution": "It matches every 72°.", "id": "VM-PGF-053"}, {"topic": "Rotational symmetry", "section": "practice", "question": "Find the smallest positive matching rotation of a regular hexagon.", "answer": "60°", "solution": "360° divided by 6 = 60°.", "id": "VM-PGF-054"}, {"topic": "Rotational symmetry", "section": "practice", "question": "A shape has rotational order 8. Find its smallest positive matching angle.", "answer": "45°", "solution": "360° divided by 8 = 45°.", "id": "VM-PGF-055"}, {"topic": "Rotational symmetry", "section": "practice", "question": "A shape matches first at 180°. Find its order.", "answer": "2", "solution": "360° divided by 180° = 2.", "id": "VM-PGF-056"}, {"topic": "Rotational symmetry", "section": "practice", "question": "Does a non-square rhombus have rotational order 2?", "answer": "Yes", "solution": "A half-turn exchanges opposite vertices.", "id": "VM-PGF-057"}, {"topic": "Rotational symmetry", "section": "practice", "question": "Rotate (2, 3) by 180° about the origin.", "answer": "(−2, −3)", "solution": "Both coordinate signs reverse.", "id": "VM-PGF-058"}, {"topic": "Rotational symmetry", "section": "practice", "question": "Rotate (2, 3) by 90° anticlockwise about the origin.", "answer": "(−3, 2)", "solution": "The rule is (x, y) → (−y, x).", "id": "VM-PGF-059"}, {"topic": "Rotational symmetry", "section": "practice", "question": "Does a non-equilateral isosceles triangle have rotational order greater than 1?", "answer": "No", "solution": "Only a full turn matches.", "id": "VM-PGF-060"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Give a counterexample to every quadrilateral having parallel sides.", "answer": "A kite with no parallel sides", "solution": "For example, join (0, 3), (2, 0), (0, −1), (−2, 0) in order. The adjacent side pairs are equal but neither pair of opposite sides is parallel.", "id": "VM-PGF-061"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Can a triangle have two obtuse angles?", "answer": "No", "solution": "Their sum would exceed 180°.", "id": "VM-PGF-062"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Can a quadrilateral have three right angles but not four?", "answer": "No", "solution": "The remaining angle is 360° − 270° = 90°.", "id": "VM-PGF-063"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Is every rhombus a parallelogram?", "answer": "Yes", "solution": "Both pairs of opposite sides are parallel.", "id": "VM-PGF-064"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Does equal diagonal length alone guarantee a square?", "answer": "No", "solution": "A non-square rectangle has equal diagonals.", "id": "VM-PGF-065"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Does four equal sides alone guarantee a square?", "answer": "No", "solution": "A non-square rhombus is a counterexample.", "id": "VM-PGF-066"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Can a triangle have angles 30°, 60°, 100°?", "answer": "No", "solution": "Their sum is 190°, not 180°.", "id": "VM-PGF-067"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Can a regular polygon have exactly seven reflection axes?", "answer": "Yes", "solution": "A regular heptagon has seven axes.", "id": "VM-PGF-068"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Can a shape have rotational symmetry without reflection symmetry?", "answer": "Yes", "solution": "A slanted non-rectangular, non-rhombus parallelogram has order 2 and no reflection axes.", "id": "VM-PGF-069"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "A rectangle has perimeter 30 cm and width 6 cm. Find its length.", "answer": "9 cm", "solution": "Half the perimeter is 15 cm; subtract 6 cm.", "id": "VM-PGF-070"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "A square has side 7 cm. Find its perimeter.", "answer": "28 cm", "solution": "Four equal sides give 4 × 7 = 28.", "id": "VM-PGF-071"}, {"topic": "Geometrical reasoning", "section": "practice", "question": "Is every equilateral triangle isosceles under the at-least-two-equal-sides definition?", "answer": "Yes", "solution": "Three equal sides imply at least two equal sides.", "id": "VM-PGF-072"}, {"topic": "Triangles", "question": "An isosceles triangle has two equal angles of 38°. Find the third angle.", "answer": "104°", "solution": "180° − 2 × 38° = 104°.", "section": "worked_example", "id": "VM-PGF-073"}, {"topic": "Triangles", "question": "In triangle ABC, name the angle at B using three letters and name the opposite side.", "answer": "∠ABC (or ∠CBA); AC", "solution": "The middle letter identifies the angle vertex. AC joins the other two vertices.", "section": "worked_example", "id": "VM-PGF-074"}, {"topic": "Triangles", "question": "Prove the angles of triangle ABC sum to 180° by drawing a line through A parallel to BC.", "answer": "The three angles sum to 180°.", "solution": "The angles at B and C equal the alternate angles formed at A. Together with ∠BAC, these form a straight angle of 180°.", "section": "worked_example", "id": "VM-PGF-075"}, {"topic": "Triangles", "question": "Extend BC beyond C to D. Explain why ∠ACD = ∠BAC + ∠ABC.", "answer": "Exterior angle equals the two remote interior angles.", "solution": "∠ACD + ∠ACB = 180° (straight line). ∠BAC + ∠ABC + ∠ACB = 180° (triangle sum). Subtract ∠ACB from both equations.", "section": "worked_example", "id": "VM-PGF-076"}, {"topic": "Quadrilaterals", "question": "A parallelogram has an interior angle of 50°. Find the adjacent angle.", "answer": "130°", "solution": "Adjacent angles are supplementary: 180° − 50° = 130°.", "section": "worked_example", "id": "VM-PGF-077"}, {"topic": "Quadrilaterals", "question": "A simple quadrilateral has an interior angle of 210°. Is it convex or non-convex?", "answer": "Non-convex", "solution": "A convex quadrilateral has all interior angles less than 180°. The reflex angle makes this quadrilateral non-convex.", "section": "worked_example", "id": "VM-PGF-078", "diagram": "<svg viewBox=\"0 0 240 155\" width=\"240\" role=\"img\" aria-label=\"Concave quadrilateral with inward vertex\"><polygon points=\"20,20 220,20 105,65 20,135\" fill=\"#f4e3ee\" stroke=\"#875b80\" stroke-width=\"3\"/><text x=\"112\" y=\"85\" font-size=\"13\">reflex vertex<\/text><\/svg>"}, {"topic": "Quadrilaterals", "question": "Draw a diagonal inside a convex quadrilateral. Explain why its angles total 360°.", "answer": "360°", "solution": "The diagonal divides it into two triangles, each with angle sum 180°. Their angles combine to give 360°.", "section": "worked_example", "id": "VM-PGF-079"}, {"topic": "Quadrilaterals", "question": "Kite ABCD has AB = AD = 7 cm and BC = CD = 11 cm. Which diagonal is the symmetry axis?", "answer": "AC", "solution": "A and C are the vertices where the equal adjacent sides meet. Reflection in AC swaps B and D.", "section": "worked_example", "id": "VM-PGF-080"}, {"topic": "Polygons", "question": "Find the interior angle sum of a 5-sided polygon.", "answer": "540°", "solution": "(5 − 2) × 180° = 540°.", "section": "worked_example", "id": "VM-PGF-081"}, {"topic": "Polygons", "question": "Find the interior angle sum of a 6-sided polygon.", "answer": "720°", "solution": "(6 − 2) × 180° = 720°.", "section": "worked_example", "id": "VM-PGF-082"}, {"topic": "Polygons", "question": "Find the interior angle sum of a 7-sided polygon.", "answer": "900°", "solution": "(7 − 2) × 180° = 900°.", "section": "worked_example", "id": "VM-PGF-083"}, {"topic": "Polygons", "question": "Find the interior angle sum of an 8-sided polygon.", "answer": "1080°", "solution": "(8 − 2) × 180° = 1080°.", "section": "worked_example", "id": "VM-PGF-084"}, {"topic": "Line symmetry", "question": "A regular polygon has 5 sides. How many lines of symmetry does it have?", "answer": "5", "solution": "A regular polygon with n sides has exactly n reflection axes.", "section": "worked_example", "id": "VM-PGF-085"}, {"topic": "Line symmetry", "question": "A regular polygon has 6 sides. How many lines of symmetry does it have?", "answer": "6", "solution": "A regular polygon with n sides has exactly n reflection axes.", "section": "worked_example", "id": "VM-PGF-086"}, {"topic": "Line symmetry", "question": "A regular polygon has 7 sides. How many lines of symmetry does it have?", "answer": "7", "solution": "A regular polygon with n sides has exactly n reflection axes.", "section": "worked_example", "id": "VM-PGF-087"}, {"topic": "Line symmetry", "question": "A regular polygon has 8 sides. How many lines of symmetry does it have?", "answer": "8", "solution": "A regular polygon with n sides has exactly n reflection axes.", "section": "worked_example", "id": "VM-PGF-088"}, {"topic": "Rotational symmetry", "question": "A regular polygon has 5 vertices. State its order of rotational symmetry and smallest positive rotation angle. Round the angle to two decimal places if needed.", "answer": "Order 5; 72.00° (to 2 decimal places)", "solution": "There are 5 matching orientations in a full turn. Divide 360° by 5.", "section": "worked_example", "id": "VM-PGF-089"}, {"topic": "Rotational symmetry", "question": "A regular polygon has 6 vertices. State its order of rotational symmetry and smallest positive rotation angle. Round the angle to two decimal places if needed.", "answer": "Order 6; 60.00° (to 2 decimal places)", "solution": "There are 6 matching orientations in a full turn. Divide 360° by 6.", "section": "worked_example", "id": "VM-PGF-090"}, {"topic": "Rotational symmetry", "question": "A regular polygon has 7 vertices. State its order of rotational symmetry and smallest positive rotation angle. Round the angle to two decimal places if needed.", "answer": "Order 7; 51.43° (to 2 decimal places)", "solution": "There are 7 matching orientations in a full turn. Divide 360° by 7.", "section": "worked_example", "id": "VM-PGF-091"}, {"topic": "Rotational symmetry", "question": "A regular polygon has 8 vertices. State its order of rotational symmetry and smallest positive rotation angle. Round the angle to two decimal places if needed.", "answer": "Order 8; 45.00° (to 2 decimal places)", "solution": "There are 8 matching orientations in a full turn. Divide 360° by 8.", "section": "worked_example", "id": "VM-PGF-092"}, {"topic": "Geometrical reasoning", "question": "A triangle has angles 26°, 52° and the remaining angle. Is it possible for this triangle to be right-angled?", "answer": "No", "solution": "The remaining angle is 102°. Check whether any of 26°, 52° and 102° equals 90°.", "section": "worked_example", "id": "VM-PGF-093"}, {"topic": "Geometrical reasoning", "question": "A quadrilateral has vertices A, B, C, D in boundary order. Is ACBD another valid boundary name?", "answer": "No", "solution": "ACBD joins opposite vertices rather than following the boundary. BCDA or ADCB is valid.", "section": "worked_example", "id": "VM-PGF-094"}, {"topic": "Geometrical reasoning", "question": "How would you mark AB = CD, AB ∥ CD and ∠ABC = 90° on a diagram?", "answer": "Matching ticks, matching arrows, right-angle square", "solution": "Ticks denote equal lengths, arrow marks denote parallel sides and a small square denotes a right angle at B.", "section": "worked_example", "id": "VM-PGF-095"}, {"topic": "Geometrical reasoning", "question": "A kite has sides 9 cm, 9 cm, 14 cm and 14 cm in adjacent equal pairs. Find its perimeter and explain why it cannot be a rhombus.", "answer": "46 cm; the side lengths are not all equal.", "solution": "Add 9 + 9 + 14 + 14 = 46. A rhombus requires four equal sides.", "section": "worked_example", "id": "VM-PGF-096"}, {"topic": "Triangles", "section": "spot_the_mistake", "question": "Classify a triangle with sides 5, 5, 8 cm. A student answers: Equilateral. Explain the error and correct the answer.", "answer": "Isosceles", "solution": "Exactly two sides are equal.", "id": "VM-PGF-097"}, {"topic": "Triangles", "section": "spot_the_mistake", "question": "Classify a triangle with angles 35°, 55°, 90°. A student answers: Acute. Explain the error and correct the answer.", "answer": "Right-angled", "solution": "One angle is 90°.", "id": "VM-PGF-098"}, {"topic": "Triangles", "section": "spot_the_mistake", "question": "Can sides 3, 4, 8 cm form a triangle? A student answers: Yes. Explain the error and correct the answer.", "answer": "No", "solution": "3 + 4 < 8, so the sides cannot close.", "id": "VM-PGF-099"}, {"topic": "Triangles", "section": "spot_the_mistake", "question": "Find each angle of an equilateral triangle. A student answers: 90°. Explain the error and correct the answer.", "answer": "60°", "solution": "180° divided by 3 is 60°.", "id": "VM-PGF-100"}, {"topic": "Quadrilaterals", "section": "spot_the_mistake", "question": "Name a quadrilateral with four equal sides and four right angles. A student answers: Rhombus, but not a square. Explain the error and correct the answer.", "answer": "Square", "solution": "Four equal sides and four right angles define a square. A square is also a rhombus.", "id": "VM-PGF-101"}, {"topic": "Quadrilaterals", "section": "spot_the_mistake", "question": "Name a parallelogram with four right angles. A student answers: Square only. Explain the error and correct the answer.", "answer": "Rectangle", "solution": "A parallelogram with right angles is a rectangle (possibly a square).", "id": "VM-PGF-102"}, {"topic": "Quadrilaterals", "section": "spot_the_mistake", "question": "Name a parallelogram with four equal sides. A student answers: Rectangle only. Explain the error and correct the answer.", "answer": "Rhombus", "solution": "All four sides are equal (possibly a square).", "id": "VM-PGF-103"}, {"topic": "Quadrilaterals", "section": "spot_the_mistake", "question": "How many pairs of opposite parallel sides does a parallelogram have? A student answers: 1. Explain the error and correct the answer.", "answer": "2", "solution": "Both opposite side pairs are parallel.", "id": "VM-PGF-104"}, {"topic": "Polygons", "section": "spot_the_mistake", "question": "Name a polygon with five sides. A student answers: Hexagon. Explain the error and correct the answer.", "answer": "Pentagon", "solution": "Penta denotes five.", "id": "VM-PGF-105"}, {"topic": "Polygons", "section": "spot_the_mistake", "question": "Name a polygon with eight sides. t answers: 4. Explain the error and correct the answer.", "answer": "2", "solution": "It matches at 180° and 360°.", "id": "VM-PGF-113"}, {"topic": "Rotational symmetry", "section": "spot_the_mistake", "question": "State the rotational order of a square. A student answers: 2. Explain the error and correct the answer.", "answer": "4", "solution": "It matches every 90°.", "id": "VM-PGF-114"}, {"topic": "Rotational symmetry", "section": "spot_the_mistake", "question": "State the rotational order of a scalene triangle. A student answers: 0. Explain the error and correct the answer.", "answer": "1", "solution": "Only a full turn matches.", "id": "VM-PGF-115"}, {"topic": "Rotational symmetry", "section": "spot_the_mistake", "question": "State the rotational order of an equilateral triangle. A student answers: 6. Explain the error and correct the answer.", "answer": "3", "solution": "It matches every 120°.", "id": "VM-PGF-116"}, {"topic": "Geometrical reasoning", "section": "spot_the_mistake", "question": "Give a counterexample to every quadrilateral having parallel sides. A student answers: A rectangle. Explain the error and correct the answer.", "answer": "A kite with no parallel sides", "solution": "For example, join (0, 3), (2, 0), (0, −1), (−2, 0) in order. The adjacent side pairs are equal but neither pair of opposite sides is parallel.", "id": "VM-PGF-117"}, {"topic": "Geometrical reasoning", "section": "spot_the_mistake", "question": "Can a triangle have two obtuse angles? A student answers: Yes. Explain the error and correct the answer.", "answer": "No", "solution": "Their sum would exceed 180°.", "id": "VM-PGF-118"}, {"topic": "Geometrical reasoning", "section": "spot_the_mistake", "question": "Can a quadrilateral have three right angles but not four? A student answers: Yes. Explain the error and correct the answer.", "answer": "No", "solution": "The remaining angle is 360° − 270° = 90°.", "id": "VM-PGF-119"}, {"topic": "Geometrical reasoning", "section": "spot_t ugh opposite side midpoints.", "id": "VM-PGF-157"}, {"topic": "Line symmetry", "section": "challenge", "question": "A point lies on the mirror line. Where is its reflection?", "answer": "At the same point", "solution": "Its perpendicular distance from the mirror is zero.", "id": "VM-PGF-158"}, {"topic": "Line symmetry", "section": "challenge", "question": "Does a non-square rhombus have diagonal symmetry lines?", "answer": "Yes, two", "solution": "Both diagonals reflect the rhombus onto itself.", "id": "VM-PGF-159"}, {"topic": "Line symmetry", "section": "challenge", "question": "Reflect (3, 1) in the y-axis, then in the x-axis.", "answer": "(−3, −1)", "solution": "Negate x first, then y.", "id": "VM-PGF-160"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "A shape has rotational symmetry of order 5. Find its smallest positive rotation.", "answer": "72°", "solution": "360° ÷ 5 = 72°.", "id": "VM-PGF-161"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "Find the rotational symmetry order of a non-square rectangle.", "answer": "2", "solution": "It matches at 180° and 360°.", "id": "VM-PGF-162"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "Does a non-equilateral isosceles triangle have rotational symmetry of order greater than 1?", "answer": "No", "solution": "Only a full turn matches it.", "id": "VM-PGF-163"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "Find the rotational symmetry order of the shape shown.", "answer": "2", "solution": "It matches after a half-turn but not a quarter-turn.", "id": "VM-PGF-164", "diagram": "<svg viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Diagram for this question; not necessarily to scale\"><polygon points=\"90,50 280,50 230,190 40,190\" fill=\"#eadcf2\" stroke=\"#74538b\" stroke-width=\"2\"/><\/svg>"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "A regular hexagon rotates 120°. How many vertex positions does it move?", "answer": "2", "solution": "Each vertex step is 60°.", "id": "VM-PGF-165"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "A shape first matches itself after 45°. Find its order.", "answer": "8", "solution": "360° ÷ 45° = 8.", "id": "VM-PGF-166"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "Can a shape have rotational symmetry of order 7 and match after 90°?", "answer": "No", "solution": "90° is not a whole multiple of 360° ÷ 7.", "id": "VM-PGF-167"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "Rotate (2, 5) through 180° about the origin.", "answer": "(−2, −5)", "solution": "Both coordinates change sign.", "id": "VM-PGF-168"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "A square turns 270° clockwise. What smaller anticlockwise turn is equivalent?", "answer": "90°", "solution": "Together the turns make 360°.", "id": "VM-PGF-169"}, {"topic": "Rotational symmetry", "section": "challenge", "question": "A regular pentagon rotates through three consecutive vertex steps in the same direction. Find the angle turned.", "answer": "216°", "solution": "3 × 72° = 216°.", "id": "VM-PGF-170"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Give a counterexample to: every quadrilateral has a symmetry line.", "answer": "A parallelogram that is neither a rectangle nor a rhombus", "solution": "For example, a parallelogram with adjacent sides 4 cm and 6 cm and an included angle of 60° has no reflection axis.", "id": "VM-PGF-171"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "A rectangle has perimeter 28 cm. Compare the areas of a square and a 5 cm wide rectangle.", "answer": "49 cm² and 45 cm²", "solution": "Square side 7; other length 9.", "id": "VM-PGF-172"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Can a quadrilateral have four obtuse angles?", "answer": "No", "solution": "Their sum would exceed 360°.", "id": "VM-PGF-173"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Which diagonal property is shared by rectangles and rhombuses?", "answer": "They bisect each other", "solution": "Both are parallelograms.", "id": "VM-PGF-174"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Find the missing angle in the diagram.", "answer": "110°", "solution": "360° − 90° − 90° − 70° = 110°.", "id": "VM-PGF-175", "diagram": "<svg viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Diagram for this question; not necessarily to scale\"><polygon points=\"60,40 260,40 260,200 118,200\" fill=\"#eadcf2\" stroke=\"#74538b\" stroke-width=\"2\"/><text x=\"90\" y=\"65\" text-anchor=\"middle\">70°<\/text><text x=\"235\" y=\"65\" text-anchor=\"middle\">90°<\/text><text x=\"235\" y=\"185\" text-anchor=\"middle\">90°<\/text><text x=\"130\" y=\"180\" text-anchor=\"middle\">x<\/text><\/svg>"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "A regular polygon has exactly three symmetry lines. Name it.", "answer": "Equilateral triangle", "solution": "A regular n-gon has n symmetry lines.", "id": "VM-PGF-176"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Explain why every square is a parallelogram.", "answer": "Both pairs of opposite sides are parallel", "solution": "This satisfies the parallelogram definition.", "id": "VM-PGF-177"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "Can a triangle have angles in ratio 2:2:5? Classify it.", "answer": "Yes; obtuse isosceles", "solution": "Each part is 20°; angles 40°, 40°, 100°.", "id": "VM-PGF-178"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "A polygon has 9 diagonals. Find its number of sides.", "answer": "6", "solution": "Six vertices each have three diagonals; 6 × 3 ÷ 2 = 9.", "id": "VM-PGF-179"}, {"topic": "Geometrical reasoning", "section": "challenge", "question": "A rectangle and rhombus both have perimeter 32 cm. Must their areas match?", "answer": "No", "solution": "A 2 cm by 14 cm rectangle has perimeter 32 cm and area 28 cm². A square of side 8 cm is also a rhombus, with perimeter 32 cm and area 64 cm².", "id": "VM-PGF-180"}, {"topic": "Triangles", "section": "diagnostic", "question": "A triangle has angles 30°, 30° and 120°. Classify it by sides and angles.", "answer": "Isosceles obtuse", "solution": "Two equal angles imply two equal sides; 120° is obtuse.", "id": "VM-PGF-181", "options": ["Scalene obtuse", "Isosceles obtuse", "Equilateral", "Isosceles acute"], "correct_index": 1}, {"topic": "Triangles", "section": "diagnostic", "question": "Which lengths cannot form a triangle?", "answer": "2, 5, 7 cm", "solution": "2 + 5 = 7, so the triangle would be flat.", "id": "VM-PGF-182", "options": ["4, 5, 6 cm", "5, 5, 8 cm", "3, 4, 5 cm", "2, 5, 7 cm"], "correct_index": 3}, {"topic": "Triangles", "section": "diagnostic", "question": "An isosceles triangle has base angles of 73°. Find its vertex angle.", "answer": "34°", "solution": "180° − 2 × 73° = 34°.", "id": "VM-PGF-183", "options": ["34°", "107°", "37°", "146°"], "correct_index": 0}, {"topic": "Quadrilaterals", "section": "diagnostic", "question": "Which property must every rectangle have?", "answer": "Equal diagonals", "solution": "Rectangle diagonals have equal length. They need not be perpendicular.", "id": "VM-PGF-184", "options": ["Four equal sides", "Perpendicular diagonals", "Equal diagonals", "Exactly one pair of parallel sides"], "correct_index": 2}, {"topic": "Quadrilaterals", "section": "diagnostic", "question": "Which shape must also be a parallelogram?", "answer": "Rhombus", "solution": "A rhombus has two pairs of parallel opposite sides.", "id": "VM-PGF-185", "options": ["Any kite", "Rhombus", "Any quadrilateral", "Any trapezium with exactly one parallel pair"], "correct_index": 1}, {"topic": "Quadrilaterals", "section": "diagnostic", "question": "A parallelogram has an angle of 112°. Find an adjacent angle.", "answer": "68°", "solution": "Adjacent angles are supplementary: 180° − 112° = 68°.", "id": "VM-PGF-186", "options": ["112°", "78°", "248°", "68°"], "correct_index": 3}, {"topic": "Polygons", "section": "diagnostic", "question": "How many sides does a decagon have?", "answer": "10", "solution": "Deca- denotes ten.", "id": "VM-PGF-187", "options": ["10", "8", "12", "9"], "correct_index": 0}, {"topic": "Polygons", "section": "diagnostic", "question": "What is the interior angle sum of a hexagon?", "answer": "720°", "solution": "A hexagon can be divided into four triangles: 4 × 180° = 720°.", "id": "VM-PGF-188", "options": ["360°", "540°", "720°", "1080°"], "correct_index": 2}, {"topic": "Polygons", "section": "diagnostic", "question": "Which condition defines a regular polygon?", "answer": "All sides and all angles equal", "solution": "Both equal sides and equal interior angles are required.", "id": "VM-PGF-189", "options": ["All sides equal only", "All sides and all angles equal", "All angles equal only", "At least one line of symmetry"], "correct_index": 1}, {"topic": "Line symmetry", "section": "diagnostic", "question": "How many lines of symmetry does a non-square rectangle have?", "answer": "2", "solution": "The two lines joining midpoints of opposite sides are reflection axes; the diagonals are not.", "id": "VM-PGF-190", "options": ["0", "1", "4", "2"], "correct_index": 3}, {"topic": "Line symmetry", "section": "diagnostic", "question": "Reflect (−3, 5) across the y-axis.", "answer": "(3, 5)", "solution": "Reflection in the y-axis changes the sign of x only.", "id": "VM-PGF-191", "options": ["(3, 5)", "(−3, −5)", "(5, −3)", "(3, −5)"], "correct_index": 0}, {"topic": "Rotational symmetry", "section": "diagnostic", "question": "What is the rotational symmetry order of a regular octagon?", "answer": "8", "solution": "Each turn of 45° maps it onto itself, giving eight matches per full turn.", "id": "VM-PGF-192", "options": ["4", "45", "8", "2"], "correct_index": 2}, {"topic": "Rotational symmetry", "section": "diagnostic", "question": "What is the smallest positive rotation about its centre mapping a non-square parallelogram onto itself?", "answer": "180°", "solution": "A half-turn about the diagonal intersection swaps opposite vertices.", "id": "VM-PGF-193", "options": ["90°", "180°", "45°", "120°"], "correct_index": 1}, {"topic": "Geometrical reasoning", "section": "diagnostic", "question": "Which is a counterexample to “all rhombuses are squares”?", "answer": "A rhombus with a 60° angle", "solution": "A square must have four right angles.", "id": "VM-PGF-194", "options": ["A square with side 3 cm", "A regular triangle", "A rectangle with unequal sides", "A rhombus with a 60° angle"], "correct_index": 3}, {"topic": "Geometrical reasoning", "section": "diagnostic", "question": "A quadrilateral has angles 80°, 95° and 105°. Find the fourth.", "answer": "80°", "solution": "360° − 80° − 95° − 105° = 80°.", "id": "VM-PGF-195", "options": ["80°", "70°", "90°", "100°"], "correct_index": 0}, {"topic": "Geometrical reasoning", "section": "diagnostic", "question": "A polygon has exterior angles of 40° each. How many sides does it have?", "answer": "9", "solution": "Exterior angles sum to 360°; 360 ÷ 40 = 9.", "id": "VM-PGF-196", "options": ["8", "10", "9", "12"], "correct_index": 2}, {"topic": "Triangles", "section": "escape_core", "question": "An isosceles triangle has vertex angle 50°. Enter one base angle in degrees.", "answer": "65", "solution": "(180 − 50) ÷ 2 = 65.", "id": "VM-PGF-197"}, {"topic": "Quadrilaterals", "section": "escape_core", "question": "Enter the number of right angles in a rectangle.", "answer": "4", "solution": "All four angles are right angles.", "id": "VM-PGF-198"}, {"topic": "Polygons", "section": "escape_core", "question": "Enter the number of sides of a heptagon.", "answer": "7", "solution": "A heptagon has seven sides.", "id": "VM-PGF-199"}, {"topic": "Line symmetry", "section": "escape_core", "question": "Enter the number of reflection axes of a regular pentagon.", "answer": "5", "solution": "Each vertex has an axis through the opposite side midpoint.", "id": "VM-PGF-200"}, {"topic": "Rotational symmetry", "section": "escape_core", "question": "Enter the rotational symmetry order of a square.", "answer": "4", "solution": "Quarter-turns give four matches.", "id": "VM-PGF-201"}, {"topic": "Geometrical reasoning", "section": "escape_core", "question": "Three angles of a quadrilateral are 70°, 80° and 90°. Enter the fourth in degrees.", "answer": "120", "solution": "360 − 70 − 80 − 90 = 120.", "id": "VM-PGF-202"}, {"topic": "Triangles", "section": "escape_extension", "question": "The angles of a triangle are x°, 2x° and 3x°. Enter its largest angle in degrees.", "answer": "90", "solution": "6x = 180, so x = 30 and 3x = 90.", "id": "VM-PGF-203"}, {"topic": "Quadrilaterals", "section": "escape_extension", "question": "A rhombus has an acute angle of 38°. Enter its obtuse angle in degrees.", "answer": "142", "solution": "180 − 38 = 142.", "id": "VM-PGF-204"}, {"topic": "Polygons", "section": "escape_extension", "question": "A regular polygon has interior angles of 150°. Enter its number of sides.", "answer": "12", "solution": "Exterior angle = 30°; 360 ÷ 30 = 12.", "id": "VM-PGF-205"}, {"topic": "Line symmetry", "section": "escape_extension", "question": "A point (7, −4) is reflected in the x-axis and then the y-axis. Enter its final x-coordinate.", "answer": "-7", "solution": "First (7, 4), then (−7, 4).", "id": "VM-PGF-206"}, {"topic": "Rotational symmetry", "section": "escape_extension", "question": "A shape has rotational symmetry order 15. Enter its smallest positive symmetry angle in degrees.", "answer": "24", "solution": "360 ÷ 15 = 24.", "id": "VM-PGF-207"}, {"topic": "Geometrical reasoning", "section": "escape_extension", "question": "A convex polygon has interior angle sum 1620°. Enter its number of sides.", "answer": "11", "solution": "1620 ÷ 180 = 9 triangles; 9 + 2 = 11 sides.", "id": "VM-PGF-208"}]</script><script>
const bank=JSON.parse(document.getElementById('bank').textContent), $=id=>document.getElementById(id), root=$('content');
const tabs={explore:'Interactive explorers',practice:'Skill practice',worked_example:'Worked examples',spot_the_mistake:'Spot the mistake',challenge:'Challenge questions',diagnostic:'Diagnostic test',escape_core:'Core escape room',escape_extension:'Extension escape room',mini:'Random mini-test'}; let active='explore';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(q,i){return `<article><p class="tag">${esc(q.topic)} · ${esc(q.id)}</p><h3>Question ${i+1}</h3><p>${esc(q.question)}</p>${q.diagram||''}<details><summary>Show answer and worked solution</summary><p><strong>${esc(q.answer)}</strong></p><p>${esc(q.solution)}</p></details></article>`}
function show(key){active=key;document.querySelectorAll('#vm-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key))); if(key==='explore')return explore(); if(key==='diagnostic')return diagnostic(); if(key.startsWith('escape'))return escapeRoom(key); if(key==='mini'){root.innerHTML='<h2>Random mini-test</h2><button id="again">New set</button><div id="questions"></div>';const run=()=>{let a=bank.filter(q=>q.section==='practice');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} $('questions').innerHTML=a.slice(0,10).map(card).join('')};$('again').onclick=run;return run()};let a=bank.filter(q=>q.section===key);root.innerHTML=`<h2>${tabs[key]}</h2><label>Topic <select id="topic"><option>All topics</option>${[...new Set(a.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><div id="questions"></div>`;const render=()=>{$('questions').innerHTML=a.filter(q=>$('topic').value==='All topics'||q.topic===$('topic').value).map(card).join('')};$('topic').onchange=render;render()}
function diagnostic(){let a=bank.filter(q=>q.section==='diagnostic');root.innerHTML='<h2>Diagnostic test</h2><p>Choose one answer for each question, then mark your test.</p><form id="test">'+a.map((q,i)=>`<article><p>${i+1}. ${esc(q.question)}</p><div class="options">${q.options.map((o,j)=>`<label><input required type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div><div id="f${i}"></div></article>`).join('')+'<button type="submit">Mark test</button> <button type="button" id="reset">Start again</button><p id="score" role="status"></p></form>'; $('reset').onclick=diagnostic;$('test').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),score=0,topics={};a.forEach((q,i)=>{let ok=Number(data.get('q'+i))===q.correct_index;score+=Number(ok);let t=topics[q.topic]??=[0,0];t[0]+=Number(ok);t[1]++;$('f'+i).innerHTML=`<p class="feedback">${ok?'Correct':'Incorrect'} · ${esc(q.answer)}</p><p>${esc(q.solution)}</p>`});$('score').innerHTML=`<strong>Score: ${score}/${a.length}</strong><br>`+Object.entries(topics).map(([k,v])=>`${esc(k)}: ${v[0]}/${v[1]}`).join('<br>')}}
function escapeRoom(key){let a=bank.filter(q=>q.section===key),i=0;function step(){if(i===a.length){root.innerHTML='<h2>Escape room complete!</h2><p>You unlocked all six challenges.</p><button id="restart">Play again</button>';$('restart').onclick=()=>escapeRoom(key);return}let q=a[i];root.innerHTML=`<h2>${tabs[key]}</h2><p>Lock ${i+1} of ${a.length}</p><article><p>${esc(q.question)}</p><form id="lock"><label>Answer <input id="guess" required autocomplete="off"></label><button>Unlock</button></form><p id="feedback" role="status"></p><details><summary>Need a hint? Show reasoning</summary><p>${esc(q.solution)}</p></details></article>`;$('lock').onsubmit=e=>{e.preventDefault();let norm=s=>String(s).toLowerCase().trim().replace(/°/g,'').replace(/\s+/g,' ');if(norm($('guess').value)===norm(q.answer)){i++;step()}else $('feedback').textContent='Not quite. Try again.'}}step()}
function explore(){root.innerHTML=`<section class="panel"><h2>Triangle explorer</h2><p>Move the top vertex horizontally and vertically.</p><label>Horizontal position <input id="tx" type="range" min="35" max="285" value="160"></label><label>Vertical position <input id="ty" type="range" min="25" max="140" value="55"></label><div id="tri"></div><p id="triInfo"></p></section><section class="panel"><h2>Quadrilateral explorer</h2><label>Shape <select id="quad"><option>Square</option><option>Rectangle</option><option>Rhombus</option><option>Parallelogram</option><option>Trapezium</option><option>Kite</option></select></label><label><input type="checkbox" id="diags"> Show diagonals</label><div id="qd"></div><p id="qi"></p></section><section class="panel"><h2>Symmetry explorer</h2><label>Regular polygon sides <input id="sides" type="range" min="3" max="10" value="5"></label><label>Rotation <input id="rot" type="range" min="0" max="360" value="0"></label><label><input id="axes" type="checkbox"> Show lines of symmetry</label><div id="sym"></div><p id="si"></p></section>`;const svg=(body)=>`<svg viewBox="0 0 320 240" role="img" aria-label="Geometry explorer diagram">${body}</svg>`;const poly=(pts,extra='')=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#e9d9ef" stroke="#74538b" stroke-width="2" ${extra}/>`;const line=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#a64e65" stroke-dasharray="5 4"/>`;function tri(){let pts=[[40,200],[280,200],[+$('tx').value,+$('ty').value]],d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),l=pts.map((p,i)=>d(p,pts[(i+1)%3])),ang=pts.map((p,i)=>{let a=pts[(i+1)%3],b=pts[(i+2)%3];return Math.acos(((a[0]-p[0])*(b[0]-p[0])+(a[1]-p[1])*(b[1]-p[1]))/(d(a,p)*d(b,p)))*180/Math.PI});$('tri').innerHTML=svg(poly(pts)+pts.map((p,i)=>`<text x="${p[0]}" y="${p[1]-8}" text-anchor="middle">${'ABC'[i]}</text>`).join(''));$('triInfo').textContent='Side lengths (diagram units): '+l.map((x,i)=>['AB','BC','CA'][i]+' = '+x.toFixed(1)).join(', ')+' · Angles: '+ang.map((x,i)=>'∠'+'ABC'[i]+' = '+x.toFixed(1)+'°').join(', ')};let shapes={Square:[[[90,50],[230,50],[230,190],[90,190]],'Four equal sides; four right angles.'],Rectangle:[[[50,70],[270,70],[270,170],[50,170]],'Opposite sides equal and parallel; four right angles.'],Rhombus:[[[160,30],[270,120],[160,210],[50,120]],'Four equal sides; opposite sides parallel.'],Parallelogram:[[[100,60],[280,60],[220,180],[40,180]],'Opposite sides equal and parallel.'],Trapezium:[[[100,60],[220,60],[280,180],[40,180]],'One pair of parallel sides in this example.'],Kite:[[[160,25],[240,100],[160,215],[80,100]],'Two pairs of adjacent equal sides.']};function quad(){let [p,t]=shapes[$('quad').value];$('qd').innerHTML=svg(poly(p)+($('diags').checked?line(p[0],p[2])+line(p[1],p[3]):''));$('qi').textContent=t}function sym(){let n=+$('sides').value,r=+$('rot').value,pt=(a,len=85)=>[160+len*Math.cos(a),120+len*Math.sin(a)],p=Array.from({length:n},(_,i)=>pt(-Math.PI/2+2*Math.PI*i/n)),a=r*Math.PI/180;let lines=Array.from({length:n},(_,i)=>{let b=-Math.PI/2+Math.PI*i/n+a;return line(pt(b,100),pt(b+Math.PI,100))}).join('');$('sym').innerHTML=svg(poly(p,'style="fill:none;stroke-dasharray:4 4"')+poly(p.map((_,i)=>pt(-Math.PI/2+2*Math.PI*i/n+a)))+($('axes').checked?lines:''));$('si').textContent=`${n} lines of symmetry · Rotational order ${n} · Smallest rotation ≈ ${(360/n).toFixed(2).replace(/\.00$/,'')}° · Current rotation ${r}°`};for(let id of ['tx','ty'])$(id).oninput=tri;for(let id of ['quad','diags'])$(id).onchange=quad;for(let id of ['sides','rot','axes'])$(id).oninput=sym;tri();quad();sym()}
$('vm-tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-key="${k}" aria-pressed="false">${v}</button>`).join('');document.querySelectorAll('#vm-tabs button').forEach(b=>b.onclick=()=>show(b.dataset.key));show(location.hash==='#diagnostic'?'diagnostic':'explore');</script></body></html>
