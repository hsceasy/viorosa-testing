able{border-collapse:collapse;width:100%}th,td{padding:8px;border:1px solid #eadce5;text-align:left} svg{max-width:440px}article,p,td{overflow-wrap:anywhere} </style><link rel="canonical" href="https://www.viorosamaths.com/year7_data_classification_and_visualisation_hub.html"><script async="" src="https://www.googletagmanager.com/gtag/js?id=G-180BGJQCSL"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-180BGJQCSL");</script></head><body><main><p class="tag">NSW Stage 4 • MA4-DAT-C-01</p><nav><a href="nsw.html">← NSW Maths</a></nav><header class="hero"><p>VIOROSA MATHS · Confidence that grows</p><h1>Data Classification and Visualisation</h1><p>Year 7 · Stage 4 · 208 questions</p></header><nav id="vm-tabs" aria-label="Learning sections"></nav><section id="content" aria-live="polite"></section></main><script id="bank" type="application/json">[{"id": "VM-DCV-001", "topic": "Classifying data", "question": "Classify eye colour as nominal, ordinal, discrete or continuous.", "answer": "nominal", "solution": "Categories have no natural order.", "section": "practice"}, {"id": "VM-DCV-002", "topic": "Classifying data", "question": "Classify satisfaction rating from poor to excellent as nominal, ordinal, discrete or continuous.", "answer": "ordinal", "solution": "Categories have a natural order.", "section": "practice"}, {"id": "VM-DCV-003", "topic": "Classifying data", "question": "Classify number of siblings as nominal, ordinal, discrete or continuous.", "answer": "discrete", "solution": "Counts take whole-number values.", "section": "practice"}, {"id": "VM-DCV-004", "topic": "Classifying data", "question": "Classify height in centimetres as nominal, ordinal, discrete or continuous.", "answer": "continuous", "solution": "Measurements can take fractional values.", "section": "practice"}, {"id": "VM-DCV-005", "topic": "Classifying data", "question": "Classify postcode as nominal, ordinal, discrete or continuous.", "answer": "nominal", "solution": "Digits identify categories rather than quantities.", "section": "practice"}, {"id": "VM-DCV-006", "topic": "Classifying data", "question": "Classify race finishing position as nominal, ordinal, discrete or continuous.", "answer": "ordinal", "solution": "Positions have an order.", "section": "practice"}, {"id": "VM-DCV-007", "topic": "Classifying data", "question": "Classify number of books borrowed as nominal, ordinal, discrete or continuous.", "answer": "discrete", "solution": "Books are counted.", "section": "practice"}, {"id": "VM-DCV-008", "topic": "Classifying data", "question": "Classify time to run 100 m as nominal, ordinal, discrete or continuous.", "answer": "continuous", "solution": "Time can take fractional values.", "section": "practice"}, {"id": "VM-DCV-009", "topic": "Classifying data", "question": "What is a statistical variable? Identify the variable and two possible values in a survey about travel to school.", "answer": "A characteristic recorded for each individual; travel method, e.g. walking and bus.", "solution": "A variable is a characteristic that can be observed, classified, counted or measured. Here each student has a recorded travel method, a nominal categorical variable.", "section": "practice"}, {"id": "VM-DCV-010", "topic": "Classifying data", "question": "Classify shirt size S, M, L as nominal, ordinal, discrete or continuous.", "answer": "ordinal", "solution": "Sizes have a natural order.", "section": "practice"}, {"id": "VM-DCV-011", "topic": "Classifying data", "question": "Classify number of goals as nominal, ordinal, discrete or continuous.", "answer": "discrete", "solution": "Goals are counted.", "section": "practice"}, {"id": "VM-DCV-012", "topic": "Classifying data", "question": "Classify mass of an apple as nominal, ordinal, discrete or continuous.", "answer": "continuous", "solution": "Mass is measured on a continuum.", "section": "practice"}, {"id": "VM-DCV-013", "topic": "Frequency tables and simple graphs", "question": "Construct a frequency table for these responses: A A A B B B B B C C C C.", "answer": "{A: 3, B: 5, C: 4}", "solution": "Count each category separately: A: 3, B: 5, C: 4. Total = 12.", "section": "practice"}, {"id": "VM-DCV-014", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one symbol for 2 votes. A, B and C have 6, 10 and 8 votes. How many symbols are needed for each?", "answer": "{A: 3, B: 5, C: 4}", "solution": "Divide each frequency by 2. Use a key stating one symbol = 2 votes.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 2 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-015", "topic": "Frequency tables and simple graphs", "question": "A club records 6 art, 2 music and 4 drama preferences. Draw a column graph.", "answer": "Art 6, Music 2, Drama 4", "solution": "Use equal-width separated columns and a frequency axis starting at zero.", "section": "practice", "solutionDiagram": "<svg role=\"img\" aria-label=\"column graph\" viewBox=\"0 0 340 220\" style=\"width:100%;max-width:420px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><g font-size=\"11\" fill=\"currentColor\"><path d=\"M45 40 V160 H315\" fill=\"none\" stroke=\"currentColor\"/><text x=\"170\" y=\"18\" text-anchor=\"middle\">Frequency display (practice data)<\/text><text x=\"28\" y=\"164.0\" text-anchor=\"middle\">0<\/text><path d=\"M45 160.0 H315\" stroke=\"currentColor\" opacity=\".15\"/><text x=\"28\" y=\"124.0\" text-anchor=\"middle\">2<\/text><path d=\"M45 120.0 H315\" stroke=\"currentColor\" opacity=\".15\"/><text x=\"28\" y=\"84.0\" text-anchor=\"middle\">4<\/text><path d=\"M45 80.0 H315\" stroke=\"currentColor\" opacity=\".15\"/><text x=\"28\" y=\"44.0\" text-anchor=\"middle\">6<\/text><path d=\"M45 40.0 H315\" stroke=\"currentColor\" opacity=\".15\"/><rect x=\"66.0\" y=\"40.0\" width=\"48\" height=\"120.0\" fill=\"#D9A5B9\" stroke=\"currentColor\" stroke-width=\".6\"/><text x=\"90\" y=\"178\" text-anchor=\"middle\">Art<\/text><rect x=\"156.0\" y=\"120.0\" width=\"48\" height=\"40.0\" fill=\"#B9ACDB\" stroke=\"currentColor\" stroke-width=\".6\"/><text x=\"180\" y=\"178\" text-anchor=\"middle\">Music<\/text><rect x=\"246.0\" y=\"80.0\" width=\"48\" height=\"80.0\" fill=\"#A5CDB9\" stroke=\"currentColor\" stroke-width=\".6\"/><text x=\"270\" y=\"178\" text-anchor=\"middle\">Drama<\/text><text x=\"12\" y=\"100\" transform=\"rotate(-90 12 100)\" text-anchor=\"middle\">Frequency<\/text><\/g><text x=\"12\" y=\"212\" font-size=\"10\" fill=\"currentColor\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-016", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one symbol for 2 votes. A, B and C have 12, 4 and 8 votes. How many symbols are needed for each?", "answer": "{A: 6, B: 2, C: 4}", "solution": "Divide each frequency by 2. Use a key stating one symbol = 2 votes.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 2 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"220\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-017", "topic": "Frequency tables and simple graphs", "question": "A tally table has 4 red, 8 blue and 2 green responses. How many responses were recorded?", "answer": "14", "solution": "Add 4 + 8 + 2 = 14.", "section": "practice"}, {"id": "VM-DCV-018", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one symbol for 2 votes. A, B and C have 8, 16 and 4 votes. How many symbols are needed for each?", "answer": "{A: 4, B: 8, C: 2}", "solution": "Divide each frequency by 2. Use a key stating one symbol = 2 votes.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 2 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"220\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"245\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"270\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-019", "topic": "Frequency tables and simple graphs", "question": "A class has 15 responses: 5 walk, 3 cycle and the rest take a bus. Find the bus frequency.", "answer": "7", "solution": "15 − 5 − 3 = 7.", "section": "practice"}, {"id": "VM-DCV-020", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one symbol for 2 votes. A, B and C have 10, 6 and 14 votes. How many symbols are needed for each?", "answer": "{A: 5, B: 3, C: 7}", "solution": "Divide each frequency by 2. Use a key stating one symbol = 2 votes.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 2 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"220\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"245\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-021", "topic": "Frequency tables and simple graphs", "question": "A graph shows 2, 6 and 8 votes for three clubs. How many more votes did the third club receive than the first?", "answer": "6", "solution": "8 − 2 = 6.", "section": "practice"}, {"id": "VM-DCV-022", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one symbol for 2 votes. A, B and C have 4, 12 and 16 votes. How many symbols are needed for each?", "answer": "{A: 2, B: 6, C: 8}", "solution": "Divide each frequency by 2. Use a key stating one symbol = 2 votes.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 2 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"220\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"220\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"245\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"270\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-023", "topic": "Frequency tables and simple graphs", "question": "A survey lists 8 cats, 4 dogs and 6 birds. Which category is least frequent?", "answer": "Dog
