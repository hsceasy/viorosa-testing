 a suitable graph for: Distribution of 100 measured heights in equal-width intervals. Justify.", "answer": "Example: histogram", "solution": "Grouped continuous measurements suit touching bars. Other appropriate displays with a sound justification may also be accepted.", "section": "practice"}, {"id": "VM-DCV-052", "topic": "Graph selection and interpretation", "question": "Suggest a suitable graph for: Share of a budget spent on each category. Justify.", "answer": "Example: sector graph", "solution": "Sectors show parts of a whole. Other appropriate displays with a sound justification may also be accepted.", "section": "practice"}, {"id": "VM-DCV-053", "topic": "Graph selection and interpretation", "question": "Suggest a suitable graph for: Exact integer scores of 15 students. Justify.", "answer": "Example: dot plot", "solution": "Dots preserve individual values. Other appropriate displays with a sound justification may also be accepted.", "section": "practice"}, {"id": "VM-DCV-054", "topic": "Graph selection and interpretation", "question": "Suggest a suitable graph for: Exact two-digit scores of 20 students. Justify.", "answer": "Example: stem-and-leaf plot", "solution": "Stems and leaves preserve original values. Other appropriate displays with a sound justification may also be accepted.", "section": "practice"}, {"id": "VM-DCV-055", "topic": "Graph selection and interpretation", "question": "Weekly library visits for weeks 1–4 are [10, 13, 16, 19]. Plot a line graph, describe the trend and predict week 5 if it continues.", "answer": "22", "solution": "Plot weeks on the horizontal axis and visits on the vertical axis. Visits increase by 3 each week; add 3 to the last value. The prediction assumes the pattern continues.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"Weekly library visits\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Weekly library visits<\/text><path d=\"M55 50 V170 H325\" fill=\"none\" stroke=\"#493843\"/><text x=\"8\" y=\"39\" font-size=\"12\" fill=\"#493843\">Visits<\/text><text x=\"145\" y=\"205\" font-size=\"12\" fill=\"#493843\">Week<\/text><text x=\"22\" y=\"174.0\" font-size=\"12\" fill=\"#493843\">0<\/text><path d=\"M55 170.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"150.0\" font-size=\"12\" fill=\"#493843\">5<\/text><path d=\"M55 146.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"126.0\" font-size=\"12\" fill=\"#493843\">10<\/text><path d=\"M55 122.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"102.0\" font-size=\"12\" fill=\"#493843\">15<\/text><path d=\"M55 98.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"78.0\" font-size=\"12\" fill=\"#493843\">20<\/text><path d=\"M55 74.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"54.0\" font-size=\"12\" fill=\"#493843\">25<\/text><path d=\"M55 50.0 H325\" stroke=\"#ddd\"/><text x=\"55\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">1<\/text><text x=\"122.5\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">2<\/text><text x=\"190\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">3<\/text><text x=\"257.5\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">4<\/text><text x=\"325\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">5<\/text><polyline fill=\"none\" stroke=\"#9875b5\" stroke-width=\"2\" points=\"55.0,122.0 122.5,107.6 190.0,93.2 257.5,78.8\"/><circle cx=\"55.0\" cy=\"122.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"122.5\" cy=\"107.6\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"190.0\" cy=\"93.2\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"257.5\" cy=\"78.8\" r=\"4\" fill=\"#9875b5\"/><path d=\"M257.5 78.8 L325.0 64.4\" stroke=\"#b77891\" stroke-dasharray=\"5 3\"/><text x=\"230\" y=\"40\" font-size=\"12\" fill=\"#493843\">Dashed: prediction<\/text><text x=\"12\" y=\"222\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-056", "topic": "Graph selection and interpretation", "question": "Weekly visits are 20, 17, 14, 11. Predict week 5 if the pattern continues.", "answer": "8", "solution": "The count decreases by 3 each week; 11 − 3 = 8.", "section": "practice"}, {"id": "VM-DCV-057", "topic": "Graph selection and interpretation", "question": "Daily temperatures are 18, 21, 19, 23 °C. Between which consecutive days is the largest rise?", "answer": "Days 3 and 4", "solution": "Changes are +3, −2 and +4 °C.", "section": "practice"}, {"id": "VM-DCV-058", "topic": "Graph selection and interpretation", "question": "A line graph records 12, 12, 15, 15 visits over four days. Describe the pattern.", "answer": "Stable, then rises, then stable", "solution": "The changes are 0, +3 and 0.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"Daily visits\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Daily visits<\/text><path d=\"M55 50 V170 H325\" fill=\"none\" stroke=\"#493843\"/><text x=\"8\" y=\"39\" font-size=\"12\" fill=\"#493843\">Visits<\/text><text x=\"145\" y=\"205\" font-size=\"12\" fill=\"#493843\">Day<\/text><text x=\"22\" y=\"174.0\" font-size=\"12\" fill=\"#493843\">0<\/text><path d=\"M55 170.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"134.0\" font-size=\"12\" fill=\"#493843\">5<\/text><path d=\"M55 130.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"94.0\" font-size=\"12\" fill=\"#493843\">10<\/text><path d=\"M55 90.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"54.0\" font-size=\"12\" fill=\"#493843\">15<\/text><path d=\"M55 50.0 H325\" stroke=\"#ddd\"/><text x=\"55\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">1<\/text><text x=\"145\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">2<\/text><text x=\"235\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">3<\/text><text x=\"325\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">4<\/text><polyline fill=\"none\" stroke=\"#9875b5\" stroke-width=\"2\" points=\"55.0,74.0 145.0,74.0 235.0,50.0 325.0,50.0\"/><circle cx=\"55.0\" cy=\"74.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"145.0\" cy=\"74.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"235.0\" cy=\"50.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"325.0\" cy=\"50.0\" r=\"4\" fill=\"#9875b5\"/><text x=\"12\" y=\"222\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-059", "topic": "Graph selection and interpretation", "question": "A shop records 14, 17, 20 and 23 sales. Is a prediction of 26 next week guaranteed?", "answer": "No", "solution": "A trend supports a prediction but does not guarantee it.", "section": "practice"}, {"id": "VM-DCV-060", "topic": "Graph selection and interpretation", "question": "Rainfall on three days is 15, 0 and 24 mm. Which day is driest?", "answer": "Day 2", "solution": "Zero millimetres is the smallest amount.", "section": "practice"}, {"id": "VM-DCV-061", "topic": "Misleading graphs and infographics", "question": "A column graph compares 40 and 45 votes but its vertical axis begins at 35. Explain the distortion and suggest a correction.", "answer": "The apparent difference is exaggerated.", "solution": "The visible bar heights are 5 and 10, suggesting twice as many votes, although the actual difference is only 5. Start the column graph at zero.", "section": "practice"}, {"id": "VM-DCV-062", "topic": "Misleading graphs and infographics", "question": "A school graph displays 18 walkers and 12 cyclists. Give a suitable title, both axis labels, a scale and a source statement for this fictional dataset.", "answer": "School travel methods; travel method; number of students; 0 to 20 in steps of 2; source: fictional school survey.", "solution": "Use a zero baseline, equally spaced ticks and a title identifying the context. Label the horizontal axis Travel method and the vertical axis Number of students. State that the data are fictional rather than inventing a real source.", "section": "practice"}, {"id": "VM-DCV-063", "topic": "Misleading graphs and infographics", "question": "A fictional garden survey records 8, 12 and 20 seedlings of three types. Choose a graph to show shares of the total and justify your choice.", "answer": "Sector graph or divided bar graph.", "solution": "There are 40 seedlings; shares are 20%, 30% and 50%. Both displays show mutually exclusive categories as parts of one whole.", "section": "practice"}, {"id": "VM-DCV-064", "topic": "Misleading graphs and infographics", "question": "A column graph compares 55 and 60 votes but its vertical axis begins at 50. Explain the distortion and suggest a correction.", "answer": "The apparent difference is exaggerated.", "solution": "The visible bar heights are 5 and 10, suggesting twice as many votes, although the actual difference is only 5. Start the column graph at zero.", "section": "practice"}, {"id": "VM-DCV-065", "topic": "Misleading graphs and infographics", "question": "A column graph compares 60 and 65 votes but its vertical axis begins at 55. Explain the distortion and suggest a correction.", "answer": "The apparent difference is exaggerated.", "solution": "The visible bar heights are 5 and 10, suggesting twice as many votes, although the actual difference is only 5. Start the column graph at zero.", "section": "practice"}, {"id": "VM-DCV-066", "topic": "Misleading graphs and infographics", "question": "A column graph compares 65 and 70 votes but its vertical axis begins at 60. Explain the distortion and suggest a correction.", "answer": "The apparent difference is exaggerated.", "solution": "The visible bar heights are 5 and 10, suggesting twice as many votes, although the actual difference is only 5. Start the column graph at zero.", "section": "practice"}, {"id": "VM-DCV-067", "topic": "Misleading graphs and infographics", "question": "A graph of school transport has no title. Identify the problem and suggest a correction.", "answer": "Add a descriptive title", "solution": "A title identifies the population and variable.", "section": "practice"}, {"id": "VM-DCV-068", "topic": "Misleading graphs and infographics", "question": "A temperature graph labels its axis only as Temperature. Identify the problem and suggest a correction.", "answer": "Add units, such as °C", "solution": "Units identify the measurement scale.", "section": "practice"}, {"id": "VM-DCV-069", "topic": "Misleading graphs and infographics", "question": "An infographic reports 70% without naming the surveyed group. Identify the problem and suggest a correction.", "answer": "Identify the group and source", "solution": "Readers need context to judge the claim.", "section": "practice"}, {"id": "VM-DCV-070", "topic": "Misleading graphs and infographics", "question": "A pictogram doubles both height and width for twice the count. Identify the problem and suggest a correction.", "answer": "Use equal-sized symbols with a key", "solution": "Doubling both dimensions quadruples area.", "section": "practice"}, {"id": "VM-DCV-071", "topic": "Misleading graphs and infographics", "question": "A graph places years 2020, 2021 and 2025 at equal spacing on a numerical time axis. Identify the problem and suggest a correction.", "answer": "Use proportional time spacing", "solution": "The gaps represent one and four years.", "section": "practice"}, {"id": "VM-DCV-072", "topic": "Misleading graphs and infographics", "question": "Design an infographic for 12 walkers, 8 cyclists and 20 bus riders. Explain your response.", "answer": "Sample: School transport — walking 12 (30%), cycling 8 (20%), bus 20 (50%).", "solution": "Total = 40. Divide each count by 40 and multiply by 100. Use labelled bars or proportional segments, a title and source: hypothetical dataset supplied in the question.", "section": "practice", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"School transport\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">School transport<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">40 students in total<\/text><rect x=\"15\" y=\"55\" width=\"96\" height=\"40\" fill=\"#d9a5b9\"/><text x=\"19\" y=\"79\" font-size=\"12\" fill=\"#493843\">30%<\/text><rect x=\"111\" y=\"55\" width=\"64\" height=\"40\" fill=\"#b9acdb\"/><text x=\"115\" y=\"79\" font-size=\"12\" fill=\"#493843\">20%<\/text><rect x=\"175\" y=\"55\" width=\"160\" height=\"40\" fill=\"#a5cdb9\"/><text x=\"179\" y=\"79\" font-size=\"12\" fill=\"#493843\">50%<\/text><text x=\"15\" y=\"118\" font-size=\"12\" fill=\"#493843\">Walk: 12 • Cycle: 8 • Bus: 20<\/text><text x=\"12\" y=\"142\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-073", "topic": "Classifying data", "question": "A library records book genre and page count. Classify each as categorical or numerical, then give its subtype and explain the difference.", "answer": "Genre: categorical nominal; page count: numerical discrete.", "solution": "Genre gives unordered labels. Page count gives numerical counts in whole numbers. Arithmetic on counts is meaningful; arithmetic on genre labels is not.", "section": "worked_example"}, {"id": "VM-DCV-074", "topic": "Classifying data", "question": "Classify jacket sizes S, M, L.", "answer": "Ordinal", "solution": "The categories have a natural size order.", "section": "worked_example"}, {"id": "VM-DCV-075", "topic": "Classifying data", "question": "Classify rainfall measured in mm.", "answer": "Continuous", "solution": "Rainfall can take fractional measurements.", "section": "worked_example"}, {"id": "VM-DCV-076", "topic": "Classifying data", "question": "Classify goals scored in a match.", "answer": "Discrete", "solution": "Goals are counted in whole numbers.", "section": "worked_example"}, {"id": "VM-DCV-077", "topic": "Classifying data", "question": "A student says a postcode is discrete because it uses digits. Correct them.", "answer": "Nominal", "solution": "Digits are identifiers, not counts.", "section": "spot_the_mistake"}, {"id": "VM-DCV-078", "topic": "Classifying data", "question": "A student says height is a discrete physical variable because measurements are rounded to whole centimetres. Correct them.", "answer": "Continuous underlying variable", "solution": "Underlying height is continuous; rounded recorded values lie on a discrete grid. Rounding does not change the physical variable.", "section": "spot_the_mistake"}, {"id": "VM-DCV-079", "topic": "Classifying data", "question": "A student calls bronze, silver and gold nominal. Correct them.", "answer": "Ordinal", "solution": "The awards have a ranking.", "section": "spot_the_mistake"}, {"id": "VM-DCV-080", "topic": "Classifying data", "question": "A student calls favourite fruit ordinal because names can be alphabetised. Correct them.", "answer": "Nominal", "solution": "Alphabetical sorting is not an inherent ranking.", "section": "spot_the_mistake"}, {"id": "VM-DCV-081", "topic": "Classifying data", "question": "A survey records age in completed years and exact age. Classify both recorded variables.", "answer": "Discrete; continuous", "solution": "Completed years are integer counts; exact age is a measurement.", "section": "challenge"}, {"id": "VM-DCV-082", "topic": "Classifying data", "question": "Classify player jersey number and number of games played.", "answer": "Nominal; discrete", "solution": "One identifies a player; the other counts games.", "section": "challenge"}, {"id": "VM-DCV-083", "topic": "Classifying data", "question": "Give two ways to record travel to school, one nominal and one continuous.", "answer": "Example: transport mode; travel time", "solution": "Mode is unordered; time is measured.", "section": "challenge"}, {"id": "VM-DCV-084", "topic": "Classifying data", "question": "A survey records temperature as cold, warm or hot. How does this differ from recording degrees Celsius?", "answer": "Ordinal rather than continuous", "solution": "Ordered categories replace measurements.", "section": "challenge"}, {"id": "VM-DCV-085", "topic": "Classifying data", "question": "Explain why a mean of telephone numbers is not meaningful.", "answer": "They are nominal labels", "solution": "Arithmetic does not describe the categories.", "section": "challenge"}, {"id": "VM-DCV-086", "topic": "Classifying data", "question": "A library records book genre, condition rating, page count and mass. Classify each.", "answer": "Nominal, ordinal, discrete, continuous", "solution": "Genre labels, rating ranks, pages count, mass measures.", "section": "challenge"}, {"id": "VM-DCV-087", "topic": "Classifying data", "question": "Give a numerical variable that can be negative and continuous.", "answer": "Example: temperature in Celsius", "solution": "Temperature can take negative and fractional values.", "section": "challenge"}, {"id": "VM-DCV-088", "topic": "Classifying data", "question": "Can a discrete variable have non-integer values? Give an example.", "answer": "Yes", "solution": "A score awarded only in half-point increments has separated possible values.", "section": "challenge"}, {"id": "VM-DCV-089", "topic": "Classifying data", "question": "A survey codes never, sometimes, often as 1, 2, 3. Are the codes measurements?", "answer": "No, ordinal", "solution": "The codes preserve order but do not establish equal intervals.", "section": "challenge"}, {"id": "VM-DCV-090", "topic": "Classifying data", "question": "Design a question that collects continuous data about a school garden.", "answer": "Example: What is the height of each sunflower in cm?", "solution": "Height is a measurable variable.", "section": "challenge"}, {"id": "VM-DCV-091", "topic": "Frequency tables and simple graphs", "question": "Responses are red, blue, red, green, blue, red. Make a frequency table.", "answer": "Red 3, blue 2, green 1", "solution": "Count each category once; total 6.", "section": "worked_example"}, {"id": "VM-DCV-092", "topic": "Frequency tables and simple graphs", "question": "A pictogram uses one icon for 4 books. How many icons represent 18 books?", "answer": "4.5 icons", "solution": "18 divided by 4 equals 4.5.", "section": "worked_example", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 4 books<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">Books<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><path d=\"M195 57 a8 8 0 0 0 0 16 Z\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-093", "topic": "Frequency tables and simple graphs", "question": "A column graph has counts 6, 12, 9. Choose a suitable vertical scale.", "answer": "Example: 0 to 12 in steps of 3", "solution": "All values lie on tick marks and zero is included.", "section": "worked_example"}, {"id": "VM-DCV-094", "topic": "Frequency tables and simple graphs", "question": "A table lists 8 walkers, 5 cyclists and 7 bus riders. Find the total.", "answer": "20", "solution": "Add 8 + 5 + 7.", "section": "worked_example"}, {"id": "VM-DCV-095", "topic": "Frequency tables and simple graphs", "question": "A student draws touching columns for favourite colours. Correct the display.", "answer": "Separate the columns", "solution": "Distinct categories should be visually separated.", "section": "spot_the_mistake"}, {"id": "VM-DCV-096", "topic": "Frequency tables and simple graphs", "question": "A pictogram key is 5 votes per icon. A student reads 3 icons as 3 votes.", "answer": "15 votes", "solution": "Multiply 3 by 5.", "section": "spot_the_mistake"}, {"id": "VM-DCV-097", "topic": "Frequency tables and simple graphs", "question": "A student records frequencies 4, 7, 3 for 15 responses. What should be checked?", "answer": "One response is missing or miscounted", "solution": "The frequencies sum to 14, not 15.", "section": "spot_the_mistake"}, {"id": "VM-DCV-098", "topic": "Frequency tables and simple graphs", "question": "A student labels the vertical axis of a pet column graph Pet type. Correct it.", "answer": "Frequency or number of students", "solution": "Pet type belongs on the category axis.", "section": "spot_the_mistake"}, {"id": "VM-DCV-099", "topic": "Frequency tables and simple graphs", "question": "A class of 28 has 9 bus riders, 7 walkers and 4 cyclists. All others travel by car. Find the car count.", "answer": "8", "solution": "28 − 9 − 7 − 4 = 8.", "section": "challenge"}, {"id": "VM-DCV-100", "topic": "Frequency tables and simple graphs", "question": "A pictogram shows 2.5 icons for 15 votes. Find the key.", "answer": "6 votes per icon", "solution": "15 divided by 2.5 = 6.", "section": "challenge"}, {"id": "VM-DCV-101", "topic": "Frequency tables and simple graphs", "question": "Two classes record library visits: A has 12, B has 18. How many more visits does B have?", "answer": "6", "solution": "18 − 12 = 6.", "section": "challenge"}, {"id": "VM-DCV-102", "topic": "Frequency tables and simple graphs", "question": "A table contains frequencies 3, x, 8, 5 and total 25. Find x.", "answer": "9", "solution": "25 − 3 − 8 − 5 = 9.", "section": "challenge"}, {"id": "VM-DCV-103", "topic": "Frequency tables and simple graphs", "question": "A column graph scale increases by 4. A bar ends halfway between 12 and 16. Read it.", "answer": "14", "solution": "Half of the interval of 4 is 2.", "section": "challenge"}, {"id": "VM-DCV-104", "topic": "Frequency tables and simple graphs", "question": "Design a pictogram key for counts 6, 9 and 15 using whole icons only.", "answer": "For example, 3 votes per icon (2, 3 and 5 icons).", "solution": "3 divides all three counts exactly. A key of 1 vote per icon also works.", "section": "challenge", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 3 votes<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">A<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"97\" font-size=\"12\" fill=\"#493843\">B<\/text><circle cx=\"95\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"93\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"125\" font-size=\"12\" fill=\"#493843\">C<\/text><circle cx=\"95\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"170\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><circle cx=\"195\" cy=\"121\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-105", "topic": "Frequency tables and simple graphs", "question": "A survey allows each of 20 students to choose two sports. The frequencies total 40. Is this necessarily wrong?", "answer": "No", "solution": "Each student contributes two responses.", "section": "challenge"}, {"id": "VM-DCV-106", "topic": "Frequency tables and simple graphs", "question": "A tally has two groups of five and three single marks. Find the frequency.", "answer": "13", "solution": "5 + 5 + 3 = 13.", "section": "challenge"}, {"id": "VM-DCV-107", "topic": "Frequency tables and simple graphs", "question": "A table has 12 yes, 8 no and 5 blank responses. Find the percentage of all responses that are yes.", "answer": "48%", "solution": "12 out of 25 multiplied by 100 = 48%.", "section": "challenge"}, {"id": "VM-DCV-108", "topic": "Frequency tables and simple graphs", "question": "Create a frequency table for 2, 4, 2, 0, 4, 2, including missing integer categories.", "answer": "0:1, 1:0, 2:3, 3:0, 4:2", "solution": "Count each value and retain zero frequencies.", "section": "challenge"}, {"id": "VM-DCV-109", "topic": "Numerical data displays", "question": "Make a dot plot for 1, 1, 2, 4, 4, 4.", "answer": "Stacks at 1:2, 2:1, 3:0, 4:3", "solution": "Each observation is one dot.", "section": "worked_example"}, {"id": "VM-DCV-110", "topic": "Numerical data displays", "question": "Make a stem-and-leaf plot for 24, 21, 32, 25.", "answer": "2 | 1 4 5; 3 | 2; key 2 | 1 = 21", "solution": "Sort leaves within each tens stem.", "section": "worked_example", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 166\" role=\"img\" aria-label=\"Stem-and-leaf plot\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Stem-and-leaf plot<\/text><text x=\"20\" y=\"45\" font-size=\"12\" fill=\"#493843\">Stem<\/text><text x=\"100\" y=\"45\" font-size=\"12\" fill=\"#493843\">Leaves<\/text><text x=\"35\" y=\"68\" font-size=\"12\" fill=\"#493843\">2<\/text><text x=\"100\" y=\"68\" font-size=\"12\" fill=\"#493843\">1   4   5<\/text><text x=\"35\" y=\"91\" font-size=\"12\" fill=\"#493843\">3<\/text><text x=\"100\" y=\"91\" font-size=\"12\" fill=\"#493843\">2<\/text><path d=\"M80 30 V99\" stroke=\"#9380bb\"/><text x=\"12\" y=\"131\" font-size=\"12\" fill=\"#493843\">Key: 2 | 1 = 21<\/text><text x=\"12\" y=\"158\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-111", "topic": "Numerical data displays", "question": "Group 3, 7, 10, 12, 19 into intervals 0–9 and 10–19.", "answer": "2, 3", "solution": "10 belongs to the second interval.", "section": "worked_example"}, {"id": "VM-DCV-112", "topic": "Numerical data displays", "question": "A frequency polygon has intervals 0 ≤ x < 10, 10 ≤ x < 20, 20 ≤ x < 30 and counts 2, 5, 3. Give midpoint coordinates.", "answer": "(5,2), (15,5), (25,3)", "solution": "Plot each interval midpoint against its frequency.", "section": "worked_example", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"Frequency polygon\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Frequency polygon<\/text><path d=\"M55 50 V170 H325\" fill=\"none\" stroke=\"#493843\"/><text x=\"8\" y=\"39\" font-size=\"12\" fill=\"#493843\">Frequency<\/text><text x=\"145\" y=\"205\" font-size=\"12\" fill=\"#493843\">Class midpoint<\/text><text x=\"22\" y=\"174.0\" font-size=\"12\" fill=\"#493843\">0<\/text><path d=\"M55 170.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"150.0\" font-size=\"12\" fill=\"#493843\">1<\/text><path d=\"M55 146.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"126.0\" font-size=\"12\" fill=\"#493843\">2<\/text><path d=\"M55 122.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"102.0\" font-size=\"12\" fill=\"#493843\">3<\/text><path d=\"M55 98.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"78.0\" font-size=\"12\" fill=\"#493843\">4<\/text><path d=\"M55 74.0 H325\" stroke=\"#ddd\"/><text x=\"22\" y=\"54.0\" font-size=\"12\" fill=\"#493843\">5<\/text><path d=\"M55 50.0 H325\" stroke=\"#ddd\"/><text x=\"55\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">5<\/text><text x=\"190\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">15<\/text><text x=\"325\" y=\"187\" text-anchor=\"middle\" font-size=\"12\" fill=\"#493843\">25<\/text><polyline fill=\"none\" stroke=\"#9875b5\" stroke-width=\"2\" points=\"55.0,122.0 190.0,50.0 325.0,98.0\"/><circle cx=\"55.0\" cy=\"122.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"190.0\" cy=\"50.0\" r=\"4\" fill=\"#9875b5\"/><circle cx=\"325.0\" cy=\"98.0\" r=\"4\" fill=\"#9875b5\"/><text x=\"12\" y=\"222\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-113", "topic": "Numerical data displays", "question": "A student puts leaves 8, 2, 5 in that order. Correct them.", "answer": "2, 5, 8", "solution": "Leaves are normally sorted ascending.", "section": "spot_the_mistake"}, {"id": "VM-DCV-114", "topic": "Numerical data displays", "question": "A student leaves gaps between equal-width histogram bins. Correct them.", "answer": "Use touching bins", "solution": "The intervals form a continuous numerical scale.", "section": "spot_the_mistake"}, {"id": "VM-DCV-115", "topic": "Numerical data displays", "question": "A student omits repeated values in a dot plot. Correct them.", "answer": "Stack one dot per observation", "solution": "Repeats contribute to frequency.", "section": "spot_the_mistake"}, {"id": "VM-DCV-116", "topic": "Numerical data displays", "question": "A student plots a frequency polygon at lower interval boundaries. Correct them.", "answer": "Use interval midpoints", "solution": "Each frequency is represented at its class midpoint.", "section": "spot_the_mistake"}, {"id": "VM-DCV-117", "topic": "Numerical data displays", "question": "A stem-and-leaf plot has stems 1: 2 2 9 and 2: 0 4. Key 1 | 2 = 12. Find the number of observations.", "answer": "5", "solution": "Count every leaf including repeats.", "section": "challenge"}, {"id": "VM-DCV-118", "topic": "Numerical data displays", "question": "Group 0, 5, 10, 15, 20 into bins [0,10), [10,20), [20,30).", "answer": "2, 2, 1", "solution": "Include lower endpoints and exclude upper endpoints.", "section": "challenge"}, {"id": "VM-DCV-119", "topic": "Numerical data displays", "question": "A dot plot has stacks 0:2, 1:4, 2:1, 3:3. How many observations are at least 2?", "answer": "4", "solution": "1 + 3 = 4.", "section": "challenge"}, {"id": "VM-DCV-120", "topic": "Numerical data displays", "question": "A histogram has equal-width bins with counts 3, 8, 5. What fraction of observations are in the middle bin?", "answer": "One half", "solution": "8 of 16 observations are in that bin.", "section": "challenge"}, {"id": "VM-DCV-121", "topic": "Numerical data displays", "question": "Construct a stem-and-leaf plot for 41, 39, 41, 50, 32.", "answer": "3 | 2 9; 4 | 1 1; 5 | 0; key 3 | 2 = 32", "solution": "Sort by tens and retain repeated leaves.", "section": "challenge", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 189\" role=\"img\" aria-label=\"Stem-and-leaf plot\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Stem-and-leaf plot<\/text><text x=\"20\" y=\"45\" font-size=\"12\" fill=\"#493843\">Stem<\/text><text x=\"100\" y=\"45\" font-size=\"12\" fill=\"#493843\">Leaves<\/text><text x=\"35\" y=\"68\" font-size=\"12\" fill=\"#493843\">3<\/text><text x=\"100\" y=\"68\" font-size=\"12\" fill=\"#493843\">2   9<\/text><text x=\"35\" y=\"91\" font-size=\"12\" fill=\"#493843\">4<\/text><text x=\"100\" y=\"91\" font-size=\"12\" fill=\"#493843\">1   1<\/text><text x=\"35\" y=\"114\" font-size=\"12\" fill=\"#493843\">5<\/text><text x=\"100\" y=\"114\" font-size=\"12\" fill=\"#493843\">0<\/text><path d=\"M80 30 V122\" stroke=\"#9380bb\"/><text x=\"12\" y=\"154\" font-size=\"12\" fill=\"#493843\">Key: 3 | 2 = 32<\/text><text x=\"12\" y=\"181\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-122", "topic": "Numerical data displays", "question": "Can you recover every original measurement from a grouped histogram?", "answer": "No", "solution": "Only counts in intervals are retained.", "section": "challenge"}, {"id": "VM-DCV-123", "topic": "Numerical data displays", "question": "A frequency polygon uses midpoints 5, 15, 25. What are the corresponding width-10 intervals?", "answer": "0 ≤ x < 10; 10 ≤ x < 20; 20 ≤ x < 30 (using lower-inclusive intervals).", "solution": "Subtract and add 5 to each midpoint. Use non-overlapping intervals so boundary values are counted once.", "section": "challenge"}, {"id": "VM-DCV-124", "topic": "Numerical data displays", "question": "A dot plot has 12 observations, with 4 at 2 and 5 at 3. How many are elsewhere?", "answer": "3", "solution": "12 − 4 − 5 = 3.", "section": "challenge"}, {"id": "VM-DCV-125", "topic": "Numerical data displays", "question": "Compare a dot plot and a grouped histogram for 8 exact measurements.", "answer": "Dot plot preserves exact values", "solution": "Grouping can hide individual values; dot plots suit small datasets.", "section": "challenge"}, {"id": "VM-DCV-126", "topic": "Numerical data displays", "question": "A stem-and-leaf key is 2 | 5 = 2.5. Interpret 3 | 7 9.", "answer": "3.7 and 3.9", "solution": "The leaves represent tenths.", "section": "challenge", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 143\" role=\"img\" aria-label=\"Stem-and-leaf plot\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Stem-and-leaf plot<\/text><text x=\"20\" y=\"45\" font-size=\"12\" fill=\"#493843\">Stem<\/text><text x=\"100\" y=\"45\" font-size=\"12\" fill=\"#493843\">Leaves<\/text><text x=\"35\" y=\"68\" font-size=\"12\" fill=\"#493843\">3<\/text><text x=\"100\" y=\"68\" font-size=\"12\" fill=\"#493843\">7   9<\/text><path d=\"M80 30 V76\" stroke=\"#9380bb\"/><text x=\"12\" y=\"108\" font-size=\"12\" fill=\"#493843\">Key: 3 | 7 = 3.7<\/text><text x=\"12\" y=\"135\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-127", "topic": "Proportional data displays", "question": "A sector graph represents 12 of 48 students. Find the angle.", "answer": "90°", "solution": "12 divided by 48 multiplied by 360 = 90.", "section": "worked_example"}, {"id": "VM-DCV-128", "topic": "Proportional data displays", "question": "A divided bar is 20 cm long. Find the length for 35%.", "answer": "7 cm", "solution": "0.35 × 20 = 7.", "section": "worked_example"}, {"id": "VM-DCV-129", "topic": "Proportional data displays", "question": "A sector measures 72°. Find its percentage.", "answer": "20%", "solution": "72 divided by 360 multiplied by 100 = 20.", "section": "worked_example"}, {"id": "VM-DCV-130", "topic": "Proportional data displays", "question": "A survey has counts 5, 10, 15. Find sector angles.", "answer": "60°, 120°, 180°", "solution": "Total 30; each count corresponds to 12°.", "section": "worked_example"}, {"id": "VM-DCV-131", "topic": "Proportional data displays", "question": "A student uses 180° for a whole sector graph. Correct them.", "answer": "360°", "solution": "A full circle is 360°.", "section": "spot_the_mistake"}, {"id": "VM-DCV-132", "topic": "Proportional data displays", "question": "A student draws a 25% segment as 25 cm on a 10 cm bar.", "answer": "2.5 cm", "solution": "0.25 × 10 = 2.5.", "section": "spot_the_mistake"}, {"id": "VM-DCV-133", "topic": "Proportional data displays", "question": "A student says equal sector angles always mean equal counts across different surveys.", "answer": "Not necessarily", "solution": "Different survey totals can produce different counts for equal proportions.", "section": "spot_the_mistake"}, {"id": "VM-DCV-134", "topic": "Proportional data displays", "question": "A student gives exact angles 100°, 120°, 130° for a complete three-category pie chart. Identify the error.", "answer": "10° missing", "solution": "The angles total 350°, not 360°.", "section": "spot_the_mistake"}, {"id": "VM-DCV-135", "topic": "Proportional data displays", "question": "A 144° sector represents 24 students. Find the total.", "answer": "60", "solution": "144° is 40% of the circle; 24 divided by 0.4 = 60.", "section": "challenge"}, {"id": "VM-DCV-136", "topic": "Proportional data displays", "question": "A divided bar has segments 3, 5, 12 cm. Find the middle percentage.", "answer": "25%", "solution": "5 out of 20 = 25%.", "section": "challenge"}, {"id": "VM-DCV-137", "topic": "Proportional data displays", "question": "Two surveys have 20% of 50 and 15% of 80 choosing art. Which has more art choices?", "answer": "Second survey", "solution": "10 versus 12.", "section": "challenge"}, {"id": "VM-DCV-138", "topic": "Proportional data displays", "question": "A sector graph has angles 80°, 100° and x. Find x.", "answer": "180°", "solution": "360 − 80 − 100 = 180.", "section": "challenge"}, {"id": "VM-DCV-139", "topic": "Proportional data displays", "question": "A 15 cm bar represents 60 students. Find the length for 16 students.", "answer": "4 cm", "solution": "15 × 16 divided by 60 = 4.", "section": "challenge"}, {"id": "VM-DCV-140", "topic": "Proportional data displays", "question": "A sector graph has a 45° sector. Give a possible count and total.", "answer": "Example: 5 of 40", "solution": "45° is one eighth of a circle.", "section": "challenge"}, {"id": "VM-DCV-141", "topic": "Proportional data displays", "question": "A survey has 7, 11, 22 responses. Find exact sector angles.", "answer": "63°, 99°, 198°", "solution": "Total 40; multiply each count by 9°.", "section": "challenge"}, {"id": "VM-DCV-142", "topic": "Proportional data displays", "question": "A 12 cm divided bar shows 25%, 50%, 25%. Find cumulative boundaries from the left.", "answer": "3 cm, 9 cm, 12 cm", "solution": "Segment lengths are 3, 6, 3 cm.", "section": "challenge"}, {"id": "VM-DCV-143", "topic": "Proportional data displays", "question": "Explain why a sector graph is unsuitable for monthly temperatures.", "answer": "Temperatures are not parts of a whole", "solution": "A line graph can show change over time.", "section": "challenge"}, {"id": "VM-DCV-144", "topic": "Proportional data displays", "question": "A sector angle is 108° in a survey of 70. Find its count.", "answer": "21", "solution": "108 divided by 360 × 70 = 21.", "section": "challenge"}, {"id": "VM-DCV-145", "topic": "Graph selection and interpretation", "question": "Choose a graph for daily water temperature over a month.", "answer": "Line graph", "solution": "Time order and changes are important. A line graph is suitable; another display may be accepted if it clearly communicates changes over time.", "section": "worked_example"}, {"id": "VM-DCV-146", "topic": "Graph selection and interpretation", "question": "Choose a graph for favourite school subjects.", "answer": "Column graph", "solution": "Separate columns compare categorical frequencies. A pictogram or sector graph may also be suitable, depending on the purpose.", "section": "worked_example"}, {"id": "VM-DCV-147", "topic": "Graph selection and interpretation", "question": "Choose a graph for masses of 200 parcels grouped into equal-width intervals.", "answer": "Histogram", "solution": "Touching bars show the distribution across equal-width numerical intervals. A frequency polygon is another suitable representation.", "section": "worked_example"}, {"id": "VM-DCV-148", "topic": "Graph selection and interpretation", "question": "Sales on Monday, Tuesday, Wednesday are 10, 15, 13. Describe the trend.", "answer": "Rise then fall", "solution": "Increase by 5, then decrease by 2.", "section": "worked_example"}, {"id": "VM-DCV-149", "topic": "Graph selection and interpretation", "question": "A student joins favourite fruit categories with a line. Explain why this may mislead.", "answer": "Categories have no continuous order", "solution": "A column graph avoids implying intermediate values.", "section": "spot_the_mistake"}, {"id": "VM-DCV-150", "topic": "Graph selection and interpretation", "question": "A student predicts exact future sales from three rising points. Correct them.", "answer": "Prediction is uncertain", "solution": "A trend does not guarantee a future value.", "section": "spot_the_mistake"}, {"id": "VM-DCV-151", "topic": "Graph selection and interpretation", "question": "A student says a graph proves exercise causes higher grades. Correct them.", "answer": "Association alone does not establish causation", "solution": "Other factors may explain the pattern.", "section": "spot_the_mistake"}, {"id": "VM-DCV-152", "topic": "Graph selection and interpretation", "question": "A student chooses a pie chart to show daily temperatures over a week, including temperatures below zero. Explain why this is unsuitable and suggest a better display.", "answer": "Temperatures are not parts of a whole; use a line graph.", "solution": "A sector graph represents non-negative shares of a meaningful whole. Daily temperatures are measurements over time, not shares of a total. A line graph with a labelled temperature axis can show both positive and negative values and changes over time.", "section": "spot_the_mistake"}, {"id": "VM-DCV-153", "topic": "Graph selection and interpretation", "question": "Weekly counts are 12, 16, 20, 24. Predict the next if the pattern continues.", "answer": "28", "solution": "The increase is 4 each week; this is conditional.", "section": "challenge"}, {"id": "VM-DCV-154", "topic": "Graph selection and interpretation", "question": "Rainfall is 10, 30, 15 mm on three days. Find the largest day-to-day change.", "answer": "20 mm increase", "solution": "Changes are +20 and −15.", "section": "challenge"}, {"id": "VM-DCV-155", "topic": "Graph selection and interpretation", "question": "Choose a display that preserves exact values for 15 test scores.", "answer": "Stem-and-leaf or dot plot", "solution": "Both can retain individual scores.", "section": "challenge"}, {"id": "VM-DCV-156", "topic": "Graph selection and interpretation", "question": "A school has 40 cyclists out of 200; another has 30 out of 100. Which has higher cycling proportion?", "answer": "Second school", "solution": "20% versus 30%.", "section": "challenge"}, {"id": "VM-DCV-157", "topic": "Graph selection and interpretation", "question": "A line graph has equal recorded values at 9 am, 10 am, 11 am and noon. What can you conclude?", "answer": "The four recorded values are equal.", "solution": "The plotted points have the same height. Without continuous measurements, changes between recording times cannot be ruled out.", "section": "challenge"}, {"id": "VM-DCV-158", "topic": "Graph selection and interpretation", "question": "A graph shows 10, 20, 10 visits. Is the overall change zero?", "answer": "Yes", "solution": "Final minus initial is zero despite intermediate changes.", "section": "challenge"}, {"id": "VM-DCV-159", "topic": "Graph selection and interpretation", "question": "A graph shows 5, 8, 14, 23. Are increases constant?", "answer": "No", "solution": "Increases are 3, 6 and 9.", "section": "challenge"}, {"id": "VM-DCV-160", "topic": "Graph selection and interpretation", "question": "Which display best shows each category as a share of a single budget?", "answer": "Sector or divided bar graph", "solution": "Both represent parts of a whole.", "section": "challenge"}, {"id": "VM-DCV-161", "topic": "Graph selection and interpretation", "question": "A graph of monthly attendance omits April. Can you determine April attendance?", "answer": "No", "solution": "The missing observation cannot be recovered from adjacent values alone.", "section": "challenge"}, {"id": "VM-DCV-162", "topic": "Graph selection and interpretation", "question": "Two lines on a graph use the same vertical scale and units and cross at June. What can you conclude about the plotted values?", "answer": "The plotted values are equal", "solution": "If both lines use the same vertical scale and units, their intersection indicates equal plotted values at the same horizontal position. It does not necessarily establish equality between recorded observations.", "section": "challenge"}, {"id": "VM-DCV-163", "topic": "Misleading graphs and infographics", "question": "Two bars show 50 and 55 with an axis starting at 45. Explain the distortion.", "answer": "Visible heights are 5 and 10", "solution": "The second appears twice as tall although its value is only 10% larger.", "section": "worked_example"}, {"id": "VM-DCV-164", "topic": "Misleading graphs and infographics", "question": "An infographic shows 3 icons with key 100 people per icon. Interpret it.", "answer": "300 people", "solution": "3 × 100 = 300.", "section": "worked_example", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 100 people<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">People<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-165", "topic": "Misleading graphs and infographics", "question": "A graph has no source. What should be added?", "answer": "Data source", "solution": "Readers need to know where the figures came from.", "section": "worked_example"}, {"id": "VM-DCV-166", "topic": "Misleading graphs and infographics", "question": "A graph axis is labelled only Time. Improve it for a race.", "answer": "Time (seconds)", "solution": "Include the measurement unit.", "section": "worked_example"}, {"id": "VM-DCV-167", "topic": "Misleading graphs and infographics", "question": "A student doubles both width and height of an icon to show twice as many people. Correct them.", "answer": "Area becomes four times as large", "solution": "Use equal-sized icons or a proportional area encoding.", "section": "spot_the_mistake"}, {"id": "VM-DCV-168", "topic": "Misleading graphs and infographics", "question": "A student uses tick labels 0, 10, 20, 50 at equal spacing. Correct them.", "answer": "Use consistent intervals", "solution": "Equal distances should represent equal numerical changes on a linear axis.", "section": "spot_the_mistake"}, {"id": "VM-DCV-169", "topic": "Misleading graphs and infographics", "question": "A student claims 8 of 10 is always more people than 60 of 100 because 80% exceeds 60%.", "answer": "60 people is more", "solution": "Distinguish proportion from absolute count.", "section": "spot_the_mistake"}, {"id": "VM-DCV-170", "topic": "Misleading graphs and infographics", "question": "A student removes the legend from a two-colour infographic. Explain the issue.", "answer": "Colours become ambiguous", "solution": "A legend identifies the categories.", "section": "spot_the_mistake"}, {"id": "VM-DCV-171", "topic": "Misleading graphs and infographics", "question": "A bar chart compares 100 and 110 with baseline 90. Compare visible height ratio with value ratio.", "answer": "2 versus 1.1", "solution": "Heights 10 and 20; actual values 100 and 110.", "section": "challenge"}, {"id": "VM-DCV-172", "topic": "Misleading graphs and infographics", "question": "An icon is scaled to triple its width and height. Find its area multiplier.", "answer": "9", "solution": "3 × 3 = 9.", "section": "challenge"}, {"id": "VM-DCV-173", "topic": "Misleading graphs and infographics", "question": "A headline says participation doubled from 2 to 4 students. Give context that should be included.", "answer": "Actual counts and group size", "solution": "Relative change alone can exaggerate practical importance.", "section": "challenge"}, {"id": "VM-DCV-174", "topic": "Misleading graphs and infographics", "question": "A survey of 25 students has 15 choosing music. Design a one-sentence infographic caption.", "answer": "15 of 25 students (60%) chose music", "solution": "Include count, total and proportion.", "section": "challenge"}, {"id": "VM-DCV-175", "topic": "Misleading graphs and infographics", "question": "A graph compares dollars with cents on the same axis without conversion. Correct it.", "answer": "Convert to common units", "solution": "One dollar equals 100 cents.", "section": "challenge"}, {"id": "VM-DCV-176", "topic": "Misleading graphs and infographics", "question": "A chart shows only the highest three of six categories. What must the title disclose?", "answer": "That only the top three are shown", "solution": "Otherwise readers may assume the display is complete.", "section": "challenge"}, {"id": "VM-DCV-177", "topic": "Misleading graphs and infographics", "question": "A pictogram uses 1 icon per 10 people. Show 35 people accurately.", "answer": "3.5 icons", "solution": "Use three full icons and a half icon.", "section": "challenge", "solutionDiagram": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Pictogram\" style=\"width:100%;max-width:480px;background:#fff;border-radius:12px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#493843\">Pictogram<\/text><text x=\"12\" y=\"42\" font-size=\"12\" fill=\"#493843\">Key: one circle = 10 people<\/text><text x=\"12\" y=\"69\" font-size=\"12\" fill=\"#493843\">People<\/text><circle cx=\"95\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"120\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><circle cx=\"145\" cy=\"65\" r=\"8\" fill=\"#b77891\"/><path d=\"M170 57 a8 8 0 0 0 0 16 Z\" fill=\"#b77891\"/><text x=\"12\" y=\"157\" font-size=\"12\" fill=\"#493843\">Source: hypothetical question data<\/text><\/svg>"}, {"id": "VM-DCV-178", "topic": "Misleading graphs and infographics", "question": "A graph labels 20% and 30% as a 10% increase. Correct the wording.", "answer": "10 percentage points, or 50% relative increase", "solution": "30 − 20 = 10 points; 10 divided by 20 = 50%.", "section": "challenge"}, {"id": "VM-DCV-179", "topic": "Misleading graphs and infographics", "question": "A survey infographic reports 90% agreement but gives no sample size. Why does it matter?", "answer": "The count and strength of evidence are unclear", "solution": "90% of 10 is 9; 90% of 1000 is 900. Sample size helps assess precision, but representativeness also depends on how the sample was selected.", "section": "challenge"}, {"id": "VM-DCV-180", "topic": "Misleading graphs and infographics", "question": "Design a fair column graph comparing 18 and 24 votes.", "answer": "Zero baseline, equal-width bars, uniform scale, labels, title and source", "solution": "A scale of 0 to 24 in steps of 6 represents both counts accurately.", "section": "challenge"}, {"id": "VM-DCV-181", "topic": "Classifying data", "section": "diagnostic", "question": "A survey records students’ preferred musical instrument. What type of variable is this?", "options": ["Nominal", "Ordinal", "Discrete", "Continuous"], "answer": "Nominal", "solution": "Instrument names have no inherent ranking.", "correct_index": 0}, {"id": "VM-DCV-182", "topic": "Classifying data", "section": "diagnostic", "question": "Which variable is continuous?", "options": ["Number of pets", "Time taken to swim 50 m", "Jersey number", "Competition placing"], "answer": "Time taken to swim 50 m", "solution": "Time can take any value within a measurement interval.", "correct_index": 1}, {"id": "VM-DCV-183", "topic": "Classifying data", "section": "diagnostic", "question": "A rating uses beginner, intermediate and advanced. Classify it.", "options": ["Continuous", "Nominal", "Ordinal", "Discrete"], "answer": "Ordinal", "solution": "The categories have a natural order.", "correct_index": 2}, {"id": "VM-DCV-184", "topic": "Frequency tables and simple graphs", "section": "diagnostic", "question": "A frequency table lists 7, 12 and 9 votes. How many votes are recorded?", "options": ["19", "21", "27", "28"], "answer": "28", "solution": "7 + 12 + 9 = 28.", "correct_index": 3}, {"id": "VM-DCV-185", "topic": "Frequency tables and simple graphs", "section": "diagnostic", "question": "A pictogram uses one symbol for 6 books. What does 2½ symbols represent?", "options": ["15", "12", "18", "9"], "answer": "15", "solution": "2 × 6 + 3 = 15.", "correct_index": 0}, {"id": "VM-DCV-186", "topic": "Numerical data displays", "section": "diagnostic", "question": "Which display uses adjacent bars to represent grouped continuous measurements?", "options": ["Column graph", "Histogram", "Sector graph", "Pictogram"], "answer": "Histogram", "solution": "Histogram bars represent consecutive numerical intervals.", "correct_index": 1}, {"id": "VM-DCV-187", "topic": "Numerical data displays", "section": "diagnostic", "question": "In a stem-and-leaf plot, the key is 4|2 = 42. What does 5|7 represent?", "options": ["12", "75", "57", "5.7"], "answer": "57", "solution": "The stem gives tens and the leaf gives units.", "correct_index": 2}, {"id": "VM-DCV-188", "topic": "Numerical data displays", "section": "diagnostic", "question": "A frequency polygon has a point (15, 8). The horizontal axis shows class midpoints. What is 8?", "options": ["Class width", "Midpoint", "Total frequency", "Frequency of that class"], "answer": "Frequency of that class", "solution": "The vertical coordinate is the class frequency.", "correct_index": 3}, {"id": "VM-DCV-189", "topic": "Proportional data displays", "section": "diagnostic", "question": "A category contains 9 of 36 responses. Find its sector angle.", "options": ["90°", "25°", "120°", "270°"], "answer": "90°", "solution": "9 ÷ 36 × 360° = 90°.", "correct_index": 0}, {"id": "VM-DCV-190", "topic": "Proportional data displays", "section": "diagnostic", "question": "A divided bar is 20 cm long. How long is the segment for 35%?", "options": ["3.5 cm", "7 cm", "13 cm", "35 cm"], "answer": "7 cm", "solution": "0.35 × 20 = 7 cm.", "correct_index": 1}, {"id": "VM-DCV-191", "topic": "Proportional data displays", "section": "diagnostic", "question": "A sector has angle 144°. What percentage does it represent?", "options": ["14.4%", "60%", "40%", "25%"], "answer": "40%", "solution": "144 ÷ 360 × 100 = 40%.", "correct_index": 2}, {"id": "VM-DCV-192", "topic": "Graph selection and interpretation", "section": "diagnostic", "question": "Which display best shows daily temperature changes over a month?", "options": ["Sector graph", "Pictogram", "Stem-and-leaf plot", "Line graph"], "answer": "Line graph", "solution": "A line graph shows change across ordered time points.", "correct_index": 3}, {"id": "VM-DCV-193", "topic": "Graph selection and interpretation", "section": "diagnostic", "question": "Weekly visits were 22, 27, 32 and 37. If the pattern continues, predict the next value.", "options": ["42", "40", "44", "47"], "answer": "42", "solution": "Each week increases by 5; 37 + 5 = 42.", "correct_index": 0}, {"id": "VM-DCV-194", "topic": "Graph selection and interpretation", "section": "diagnostic", "question": "Which graph best compares counts for five unrelated favourite sports?", "options": ["Line graph", "Column graph", "Histogram", "Frequency polygon"], "answer": "Column graph", "solution": "Separate columns compare categorical frequencies.", "correct_index": 1}, {"id": "VM-DCV-195", "topic": "Misleading graphs and infographics", "section": "diagnostic", "question": "Two column graphs show the same counts, but one starts its vertical axis at 90 rather than zero. What is the main risk?", "options": ["The counts change", "The categories disappear", "Differences look exaggerated", "The total doubles"], "answer": "Differences look exaggerated", "solution": "A truncated baseline exaggerates relative bar lengths.", "correct_index": 2}, {"id": "VM-DCV-196", "topic": "Misleading graphs and infographics", "section": "diagnostic", "question": "Which addition lets readers check where infographic data came from?", "options": ["A larger title", "More colours", "A decorative border", "A source citation"], "answer": "A source citation", "solution": "A source identifies the origin of the data.", "correct_index": 3}, {"id": "VM-DCV-197", "topic": "Classifying data", "section": "escape_core", "question": "Enter 1 for nominal, 2 for ordinal, 3 for discrete or 4 for continuous: number of goals scored.", "answer": "3", "solution": "Goals are counted, so the variable is discrete."}, {"id": "VM-DCV-198", "topic": "Frequency tables and simple graphs", "section": "escape_core", "question": "A tally table has frequencies 8, 6 and 11. Enter the total.", "answer": "25", "solution": "8 + 6 + 11 = 25."}, {"id": "VM-DCV-199", "topic": "Numerical data displays", "section": "escape_core", "question": "A dot plot has 3 dots at 4 and 5 dots at 6. Enter the total number of observations.", "answer": "8", "solution": "3 + 5 = 8."}, {"id": "VM-DCV-200", "topic": "Proportional data displays", "section": "escape_core", "question": "A sector represents half the responses. Enter its angle in degrees.", "answer": "180", "solution": "360 ÷ 2 = 180."}, {"id": "VM-DCV-201", "topic": "Graph selection and interpretation", "section": "escape_core", "question": "A line graph shows 14 visitors on Monday and 23 on Tuesday. Enter the increase.", "answer": "9", "solution": "23 − 14 = 9."}, {"id": "VM-DCV-202", "topic": "Misleading graphs and infographics", "section": "escape_core", "question": "A pictogram key is one icon per 4 people. Enter the count represented by 3 icons.", "answer": "12", "solution": "3 × 4 = 12."}, {"id": "VM-DCV-203", "topic": "Classifying data", "section": "escape_extension", "question": "Of four variables (mass, postcode, number of cousins, temperature), enter how many are continuous.", "answer": "2", "solution": "Mass and temperature are continuous."}, {"id": "VM-DCV-204", "topic": "Frequency tables and simple graphs", "section": "escape_extension", "question": "A frequency table has total 48 and known frequencies 13, 9 and 17. Enter the missing frequency.", "answer": "9", "solution": "48 − 13 − 9 − 17 = 9."}, {"id": "VM-DCV-205", "topic": "Numerical data displays", "section": "escape_extension", "question": "A histogram class covers 20 ≤ x < 30. Enter the midpoint.", "answer": "25", "solution": "(20 + 30) ÷ 2 = 25."}, {"id": "VM-DCV-206", "topic": "Proportional data displays", "section": "escape_extension", "question": "A sector of 72° represents 14 students. Enter the total number of students.", "answer": "70", "solution": "72 ÷ 360 = 0.2; 14 ÷ 0.2 = 70."}, {"id": "VM-DCV-207", "topic": "Graph selection and interpretation", "section": "escape_extension", "question": "A line graph records 18, 24, 30 and 36. If the same pattern continues for two more observations, enter the sixth value.", "answer": "48", "solution": "Add 6 twice: 36 + 12 = 48."}, {"id": "VM-DCV-208", "topic": "Misleading graphs and infographics", "section": "escape_extension", "question": "A graph shows an increase from 40% to 50%. Enter the relative percentage increase, without the percent sign.", "answer": "25", "solution": "(50 − 40) ÷ 40 × 100 = 25%."}]</script><script>
const bank=JSON.parse(document.getElementById('bank').textContent), $=id=>document.getElementById(id), root=$('content');
const tabs={explore:'Interactive explorers',practice:'Skill practice',worked_example:'Worked examples',spot_the_mistake:'Spot the mistake',challenge:'Challenge questions',diagnostic:'Diagnostic test',escape_core:'Core escape room',escape_extension:'Extension escape room',mini:'Random mini-test'}; let active='explore';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(q,i){return `<article><p class="tag">${esc(q.topic)} · ${esc(q.id)}</p><h3>Question ${i+1}</h3><p>${esc(q.question)}</p>${q.diagram||''}<details><summary>Show answer and worked solution</summary><p><strong>${esc(q.answer)}</strong></p><p>${esc(q.solution)}</p>${q.solutionDiagram||''}</details></article>`}
function show(key){active=key;document.querySelectorAll('#vm-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key))); if(key==='explore')return explore(); if(key==='diagnostic')return diagnostic(); if(key.startsWith('escape'))return escapeRoom(key); if(key==='mini'){root.innerHTML='<h2>Random mini-test</h2><button id="again">New set</button><div id="questions"></div>';const run=()=>{let a=bank.filter(q=>q.section==='practice');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} $('questions').innerHTML=a.slice(0,10).map(card).join('')};$('again').onclick=run;return run()};let a=bank.filter(q=>q.section===key);root.innerHTML=`<h2>${tabs[key]}</h2><label>Topic <select id="topic"><option>All topics</option>${[...new Set(a.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><div id="questions"></div>`;const render=()=>{$('questions').innerHTML=a.filter(q=>$('topic').value==='All topics'||q.topic===$('topic').value).map(card).join('')};$('topic').onchange=render;render()}
function diagnostic(){let a=bank.filter(q=>q.section==='diagnostic');root.innerHTML='<h2>Diagnostic test</h2><p>Choose one answer for each question, then mark your test.</p><form id="test">'+a.map((q,i)=>`<article><p>${i+1}. ${esc(q.question)}</p><div class="options">${q.options.map((o,j)=>`<label><input required type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div><div id="f${i}"></div></article>`).join('')+'<button type="submit">Mark test</button> <button type="button" id="reset">Start again</button><p id="score" role="status"></p></form>'; $('reset').onclick=diagnostic;$('test').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),score=0,topics={};a.forEach((q,i)=>{let ok=Number(data.get('q'+i))===q.correct_index;score+=Number(ok);let t=topics[q.topic]??=[0,0];t[0]+=Number(ok);t[1]++;$('f'+i).innerHTML=`<p class="feedback">${ok?'Correct':'Incorrect'} · ${esc(q.answer)}</p><p>${esc(q.solution)}</p>`});$('score').innerHTML=`<strong>Score: ${score}/${a.length}</strong><br>`+Object.entries(topics).map(([k,v])=>`${esc(k)}: ${v[0]}/${v[1]}`).join('<br>')}}
function escapeRoom(key){let a=bank.filter(q=>q.section===key),i=0;function step(){if(i===a.length){root.innerHTML='<h2>Escape room complete!</h2><p>You unlocked all six challenges.</p><button id="restart">Play again</button>';$('restart').onclick=()=>escapeRoom(key);return}let q=a[i];root.innerHTML=`<h2>${tabs[key]}</h2><p>Lock ${i+1} of ${a.length}</p><article><p>${esc(q.question)}</p><form id="lock"><label>Answer <input id="guess" required autocomplete="off"></label><button>Unlock</button></form><p id="feedback" role="status"></p><details><summary>Need a hint? Show reasoning</summary><p>${esc(q.solution)}</p>${q.solutionDiagram||''}</details></article>`;$('lock').onsubmit=e=>{e.preventDefault();let norm=s=>String(s).toLowerCase().trim().replace(/°/g,'').replace(/\s+/g,' ');if(norm($('guess').value)===norm(q.answer)){i++;step()}else $('feedback').textContent='Not quite. Try again.'}}step()}
function explore(){root.innerHTML=`<section class="panel"><h2>Graph builder</h2><p>Change the frequencies to compare representations. Data are simulated.</p><div id="counts">${['A','B','C','D'].map((x,i)=>`<label>${x} <input type="range" id="n${i}" min="0" max="12" value="${i+3}"></label>`).join('')}</div><label>Display <select id="kind"><option>Column graph</option><option>Dot plot</option><option>Sector graph</option><option>Divided bar graph</option><option>Pictogram</option><option>Histogram</option><option>Frequency polygon</option><option>Line graph</option><option>Stem-and-leaf plot</option></select></label><div id="graph"></div><div id="freq"></div></section><section class="panel"><h2>Data classification explorer</h2><label>Variable <select id="variable"><option>Eye colour</option><option>Finishing position</option><option>Number of books</option><option>Height</option></select></label><p id="classification"></p></section><section class="panel"><h2>Misleading graphs explorer</h2><p>Compare the same values, 80 and 90, using different vertical scales.</p><label><input type="checkbox" id="truncate"> Start axis at 75 instead of zero</label><div id="mislead"></div><p id="explain"></p></section>`;
const colors=['#b77891','#9380bb','#78a98f','#7299bc'],svg=(body,title)=>`<svg viewBox="0 0 340 240" role="img" aria-label="${title}"><title>${title}</title>${body}</svg>`,txt=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle">${t}</text>`,rect=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
function graph(){let v=[0,1,2,3].map(i=>+$('n'+i).value),total=v.reduce((a,b)=>a+b,0),kind=$('kind').value,labels=['A','B','C','D'],body=txt(170,18,kind),axis='<path d="M40 30 V190 H320" fill="none" stroke="#493843"/>';let numeric=['Dot plot','Histogram','Frequency polygon','Line graph','Stem-and-leaf plot'].includes(kind);if(numeric)labels=kind==='Histogram'?['0–<10','10–<20','20–<30','30–<40']:kind==='Frequency polygon'?['5','15','25','35']:kind==='Line graph'?['Day 1','Day 2','Day 3','Day 4']:['10','20','30','40'];$('freq').innerHTML='<p>Source: simulated data · Total frequency: '+total+'</p><table><thead><tr><th>Value / group</th><th>Frequency</th></tr></thead><tbody>'+v.map((n,i)=>`<tr><td>${labels[i]}</td><td>${n}</td></tr>`).join('')+'</tbody></table>';
if(kind==='Sector graph'||kind==='Divided bar graph'){if(!total){$('graph').textContent='Increase a frequency to display proportions.';return}let a=0;v.forEach((n,i)=>{let f=n/total;if(kind==='Divided bar graph')body+=rect(20+a*300,75,f*300,50,colors[i]);else if(f===1)body+=`<circle cx="170" cy="112" r="78" fill="${colors[i]}"/>`;else if(f>0){let p=t=>[170+78*Math.cos(t*2*Math.PI-Math.PI/2),112+78*Math.sin(t*2*Math.PI-Math.PI/2)];body+=`<path d="M170 112 L${p(a).join(' ')} A78 78 0 ${f>.5?1:0} 1 ${p(a+f).join(' ')} Z" fill="${colors[i]}" stroke="white"/>`}a+=f;body+=rect(20+i*80,205,12,12,colors[i])+txt(55+i*80,216,labels[i]+': '+n)})}else if(kind==='Stem-and-leaf plot'){body+=txt(170,45,'Stem | Leaves');v.forEach((n,i)=>body+=txt(170,75+i*32,`${i+1} | ${Array(n).fill('0').join(' ')}`));body+=txt(170,220,'Key: 1 | 0 = 10')}else if(kind==='Pictogram'){v.forEach((n,i)=>{body+=txt(25,55+i*35,labels[i]);for(let j=0;j<n;j++)body+=`<circle cx="${50+j*22}" cy="${50+i*35}" r="7" fill="${colors[i]}"/>`});body+=txt(170,215,'Key: one dot = one response')}else{body+=axis;for(let n=0;n<=12;n+=3)body+=txt(29,194-n*12,n);body+=txt(170,232,kind==='Frequency polygon'?'Class midpoint':kind==='Line graph'?'Day':kind==='Histogram'?'Class boundary':'Value / group');body+='<text x="9" y="110" transform="rotate(-90 9 110)" text-anchor="middle">Frequency</text>'; v.forEach((n,i)=>{let x=75+i*70;if(kind==='Histogram'){body+=txt(x-35,207,i*10);if(i===3)body+=txt(x+35,207,40)}else body+=txt(x,207,esc(labels[i]));if(kind==='Dot plot'){for(let j=0;j<n;j++)body+=`<circle cx="${x}" cy="${184-j*12}" r="4" fill="${colors[i]}"/>`}else if(kind==='Column graph'||kind==='Histogram')body+=rect(x-(kind==='Histogram'?35:23),190-n*12,kind==='Histogram'?70:46,n*12,colors[i]);else body+=`<circle cx="${x}" cy="${190-n*12}" r="4" fill="#74538b"/>`});if(kind==='Line graph'||kind==='Frequency polygon')body+=`<polyline points="${v.map((n,i)=>`${75+i*70},${190-n*12}`).join(' ')}" fill="none" stroke="#74538b" stroke-width="2"/>`} $('graph').innerHTML=svg(body,kind)}
function classify(){$('classification').textContent=['Nominal: unordered categories.','Ordinal: ordered categories.','Discrete: countable numerical values.','Continuous: measurements on a scale.'][$('variable').selectedIndex]}
function misleading(){let base=$('truncate').checked?75:0,scale=140/(100-base),body=txt(170,18,'Same data, different scales')+'<path d="M45 30 V190 H310" fill="none" stroke="#493843"/>';for(let n=base;n<=100;n+=(base?5:20))body+=txt(25,194-(n-base)*scale,n);[80,90].forEach((n,i)=>{let h=(n-base)*scale;body+=rect(90+i*120,190-h,60,h,colors[i])+txt(120+i*120,183-h,n)+txt(120+i*120,210,['A','B'][i])});$('mislead').innerHTML=svg(body,'Comparison of 80 and 90');$('explain').textContent=base?'A truncated axis exaggerates the visual difference. The actual increase is still 10.':'A zero baseline shows the relative bar lengths accurately.'}
for(let i=0;i<4;i++)$('n'+i).oninput=graph;$('kind').onchange=graph;$('variable').onchange=classify;$('truncate').onchange=misleading;graph();classify();misleading()}
$('vm-tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-key="${k}" aria-pressed="false">${v}</button>`).join('');document.querySelectorAll('#vm-tabs button').forEach(b=>b.onclick=()=>show(b.dataset.key));show(location.hash==='#diagnostic'?'diagnostic':'explore');</script></body></html>
