<meta name="description" content="Revise mathematics with a mixed practice exam and review your answers."><style>body{font:16px system-ui;color:#483c46;background:#fffcf7;margin:0;padding:16px}main{max-width:850px;margin:auto}h1,h2{font-family:Georgia;color:#87465a}fieldset,article{border:1px solid #e4d5d8;border-radius:16px;padding:16px;margin:14px 0;background:white}label{display:block;padding:7px}button{font:inherit;font-weight:650;background:#87465a;color:white;border:0;border-radius:10px;padding:10px 16px;margin:5px;cursor:pointer}button:disabled{opacity:.5}input[type=number],textarea{font:inherit;border:1px solid #cbbbc4;border-radius:8px;padding:8px;max-width:95%}textarea{width:95%;min-height:70px}svg,img{max-width:100%;height:auto;max-height:320px}.frac,.fraction{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}.frac>span:first-child,.fraction>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}.solution{background:#f5edf7;padding:12px;border-radius:10px;white-space:pre-line}.prompt{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:1.2rem;font-weight:600;line-height:1.5;color:#87465a;white-space:pre-line;overflow-wrap:anywhere}small{color:#66545f} [hidden]{display:none!important} .choices label{background:#f9f1f4;margin:4px;border-radius:8px}</style><main><h1 id="title">Mixed Practice Exam</h1><p>Select units and the number of questions. Questions are randomly sampled without replacement, with a balanced mix of selected units where possible.</p><p id="notice"></p><section id="setup"><fieldset><legend>Choose units</legend><button id="all" type="button">Select all</button><button id="none" type="button">Clear all</button><div id="units"></div></fieldset><label>Number of questions <input id="count" type="number" min="1" value="20" step="1"></label><p id="available" aria-live="polite"></p><button id="start" disabled>Start exam</button></section><section id="exam" hidden><p id="progress" aria-live="polite"></p><article id="question"></article><button id="prev">Previous</button><button id="next">Next</button><button id="finish">Finish and review</button><button id="reset">New exam</button></section><section id="review" hidden><h2>Exam review</h2><p id="score"></p><div id="results"></div><button id="again">Create another exam</button></section></main><script>
const year=Number(new URLSearchParams(location.search).get('year'))||9;const $=id=>document.getElementById(id);let banks=[],deck=[],responses=[],pos=0;const key='vm-mixed-v1-'+year;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function selected(){return [...$('units').querySelectorAll('input:checked')].map(x=>banks[Number(x.value)])}function update(){const n=selected().reduce((s,b)=>s+b.questions.length,0);$('count').max=n;$('available').textContent=n+' questions available';$('start').disabled=!n||!Number.isInteger(+$('count').value)||+$('count').value<1||+$('count').value>n}function save(){try{sessionStorage.setItem(key,JSON.stringify({deck,responses,pos,review:!$('review').hidden}))}catch(e){}}function clear(){try{sessionStorage.removeItem(key)}catch(e){}$('setup').hidden=false;$('exam').hidden=true;$('review').hidden=true}function html(v){return String(v??'')}function show(){ $('setup').hidden=true;$('review').hidden=true;$('exam').hidden=false;const q=deck[pos];$('progress').textContent=`Question ${pos+1} of ${deck.length} · ${responses.filter(x=>x!==undefined&&x!==null&&x!=='').length} answered`;const a=$('question');a.innerHTML='<small></small><h2 class="prompt"></h2><div class="diagram"></div><div class="choices"></div>';a.querySelector('small').textContent=q.unit+' · '+q.id;a.querySelector('h2').innerHTML=html(q.prompt);a.querySelector('.diagram').innerHTML=html(q.diagram);const c=a.querySelector('.choices');if(q.options.length){q.options.forEach((v,i)=>{const l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='answer';r.checked=responses[pos]===i;r.onchange=()=>{responses[pos]=i;save()};l.append(r);const t=document.createElement('span');t.innerHTML=html(v);l.append(t);c.append(l)})}else{const t=document.createElement('textarea');t.placeholder='Write your answer or working here';t.value=responses[pos]??'';t.oninput=()=>{responses[pos]=t.value;save()};c.append(t)}$('prev').disabled=pos===0;$('next').disabled=pos===deck.length-1;save()}
function start(){let pools=shuffle(selected()).map(b=>shuffle(b.questions).map(q=>({...q,unit:b.title,options:shuffle(Array.isArray(q.options)?q.options:[])})));deck=[];const n=+$('count').value;while(deck.length<n){for(const p of pools){if(p.length&&deck.length<n)deck.push(p.pop())}}deck=shuffle(deck);responses=Array(deck.length).fill(null);pos=0;show()}
function review(){ $('exam').hidden=true;$('setup').hidden=true;$('review').hidden=false;let correct=0,total=0,manual=0;const r=$('results');r.replaceChildren();deck.forEach((q,i)=>{const mc=q.options.length>0,ans=responses[i],ok=mc&&ans!==null&&q.options[ans]===q.answer;if(mc){total++;if(ok)correct++}else manual++;const a=document.createElement('article');a.innerHTML='<small></small><h3 class="prompt"></h3><div class="diagram"></div><p class="given"></p><div class="solution"><strong>Answer</strong><div class="answer"></div><strong>Worked solution</strong><div class="working"></div></div>';a.querySelector('small').textContent=`${i+1}. ${q.unit} · ${mc?(ok?'Correct':ans===null?'Unanswered':'Incorrect'):'Self-mark'}`;a.querySelector('h3').innerHTML=html(q.prompt);a.querySelector('.diagram').innerHTML=html(q.diagram);a.querySelector('.given').textContent='Your answer: ';if(mc&&ans!==null){const span=document.createElement('span');span.innerHTML=html(q.options[ans]);a.querySelector('.given').append(span)}else a.querySelector('.given').append(ans??'Not answered');a.querySelector('.answer').innerHTML=html(q.answer);a.querySelector('.working').innerHTML=html(q.solution);r.append(a)});$('score').textContent=`Multiple-choice score: ${correct}/${total}. ${manual} written-response questions to self-mark using the worked solutions.`;save()}
$('all').onclick=()=>{$('units').querySelectorAll('input').forEach(x=>x.checked=true);update()};$('none').onclick=()=>{$('units').querySelectorAll('input').forEach(x=>x.checked=false);update()};$('count').oninput=update;$('start').onclick=start;$('prev').onclick=()=>{pos--;show()};$('next').onclick=()=>{pos++;show()};$('finish').onclick=review;$('reset').onclick=()=>{if(confirm('Discard this exam?'))clear()};$('again').onclick=clear;
if(![7,8,9,10].includes(year)){$('notice').textContent='Choose a valid year level.'}else{ $('title').textContent='Year '+year+' Mixed Practice Exam';if(year===10)$('notice').textContent='Currently includes the existing Algebra and Linear Relationships diagnostic banks. More units will be added as Year 10 hubs are developed.';const s=document.createElement('script');s.src='year'+year+'_mixed_bank.js';s.onload=()=>{banks=window.mixedBanks; banks.forEach((b,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=i;c.checked=true;c.onchange=update;l.append(c,` ${b.title} (${b.questions.length})`);$('units').append(l)});update();try{const old=JSON.parse(sessionStorage.getItem(key));if(old?.deck?.length){({deck,responses,pos}=old);old.review?review():show()}}catch(e){}};s.onerror=()=>{$('notice').textContent='Question bank could not load. Please refresh.'};document.head.append(s)}
</script></html>
