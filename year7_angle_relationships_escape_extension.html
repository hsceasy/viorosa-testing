<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Parallel Paradox | Viorosa Maths</title><style>body{margin:0;background:#fff9f4;color:#493843;font:17px system-ui}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(28px,5vw,44px)}.panel,article{background:white;border:1px solid #eadce5;border-radius:18px;padding:18px;margin:14px 0}button,select{font:inherit;padding:9px;border:1px solid #bba4bf;border-radius:9px;background:#f1e6f4;color:#493843;max-width:100%}button{cursor:pointer}svg{display:block;width:100%;max-width:340px;margin:12px auto}svg text{font:13px system-ui;fill:#493843}label{display:block;margin:10px 0}input[type=range]{width:100%}summary{cursor:pointer;color:#74538b}nav a{color:#74538b}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac span:first-child{border-bottom:1px solid} .choices button{display:block;width:100%;margin:10px 0;text-align:left} button:disabled{opacity:.65;cursor:default} progress{width:100%;accent-color:#9875b1} button:focus-visible,a:focus-visible{outline:3px solid #74538b;outline-offset:3px}</style></head><body><main><nav><a href="year7_angle_relationships_hub.html">← Angle Relationships hub</a></nav><p>VIOROSA MATHS · Confidence that grows</p><h1>The Parallel Paradox</h1><p>Restore the geometry laboratory by solving six increasingly challenging locks.</p><section class="panel"><p id="status"></p><progress id="progress" max="6" value="0" aria-label="Locks opened"></progress><h2 id="question" tabindex="-1"></h2><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="hint">Show hint</button> <button id="next" hidden>Next lock</button> <button id="restart">Restart</button></section></main><script>const questions=[["Parallel lines are crossed by a transversal. Corresponding angles are (3x + 7)° and 82°. Find x.", ["25", "30", "23"], 0, "3x + 7 = 82, so x = 25."], ["Alternate interior angles on parallel lines are (2x + 9)° and (5x − 36)°. Find x.", ["9", "15", "45"], 1, "2x + 9 = 5x − 36, so 3x = 45 and x = 15."], ["Co-interior angles on parallel lines are (x + 18)° and (2x + 12)°. Find x.", ["60", "40", "50"], 2, "3x + 30 = 180, so x = 50."], ["An isosceles triangle has a vertex angle of 34°. Find each base angle.", ["73°", "146°", "56°"], 0, "(180 − 34) ÷ 2 = 73°."], ["A quadrilateral has angles x°, (x + 20)°, 100° and 80°. Find x.", ["90", "80", "70"], 1, "2x + 200 = 360, so x = 80."], ["A triangle has an exterior angle of 128°. Its non-adjacent interior angles are x° and (x + 18)°. Find x.", ["64", "46", "55"], 2, "2x + 18 = 128, so x = 55."]];let i=0,solved=false;const $=id=>document.getElementById(id);function render(){solved=false;$('progress').value=i;$('status').textContent=i+' of 6 locks opened';$('feedback').textContent='';$('choices').replaceChildren();$('next').hidden=true;$('hint').hidden=i===6;if(i===6){$('question').textContent='Escape complete! All six locks opened.';$('question').focus();return;}const q=questions[i];$('question').textContent='Lock '+(i+1)+': '+q[0];q[1].forEach((option,j)=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>{if(solved)return;if(j!==q[2]){$('feedback').textContent='Not quite. Try another answer or use the hint.';return;}solved=true;$('progress').value=i+1;$('status').textContent=(i+1)+' of 6 locks opened';$('feedback').textContent='Unlocked! '+q[3];$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('hint').hidden=true;$('next').hidden=false;$('next').textContent=i===5?'Finish escape':'Next lock';$('next').focus();};$('choices').append(b);});$('question').focus();}const hints=["Set corresponding angles equal.", "Set alternate interior angles equal.", "Add the two expressions and equate to 180.", "Subtract the vertex angle from 180, then halve.", "The four interior angles sum to 360°.", "The exterior angle equals the sum of the two non-adjacent interior angles."];$('hint').onclick=()=>{$('feedback').textContent=hints[i];};$('next').onclick=()=>{if(solved){i++;render();}};$('restart').onclick=()=>{i=0;render();};render();</script></body></html>
