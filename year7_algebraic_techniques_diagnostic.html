0%,300px);height:auto;margin:12px 0}</style><main><a href="year7_algebraic_techniques_hub.html">← Algebraic Techniques Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>Algebraic Techniques Diagnostic</h1></header><p>Choose one answer for each of the 16 questions. Submit for a topic-by-topic breakdown.</p><div id="quiz"></div><button id="mark">Mark diagnostic</button><article id="feedback" aria-live="polite"></article></main><script>const bank=[["Write 7 more than twice n.", "2n + 7", ["7n + 2", "2(n + 7)", "7 − 2n"], "Twice n is 2n; add 7.", "Language"], ["What is the coefficient of y in 8 − 6y?", "−6", ["6", "8", "−8"], "Include the negative sign.", "Language"], ["Which expression means p multiplied by itself three times?", "p³", ["3p", "p + 3", "p²"], "Three factors of p give p³.", "Language"], ["Which term is like 9ab?", "−2ab", ["9a", "9b", "9a²b"], "The variable parts must match.", "Language"], ["Simplify 8m − 3m + 2.", "5m + 2", ["5m", "7m", "13m + 2"], "Subtract coefficients of m only.", "Simplifying"], ["Simplify −3a × 4a.", "−12a²", ["12a²", "−12a", "−7a²"], "Multiply coefficients and variable factors.", "Simplifying"], ["Simplify 21t² ÷ 7t, where t ≠ 0.", "3t", ["3t²", "14t", "3"], "Divide coefficients and cancel one t.", "Simplifying"], ["Simplify <span class=\"frac\"><span>2k</span><span>5</span></span> + <span class=\"frac\"><span>k</span><span>5</span></span>.", "<span class=\"frac\"><span>3k</span><span>5</span></span>", ["<span class=\"frac\"><span>3k</span><span>10</span></span>", "<span class=\"frac\"><span>2k²</span><span>5</span></span>", "<span class=\"frac\"><span>k</span><span>5</span></span>"], "Keep the common denominator and add numerators.", "Simplifying"], ["Evaluate 5x − 4 when x = 3.", "11", ["19", "4", "−11"], "5 × 3 − 4 = 11.", "Substitution"], ["Evaluate z² − 1 when z = −5.", "24", ["−26", "−24", "9"], "(−5)² − 1 = 24.", "Substitution"], ["Evaluate 2a − b when a = −2 and b = −7.", "3", ["−11", "11", "−3"], "−4 − (−7) = 3.", "Substitution"], ["A rectangle has sides x + 2 and 5. Find its perimeter when x = 4.", "22", ["11", "30", "20"], "2 × (6 + 5) = 22.", "Substitution"], ["Expand 6(2p − 3).", "12p − 18", ["12p − 3", "12p + 18", "8p − 18"], "Multiply both terms by 6.", "Brackets"], ["Expand −2(3r + 5).", "−6r − 10", ["−6r + 10", "−6r + 5", "6r − 10"], "Multiply both terms by −2.", "Brackets"], ["Factorise fully 15x + 25.", "5(3x + 5)", ["5(3x + 25)", "3(5x + 25)", "5(15x + 5)"], "The highest common factor is 5.", "Brackets"], ["Simplify 3(x + 4) − x.", "2x + 12", ["2x + 4", "3x + 12", "4x + 12"], "Expand to 3x + 12, then subtract x.", "Brackets"]];const picks=[];const root=document.getElementById('quiz');bank.forEach((q,i)=>{let a=document.createElement('article');let h=document.createElement('h3');h.innerHTML=(i+1)+'. '+q[0];a.append(h);let opts=[q[1],...q[2]];opts=opts.slice(i%4).concat(opts.slice(0,i%4));opts.forEach(v=>{let l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=v;r.onchange=()=>picks[i]=v;l.append(r,' ');if(/^\d+\/\d+$/.test(v)){let f=document.createElement('span');f.className='frac';v.split('/').forEach(n=>{let s=document.createElement('span');s.textContent=n;f.append(s)});l.append(f)}else {let s=document.createElement('span');s.innerHTML=v;l.append(s)};a.append(l)});root.append(a)});document.getElementById('mark').onclick=()=>{if(bank.some((q,i)=>picks[i]===undefined)){document.getElementById('feedback').textContent='Please answer every question first.';return}let score=0,groups={};bank.forEach((q,i)=>{let ok=picks[i]===q[1];score+=ok;let g=groups[q[4]]??=[0,0];g[0]+=ok;g[1]++;});let f=document.getElementById('feedback');f.replaceChildren();let h=document.createElement('h2');h.textContent=score+' / '+bank.length;f.append(h);Object.entries(groups).forEach(([k,v])=>{let p=document.createElement('p');p.textContent=k+': '+v.join(' / ');f.append(p)});bank.forEach((q,i)=>{let p=document.createElement('p');p.innerHTML=(i+1)+'. '+(picks[i]===q[1]?'Correct. ':'Review: ')+q[1]+'. '+q[3];f.append(p)});f.scrollIntoView()};</script></html>
