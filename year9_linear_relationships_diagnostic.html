<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear Relationships A Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year9_linear_relationships_hub.html">← Learning hub</a><header><span class="pill">YEAR 9 · DIAGNOSTIC</span><h1>Linear Relationships A</h1><p>Answer all 24 questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"id": "VM-LIN-081", "skill": "Linear equations and substitution", "prompt": "A delivery fee is C = 4d + 90 dollars. Find C when d = 7.", "answer": "118", "solution": "C = 4 × 7 + 90 = 118.", "level": "Intermediate", "source_paragraph": 205, "options": ["118", "117", "119", "120"]}, {"id": "VM-LIN-082", "skill": "Parallel lines", "prompt": "Find the gradient of a line parallel to y = 6x + 9.", "answer": "6", "solution": "Parallel nonvertical lines have equal gradients.", "level": "Intermediate", "source_paragraph": 207, "options": ["7", "5", "8", "6"]}, {"id": "VM-LIN-083", "skill": "Axis-parallel lines", "prompt": "Which equation represents a vertical line through (6, 9)?", "answer": "x = 6", "solution": "Every point on a vertical line has the same x-coordinate.", "level": "Intermediate", "source_paragraph": 209, "options": ["y = 6", "y = 9", "x = 6", "x = 9"]}, {"id": "VM-LIN-084", "skill": "Axis-parallel lines", "prompt": "Give the equation of the horizontal line through (−3, 91).", "answer": "y = 91", "solution": "All points on a horizontal line share the same y-coordinate.", "level": "Intermediate", "source_paragraph": 210, "options": ["y = −3", "x = 91", "x = −3", "y = 91"]}, {"id": "VM-LIN-085", "skill": "Axis-parallel lines", "prompt": "Give the equation of the horizontal line through (−3, 92).", "answer": "y = 92", "solution": "All points on a horizontal line share the same y-coordinate.", "level": "Intermediate", "source_paragraph": 211, "options": ["y = 92", "y = −3", "x = 92", "x = −3"]}, {"id": "VM-LIN-086", "skill": "Distance and right triangles", "prompt": "Find the distance between (7, 10) and (10, 14).", "answer": "5", "solution": "Horizontal change = 3; vertical change = 4. By Pythagoras, √(9 + 16) = 5.", "level": "Intermediate", "source_paragraph": 185, "options": ["4", "7", "6", "5"]}, {"id": "VM-LIN-087", "skill": "Gradient", "prompt": "Find the gradient from (7, 10) to (9, 14).", "answer": "2", "solution": "Rise = 4; run = 2. Divide rise by run to obtain 2.", "level": "Intermediate", "source_paragraph": 187, "options": ["4", "1", "2", "3"]}, {"id": "VM-LIN-088", "skill": "Gradient", "prompt": "A line passes through (−93, 3) and (−91, 195). Find its gradient.", "answer": "96", "solution": "Rise = 192, run = 2, so gradient = 96.", "level": "Intermediate", "source_paragraph": 189, "options": ["98", "97", "95", "96"]}, {"id": "VM-LIN-089", "skill": "Horizontal and vertical gradients", "prompt": "What is the gradient of x = 7?", "answer": "Undefined", "solution": "The horizontal change is zero, so the gradient quotient is undefined.", "level": "Intermediate", "source_paragraph": 191, "options": ["1", "7", "Undefined", "0"]}, {"id": "VM-LIN-090", "skill": "Midpoint", "prompt": "Find the midpoint of (7, 10) and (11, 10).", "answer": "(9, 10)", "solution": "Average the two x-coordinates and the two y-coordinates separately.", "level": "Intermediate", "source_paragraph": 192, "options": ["(9, 10)", "(11, 10)", "(7, 10)", "(9, 11)"]}, {"id": "VM-LIN-091", "skill": "Midpoint", "prompt": "Find the midpoint of (7, 10) and (11, 16).", "answer": "(9, 13)", "solution": "Average the two x-coordinates and the two y-coordinates separately.", "level": "Intermediate", "source_paragraph": 194, "options": ["(7, 13)", "(9, 13)", "(11, 13)", "(9, 14)"]}, {"id": "VM-LIN-092", "skill": "Gradient", "prompt": "A line passes through (−94, 3) and (−92, 197). Find its gradient.", "answer": "97", "solution": "Rise = 194, run = 2, so gradient = 97.", "level": "Intermediate", "source_paragraph": 196, "options": ["96", "97", "99", "98"]}, {"id": "VM-LIN-093", "skill": "Distance and right triangles", "prompt": "A drone moves from (95, −2) to (100, 10). Find the straight-line distance in units.", "answer": "13", "solution": "Horizontal change = 5, vertical change = 12. Distance = √(25 + 144) = 13.", "level": "Intermediate", "source_paragraph": 198, "options": ["12", "13", "15", "14"]}, {"id": "VM-LIN-094", "skill": "Distance and right triangles", "prompt": "A drone moves from (96, −2) to (101, 10). Find the straight-line distance in units.", "answer": "13", "solution": "Horizontal change = 5, vertical change = 12. Distance = √(25 + 144) = 13.", "level": "Intermediate", "source_paragraph": 200, "options": ["14", "13", "12", "15"]}, {"id": "VM-LIN-095", "skill": "Linear equations and substitution", "prompt": "For y = 2x + (3), find y when x = 7.", "answer": "17", "solution": "Substitute x = 7: 2 × 7 + (3) = 17.", "level": "Intermediate", "source_paragraph": 202, "options": ["16", "19", "18", "17"]}, {"id": "VM-LIN-096", "skill": "Linear equations and substitution", "prompt": "A delivery fee is C = 4d + 97 dollars. Find C when d = 7.", "answer": "125", "solution": "C = 4 × 7 + 97 = 125.", "level": "Intermediate", "source_paragraph": 203, "options": ["127", "124", "126", "125"]}, {"id": "VM-LIN-097", "skill": "Intercepts", "prompt": "Find the y-intercept of y = 2x + (7). Give the y-coordinate.", "answer": "7", "solution": "Set x = 0; the constant is the y-coordinate.", "level": "Intermediate", "source_paragraph": 204, "options": ["9", "8", "7", "6"]}, {"id": "VM-LIN-098", "skill": "Linear equations and substitution", "prompt": "A delivery fee is C = 4d + 98 dollars. Find C when d = 7.", "answer": "126", "solution": "C = 4 × 7 + 98 = 126.", "level": "Intermediate", "source_paragraph": 205, "options": ["126", "127", "125", "128"]}, {"id": "VM-LIN-099", "skill": "Parallel lines", "prompt": "Find the gradient of a line parallel to y = 7x + 10.", "answer": "7", "solution": "Parallel nonvertical lines have equal gradients.", "level": "Intermediate", "source_paragraph": 207, "options": ["6", "9", "8", "7"]}, {"id": "VM-LIN-100", "skill": "Axis-parallel lines", "prompt": "Which equation represents a vertical line through (7, 10)?", "answer": "x = 7", "solution": "Every point on a vertical line has the same x-coordinate.", "level": "Intermediate", "source_paragraph": 209, "options": ["y = 10", "y = 7", "x = 7", "x = 10"]}, {"id": "VM-LIN-101", "skill": "Axis-parallel lines", "prompt": "Give the equation of the horizontal line through (−3, 99).", "answer": "y = 99", "solution": "All points on a horizontal line share the same y-coordinate.", "level": "Intermediate", "source_paragraph": 210, "options": ["y = 99", "x = −3", "y = −3", "x = 99"]}, {"id": "VM-LIN-102", "skill": "Axis-parallel lines", "prompt": "Give the equation of the horizontal line through (−3, 100).", "answer": "y = 100", "solution": "All points on a horizontal line share the same y-coordinate.", "level": "Intermediate", "source_paragraph": 211, "options": ["x = 100", "y = 100", "y = −3", "x = −3"]}, {"id": "VM-LIN-103", "skill": "Distance and right triangles", "prompt": "Find the distance between (8, 11) and (11, 15).", "answer": "5", "solution": "Horizontal change = 3; vertical change = 4. By Pythagoras, √(9 + 16) = 5.", "level": "Intermediate", "source_paragraph": 185, "options": ["5", "7", "4", "6"]}, {"id": "VM-LIN-104", "skill": "Gradient", "prompt": "Find the gradient from (8, 11) to (10, 17).", "answer": "3", "solution": "Rise = 6; run = 2. Divide rise by run to obtain 3.", "level": "Intermediate", "source_paragraph": 187, "options": ["3", "2", "5", "4"]}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
