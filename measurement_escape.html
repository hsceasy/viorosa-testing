</head><body><main><a href="year7_measurement_hub.html">← Length, Area and Volume Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>The Measurement Mission</h1><p>Confidence that grows</p></header><p>Unlock six rooms by entering numerical answers in the requested units. Hints are available at every lock.</p><article id="room"><h2 id="progress"></h2><h3 id="name"></h3><p id="question"></p><form id="lock"><label>Numerical code <input id="code" type="number" step="any" required inputmode="decimal"></label><button>Unlock</button> <button type="button" id="help">Show hint</button></form><p id="hint" aria-live="polite"></p><p id="feedback" aria-live="polite"></p><button id="next" hidden>Next room →</button></article><article id="done" hidden><h2>You escaped!</h2><p>All six rooms unlocked.</p><button id="restart">Play again</button></article></main><script>const rooms=[["The supply cabinet", "Convert 3.45 m to centimetres.", 345, "Multiply metres by 100.", "3.45 × 100 = 345 cm."], ["The garden gate", "A rectangular garden is 9 m long and 6 m wide. Find its perimeter in metres.", 30, "Add all four sides.", "2 × (9 + 6) = 30 m."], ["The floor panel", "Convert 0.6 m² to cm².", 6000, "One square metre contains 10,000 square centimetres.", "0.6 × 10,000 = 6000 cm²."], ["The triangular window", "A triangle has base 14 cm and perpendicular height 9 cm. Find its area in cm².", 63, "Halve the product of base and perpendicular height.", "14 × 9 ÷ 2 = 63 cm²."], ["The storage box", "A rectangular prism measures 8 cm by 5 cm by 7 cm. Find its volume in cm³.", 280, "Multiply the three dimensions.", "8 × 5 × 7 = 280 cm³."], ["The water chamber", "A tank contains 3750 mL. Convert this to litres.", 3.75, "Divide by 1000.", "3750 ÷ 1000 = 3.75 L."]];let i=0;const e=id=>document.getElementById(id);function draw(){e('room').hidden=i===rooms.length;e('done').hidden=i!==rooms.length;if(i===rooms.length)return;let r=rooms[i];e('progress').textContent=`Room ${i+1} of ${rooms.length}`;e('name').textContent=r[0];e('question').textContent=r[1];e('code').value='';e('hint').textContent='';e('feedback').textContent='';e('lock').hidden=false;e('next').hidden=true;}e('lock').onsubmit=ev=>{ev.preventDefault();let v=e('code').valueAsNumber;if(!Number.isFinite(v))return;if(Math.abs(v-rooms[i][2])<1e-8){e('feedback').textContent='Unlocked! '+rooms[i][4];e('lock').hidden=true;e('next').hidden=false;e('next').focus()}else e('feedback').textContent='Not quite. Check your calculation and units.'};e('help').onclick=()=>e('hint').textContent=rooms[i][3];e('next').onclick=()=>{i++;draw();if(i<rooms.length)e('code').focus();else e('restart').focus()};e('restart').onclick=()=>{i=0;draw();e('code').focus()};draw();</script></body></html>
