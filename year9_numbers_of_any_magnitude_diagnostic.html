<html lang="en-AU"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Numbers of Any Magnitude Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.h 4", "skill": "Scientific notation calculations", "prompt": "Use a calculator to evaluate (7 × 10<sup>10</sup>) × (2 × 10<sup>-10</sup>). Give an ordinary number.", "answer": "14", "solution": "Multiply coefficients and add the exponents. Answer: 14", "level": "Intermediate", "source_paragraph": 298, "options": ["14", "13", "16", "15"]}, {"id": "VM-MAG-085", "skill": "Metric prefixes", "prompt": "Convert 1000 mm to metres.", "answer": "1", "solution": "Divide millimetres by 1000. Answer: 1", "level": "Intermediate", "source_paragraph": 277, "options": ["2", "3", "1", "0"]}, {"id": "VM-MAG-086", "skill": "Very small units", "prompt": "Convert 2000 micrometres to millimetres.", "answer": "2", "solution": "1000 micrometres = 1 millimetre. Answer: 2", "level": "Intermediate", "source_paragraph": 278, "options": ["3", "4", "2", "1"]}, {"id": "VM-MAG-087", "skill": "Instrument precision", "prompt": "A scale has 8 equal intervals between 0 and 88 mL. Find its smallest division in mL.", "answer": "11", "solution": "Divide 88 by 8. Answer: 11", "level": "Intermediate", "source_paragraph": 281, "options": ["13", "12", "11", "10"]}, {"id": "VM-MAG-088", "skill": "Absolute error", "prompt": "A ruler has divisions of 16 mm. Find the maximum rounding error in mm.", "answer": "8", "solution": "Maximum rounding error is half the smallest division. Answer: 8", "level": "Intermediate", "source_paragraph": 282, "options": ["7", "10", "8", "9"]}, {"id": "VM-MAG-089", "skill": "Percentage error", "prompt": "A measurement of 1100 g has maximum absolute error 8 g. Find percentage error, to 2 decimal places.", "answer": "0.73", "solution": "Calculate 8 ÷ 1100 × 100. Answer: 0.73", "level": "Intermediate", "source_paragraph": 284, "options": ["0.74", "0.72", "0.73", "0.75"]}, {"id": "VM-MAG-090", "skill": "Rounding", "prompt": "Round 2151 to two significant figures.", "answer": "2200", "solution": "Keep the first two significant digits and round using the third. Answer: 2200", "level": "Intermediate", "source_paragraph": 286, "options": ["2199", "2201", "2202", "2200"]}, {"id": "VM-MAG-091", "skill": "Rounding", "prompt": "Round 2170 to two significant figures.", "answer": "2200", "solution": "Keep the first two significant digits and round using the third. Answer: 2200", "level": "Intermediate", "source_paragraph": 287, "options": ["2201", "2202", "2199", "2200"]}, {"id": "VM-MAG-092", "skill": "Intermediate rounding", "prompt": "Calculate 8.47 × 10 without first rounding 8.47 to a whole number.", "answer": "84.7", "solution": "Retain the original precision until the final result. Answer: 84.7", "level": "Intermediate", "source_paragraph": 288, "options": ["85.7", "86.7", "83.7", "84.7"]}, {"id": "VM-MAG-093", "skill": "Scientific notation", "prompt": "Write 82,300,000,000,000 in scientific notation.", "answer": "8.23 × 10<sup>13</sup>", "solution": "Move the decimal point until the coefficient is between 1 and 10. Answer: 8.23 × 10<sup>13</sup>", "level": "Intermediate", "source_paragraph": 290, "options": ["8.23 × 10<sup>12</sup>", "8.23 × 10<sup>-13</sup>", "8.23 × 10<sup>13</sup>", "8.23 × 10<sup>14</sup>"]}, {"id": "VM-MAG-094", "skill": "Scientific notation", "prompt": "Write 106,000,000 in scientific notation.", "answer": "1.06 × 10<sup>8</sup>", "solution": "Move the decimal 8 places left to obtain 1.06.", "level": "Intermediate", "source_paragraph": 292, "options": ["1.06 × 10<sup>8</sup>", "1.06 × 10<sup>7</sup>", "1.06 × 10<sup>−8</sup>", "1.06 × 10<sup>9</sup>"]}, {"id": "VM-MAG-095", "skill": "Ordering scientific notation", "prompt": "Which is greater: 8 × 10<sup>11</sup> or 9 × 10<sup>10</sup>?", "answer": "8 × 10<sup>11</sup>", "solution": "Compare powers of ten first. Answer: 8 × 10<sup>11</sup>", "level": "Intermediate", "source_paragraph": 293, "options": ["Equal", "9 × 10<sup>10</sup>", "8 × 10<sup>11</sup>", "Cannot determine"]}, {"id": "VM-MAG-096", "skill": "Decimal notation", "prompt": "Write 8.5 × 10<sup>-11</sup> as a decimal.", "answer": "0.000000000085", "solution": "Move the decimal point 11 places left. Answer: 0.000000000085", "level": "Intermediate", "source_paragraph": 295, "options": ["0.000000000085", "0.01000000009", "0.02000000009", "-0.009999999915"]}, {"id": "VM-MAG-097", "skill": "Scientific notation calculations", "prompt": "Estimate (8 × 10<sup>11</sup>) × (2 × 10<sup>-9</sup>) using index laws.", "answer": "1600", "solution": "Multiply coefficients and add the exponents. Answer: 1600", "level": "Intermediate", "source_paragraph": 296, "options": ["1602", "1599", "1601", "1600"]}, {"id": "VM-MAG-098", "skill": "Scientific notation calculations", "prompt": "Use a calculator to evaluate (8 × 10<sup>11</sup>) × (2 × 10<sup>-11</sup>). Give an ordinary number.", "answer": "16", "solution": "Multiply coefficients and add the exponents. Answer: 16", "level": "Intermediate", "source_paragraph": 298, "options": ["17", "18", "16", "15"]}, {"id": "VM-MAG-099", "skill": "Metric prefixes", "prompt": "Convert 1125 mm to metres.", "answer": "1.125", "solution": "Divide millimetres by 1000. Answer: 1.125", "level": "Intermediate", "source_paragraph": 277, "options": ["1.125", "0.125", "3.125", "2.125"]}, {"id": "VM-MAG-100", "skill": "Very small units", "prompt": "Convert 2250 micrometres to millimetres.", "answer": "2.25", "solution": "1000 micrometres = 1 millimetre. Answer: 2.25", "level": "Intermediate", "source_paragraph": 278, "options": ["2.25", "3.25", "1.25", "4.25"]}, {"id": "VM-MAG-101", "skill": "Instrument precision", "prompt": "A scale has 9 equal intervals between 0 and 108 mL. Find its smallest division in mL.", "answer": "12", "solution": "Divide 108 by 9. Answer: 12", "level": "Intermediate", "source_paragraph": 281, "options": ["14", "13", "11", "12"]}, {"id": "VM-MAG-102", "skill": "Absolute error", "prompt": "A ruler has divisions of 18 mm. Find the maximum rounding error in mm.", "answer": "9", "solution": "Maximum rounding error is half the smallest division. Answer: 9", "level": "Intermediate", "source_paragraph": 282, "options": ["9", "11", "8", "10"]}, {"id": "VM-MAG-103", "skill": "Percentage error", "prompt": "A measurement of 1200 g has maximum absolute error 9 g. Find percentage error, to 2 decimal places.", "answer": "0.75", "solution": "Calculate 9 ÷ 1200 × 100. Answer: 0.75", "level": "Intermediate", "source_paragraph": 284, "options": ["0.74", "0.75", "0.77", "0.76"]}, {"id": "VM-MAG-104", "skill": "Rounding", "prompt": "Round 2288 to two significant figures.", "answer": "2300", "solution": "Keep the first two significant digits and round using the third. Answer: 2300", "level": "Intermediate", "source_paragraph": 286, "options": ["2300", "2301", "2299", "2302"]}, {"skill": "Metric prefixes", "kind": "Fluency", "prompt": "Convert 7 mm to metres.", "answer": "0.007 m", "options": ["0.007 m", "0.07 m", "7 m", "7000 m"], "solution": "7 × 0.001<br>= 0.007 m", "id": "Y9-numbers_of_any_magnitude-25", "level": "s5"}, {"skill": "Large and small measurements", "kind": "Fluency", "prompt": "Convert 3 GW to watts.", "answer": "3000000000 W", "options": ["3000000000 W", "3000 W", "3000000 W", "0.000000003 W"], "solution": "3 × 10⁹ W<br>= 3000000000 W", "id": "Y9-numbers_of_any_magnitude-26", "level": "s5"}, {"skill": "Instrument precision", "kind": "Fluency", "prompt": "A scale has 5 equal intervals from 0 to 10 g. Find resolution.", "answer": "2 g", "options": ["2 g", "5 g", "10 g", "0.5 g"], "solution": "<span class=\"frac\"><span>10</span><span>5</span></span><br>= 2 g", "id": "Y9-numbers_of_any_magnitude-27", "level": "s5"}, {"skill": "Absolute error", "kind": "Fluency", "prompt": "Find maximum error for nearest 2 g.", "answer": "1 g", "options": ["1 g", "2 g", "4 g", "0.5 g"], "solution": "Error = <span class=\"frac\"><span>2</span><span>2</span></span><br>= 1 g", "id": "Y9-numbers_of_any_magnitude-28", "level": "s5"}, {"skill": "Significant figures", "kind": "Fluency", "prompt": "Round 5836 to 2 significant figures.", "answer": "5800", "options": ["5800", "5900", "5830", "580"], "solution": "First two digits: 5, 8<br>Next digit = 3, keep 8<br>≈ 5800", "id": "Y9-numbers_of_any_magnitude-29", "level": "s5"}, {"skill": "Scientific notation", "kind": "Fluency", "prompt": "Write 7200000 in scientific notation.", "answer": "7.2 × 10⁶", "options": ["7.2 × 10⁶", "7.2 × 10⁵", "72 × 10⁶", "7.2 × 10⁻⁶"], "solution": "7200000 = 7.2 × 1000000<br>= 7.2 × 10⁶", "id": "Y9-numbers_of_any_magnitude-30", "level": "s5"}, {"skill": "Ordering scientific notation", "kind": "Fluency", "prompt": "Which is larger: 9 × 10⁻⁴ or 2 × 10⁻³?", "answer": "2 × 10⁻³", "options": ["2 × 10⁻³", "9 × 10⁻⁴", "Equal", "Neither"], "solution": "0.0009 < 0.002<br>2 × 10⁻³ is larger.", "id": "Y9-numbers_of_any_magnitude-31", "level": "s5"}, {"skill": "Scientific notation calculations", "kind": "Fluency", "prompt": "Calculate (8 × 10⁶) ÷ (4 × 10²).", "answer": "2 × 10⁴", "options": ["2 × 10⁴", "2 × 10⁸", "4 × 10⁴", "2 × 10⁻⁴"], "solution": "= <span class=\"frac\"><span>8</span><span>4</span></span> × 10^(6 − 2)<br>= 2 × 10⁴", "id": "Y9-numbers_of_any_magnitude-32", "level": "s5"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
