 "VM-PRO-009", "topic": "Language of probability", "section": "practice", "question": "A bag contains 2 red and 4 blue counters. How many red counters must be added to make both colours equally likely?", "answer": "2", "solution": "Red needs 4 counters. Add 4 − 2 = 2.", "difficulty": "intermediate"}, {"id": "VM-PRO-010", "topic": "Language of probability", "section": "practice", "question": "A bag contains 3 red and 7 blue counters. How many red counters must be added to make both colours equally likely?", "answer": "4", "solution": "Red needs 7 counters. Add 7 − 3 = 4.", "difficulty": "intermediate"}, {"id": "VM-PRO-011", "topic": "Language of probability", "section": "practice", "question": "A bag contains 4 red and 10 blue counters. How many red counters must be added to make both colours equally likely?", "answer": "6", "solution": "Red needs 10 counters. Add 10 − 4 = 6.", "difficulty": "intermediate"}, {"id": "VM-PRO-012", "topic": "Language of probability", "section": "practice", "question": "A bag contains 5 red and 13 blue counters. How many red counters must be added to make both colours equally likely?", "answer": "8", "solution": "Red needs 13 counters. Add 13 − 5 = 8.", "difficulty": "intermediate"}, {"id": "VM-PRO-013", "topic": "Language of probability", "section": "practice", "question": "A bag contains 2 red and 4 blue counters. What is the minimum number of red counters that must be added to make red more likely than blue?", "answer": "3", "solution": "Red needs 5 counters. Add 5 − 2 = 3.", "difficulty": "advanced"}, {"id": "VM-PRO-014", "topic": "Language of probability", "section": "practice", "question": "A bag contains 3 red and 7 blue counters. What is the minimum number of red counters that must be added to make red more likely than blue?", "answer": "5", "solution": "Red needs 8 counters. Add 8 − 3 = 5.", "difficulty": "advanced"}, {"id": "VM-PRO-015", "topic": "Language of probability", "section": "practice", "question": "A bag contains 4 red and 10 blue counters. What is the minimum number of red counters that must be added to make red more likely than blue?", "answer": "7", "solution": "Red needs 11 counters. Add 11 − 4 = 7.", "difficulty": "advanced"}, {"id": "VM-PRO-016", "topic": "Language of probability", "section": "practice", "question": "A bag contains 5 red and 13 blue counters. What is the minimum number of red counters that must be added to make red more likely than blue?", "answer": "9", "solution": "Red needs 14 counters. Add 14 − 5 = 9.", "difficulty": "advanced"}, {"id": "VM-PRO-017", "topic": "Language of probability", "section": "spot_the_mistake", "question": "A bag contains 21 red counters only. Describe drawing a red counter. A student calls the event likely but not certain. Explain the error and give the correct answer.", "answer": "Certain", "solution": "Likely allows a chance of failure. Every counter is red, so P(red) = 21/21 = 1. The event is certain."}, {"id": "VM-PRO-018", "topic": "Language of probability", "section": "spot_the_mistake", "question": "A bag contains 11 blue counters only. Describe drawing a red counter. A student calls the event unlikely but possible. Explain the error and give the correct answer.", "answer": "Impossible", "solution": "Unlikely means a small but positive probability. There are no red counters, so P(red) = 0/11 = 0. The event is impossible."}, {"id": "VM-PRO-019", "topic": "Language of probability", "section": "spot_the_mistake", "question": "A bag contains 2 red and 2 blue counters. Describe drawing red. A student calls red more likely because red is listed first. Explain the error and give the correct answer.", "answer": "Even chance", "solution": "Listing order does not affect probability. P(red) = 2/4 = 1/2, so red has an even chance."}, {"id": "VM-PRO-020", "topic": "Language of probability", "section": "spot_the_mistake", "question": "A bag contains 15 red and 16 blue counters. Which colour is more likely? A student claims both colours are equally likely because there are two colours. Explain the error and give the correct answer.", "answer": "Blue", "solution": "Two colours need not have equal probabilities. There are 31 counters: P(red) = 15/31 and P(blue) = 16/31. Blue is more likely."}, {"id": "VM-PRO-021", "topic": "Language of probability", "section": "challenge", "question": "A bag contains 5 red and 9 blue counters. How many blue counters must be removed to make red and blue equally likely?", "answer": "4", "solution": "Equal likelihood requires 5 of each colour. Remove 9 − 5 = 4 blue counters."}, {"id": "VM-PRO-022", "topic": "Language of probability", "section": "challenge", "question": "A fair die is rolled. How many faces must be labelled with a star for a star to be more likely than no star? Give the minimum.", "answer": "4", "solution": "Half of 6 is 3. More than half requires at least 4 faces."}, {"id": "VM-PRO-023", "topic": "Language of probability", "section": "challenge", "question": "A box contains 12 tickets. Winning is impossible. How many tickets must be replaced with winning tickets to make winning certain?", "answer": "12", "solution": "Every ticket must be a winner for certainty, so replace all 12."}, {"id": "VM-PRO-024", "topic": "Language of probability", "section": "challenge", "question": "A spinner has 15 equal sectors. What is the minimum number of purple sectors needed for purple to be more likely than not purple?", "answer": "8", "solution": "Half of 15 is 7.5. The smallest whole number greater than 7.5 is 8."}, {"id": "VM-PRO-025", "topic": "Language of probability", "section": "challenge", "question": "A bag contains 4 green and 10 orange counters. How many green counters must be added to make both colours equally likely?", "answer": "6", "solution": "There must be 10 green counters. Add 10 − 4 = 6."}, {"id": "VM-PRO-026", "topic": "Language of probability", "section": "challenge", "question": "A spinner has 18 equal sectors, including 5 blue sectors. How many non-blue sectors must be recoloured blue to make blue and not blue equally likely?", "answer": "4", "solution": "Half of 18 is 9. Recolour 9 − 5 = 4 sectors."}, {"id": "VM-PRO-027", "topic": "Language of probability", "section": "challenge", "question": "A box contains 3 winning and 12 losing tickets. How many losing tickets must be replaced with winning tickets to make winning certain?", "answer": "12", "solution": "All 12 losing tickets must be replaced."}, {"id": "VM-PRO-028", "topic": "Language of probability", "section": "challenge", "question": "A bag contains 7 black and 2 white counters. What is the minimum number of white counters to add to make white more likely than black?", "answer": "6", "solution": "White must have at least 8 counters to exceed 7 black counters. Add 8 − 2 = 6."}, {"id": "VM-PRO-029", "topic": "Language of probability", "section": "challenge", "question": "A spinner has 24 equal sectors, 18 of which are red. How many red sectors must be recoloured blue to make red and not red equally likely?", "answer": "6", "solution": "Half of 24 is 12. Recolour 18 − 12 = 6 red sectors."}, {"id": "VM-PRO-030", "topic": "Language of probability", "section": "challenge", "question": "A bag contains 11 yellow and 5 purple counters. How many yellow counters must be replaced with purple counters to make the colours equally likely?", "answer": "3", "solution": "Each colour needs 8 counters. Replacing 11 − 8 = 3 yellow counters gives 8 of each."}, {"id": "VM-PRO-031", "topic": "Language of probability", "section": "escape_core", "question": "A bag contains 29 red counters only. Describe drawing a red counter.", "answer": "Certain", "solution": "Every counter is red."}, {"id": "VM-PRO-032", "topic": "Language of probability", "section": "escape_extension", "question": "A bag contains 7 green and 11 yellow counters. What is the minimum number of green counters to add so that drawing green is more likely than drawing yellow?", "answer": "5", "solution": "Green must outnumber yellow. The smallest possible green count is 12, so add 12 − 7 = 5."}, {"id": "VM-PRO-033", "topic": "Sample spaces", "section": "worked_example", "question": "A spinner has sectors A, B and C. A coin is tossed. List all ordered outcomes, spinner first.", "answer": "AH, AT, BH, BT, CH, CT", "solution": "Pair each letter with H and T: AH, AT, BH, BT, CH, CT. There are 3 × 2 = 6 outcomes."}, {"id": "VM-PRO-034", "topic": "Sample spaces", "section": "worked_example", "question": "A bag contains red, blue and green counters. One counter is drawn and its colour recorded. List the sample space.", "answer": "red, blue, green", "solution": "The recorded outcome is a colour, so the sample space contains red, blue and green."}, {"id": "VM-PRO-035", "topic": "Sample spaces", "section": "worked_example", "question": "A café offers 4 mains and 3 desserts. How many main–dessert pairs are possible?", "answer": "12", "solution": "Each of the 4 mains can be paired with each of the 3 desserts: 4 × 3 = 12."}, {"id": "VM-PRO-036", "topic": "Sample spaces", "section": "worked_example", "question": "A standard six-sided die is rolled. List the outcomes greater than 3.", "answer": "4, 5, 6", "solution": "The sample space is 1, 2, 3, 4, 5, 6. Only 4, 5 and 6 exceed 3."}, {"id": "VM-PRO-037", "topic": "Sample spaces", "section": "practice", "question": "A student has 3 shirts and 2 pairs of shorts. How many outfits with one of each are possible?", "answer": "6", "solution": "3 × 2 = 6 outfits.", "difficulty": "foundation"}, {"id": "VM-PRO-038", "topic": "Sample spaces", "section": "practice", "question": "A traffic light is observed and its colour recorded. List the three possible colours.", "answer": "red, amber, green", "solution": "The possible colours are red, amber and green.", "difficulty": "foundation"}, {"id": "VM-PRO-039", "topic": "Sample spaces", "section": "practice", "question": "A café offers 5 sandwiches and 2 drinks. How many sandwich–drink pairs are possible?", "answer": "10", "solution": "5 × 2 = 10 pairs.", "difficulty": "foundation"}, {"id": "VM-PRO-040", "topic": "Sample spaces", "section": "practice", "question": "A standard die is rolled. How many outcomes are odd?", "answer": "3", "solution": "The odd outcomes are 1, 3 and 5, giving 3 outcomes.", "difficulty": "foundation"}, {"id": "VM-PRO-041", "topic": "Sample spaces", "section": "practice", "question": "Two coins are tossed. List the ordered outcomes using H and T.", "answer": "HH, HT, TH, TT", "solution": "Pair each first toss with each second toss: HH, HT, TH, TT.", "difficulty": "intermediate"}, {"id": "VM-PRO-042", "topic": "Sample spaces", "section": "practice", "question": "A spinner labelled A, B, C is spun twice. How many ordered outcomes are possible?", "answer": "9", "solution": "Each first result has 3 possible second results: 3 × 3 = 9.", "difficulty": "intermediate"}, {"id": "VM-PRO-043", "topic": "Sample spaces", "section": "practice", "question": "A lunch consists of one of 3 mains, one of 2 drinks and one of 2 fruits. How many lunches are possible?", "answer": "12", "solution": "3 × 2 × 2 = 12.", "difficulty": "intermediate"}, {"id": "VM-PRO-044", "topic": "Sample spaces", "section": "practice", "question": "Two standard dice are rolled. How many ordered outcomes have a sum of 5?", "answer": "4", "solution": "The pairs are (1,4), (2,3), (3,2), (4,1): 4 outcomes.", "difficulty": "intermediate"}, {"id": "VM-PRO-045", "topic": "Sample spaces", "section": "practice", "question": "A code uses two different letters chosen from A, B, C, D. How many ordered codes are possible?", "answer": "12", "solution": "There are 4 first-letter choices and 3 remaining second-letter choices: 4 × 3 = 12.", "difficulty": "advanced"}, {"id": "VM-PRO-046", "topic": "Sample spaces", "section": "practice", "question": "Two standard dice are rolled. How many ordered outcomes have matching numbers?", "answer": "6", "solution": "The matching pairs are (1,1) through (6,6), so there are 6.", "difficulty": "advanced"}, {"id": "VM-PRO-047", "topic": "Sample spaces", "section": "practice", "question": "A spinner labelled 1, 2, 3, 4 is spun twice. How many ordered outcomes have a second number larger than the first?", "answer": "6", "solution": "For first results 1, 2, 3, 4 there are respectively 3, 2, 1, 0 choices. Total = 6.", "difficulty": "advanced"}, {"id": "VM-PRO-048", "topic": "Sample spaces", "section": "practice", "question": "Three coins are tossed. How many ordered outcomes contain exactly two heads?", "answer": "3", "solution": "The outcomes are HHT, HTH and THH: 3 outcomes.", "difficulty": "advanced"}, {"id": "VM-PRO-049", "topic": "Sample spaces", "section": "spot_the_mistake", "question": "A spinner has 4 sectors and a coin has 2 sides. A student adds 4 and 2 to get 6 combined outcomes. Give the correct number.", "answer": "8", "solution": "Each spinner result can occur with either coin result. Multiply rather than add: 4 × 2 = 8."}, {"id": "VM-PRO-050", "topic": "Sample spaces", "section": "spot_the_mistake", "question": "A spinner is labelled A, B, C. A student lists A, B, C, D as the sample space. Give the correct sample space.", "answer": "A, B, C", "solution": "D cannot occur because it is not on the spinner. Only A, B and C belong in the sample space."}, {"id": "VM-PRO-051", "topic": "Sample spaces", "section": "spot_the_mistake", "question": "A menu offers 3 mains and 4 desserts. A student claims there are 7 pairs. Give the correct number.", "answer": "12", "solution": "Adding counts individual dishes, not pairs. Each main has 4 dessert choices: 3 × 4 = 12."}, {"id": "VM-PRO-052", "topic": "Sample spaces", "section": "spot_the_mistake", "question": "A standard die is rolled. A student counts 3, 4, 5, 6 as outcomes greater than 3. Give the correct number of outcomes.", "answer": "3", "solution": "Greater than excludes equality. Only 4, 5 and 6 qualify."}, {"id": "VM-PRO-053", "topic": "Sample spaces", "section": "challenge", "question": "Two standard dice are rolled. How many ordered outcomes have a sum of 9 or 10?", "answer": "7", "solution": "Sum 9: (3,6), (4,5), (5,4), (6,3). Sum 10: (4,6), (5,5), (6,4). Total = 7."}, {"id": "VM-PRO-054", "topic": "Sample spaces", "section": "challenge", "question": "A code contains three different letters chosen from A, B, C, D, E. How many codes are possible?", "answer": "60", "solution": "There are 5, then 4, then 3 choices: 5 × 4 × 3 = 60."}, {"id": "VM-PRO-055", "topic": "Sample spaces", "section": "challenge", "question": "Three coins are tossed. How many ordered outcomes contain at least one tail?", "answer": "7", "solution": "There are 2 × 2 × 2 = 8 outcomes. Only HHH has no tails, leaving 7."}, {"id": "VM-PRO-056", "topic": "Sample spaces", "section": "challenge", "question": "A café offers 4 mains, 3 drinks and 2 desserts. One main cannot be paired with either dessert. How many three-item meals remain?", "answer": "18", "solution": "There are 4 × 3 × 2 = 24 unrestricted meals. Exclude 1 × 3 × 2 = 6. Remaining = 18."}, {"id": "VM-PRO-057", "topic": "Sample spaces", "section": "challenge", "question": "A spinner labelled 1 to 5 is spun twice. How many ordered outcomes have a sum less than 5?", "answer": "6", "solution": "Sums 2, 3 and 4 have respectively 1, 2 and 3 ordered outcomes. Total = 6."}, {"id": "VM-PRO-058", "topic": "Sample spaces", "section": "challenge", "question": "A two-digit code uses digits 0 to 4, with repetition allowed and leading zeros permitted. How many codes contain exactly one zero?", "answer": "8", "solution": "Zero can be first or second. The non-zero digit has 4 choices (1, 2, 3 or 4). Number of codes = 2 × 4 = 8."}, {"id": "VM-PRO-059", "topic": "Sample spaces", "section": "challenge", "question": "Two standard dice are rolled. How many ordered outcomes have an even sum?", "answer": "18", "solution": "Both dice must be odd or both even. There are 3 × 3 + 3 × 3 = 18 outcomes."}, {"id": "VM-PRO-060", "topic": "Sample spaces", "section": "challenge", "question": "A student chooses two different books from 5 books. Order does not matter. How many pairs are possible?", "answer": "10", "solution": "There are 5 × 4 = 20 ordered choices. Each unordered pair is counted twice, so 20 ÷ 2 = 10."}, {"id": "VM-PRO-061", "topic": "Sample spaces", "section": "challenge", "question": "A spinner has sectors A, B, C, D. It is spun twice. How many ordered outcomes contain A at least once?", "answer": "7", "solution": "There are 16 total outcomes and 3 × 3 = 9 without A. Thus 16 − 9 = 7."}, {"id": "VM-PRO-062", "topic": "Sample spaces", "section": "challenge", "question": "A code has two letters followed by a digit. Letters are chosen from A, B, C without repetition, and the digit is 1, 2, 3 or 4. How many codes are possible?", "answer": "24", "solution": "3 choices for the first letter, 2 for the second and 4 for the digit: 3 × 2 × 4 = 24."}, {"id": "VM-PRO-063", "topic": "Sample spaces", "section": "escape_core", "question": "A lock uses one of 4 letters followed by one of 3 digits. How many codes are possible?", "answer": "12", "solution": "4 × 3 = 12 codes."}, {"id": "VM-PRO-064", "topic": "Sample spaces", "section": "escape_extension", "question": "A fair six-sided die and a coin are used together. Outcomes with an even die number and tails are excluded. How many ordered outcomes remain?", "answer": "9", "solution": "There are 6 × 2 = 12 ordered outcomes. Three even numbers can occur with tails, so 12 − 3 = 9 remain."}, {"id": "VM-PRO-065", "topic": "Theoretical probability", "section": "worked_example", "question": "A bag contains 2 red and 3 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{2}{5}\\)", "solution": "There are 2 favourable outcomes out of 5. Simplify to \\(\\frac{2}{5}\\)."}, {"id": "VM-PRO-066", "topic": "Theoretical probability", "section": "worked_example", "question": "A bag contains 7 red and 2 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{7}{9}\\)", "solution": "There are 7 favourable outcomes out of 9. Simplify to \\(\\frac{7}{9}\\)."}, {"id": "VM-PRO-067", "topic": "Theoretical probability", "section": "worked_example", "question": "A bag contains 12 red and 1 blue counter. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{12}{13}\\)", "solution": "There are 12 favourable outcomes out of 13. Simplify to \\(\\frac{12}{13}\\)."}, {"id": "VM-PRO-068", "topic": "Theoretical probability", "section": "worked_example", "question": "A bag contains 8 red and 3 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{8}{11}\\)", "solution": "There are 8 favourable outcomes out of 11. Simplify to \\(\\frac{8}{11}\\)."}, {"id": "VM-PRO-069", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 2 red and 23 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{2}{25}\\)", "solution": "There are 2 favourable outcomes out of 25. Simplify to \\(\\frac{2}{25}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-070", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 3 red and 15 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{1}{6}\\)", "solution": "There are 3 favourable outcomes out of 18. Simplify to \\(\\frac{1}{6}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-071", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 17 red and 5 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{17}{22}\\)", "solution": "There are 17 favourable outcomes out of 22. Simplify to \\(\\frac{17}{22}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-072", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 10 red and 8 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{5}{9}\\)", "solution": "There are 10 favourable outcomes out of 18. Simplify to \\(\\frac{5}{9}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-073", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 2 red, 3 blue and 4 green counters. One is drawn at random. Find the probability of red or green.", "answer": "2/3", "solution": "There are 6 favourable counters out of 9. Probability = 6/9 = 2/3.", "difficulty": "intermediate"}, {"id": "VM-PRO-074", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 3 red, 5 blue and 5 green counters. One is drawn at random. Find the probability of red or green.", "answer": "8/13", "solution": "There are 8 favourable counters out of 13. Probability = 8/13 = 8/13.", "difficulty": "intermediate"}, {"id": "VM-PRO-075", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 4 red, 7 blue and 6 green counters. One is drawn at random. Find the probability of red or green.", "answer": "10/17", "solution": "There are 10 favourable counters out of 17. Probability = 10/17 = 10/17.", "difficulty": "intermediate"}, {"id": "VM-PRO-076", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 5 red, 9 blue and 7 green counters. One is drawn at random. Find the probability of red or green.", "answer": "4/7", "solution": "There are 12 favourable counters out of 21. Probability = 12/21 = 4/7.", "difficulty": "intermediate"}, {"id": "VM-PRO-077", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 2 red and 4 blue counters. How many red counters must be added so that the probability of red is 1/2?", "answer": "2", "solution": "For probability 1/2 the counts must match. Add 4 − 2 = 2 red counters.", "difficulty": "advanced"}, {"id": "VM-PRO-078", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 3 red and 6 blue counters. How many red counters must be added so that the probability of red is 1/2?", "answer": "3", "solution": "For probability 1/2 the counts must match. Add 6 − 3 = 3 red counters.", "difficulty": "advanced"}, {"id": "VM-PRO-079", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 4 red and 8 blue counters. How many red counters must be added so that the probability of red is 1/2?", "answer": "4", "solution": "For probability 1/2 the counts must match. Add 8 − 4 = 4 red counters.", "difficulty": "advanced"}, {"id": "VM-PRO-080", "topic": "Theoretical probability", "section": "practice", "question": "A bag contains 5 red and 10 blue counters. How many red counters must be added so that the probability of red is 1/2?", "answer": "5", "solution": "For probability 1/2 the counts must match. Add 10 − 5 = 5 red counters.", "difficulty": "advanced"}, {"id": "VM-PRO-081", "topic": "Theoretical probability", "section": "spot_the_mistake", "question": "A bag contains 1 red and 9 blue counters. One is selected uniformly at random. Find P(red). A student uses blue counters as favourable outcomes. Explain the error and give the correct answer.", "answer": "\\(\\frac{1}{10}\\)", "solution": "Favourable outcomes must match the event red, not blue. There is 1 red counter out of 10, so P(red) = 1/10."}, {"id": "VM-PRO-082", "topic": "Theoretical probability", "section": "spot_the_mistake", "question": "A bag contains 22 red and 1 blue counter. One is selected uniformly at random. Find P(red). A student uses blue counters as favourable outcomes. Explain the error and give the correct answer.", "answer": "\\(\\frac{22}{23}\\)", "solution": "The event is red, so blue is not favourable. P(red) = 22/(22 + 1) = 22/23."}, {"id": "VM-PRO-083", "topic": "Theoretical probability", "section": "spot_the_mistake", "question": "A bag contains 5 red and 6 blue counters. One is selected uniformly at random. Find P(red). A student uses blue counters as favourable outcomes. Explain the error and give the correct answer.", "answer": "\\(\\frac{5}{11}\\)", "solution": "Count red counters in the numerator and all counters in the denominator. P(red) = 5/11."}, {"id": "VM-PRO-084", "topic": "Theoretical probability", "section": "spot_the_mistake", "question": "A bag contains 3 red and 4 blue counters. One is selected uniformly at random. Find P(red). A student uses blue counters as favourable outcomes. Explain the error and give the correct answer.", "answer": "\\(\\frac{3}{7}\\)", "solution": "Blue counters belong in the total but not the favourable count. P(red) = 3/7."}, {"id": "VM-PRO-085", "topic": "Theoretical probability", "section": "challenge", "question": "A bag contains 6 red counters and some blue counters. The probability of red is 2/5. How many blue counters are there?", "answer": "9", "solution": "6 ÷ (2/5) = 15 counters in total. 15 − 6 = 9 blue counters."}, {"id": "VM-PRO-086", "topic": "Theoretical probability", "section": "challenge", "question": "A fair 12-sided die is numbered 1 to 12. What is the probability of rolling a multiple of 3 or 4?", "answer": "1/2", "solution": "The favourable outcomes are 3, 4, 6, 8, 9 and 12. Count 12 only once. P = 6/12 = 1/2."}, {"id": "VM-PRO-087", "topic": "Theoretical probability", "section": "challenge", "question": "A box has 8 winning and 12 losing tickets. Four losing tickets are removed. Find the new probability of winning.", "answer": "1/2", "solution": "There are 20 − 4 = 16 tickets left, including 8 winners. P = 8/16 = 1/2."}, {"id": "VM-PRO-088", "topic": "Theoretical probability", "section": "challenge", "question": "A spinner has 24 equal sectors. The probability of green is 3/8. How many green sectors must be recoloured red to make the probability of green 1/4?", "answer": "3", "solution": "Initially 24 × 3/8 = 9 green sectors. The target is 24 × 1/4 = 6. Recolour 9 − 6 = 3."}, {"id": "VM-PRO-089", "topic": "Theoretical probability", "section": "challenge", "question": "A bag contains 5 red, 7 blue and 8 green counters. One counter is drawn at random. Find the probability of red or green.", "answer": "13/20", "solution": "There are 5 + 8 = 13 favourable counters out of 20. P = 13/20."}, {"id": "VM-PRO-090", "topic": "Theoretical probability", "section": "challenge", "question": "A box has 30 tickets, of which 12 win. How many losing tickets must be replaced by winning tickets to make the probability of winning 3/5?", "answer": "6", "solution": "The total stays 30. The target is 30 × 3/5 = 18 winners. Replace 18 − 12 = 6 tickets."}, {"id": "VM-PRO-091", "topic": "Theoretical probability", "section": "challenge", "question": "Two fair coins are tossed. Find the probability of at least one head.", "answer": "3/4", "solution": "The equally likely outcomes are HH, HT, TH and TT. Three contain at least one head. P = 3/4."}, {"id": "VM-PRO-092", "topic": "Theoretical probability", "section": "challenge", "question": "A bag contains 4 red and 6 blue counters. How many red counters must be added to make the probability of blue 1/3?", "answer": "8", "solution": "Six blue counters must be one-third of the new total, so the total is 18. Add 18 − 10 = 8 red counters."}, {"id": "VM-PRO-093", "topic": "Theoretical probability", "section": "challenge", "question": "A fair die is rolled and a fair coin tossed. Find the probability of an even number and heads.", "answer": "1/4", "solution": "There are 6 × 2 = 12 equally likely pairs. The favourable pairs are 2H, 4H and 6H. P = 3/12 = 1/4."}, {"id": "VM-PRO-094", "topic": "Theoretical probability", "section": "challenge", "question": "A spinner has 20 equal sectors. Five are blue and seven are red. The rest are yellow. Find the probability of yellow or blue.", "answer": "13/20", "solution": "Yellow sectors: 20 − 5 − 7 = 8. Favourable sectors: 8 + 5 = 13. P = 13/20."}, {"id": "VM-PRO-095", "topic": "Theoretical probability", "section": "escape_core", "question": "A bag contains 14 red and 1 blue counter. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{14}{15}\\)", "solution": "There are 14 favourable outcomes out of 15. Simplify to \\(\\frac{14}{15}\\)."}, {"id": "VM-PRO-096", "topic": "Theoretical probability", "section": "escape_extension", "question": "A bag contains 6 red and 9 blue counters. How many red counters must be added so that the probability of red is exactly 1/2?", "answer": "3", "solution": "For probability 1/2, red and blue counts must be equal. Add 9 − 6 = 3 red counters."}, {"id": "VM-PRO-097", "topic": "Complementary events", "section": "worked_example", "question": "A bag contains 1 red and 21 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{21}{22}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 1/22 = 21/22."}, {"id": "VM-PRO-098", "topic": "Complementary events", "section": "worked_example", "question": "A bag contains 3 red and 2 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{2}{5}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 3/5 = 2/5."}, {"id": "VM-PRO-099", "topic": "Complementary events", "section": "worked_example", "question": "A bag contains 5 red and 1 blue counter. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{1}{6}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 5/6 = 1/6."}, {"id": "VM-PRO-100", "topic": "Complementary events", "section": "worked_example", "question": "A bag contains 7 red and 6 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{6}{13}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 7/13 = 6/13."}, {"id": "VM-PRO-101", "topic": "Complementary events", "section": "practice", "question": "A bag contains 11 red and 6 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{6}{17}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 11/17 = 6/17.", "difficulty": "foundation"}, {"id": "VM-PRO-102" d green sectors only. P(red) = 1/5 and P(blue) = 3/10. Find P(green).", "answer": "1/2", "solution": "P(green) = 1 − 1/5 − 3/10 = 10/10 − 2/10 − 3/10 = 1/2."}, {"id": "VM-PRO-120", "topic": "Complementary events", "section": "challenge", "question": "A box contains 40 tickets. The probability of not winning is 7/10. How many winning tickets are there?", "answer": "12", "solution": "P(win) = 1 − 7/10 = 3/10. Winning tickets = 40 × 3/10 = 12."}, {"id": "VM-PRO-121", "topic": "Complementary events", "section": "challenge", "question": "Two fair coins are tossed. Find the probability of not getting two tails.", "answer": "3/4", "solution": "Only TT is excluded from HH, HT, TH, TT. P = 1 − 1/4 = 3/4."}, {"id": "VM-PRO-122", "topic": "Complementary events", "section": "challenge", "question": "A bag contains 7 green and 13 orange counters. How many orange counters must be removed so that P(not green) = 1/2?", "answer": "6", "solution": "Not green means orange. Equal probabilities require 7 orange counters. Remove 13 − 7 = 6."}, {"id": "VM-PRO-123", "topic": "Complementary events", "section": "challenge", "question": "A fair 10-sided die is numbered 1 to 10. Find the probability of not rolling a prime number.", "answer": "3/5", "solution": "The primes are 2, 3, 5 and 7. P(not prime) = 1 − 4/10 = 3/5. The number 1 is not prime."}, {"id": "VM-PRO-124", "topic": "Complementary events", "section": "challenge", "question": "A spinner has 16 equal sectors, 6 of them yellow. Four yellow sectors are recoloured purple. Find P(not yellow).", "answer": "7/8", "solution": "Two yellow sectors remain. P(not yellow) = 1 − 2/16 = 14/16 = 7/8."}, {"id": "VM-PRO-125", "topic": "Complementary events", "section": "challenge", "question": "A box has 18 tickets, 6 winning. How many losing tickets must be added so that P(not winning) = 3/4?", "answer": "6", "solution": "P(win) must be 1/4. Six winning tickets require 24 tickets in total. Add 24 − 18 = 6 losing tickets."}, {"id": "VM-PRO-126", "topic": "Complementary events", "section": "challenge", "question": "A fair die is rolled and a fair coin tossed. Find the probability of not getting both a six and heads.", "answer": "11/12", "solution": "There are 12 equally likely pairs and only one is six with heads. P = 1 − 1/12 = 11/12."}, {"id": "VM-PRO-127", "topic": "Complementary events", "section": "escape_core", "question": "A bag contains 4 red and 24 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{6}{7}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 4/28 = 6/7."}, {"id": "VM-PRO-128", "topic": "Complementary events", "section": "escape_extension", "question": "A spinner has 20 equal sectors. The probability of not landing on green is 3/5. Four non-green sectors are recoloured green. Find the new probability of not landing on green.", "answer": "2/5", "solution": "Initially 20 × 3/5 = 12 sectors are not green. After recolouring, 8 remain. Probability = 8/20 = 2/5."}, {"id": "VM-PRO-129", "topic": "Experimental probability", "section": "worked_example", "question": "In 156 trials an event occurred 108 times. Find its relative frequency.", "answer": "\\(\\frac{9}{13}\\)", "solution": "Divide 108 by 156 and simplify to \\(\\frac{9}{13}\\)."}, {"id": "VM-PRO-130", "topic": "Experimental probability", "section": "worked_example", "question": "An event has probability \\(\\frac{17}{25}\\). Estimate its frequency in 75 trials.", "answer": "51", "solution": "Multiply the probability by 75; expected count = 51."}, {"id": "VM-PRO-131", "topic": "Experimental probability", "section": "worked_example", "question": "In 108 trials an event occurred 24 times. Find its relative frequency.", "answer": "\\(\\frac{2}{9}\\)", "solution": "Divide 24 by 108 and simplify to \\(\\frac{2}{9}\\)."}, {"id": "VM-PRO-132", "topic": "Experimental probability", "section": "worked_example", "question": "An event has probability \\(\\frac{1}{19}\\). Estimate its frequency in 95 trials.", "answer": "5", "solution": "Multiply the probability by 95; expected count = 5."}, {"id": "VM-PRO-133", "topic": "Experimental probability", "section": "practice", "question": "In 198 trials an event occurred 90 times. Find its relative frequency.", "answer": "\\(\\frac{5}{11}\\)", "solution": "Divide 90 by 198 and simplify to \\(\\frac{5}{11}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-134", "topic": "Experimental probability", "section": "practice", "question": "An event has probability \\(\\frac{4}{7}\\). Estimate its frequency in 63 trials.", "answer": "36", "solution": "Multiply the probability by 63; expected count = 36.", "difficulty": "foundation"}, {"id": "VM-PRO-135", "topic": "Experimental probability", "section": "practice", "question": "In 40 trials an event occurred 25 times. Find its relative frequency.", "answer": "\\(\\frac{5}{8}\\)", "solution": "Divide 25 by 40 and simplify to \\(\\frac{5}{8}\\).", "difficulty": "foundation"}, {"id": "VM-PRO-136", "topic": "Experimental probability", "section": "practice", "question": "An event has probability \\(\\frac{7}{8}\\). Estimate its frequency in 32 trials.", "answer": "28", "solution": "Multiply the probability by 32; expected count = 28.", "difficulty": "foundation"}, {"id": "VM-PRO-137", "topic": "Experimental probability", "section": "practice", "question": "An event occurs 6 times in 10 trials. Using this relative frequency, predict its number of occurrences in 40 trials.", "answer": "24", "solution": "Relative frequency = 3/5. Multiply by 40 to get 24.", "difficulty": "intermediate"}, {"id": "VM-PRO-138", "topic": "Experimental probability", "section": "practice", "question": "An event occurs 9 times in 15 trials. Using this relative frequency, predict its number of occurrences in 60 trials.", "answer": "36", "solution": "Relative frequency = 3/5. Multiply by 60 to get 36.", "difficulty": "intermediate"}, {"id": "VM-PRO-139", "topic": "Experimental probability", "section": "practice", "question": n": "In 81 trials an event occurred 48 times. Find its relative frequency. A student divides successes by failures instead of total trials. Explain the error and give the correct answer.", "answer": "\\(\\frac{16}{27}\\)", "solution": "Relative frequency is successes divided by all trials, not failures alone. Relative frequency = 48/81 = 16/27."}, {"id": "VM-PRO-146", "topic": "Experimental probability", "section": "spot_the_mistake", "question": "An event has probability \\(\\frac{2}{5}\\). Estimate its frequency in 25 trials. A student divides 25 by the probability instead of multiplying. Explain the error and give the correct answer.", "answer": "10", "solution": "The probability represents the expected proportion of trials with the event. Multiply rather than divide: 25 × 2/5 = 10."}, {"id": "VM-PRO-147", "topic": "Experimental probability", "section": "spot_the_mistake", "question": "In 72 trials an event occurred 32 times. Find its relative frequency. A student divides successes by failures instead of total trials. Explain the error and give the correct answer.", "answer": "\\(\\frac{4}{9}\\)", "solution": "The denominator must include successes and failures. Relative frequency = 32/72 = 4/9."}, {"id": "VM-PRO-148", "topic": "Experimental probability", "section": "spot_the_mistake", "question": "An event has probability \\(\\frac{22}{23}\\). Estimate its frequency in 184 trials. A student divides 184 by the probability instead of multiplying. Explain the error and give the correct answer.", "answer": "176", "solution": "Expected frequency is the number of trials multiplied by the probability. 184 × 22/23 = 176."}, {"id": "VM-PRO-149", "topic": "Experimental probability", "section": "challenge", "question": "A basketball player scores 12 of 20 shots and then 9 of 15 shots. Find the combined experimental probability of scoring.", "answer": "3/5", "solution": "Combine successes and trials: (12 + 9)/(20 + 15) = 21/35 = 3/5."}, {"id": "VM-PRO-150", "topic": "Experimental probability", "section": "challenge", "question": "A spinner lands on blue 18 times in 60 spins. Using this relative frequency, predict the number of blue results in 150 spins.", "answer": "45", "solution": "Relative frequency = 18/60 = 3/10. Predicted count = 150 × 3/10 = 45; this is an estimate."}, {"id": "VM-PRO-151", "topic": "Experimental probability", "section": "challenge", "question": "After 80 trials, the experimental probability of success is 3/8. How many failures occurred?", "answer": "50", "solution": "Successes = 80 × 3/8 = 30. Failures = 80 − 30 = 50."}, {"id": "VM-PRO-152", "topic": "Experimental probability", "section": "challenge", "question": "A coin gives 17 heads in 40 tosses. How many fewer heads were observed than the theoretical expected count for a fair coin?", "answer": "3", "solution": "Expected heads = 40 × 1/2 = 20. Difference = 20 − 17 = 3."}, {"id": "VM-PRO-153", "topic": "Experimental probability", "section": "challenge", "question": "A player succeeds 6 times in 15 trials. After another 25 trials the combined success rate is 1/2. How many successes occurred in the second set?", "answer": "14", "solution": "Total trials = 40. Total successes = 40 × 1/2 = 20. Second set successes = 20 − 6 = 14."}, {"id": "VM-PRO-154", "topic": "Experimental probability", "section": "challenge", "question": "A spinner lands on red 4 times in 10 spins and 30 times in 50 spins. Find the combined relative frequency of red.", "answer": "17/30", "solution": "Combine counts, not the two rates: (4 + 30)/(10 + 50) = 34/60 = 17/30."}, {"id": "VM-PRO-155", "topic": "Experimental probability", "section": "challenge", "question": "A factory checks 120 items and finds 9 defective. Estimate the number of non-defective items in a batch of 400.", "answer": "370", "solution": "Non-defective relative frequency = 111/120 = 37/40. Estimate = 400 × 37/40 = 370."}, {"id": "VM-PRO-156", "topic": "Experimental probability", "section": "challenge", "question": "A fair die is rolled 90 times. A six appears 21 times. By how many does the observed count exceed the expected count?", "answer": "6", "solution": "Expected sixes = 90 × 1/6 = 15. Observed excess = 21 − 15 = 6."}, {"id": "VM-PRO-157", "topic": "Experimental probability", "section": "challenge", "question": "A spinner has 24 red results in 80 spins. In the next 20 spins, how many red results would make the combined relative frequency exactly 2/5?", "answer": "16", "solution": "There will be 100 spins. Target red count = 100 × 2/5 = 40. Need 40 − 24 = 16 red results."}, {"id": "VM-PRO-158", "topic": "Experimental probability", "section": "challenge", "question": "In a survey of 75 randomly selected trips, 27 were by bus. Estimate the probability that a randomly selected trip from the same population is not by bus.", "answer": "16/25", "solution": "Use the observed relative frequency: P(not bus) ≈ (75 − 27)/75 = 48/75 = 16/25."}, {"id": "VM-PRO-159", "topic": "Experimental probability", "section": "escape_core", "question": "In 174 trials an event occurred 132 times. Find its relative frequency.", "answer": "\\(\\frac{22}{29}\\)", "solution": "Divide 132 by 174 and simplify to \\(\\frac{22}{29}\\)."}, {"id": "VM-PRO-160", "topic": "Experimental probability", "section": "escape_extension", "question": "An event occurs 18 times in 30 trials and 12 times in another 50 trials. Find the relative frequency across all trials.", "answer": "3/8", "solution": "Total successes = 18 + 12 = 30. Total trials = 30 + 50 = 80. Relative frequency = 30/80 = 3/8."}, {"id": "VM-PRO-161", "topic": "Probability investigations", "section": "worked_example", "question": "A spinner has 14 red and 14 blue equal sectors. Is it fair for a game where red wins and blue loses? Assume equal rewards and losses.", "answer": "Yes", "solution": "Red has 14 sectors and blue has 14; fairness requires equal probabilities."}, {"id": "VM-PRO-162", "topic": "Probability investigations", "section": "worked_example", "question": "A fair coin is tossed 26 times and lands heads 7 times. How many fewer heads were observed than expected in these tosses?", "answer": "6", "solution": "Expected heads = 26 × 1/2 = 13. Observed heads = 7. Difference = 13 − 7 = 6."}, {"id": "VM-PRO-163", "topic": "Probability investigations", "section": "worked_example", "question": "A fair spinner has 8 equal sectors, one marked gold. Predict gold outcomes in 24 spins.", "answer": "3", "solution": "Expected count = 24 × \\(\\frac{1}{8}\\) = 3."}, {"id": "VM-PRO-164", "topic": "Probability investigations", "section": "worked_example", "question": "A fair coin lands heads 17 times in a row. What is the probability of heads on the next independent toss?", "answer": "\\(\\frac{1}{2}\\)", "solution": "Independent tosses do not depend on previous results."}, {"id": "VM-PRO-165", "topic": "Probability investigations", "section": "practice", "question": "A spinner has 9 red and 14 blue equal sectors. Is it fair for a game where red wins and blue loses? Assume equal rewards and losses.", "answer": "No", "solution": "Red has 9 sectors and blue has 14; fairness requires equal probabilities.", "difficulty": "foundation"}, {"id": "VM-PRO-166", "topic": "Probability investigations", "section": "practice", "question": "A fair coin is tossed 18 times and lands heads 4 times. How many fewer heads were observed than expected in these tosses?", "answer": "5", "solution": "Expected heads = 18 × 1/2 = 9. Observed heads = 4. Difference = 9 − 4 = 5.", "difficulty": "foundation"}, {"id": "VM-PRO-167", "topic": "Probability investigations", "section": "practice", "question": "A fair spinner has 17 equal sectors, one marked gold. Predict gold outcomes in 136 spins.", "answer": "8", "solution": "Expected count = 136 × \\(\\frac{1}{17}\\) = 8.", "difficulty": "foundation"}, {"id": "VM-PRO-168", "topic": "Probability investigations", "section": "practice", "question": "A fair coin lands heads 16 times in a row. What is the probability of heads on the next independent toss?", "answer": "\\(\\frac{1}{2}\\)", "solution": "Independent tosses do not depend on previous results.", "difficulty": "foundation"}, {"id": "VM-PRO-169", "topic": "Probability investigations", "section": "practice", "question": "A fair spinner has 8 equal sectors, 2 of which win. Predict the number of wins in 40 spins.", "answer": "10", "solution": "Win probability = 1/4. Expected wins = 40 × 1/4 = 10.", "difficulty": "intermediate"}, {"id": "VM-PRO-170", "topic": "Probability investigations", "section": "practice", "question": "A fair spinner has 12 equal sectors, 3 of which win. Predict the number of wins in 60 spins.", "answer": "15", "solution": "Win probability = 1/4. Expected wins = 60 × 1/4 = 15.", "difficulty": "intermediate"}, {"id": "VM-PRO-171", "topic": "Probability investigations", "section": "practice", "question": "A fair spinner has 16 equal sectors, 4 of which win. Predict the number of wins in 80 spins.", "answer": "20", "solution": "Win probability = 1/4. Expected wins = 80 × 1/4 = 20.", "difficulty": "intermediate"}, {"id": "VM-PRO-172", "topic": "Probability investigations", "section": "practice", "question": "A fair spinner has 20 equal sectors, 5 of which win. Predict the number of wins in 100 spins.", "answer": "25", "solution": "Win probability = 1/4. Expected wins = 100 × 1/4 = 25.", "difficulty": "intermediate"}, {"id": "VM-PRO-173", "topic": "Probability investigations", "section": "practice", "question": "A game pays $2 for a win and costs $1 for a loss. A bag contains 2 winning counters and 6 losing counters. How many losing counters must be removed to make the game fair?", "answer": "2", "solution": "For zero expected gain, losses must be twice as numerous as wins. Remove 6 − 4 = 2 losing counters.", "difficulty": "advanced"}, {"id": "VM-PRO-174", "topic": "Probability investigations", "section": "practice", "question": "A game pays $2 for a win and costs $1 for a loss. A bag contains 3 winning counters and 9 losing counters. How many losing counters must be removed to make the game fair?", "answer": "3", "solution": "For zero expected gain, losses must be twice as numerous as wins. Remove 9 − 6 = 3 losing counters.", "difficulty": "advanced"}, {"id": "VM-PRO-175", "topic": "Probability investigations", "section": "practice", "question": "A game pays $2 for a win and costs $1 for a loss. A bag contains 4 winning counters and 12 losing counters. How many losing counters must be removed to make the game fair?", "answer": "4", "solution": "For zero expected gain, losses must be twice as numerous as wins. Remove 12 − 8 = 4 losing counters.", "difficulty": "advanced"}, {"id": "VM-PRO-176", "topic": "Probability investigations", "section": "practice", "question": "A game pays $2 for a win and costs $1 for a loss. A bag contains 5 winning counters and 15 losing counters. How many losing counters must be removed to make the game fair?", "answer": "5", "solution": "For zero expected gain, losses must be twice as numerous as wins. Remove 15 − 10 = 5 losing counters.", "difficulty": "advanced"}, {"id": "VM-PRO-177", "topic": "Probability investigations", "section": "spot_the_mistake", "question": "A spinner has 10 red and 2 blue equal sectors. Is it fair for a game where red wins and blue loses? Assume equal rewards and losses. A student claims the game is fair because both colours appear. Explain the error and give the correct answer.", "answer": "No", "solution": "Both colours appearing does not make the game fair. P(win) = 10/12 = 5/6 and P(loss) = 2/12 = 1/6. With equal rewards and losses, these must be equal for fairness. No, the game is unfair."}, {"id": "VM-PRO-178", "topic": "Probability investigations", "section": "spot_the_mistake", "question": "A fair coin is tossed 24 times and lands heads 7 times. How many fewer heads were observed than expected in these tosses? A student reports the expected count of 12 rather than the difference. Explain the error and give the correct answer.", "answer": "5", "solution": "The expected count is not the difference. Expected heads = 24 × 1/2 = 12. Observed heads = 7. Shortfall = 12 − 7 = 5."}, {"id": "VM-PRO-179", "topic": "Probability investigations", "section": "spot_the_mistake", "question": "A fair spinner has 8 equal sectors, one marked gold. Predict gold outcomes in 40 spins. A student predicts 8 gold outcomes because there are 8 sectors. Explain the error and give the correct answer.", "answer": "5", "solution": "The number of sectors determines the probability, not the expected count. P(gold) = 1/8. Expected gold outcomes = 40 × 1/8 = 5."}, {"id": "VM-PRO-180", "topic": "Probability investigations", "section": "spot_the_mistake", "question": "A fair coin lands heads 5 times in a row. What is the probability of heads on the next independent toss? A student claims tails is now more likely because heads has occurred five times. Explain the error and give the correct answer.", "answer": "\\(\\frac{1}{2}\\)", "solution": "Independent tosses have unchanged probabilities. Previous heads do not make tails due; that is the gambler’s fallacy. P(heads) = 1/2."}, {"id": "VM-PRO-181", "topic": "Probability investigations", "section": "challenge", "question": "A fair die game awards a net gain of 10 points on a six and deducts 2 points otherwise. Is the game fair? Answer Yes or No.", "answer": "Yes", "solution": "Across six equally likely outcomes, the total net change is 10 − 5 × 2 = 0. The game is fair."}, {"id": "VM-PRO-182", "topic": "Probability investigations", "section": "challenge", "question": "A spinner has 3 winning and 5 losing equal sectors. A loss deducts 6 points. What net gain in points per win makes the game fair?", "answer": "10", "solution": "Five losses deduct 5 × 6 = 30 points. Three wins must balance this: 30 ÷ 3 = 10 points."}, {"id": "VM-PRO-183", "topic": "Probability investigations", "section": "challenge", "question": "A game awards 4 points on a head and deducts 6 points on a tail of a fair coin. Is it fair? Answer Yes or No.", "answer": "No", "solution": "The two equally likely outcomes sum to 4 − 6 = −2 points, not zero. The game favours the organiser."}, {"id": "VM-PRO-184", "topic": "Probability investigations", "section": "challenge", "question": "A game uses 20 equally likely tickets. A win gains 3 points and a loss deducts 2 points. How many winning tickets make the game fair?", "answer": "8", "solution": "With 8 winners and 12 losers, gains are 8 × 3 = 24 and losses are 12 × 2 = 24. Equivalently 3w = 2(20 − w), so w = 8."}, {"id": "VM-PRO-185", "topic": "Probability investigations", "section": "challenge", "question": "A fair die game gains 5 points on a roll of 1 or 2 and loses 2 points otherwise. Find the total net change across one occurrence of each face.", "answer": "2", "solution": "Two winning faces gain 2 × 5 = 10 points. Four losing faces deduct 4 × 2 = 8. Net change = 2 points."}, {"id": "VM-PRO-186", "topic": "Probability investigations", "section": "challenge", "question": "A spinner has 4 winning and 6 losing equal sectors. A win gains 9 points. How many points must a loss deduct to make the game fair?", "answer": "6", "solution": "Four wins gain 36 points. Six losses must deduct 36 points in total, so each deducts 6 points."}, {"id": "VM-PRO-187", "topic": "Probability investigations", "section": "challenge", "question": "A fair coin is tossed 8 times and lands heads every time. What is the probability of tails on the next independent toss?", "answer": "1/2", "solution": "The next toss is independent of previous results. P(tails) remains 1/2."}, {"id": "VM-PRO-188", "topic": "Probability investigations", "section": "challenge", "question": "A spinner with 10 equal sectors has 2 winning sectors. How many additional sectors must be recoloured as winning to make a game with equal gains and losses fair?", "answer": "3", "solution": "Equal gains and losses require equal probabilities. Five of ten sectors must win. Recolour 5 − 2 = 3 sectors."}, {"id": "VM-PRO-189", "topic": "Probability investigations", "section": "challenge", "question": "A game uses 12 equally likely tickets. Three win 8 points each and nine lose 3 points each. Is the game fair? Answer Yes or No.", "answer": "No", "solution": "Total gains = 3 × 8 = 24; total losses = 9 × 3 = 27. The net change is −3, so the game is not fair."}, {"id": "VM-PRO-190", "topic": "Probability investigations", "section": "challenge", "question": "A fair die game gains 4 points for an even roll and loses 4 points for an odd roll. Over 60 rolls, how many wins are theoretically expected?", "answer": "30", "solution": "Three of six faces are even. Expected wins = 60 × 3/6 = 30. Actual wins may differ."}, {"id": "VM-PRO-191", "topic": "Probability investigations", "section": "escape_core", "question": "A spinner has 2 red and 14 blue equal sectors. Is it fair for a game where red wins and blue loses? Assume equal rewards and losses.", "answer": "No", "solution": "Red has 2 sectors and blue has 14; fairness requires equal probabilities."}, {"id": "VM-PRO-192", "topic": "Probability investigations", "section": "escape_extension", "question": "A spinner has 12 equal sectors, 4 winning and 8 losing. A loss costs 2 points. How many points must a win award for the game to be fair on average?", "answer": "4", "solution": "Across 12 equally likely outcomes, total losses are 8 × 2 = 16 points. Four winning outcomes must balance those losses, so each win awards 16/4 = 4 points."}, {"id": "VM-PRO-193", "topic": "Language of probability", "section": "diagnostic", "question": "A bag contains 9 red counters only. Describe drawing a red counter.", "answer": "Certain", "solution": "Every counter is red.", "options": ["Impossible", "Certain", "Even chance", "Unlikely"], "correct_index": 1}, {"id": "VM-PRO-194", "topic": "Sample spaces", "section": "diagnostic", "question": "A café offers 4 mains and 2 drinks. How many main–drink pairs are possible?", "answer": "8", "solution": "4 × 2 = 8 pairs.", "options": ["8", "6", "12", "4"], "correct_index": 0}, {"id": "VM-PRO-195", "topic": "Theoretical probability", "section": "diagnostic", "question": "A bag contains 4 red and 14 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{2}{9}\\)", "solution": "There are 4 favourable outcomes out of 18. Simplify to \\(\\frac{2}{9}\\).", "options": ["\\(\\frac{2}{7}\\)", "\\(\\frac{7}{9}\\)", "\\(\\frac{2}{9}\\)", "\\(\\frac{1}{2}\\)"], "correct_index": 2}, {"id": "VM-PRO-196", "topic": "Complementary events", "section": "diagnostic", "question": "A bag contains 18 red and 2 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{1}{10}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 18/20 = 1/10.", "options": ["\\(\\frac{1}{10}\\)", "\\(\\frac{9}{10}\\)", "\\(\\frac{1}{9}\\)", "\\(\\frac{1}{2}\\)"], "correct_index": 0}, {"id": "VM-PRO-197", "topic": "Experimental probability", "section": "diagnostic", "question": "In 50 trials an event occurred 30 times. Find its relative frequency.", "answer": "\\(\\frac{3}{5}\\)", "solution": "Divide 30 by 50 and simplify to \\(\\frac{3}{5}\\).", "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{3}{2}\\)", "\\(\\frac{2}{5}\\)", "\\(\\frac{3}{5}\\)"], "correct_index": 3}, {"id": "VM-PRO-198", "topic": "Probability investigations", "section": "diagnostic", "question": "A fair coin is tossed 44 times and lands heads 14 times. How many fewer heads were observed than expected in these tosses?", "answer": "8", "solution": "Expected heads = 44 × 1/2 = 22. Observed heads = 14. Difference = 22 − 14 = 8.", "options": ["14", "22", "8", "30"], "correct_index": 2}, {"id": "VM-PRO-199", "topic": "Language of probability", "section": "diagnostic", "question": "A bag contains 5 red and 5 blue counters. Describe drawing red.", "answer": "Even chance", "solution": "Exactly half the counters are red.", "options": ["Certain", "Impossible", "Likely but not an even chance", "Even chance"], "correct_index": 3}, {"id": "VM-PRO-200", "topic": "Sample spaces", "section": "diagnostic", "question": "A standard six-sided die is rolled. How many outcomes exceed 4?", "answer": "2", "solution": "Only 5 and 6 exceed 4, giving 2 outcomes.", "options": ["1", "2", "3", "4"], "correct_index": 1}, {"id": "VM-PRO-201", "topic": "Theoretical probability", "section": "diagnostic", "question": "A bag contains 22 red and 3 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{22}{25}\\)", "solution": "There are 22 favourable outcomes out of 25. Simplify to \\(\\frac{22}{25}\\).", "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{3}{25}\\)", "\\(\\frac{22}{25}\\)", "\\(\\frac{22}{3}\\)"], "correct_index": 2}, {"id": "VM-PRO-202", "topic": "Complementary events", "section": "diagnostic", "question": "A bag contains 19 red and 2 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{2}{21}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 19/21 = 2/21.", "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{2}{21}\\)", "\\(\\frac{2}{19}\\)", "\\(\\frac{19}{21}\\)"], "correct_index": 1}, {"id": "VM-PRO-203", "topic": "Experimental probability", "section": "diagnostic", "question": "In 44 trials an event occurred 8 times. Find its relative frequency.", "answer": "\\(\\frac{2}{11}\\)", "solution": "Divide 8 by 44 and simplify to \\(\\frac{2}{11}\\).", "options": ["\\(\\frac{9}{11}\\)", "\\(\\frac{2}{9}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{2}{11}\\)"], "correct_index": 3}, {"id": "VM-PRO-204", "topic": "Probability investigations", "section": "diagnostic", "question": "A spinner has 4 red and 6 blue equal sectors. Is it fair for a game where red wins and blue loses? Assume equal rewards and losses.", "answer": "No", "solution": "Red has 4 sectors and blue has 6; fairness requires equal probabilities.", "options": ["No", "Yes, because both colours appear", "Yes, because all sectors are equal in size", "Cannot tell without spinning"], "correct_index": 0}, {"id": "VM-PRO-205", "topic": "Language of probability", "section": "diagnostic", "question": "A bag contains 22 red counters only. Describe drawing a red counter.", "answer": "Certain", "solution": "Every counter is red.", "options": ["Certain", "Even chance", "Impossible", "Unlikely"], "correct_index": 0}, {"id": "VM-PRO-206", "topic": "Sample spaces", "section": "diagnostic", "question": "A spinner has sectors labelled A, B and C. Which is its sample space?", "answer": "A, B, C", "solution": "Only the three labels on the spinner can occur.", "options": ["A, B", "A, B, C", "B, C", "A, B, C, D"], "correct_index": 1}, {"id": "VM-PRO-207", "topic": "Theoretical probability", "section": "diagnostic", "question": "A bag contains 4 red and 11 blue counters. One is selected uniformly at random. Find P(red).", "answer": "\\(\\frac{4}{15}\\)", "solution": "There are 4 favourable outcomes out of 15. Simplify to \\(\\frac{4}{15}\\).", "options": ["\\(\\frac{11}{15}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{4}{15}\\)", "\\(\\frac{4}{11}\\)"], "correct_index": 2}, {"id": "VM-PRO-208", "topic": "Complementary events", "section": "diagnostic", "question": "A bag contains 4 red and 3 blue counters. One is selected uniformly at random. Find P(not red).", "answer": "\\(\\frac{3}{7}\\)", "solution": "P(not red) = 1 − P(red) = 1 − 4/7 = 3/7.", "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{3}{4}\\)", "\\(\\frac{4}{7}\\)", "\\(\\frac{3}{7}\\)"], "correct_index": 3}];const sections={worked_example:'Worked examples',practice:'Skill practice',spot_the_mistake:'Spot the mistake',challenge:'Challenges',diagnostic:'Diagnostic',escape_core:'Core escape room',escape_extension:'Extension escape room',explore:'Interactive explorer'};let current='worked_example',choices={},marked=false,escapeIndex=0;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function plain(s){return String(s).replace(/\\\(\\frac\{([^{}]+)\}\{([^{}]+)\}\\\)/g,'$1/$2')}function fmt(s){return esc(plain(s)).replace(/(?<![\w])(-?\d+)\/(\d+)(?![\w])/g,'<span class="frac"><span>$1</span><span>$2</span></span>')}function equivalent(a,b){const norm=s=>plain(s).toLowerCase().trim().replace(/\s+/g,'');const num=s=>{if(/^[+-]?\d+(?:\.\d+)?%$/.test(s))return Number(s.slice(0,-1))/100;if(/^[+-]?\d+\/\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return b?a/b:NaN}return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN};a=norm(a);b=norm(b);if(!a)return false;if(a===b)return true;let x=num(a),y=num(b);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-10}function solution(q){return '<details><summary>Show answer and solution</summary><p><strong>Answer:</strong> '+fmt(q.answer)+'</p><p>'+fmt(q.solution).replace(/\n/g,'<br>')+'</p></details>'}function render(){document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.section===current);b.setAttribute('aria-pressed',b.dataset.section===current)});$('filters').hidden=['diagnostic','escape_core','escape_extension','explore'].includes(current);$('levelLabel').hidden=current!=='practice';let qs=bank.filter(q=>q.section===current);if(current==='explore'){explore();return}if(current==='diagnostic'){let score=qs.filter(q=>choices[q.id]===q.correct_index).length;$('content').innerHTML=(marked?'<div class="panel" role="status"><h2>Score: '+score+' / '+qs.length+'</h2>'+[...new Set(qs.map(q=>q.topic))].map(t=>{let a=qs.filter(q=>q.topic===t);return '<p>'+esc(t)+': '+a.filter(q=>choices[q.id]===q.correct_index).length+' / '+a.length+'</p>'}).join('')+'</div>':'<p>Select one answer for each question, then mark your test.</p>')+qs.map((q,i)=>'<article><small>'+esc(q.topic)+'</small><p><strong>'+ (i+1)+'.</strong> '+fmt(q.question)+'</p>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="'+q.id+'" value="'+j+'" '+(choices[q.id]===j?'checked ':'')+(marked?'disabled':'')+'>'+fmt(o)+'</label>').join('')+(marked?'<p><strong>'+(choices[q.id]===q.correct_index?'Correct':'Review this question')+'</strong></p>'+solution(q):'')+'</article>').join('')+'<p id="diagnosticStatus" role="status"></p><button class="primary" id="mark">'+(marked?'Try again':'Mark diagnostic')+'</button>';$('content').querySelectorAll('input').forEach(e=>e.onchange=()=>choices[e.name]=Number(e.value));$('mark').onclick=()=>{if(marked){choices={};marked=false}else{let missing=qs.filter(q=>choices[q.id]===undefined).length;if(missing){$('diagnosticStatus').textContent='Please answer all questions. '+missing+' remaining.';return}marked=true}render();$('content').scrollIntoView()};return}if(current.startsWith('escape')){let q=qs[escapeIndex];$('content').innerHTML=q?'<article><small>Room '+(escapeIndex+1)+' of '+qs.length+'</small><p>'+fmt(q.question)+'</p><label>Your answer <input id="attempt"></label><button id="check">Check</button><p id="feedback" role="status"></p>'+'<div id="roomSolution" hidden>'+solution(q)+'</div><button id="next" hidden>Next room</button></article>':'<div class="panel"><h2>Escape complete!</h2><button id="restart">Play again</button></div>';if(!q){$('restart').onclick=()=>{escapeIndex=0;render()};return}$('check').onclick=()=>{let ok=equivalent($('attempt').value,q.answer);$('feedback').textContent=ok?'Correct! Room unlocked.':'Not quite. Try again.';$('next').hidden=!ok;$('roomSolution').hidden=!ok};$('next').onclick=()=>{escapeIndex++;render()};return}qs=qs.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(current!=='practice'||!$('level').value||q.difficulty===$('level').value));$('content').innerHTML='<p>'+qs.length+' questions</p>'+qs.map(q=>'<article><small>'+esc(q.topic)+(q.difficulty?' · '+esc(q.difficulty):'')+'</small><p>'+fmt(q.question)+'</p>'+solution(q)+'</article>').join('')};for(let [k,v] of Object.entries(sections)){let b=document.createElement('button');b.textContent=v;b.dataset.section=k;b.onclick=()=>{current=k;escapeIndex=0;render()};$('tabs').append(b)}$('topic').innerHTML='<option value="">All topics</option>'+[...new Set(bank.map(q=>q.topic))].map(t=>'<option>'+esc(t)+'</option>').join('');$('topic').onchange=$('level').onchange=render;function explore(){$('content').innerHTML='<div class="panel"><h2>Probability simulator</h2><label>Experiment <select id="experiment"><option value="2">Fair coin — heads</option><option value="6">Fair die — roll a six</option><option value="4">Four equal spinner sectors — sector 1</option></select></label><p><button id="one">Run 1 trial</button> <button id="hundred">Run 100 trials</button> <button id="thousand">Run 1,000 trials</button> <button id="reset">Reset</button></p><div id="results" aria-live="polite"></div><h3>Investigate</h3><ol><li>Select the fair coin. Predict the number of heads in 100 trials. Run 1 trial, then 100 trials, and record the observed proportion.</li><li>Run another 1,000 trials. Compare the observed proportion with 1/2. Reset and repeat. Does the difference always decrease?</li><li>Select the fair die. Predict the number of sixes in 600 trials. Run six batches of 100 and compare with your prediction.</li><li>Express the observed probability as a fraction, decimal and percentage. Explain why different runs can produce different results.</li></ol><details><summary>Check your reasoning</summary><p>Expected heads in 100 trials: 50. Expected sixes in 600 trials: 100. Observed results vary randomly. Larger samples generally give more stable estimates, but the error need not decrease after every batch. Divide successes by total trials to obtain the observed probability.</p></details></div><div class="panel"><h2>Probability scale</h2><label>Probability <input type="range" id="scale" min="0" max="100" value="50"></label><p id="scaleText"></p></div>';let n=0,h=0;function show(){let k=Number($('experiment').value);$('results').innerHTML='<p>Trials: '+n+' · Successful outcomes: '+h+'</p><p>Theoretical: '+fmt('1/'+k)+' (decimal ≈ '+(1/k).toFixed(4)+'; '+(100/k).toFixed(2)+'%)</p><p>Experimental: '+(n?fmt(h+'/'+n)+' (decimal ≈ '+(h/n).toFixed(4)+'; '+(100*h/n).toFixed(2)+'%)':'Run a trial')+'</p><div class="track"><div class="fill" style="width:'+(n?100*h/n:0)+'%"></div></div>'}function run(t){for(let i=0;i<t;i++){n++;if(Math.floor(Math.random()*Number($('experiment').value))===0)h++}show()}$('one').onclick=()=>run(1);$('hundred').onclick=()=>run(100);$('thousand').onclick=()=>run(1000);$('reset').onclick=$('experiment').onchange=()=>{n=h=0;show()};$('scale').oninput=()=>{let v=Number($('scale').value);$('scaleText').textContent=v+'% — '+(v===0?'Impossible':v===100?'Certain':v===50?'Even chance':v<50?'Unlikely':'Likely')};$('scale').oninput();show()};if(location.hash==="#diagnostic")current="diagnostic";render();</script></body></html>
