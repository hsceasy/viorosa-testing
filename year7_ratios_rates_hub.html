t her reasoning.", "answer": "$36 and $48", "solution": "There are 3 + 4 = 7 parts altogether, not 4. One part is $84 ÷ 7 = $12. The shares are 3 × $12 = $36 and 4 × $12 = $48.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-100", "section": "Spot the mistake", "group": "Ratios", "skill": "Converting units", "prompt": "Noah writes 2 kg:500 g as 1:250. Explain the error and simplify correctly.", "answer": "4:1", "solution": "The quantities must have matching units before simplifying. Convert 2 kg to 2000 g. Divide 2000:500 by 500 to obtain 4:1.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-101", "section": "Spot the mistake", "group": "Rates", "skill": "Unit rates", "prompt": "Six notebooks cost $15. Ella calculates 6 ÷ 15 = 0.4 and labels it dollars per notebook. Correct her answer.", "answer": "$2.50 per notebook", "solution": "6 ÷ 15 measures notebooks per dollar. Dollars per notebook requires cost divided by number: 15 ÷ 6 = 2.50.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-102", "section": "Spot the mistake", "group": "Rates", "skill": "Best buys", "prompt": "A 400 g pack costs $3.20 and a 750 g pack costs $5.25. Sam chooses the smaller pack because its price is lower. Which is the better buy?", "answer": "750 g pack", "solution": "Compare equal quantities: $3.20 ÷ 4 = $0.80 per 100 g; $5.25 ÷ 7.5 = $0.70 per 100 g. The larger pack costs less per 100 g.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-103", "section": "Spot the mistake", "group": "Rates", "skill": "Speed distance and time", "prompt": "A runner covers 9 km in 45 minutes. Ivy calculates 9 ÷ 45 = 0.2 km/h. Correct the speed.", "answer": "12 km/h", "solution": "The calculation gives kilometres per minute, not per hour. Multiply 0.2 by 60 to get 12 km/h.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-104", "section": "Spot the mistake", "group": "Rates", "skill": "Rate conversions", "prompt": "A student converts 72 km/h to m/s by multiplying by 3.6. Explain and correct the conversion.", "answer": "20 m/s", "solution": "Convert kilometres to metres and hours to seconds: 72 × 1000 ÷ 3600 = 20. Therefore divide by 3.6, not multiply.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-105", "section": "Spot the mistake", "group": "Proportion", "skill": "Direct proportion", "prompt": "A gym charges $10 to join and $4 per visit. Ben says the total cost doubles whenever the number of visits doubles. Test his claim using 2 and 4 visits.", "answer": "Not directly proportional", "solution": "Two visits cost $18; four cost $26, not $36. The fixed joining fee prevents a constant cost-to-visits ratio.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-106", "section": "Spot the mistake", "group": "Scale", "skill": "Scale drawings", "prompt": "A map has scale 1:5000. A path measures 3 cm. Zoe says the real path is 15 km. Correct her conversion.", "answer": "150 m", "solution": "Multiply 3 cm by 5000 to get 15000 cm. Divide by 100 to obtain 150 m, not 15 km.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-107", "section": "Spot the mistake", "group": "Proportion", "skill": "Multi-step ratios", "prompt": "Red and blue counters are in the ratio 2:5. A student says two fifths of all counters are red. Correct the fraction.", "answer": "<span class=\"frac\"><span>2</span><span>7</span></span>", "solution": "The denominator must count all parts: 2 + 5 = 7. Five is only the number of blue parts.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-108", "section": "Spot the mistake", "group": "Proportion", "skill": "Multi-step rates", "prompt": "A car travels 60 km in 1 hour and 60 km in 2 hours. Max averages 60 and 30 to get 45 km/h. Correct the average speed.", "answer": "40 km/h", "solution": "The time intervals differ, so the simple mean is inappropriate. Total distance is 120 km and total time is 3 h. Average speed is 120 ÷ 3 = 40 km/h.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-109", "section": "Spot the mistake", "group": "Ratios", "skill": "Simplifying ratios", "prompt": "A student simplifies 24:36 to 12:18 and says it is in simplest form. Explain what remains to be done.", "answer": "2:3", "solution": "12:18 is equivalent but both terms still share a factor of 6. Divide both by 6 to obtain 2:3.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-110", "section": "Spot the mistake", "group": "Ratios", "skill": "Equivalent ratios", "prompt": "A recipe uses flour and sugar in the ratio 5:2. To triple the recipe, Ruby writes 15:2. Correct the scaled quantities.", "answer": "15:6", "solution": "Both ingredients must be multiplied by 3 to preserve the mixture. The scaled quantities are 15 and 6.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-111", "section": "Spot the mistake", "group": "Ratios", "skill": "Sharing in a ratio", "prompt": "Two friends share 96 stickers in the ratio 5:3. Finn gives the first friend 5 stickers and the second 91. Correct the shares.", "answer": "60 and 36 stickers", "solution": "Ratio terms describe relative parts, not actual counts. There are 8 parts, each worth 96 ÷ 8 = 12 stickers. Multiply by 5 and 3.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-112", "section": "Spot the mistake", "group": "Ratios", "skill": "Converting units", "prompt": "A student converts 1.5 L to 150 mL before comparing it with 600 mL. Find the correct simplest ratio.", "answer": "5:2", "solution": "One litre equals 1000 mL, so 1.5 L = 1500 mL. Simplify 1500:600 by dividing both by 300.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-113", "section": "Spot the mistake", "group": "Rates", "skill": "Unit rates", "prompt": "A tap fills 18 L in 3 minutes. A student says its rate is 15 L/min because 18 − 3 = 15. Correct the rate.", "answer": "6 L/min", "solution": "A unit rate measures the quantity for one unit of time. Divide 18 L by 3 min, giving 6 L/min.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-114", "section": "Spot the mistake", "group": "Rates", "skill": "Best buys", "prompt": "A 2 kg bag costs $9 and a 500 g bag costs $2.40. A student compares 9 ÷ 2 with 2.40 ÷ 500 and chooses the smaller bag. Correct the comparison.", "answer": "2 kg bag", "solution": "The rates use different mass units. The larger bag costs $4.50/kg and the smaller costs $4.80/kg because 500 g = 0.5 kg.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-115", "section": "Spot the mistake", "group": "Rates", "skill": "Speed distance and time", "prompt": "A bus travels at 80 km/h for 1 hour 30 minutes. A student multiplies 80 by 1.30. Find the actual distance.", "answer": "120 km", "solution": "Thirty minutes is half an hour, not 0.30 hours. Distance = 80 × 1.5 = 120 km.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-116", "section": "Spot the mistake", "group": "Rates", "skill": "Rate conversions", "prompt": "A pump delivers 1200 mL/min. A student converts this to 12 L/min. Correct the rate.", "answer": "1.2 L/min", "solution": "Divide the volume by 1000 because 1000 mL = 1 L. The time unit remains minutes.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-117", "section": "Spot the mistake", "group": "Proportion", "skill": "Direct proportion", "prompt": "Four identical pens cost $6. A student predicts that seven pens cost $9 because both numbers increase by 3. Find the correct cost.", "answer": "$10.50", "solution": "The cost increases by $1.50 per pen, not $1. The unit price is $6 ÷ 4 = $1.50, so seven cost $10.50.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-118", "section": "Spot the mistake", "group": "Scale", "skill": "Scale drawings", "prompt": "A square on a plan has side 2 cm at scale 1:100. A student multiplies its plan area of 4 square centimetres by 100. Find the actual area in square metres.", "answer": "4 m²", "solution": "Scale each length first: 2 cm × 100 = 200 cm = 2 m. Area is 2 × 2 = 4 m². Area scales by the square of the length factor.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-119", "section": "Spot the mistake", "group": "Proportion", "skill": "Multi-step ratios", "prompt": "The ratio of cats to dogs is 3:2 and dogs to rabbits is 4:5. A student combines them as 3:2:5. Correct the combined ratio.", "answer": "6:4:5", "solution": "The dog terms must match before combining. Double 3:2 to obtain 6:4, then combine with 4:5 to obtain 6:4:5.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-120", "section": "Spot the mistake", "group": "Proportion", "skill": "Multi-step rates", "prompt": "A machine makes 30 items in 5 minutes and then 48 items in 12 minutes. A student adds the two rates and reports 10 items/min overall. Find the overall rate to two decimal places.", "answer": "4.59 items/min", "solution": "Adding rates does not give the combined average. Total output is 78 items over 17 minutes. Divide 78 by 17 and round to 4.59.", "difficulty": "Core", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-121", "section": "Challenge questions", "group": "Ratios", "skill": "Simplifying ratios", "prompt": "Three ribbon lengths are in the ratio 0.6:1.5:2.4. Express this as a simplest whole-number ratio.", "answer": "2:5:8", "solution": "Multiply each term by 10 to get 6:15:24, then divide by 3.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-122", "section": "Challenge questions", "group": "Ratios", "skill": "Equivalent ratios", "prompt": "Two recipes use flour and sugar in ratios 5:2 and 12:5. Which has more sugar per gram of flour?", "answer": "Second recipe", "solution": "Compare 2 ÷ 5 = 0.4 and 5 ÷ 12 ≈ 0.417. The second is greater.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-123", "section": "Challenge questions", "group": "Ratios", "skill": "Sharing in a ratio", "prompt": "Three teams share $840 in the ratio 2:3:7. How much more does the largest team receive than the smallest?", "answer": "$350", "solution": "There are 12 parts worth $70 each. The difference is 5 parts, or $350.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-124", "section": "Challenge questions", "group": "Ratios", "skill": "Converting units", "prompt": "Simplify the ratio 1.25 kg : 375 g : 0.5 kg.", "answer": "10:3:4", "solution": "Convert to 1250:375:500 grams and divide by 125.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-125", "section": "Challenge questions", "group": "Rates", "skill": "Unit rates", "prompt": "A machine fills 18 bottles in 45 seconds. At this rate, how many bottles can it fill in 12 minutes?", "answer": "288 bottles", "solution": "12 minutes = 720 seconds. 720 ÷ 45 = 16; 18 × 16 = 288.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-126", "section": "Challenge questions", "group": "Rates", "skill": "Best buys", "prompt": "Rice costs $8.40 for 1.5 kg or $13.20 for 2.5 kg. How much is saved per kilogram by choosing the better buy?", "answer": "$0.32 per kg", "solution": "Unit prices are $5.60 and $5.28 per kg. Difference = $0.32.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-127", "section": "Challenge questions", "group": "Rates", "skill": "Speed distance and time", "prompt": "A train leaves at 9:48 am and travels 156 km at an average speed of 72 km/h. When does it arrive?", "answer": "11:58 am", "solution": "156 ÷ 72 = <span class=\"frac\"><span>13</span><span>6</span></span> hours = 2 hours 10 minutes. Add to 9:48 am.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-128", "section": "Challenge questions", "group": "Rates", "skill": "Rate conversions", "prompt": "A pump delivers 0.45 litres per second. Express its rate in litres per hour.", "answer": "1620 L/h", "solution": "There are 3600 seconds in an hour. Multiply 0.45 by 3600.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-129", "section": "Challenge questions", "group": "Proportion", "skill": "Direct proportion", "prompt": "A recipe for 8 people requires 600 g of flour. You have 1.05 kg of flour. How many people can you serve?", "answer": "14 people", "solution": "600 ÷ 8 = 75 g per person. 1050 ÷ 75 = 14.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-130", "section": "Challenge questions", "group": "Scale", "skill": "Scale drawings", "prompt": "A floor plan uses a scale of 1:80. A room measures 5.5 cm by 4 cm on the plan. Find its actual floor area.", "answer": "14.08 m²", "solution": "Actual dimensions are 440 cm and 320 cm, or 4.4 m and 3.2 m. Multiply to obtain 14.08 m².", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-131", "section": "Challenge questions", "group": "Proportion", "skill": "Multi-step ratios", "prompt": "Red and blue counters are in the ratio 3:5. Adding 12 red counters makes the numbers equal. How many counters were there originally?", "answer": "48 counters", "solution": "The difference of 2 parts equals 12, so each part is 6. Original total = 8 × 6 = 48.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-132", "section": "Challenge questions", "group": "Proportion", "skill": "Multi-step rates", "prompt": "A walker covers 4 km at 4 km/h, rests for 30 minutes, then covers 6 km at 6 km/h. Find the average speed including the rest.", "answer": "4 km/h", "solution": "Travel takes 1 + 1 hours, plus 0.5 hours resting. Average = 10 ÷ 2.5 = 4 km/h.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-133", "section": "Challenge questions", "group": "Ratios", "skill": "Simplifying ratios", "prompt": "A bag has red, blue and yellow counters. Red:blue = 2:3 and blue:yellow = 4:5. Find red:blue:yellow.", "answer": "8:12:15", "solution": "Make the blue term 12 in both ratios: 8:12 and 12:15.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-134", "section": "Challenge questions", "group": "Ratios", "skill": "Equivalent ratios", "prompt": "A mixture has cordial:water = 2:7. Can exactly 1 litre be made using whole millilitres while keeping this ratio? Explain.", "answer": "No", "solution": "There are 9 equal parts. 1000 is not divisible by 9, so each part cannot be a whole number of millilitres.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-135", "section": "Challenge questions", "group": "Ratios", "skill": "Sharing in a ratio", "prompt": "Two siblings share money in the ratio 5:3. The first receives $24 more. Find the total.", "answer": "$96", "solution": "Two parts equal $24, so one part is $12. Eight parts total $96.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-136", "section": "Challenge questions", "group": "Ratios", "skill": "Converting units", "prompt": "A model weighs 240 g and its display base weighs 0.36 kg. Express model:base:combined mass in simplest form.", "answer": "2:3:5", "solution": "Convert to grams: 240:360:600. Divide all terms by 120.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-137", "section": "Challenge questions", "group": "Rates", "skill": "Unit rates", "prompt": "A 750 mL bottle costs $3.60. What is the cost per 100 mL?", "answer": "$0.48 per 100 mL", "solution": "750 mL contains 7.5 lots of 100 mL. Divide $3.60 by 7.5.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-138", "section": "Challenge questions", "group": "Rates", "skill": "Best buys", "prompt": "A shop sells 4 pens for $6 or 7 pens for $9.80. You need exactly 28 pens. How much do you save by choosing only the better-value packs?", "answer": "$2.80", "solution": "Seven 4-packs cost $42. Four 7-packs cost $39.20. Difference $2.80.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-139", "section": "Challenge questions", "group": "Rates", "skill": "Speed distance and time", "prompt": "A runner completes 1500 m in 6 minutes. Find the average speed in km/h.", "answer": "15 km/h", "solution": "1500 m = 1.5 km and 6 minutes = 0.1 hours. Divide 1.5 by 0.1.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-140", "section": "Challenge questions", "group": "Rates", "skill": "Rate conversions", "prompt": "A conveyor moves at 1.2 m/s. How far does it move in 7 minutes 30 seconds?", "answer": "540 m", "solution": "7 minutes 30 seconds = 450 seconds. Multiply 1.2 × 450.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-141", "section": "Challenge questions", "group": "Proportion", "skill": "Direct proportion", "prompt": "A taxi charges $5 plus $2 per kilometre. Is the total fare directly proportional to distance? Explain.", "answer": "No", "solution": "For 1 km the fare is $7; for 2 km it is $9, not $14. The fixed charge prevents direct proportion.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-142", "section": "Challenge questions", "group": "Scale", "skill": "Scale drawings", "prompt": "Two points are 18 km apart. On a map with scale 1:250 000, how far apart are they in centimetres?", "answer": "7.2 cm", "solution": "1 cm represents 250 000 cm = 2.5 km. Divide 18 by 2.5.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-143", "section": "Challenge questions", "group": "Proportion", "skill": "Multi-step ratios", "prompt": "A class has boys:girls = 4:5. After 3 boys join, the ratio becomes 1:1. How many students are now in the class?", "answer": "30 students", "solution": "The original difference of one part is 3. There were 12 boys and 15 girls; now there are 15 of each.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-144", "section": "Challenge questions", "group": "Proportion", "skill": "Multi-step rates", "prompt": "A cyclist travels 12 km out at 24 km/h and returns along the same route at 12 km/h. Find the average speed.", "answer": "16 km/h", "solution": "Outward time is 0.5 h; return time is 1 h. Total distance 24 km divided by 1.5 h gives 16 km/h.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-145", "section": "Challenge questions", "group": "Ratios", "skill": "Simplifying ratios", "prompt": "A mosaic has 18 blue, 24 white and 30 gold tiles. What is the simplest ratio of blue tiles to all non-blue tiles?", "answer": "1:3", "solution": "Non-blue = 24 + 30 = 54. Divide 18:54 by 18.", "difficulty": "Extension", "review_status": "draft", "curriculum_candidates": ["NSW Stage 4 ratios and rates"]}, {"id": "VM-RR-146", "section": "Challenge questions", "group": "Ratios", "skill": "Equivalent ratios", "prompt": "The upper line shows cups of concentrate and the lower line cups of water. Find the missing values.<svg viewBox=\"0 0 320 112\" role=\"img\" aria-label=\"Double number line; upper and lower quantities at matching intervals\" style=\"width:100%;max-width:420px;display:block\"><path d=\"M24 30H296\" stroke=\"#665463\" stroke-width=\"2\"/><path d=\"M24 25v10\" stroke=\"#665463\"/><text x=\"24\" y=\"20\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">0</text><path d=\"M92 25v10\" stroke=\"#665463\"/><text x=\"92\" y=\"20\" text-anchor=\"middle\" font-size=\"12\" f 1));[a[i],a[j]]=[a[j],a[i]];}test=a.slice(0,10);}function render(){for(const b of $('nav').children)b.setAttribute('aria-pressed',b.textContent===section);$('newtest').hidden=section!=='Mini-tests';let qs=section==='Mini-tests'?test:pool().filter(q=>q.section===section);$('questions').replaceChildren();for(const q of qs){let a=document.createElement('article');let h=document.createElement('small');h.textContent=q.skill+' · '+q.difficulty;let p=document.createElement('div');p.innerHTML=q.prompt;let d=document.createElement('details');let sm=document.createElement('summary');sm.textContent='Show worked solution';let w=document.createElement('p');w.innerHTML=q.solution+' <strong>Answer:</strong> '+q.answer;d.append(sm,w);if(section==='Worked examples')d.open=true;a.append(h,p,d);$('questions').append(a);}if(!qs.length)$('questions').textContent='No questions match these filters.';}for(const s of sections){let b=document.createElement('button');b.textContent=s;b.onclick=()=>{section=s;if(s==='Mini-tests')sample();render();};$('nav').append(b);}for(const s of ['All',...new Set(bank.map(q=>q.skill))])$('skill').add(new Option(s,s));for(const id of ['skill','difficulty','group'])$(id).onchange=()=>{if(section==='Mini-tests')sample();render();};$('newtest').onclick=()=>{sample();render();};$('move').onclick=draw;draw();render();</script></html>
