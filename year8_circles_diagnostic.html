"}, {"skill": "Circumference", "prompt": "A circle has radius 5 cm. Find its circumference exactly.", "answer": "10π cm", "solution": "C = 2πr = 10π cm.", "options": ["10π cm", "5π cm", "20π cm", "11π cm"], "level": "Foundation", "id": "VM-CIR-009"}, {"skill": "Area", "prompt": "Find the exact area of a circle with diameter 10 cm.", "answer": "25π cm²", "solution": "Radius = 5 cm. A = πr².", "options": ["25π cm²", "100π cm²", "26π cm²", "50π cm²"], "level": "Foundation", "id": "VM-CIR-010"}, {"skill": "Semicircles", "prompt": "Find the perimeter of a semicircle of radius 6 cm, including its straight edge.", "answer": "6π + 12 cm", "solution": "Half the circumference is 6π; add diameter 12.", "options": ["6π + 12 cm", "6π cm", "12π + 12 cm", "6π + 6 cm"], "level": "Foundation", "id": "VM-CIR-015"}, {"skill": "Composite areas", "prompt": "A circular pond of radius 6 m sits inside a circular garden of radius 8 m. Find the area outside the pond but inside the garden.", "answer": "28π m²", "solution": "Subtract the areas: π(8² − 6²) = 28π.", "options": ["28π m²", "24π m²", "64π m²", "4π m²"], "level": "Foundation", "id": "VM-CIR-016"}, {"skill": "Circumference", "prompt": "A circle has radius 7 cm. Find its circumference exactly.", "answer": "14π cm", "solution": "C = 2πr = 14π cm.", "options": ["14π cm", "7π cm", "28π cm", "15π cm"], "level": "Core", "id": "VM-CIR-017"}, {"skill": "Area", "prompt": "Find the exact area of a circle with diameter 14 cm.", "answer": "49π cm²", "solution": "Radius = 7 cm. A = πr².", "options": ["49π cm²", "196π cm²", "50π cm²", "98π cm²"], "level": "Core", "id": "VM-CIR-018"}, {"skill": "Semicircles", "prompt": "Find the perimeter of a semicircle of radius 8 cm, including its straight edge.", "answer": "8π + 16 cm", "solution": "Half the circumference is 8π; add diameter 16.", "options": ["8π + 16 cm", "8π cm", "16π + 16 cm", "8π + 8 cm"], "level": "Core", "id": "VM-CIR-023"}, {"skill": "Composite areas", "prompt": "A circular pond of radiu
