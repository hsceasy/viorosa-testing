us 5 cm. Find its circumference exactly.","answer":"10π cm","solution":"C = 2πr = 10π cm.","options":["10π cm","5π cm","20π cm","11π cm"],"level":"Foundation","id":"VM-CIR-009"},{"skill":"Area","prompt":"Find the exact area of a circle with diameter 10 cm.","answer":"25π cm²","solution":"Radius = 5 cm. A = πr².","options":["25π cm²","100π cm²","26π cm²","50π cm²"],"level":"Foundation","id":"VM-CIR-010"},{"skill":"Semicircles","prompt":"Find the perimeter of a semicircle of radius 6 cm, including its straight edge.","answer":"6π + 12 cm","solution":"Half the circumference is 6π; add diameter 12.","options":["6π + 12 cm","6π cm","12π + 12 cm","6π + 6 cm"],"level":"Foundation","id":"VM-CIR-015"},{"skill":"Composite areas","prompt":"A circular pond of radius 6 m sits inside a circular garden of radius 8 m. Find the area outside the pond but inside the garden.","answer":"28π m²","solution":"Subtract the areas: π(8² − 6²) = 28π.","options":["28π m²","24π m²","64π m²","4π m²"],"level":"Foundation","id":"VM-CIR-016"},{"skill":"Circumference","prompt":"A circle has radius 7 cm. Find its circumference exactly.","answer":"14π cm","solution":"C = 2πr = 14π cm.","options":["14π cm","7π cm","28π cm","15π cm"],"level":"Core","id":"VM-CIR-017"},{"skill":"Area","prompt":"Find the exact area of a circle with diameter 14 cm.","answer":"49π cm²","solution":"Radius = 7 cm. A = πr².","options":["49π cm²","196π cm²","50π cm²","98π cm²"],"level":"Core","id":"VM-CIR-018"},{"skill":"Semicircles","prompt":"Find the perimeter of a semicircle of radius 8 cm, including its straight edge.","answer":"8π + 16 cm","solution":"Half the circumference is 8π; add diameter 16.","options":["8π + 16 cm","8π cm","16π + 16 cm","8π + 8 cm"],"level":"Core","id":"VM-CIR-023"},{"skill":"Composite areas","prompt":"A circular pond of radius 8 m sits inside a circular garden of radius 10 m. Find the area outside the pond but inside the garden.","answer":"36π m²","solution":"Subtract the areas: π(10² − 8²) = 36π.","options":["36π m²","32π m²","100π m²","4π m²"],"level":"Core","id":"VM-CIR-024"},{"skill":"Circumference","prompt":"A circle has radius 9 cm. Find its circumference exactly.","answer":"18π cm","solution":"C = 2πr = 18π cm.","options":["18π cm","9π cm","36π cm","19π cm"],"level":"Core","id":"VM-CIR-025"},{"skill":"Area","prompt":"Find the exact area of a circle with diameter 18 cm.","answer":"81π cm²","solution":"Radius = 9 cm. A = πr².","options":["81π cm²","324π cm²","82π cm²","162π cm²"],"level":"Core","id":"VM-CIR-026"},{"skill":"Semicircles","prompt":"Find the perimeter of a semicircle of radius 10 cm, including its straight edge.","answer":"10π + 20 cm","solution":"Half the circumference is 10π; add diameter 20.","options":["10π + 20 cm","10π cm","20π + 20 cm","10π + 10 cm"],"level":"Core","id":"VM-CIR-031"},{"skill":"Composite areas","prompt":"A circular pond of radius 10 m sits inside a circular garden of radius 12 m. Find the area outside the pond but inside the garden.","answer":"44π m²","solution":"Subtract the areas: π(12² − 10²) = 44π.","options":["44π m²","40π m²","144π m²","4π m²"],"level":"Core","id":"VM-CIR-032"},{"skill":"Circumference","prompt":"A circle has radius 11 cm. Find its circumference exactly.","answer":"22π cm","solution":"C = 2πr = 22π cm.","options":["22π cm","11π cm","44π cm","23π cm"],"level":"Extension","id":"VM-CIR-033"},{"skill":"Area","prompt":"Find the exact area of a circle with diameter 22 cm.","answer":"121π cm²","solution":"Radius = 11 cm. A = πr².","options":["121π cm²","484π cm²","122π cm²","242π cm²"],"level":"Extension","id":"VM-CIR-034"},{"skill":"Semicircles","prompt":"Find the perimeter of a semicircle of radius 12 cm, including its straight edge.","answer":"12π + 24 cm","solution":"Half the circumference is 12π; add diameter 24.","options":["12π + 24 cm","12π cm","24π + 24 cm","12π + 12 cm"],"level":"Extension","id":"VM-CIR-039"},{"skill":"Composite areas","prompt":"A circular pond of radius 12 m sits inside a circular garden of radius 14 m. Find the area outside the pond but inside the garden.","answer":"52π m²","solution":"Subtract the areas: π(14² − 12²) = 52π.","options":["52π m²","48π m²","196π m²","4π m²"],"level":"Extension","id":"VM-CIR-040"},{"skill":"Circumference","prompt":"A circle has radius 13 cm. Find its circumference exactly.","answer":"26π cm","solution":"C = 2πr = 26π cm.","options":["26π cm","13π cm","52π cm","27π cm"],"level":"Extension","id":"VM-CIR-041"},{"skill":"Area","prompt":"Find the exact area of a circle with diameter 26 cm.","answer":"169π cm²","solution":"Radius = 13 cm. A = πr².","options":["169π cm²","676π cm²","170π cm²","338π cm²"],"level":"Extension","id":"VM-CIR-042"},{"skill":"Semicircles","prompt":"Find the perimeter of a semicircle of radius 14 cm, including its straight edge.","answer":"14π + 28 cm","solution":"Half the circumference is 14π; add diameter 28.","options":["14π + 28 cm","14π cm","28π + 28 cm","14π + 14 cm"],"level":"Extension","id":"VM-CIR-047"},{"skill":"Composite areas","prompt":"A circular pond of radius 14 m sits inside a circular garden of radius 16 m. Find the area outside the pond but inside the garden.","answer":"60π m²","solution":"Subtract the areas: π(16² − 14²) = 60π.","options":["60π m²","56π m²","256π m²","4π m²"],"level":"Extension","id":"VM-CIR-048"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
