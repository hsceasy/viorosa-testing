<!DOCTYPE html>

<html lang="en-AU"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Directed and weighted networks | Viorosa Maths</title><meta content="Vertices are points and edges connect them. Degree counts incident edge ends; a loop counts twice." name="description"/><link href="https://viorosamaths.com/maths-standard/year-11/introduction-to-networks/vertices-edges-and-degree.html" rel="canonical"/><style>body{font:17px/1.65 system-ui,sans-serif;color:#493b50;background:#fffaf5;margin:0}main{max-width:820px;margin:auto;padding:28px}h1,h2{color:#654c70;line-height:1.25}a{color:#654c70}article,.example{background:white;border:1px solid #eadce7;border-radius:18px;padding:20px;margin:18px 0}.example{background:#f5edf8}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .15em}.frac span:first-child{border-bottom:1px solid}.note{background:#fff0d7;padding:16px;border-radius:12px}svg{max-width:100%;height:auto}</style><style>.hub-back{display:inline-block;padding:8px 14px;border:1px solid #dbc8e3;border-radius:12px;background:#fff;color:#884056;text-decoration:none;font-weight:700}.vm-simple-brand{color:#884056;font-size:12px;font-weight:800;letter-spacing:.16em}button{font:inherit;padding:10px 16px;border:1px solid #dbc8e3;border-radius:12px;background:#f1e5f4;color:#654c70}</style></head><body><main><a class="hub-back" href="../../../year11_standard_introduction_to_networks_hub.html">← Back to topic hub</a><p class="vm-simple-brand">VIOROSA MATHS · YEAR 11 · MATHEMATICS STANDARD</p><h1>Directed and weighted networks</h1><article><p>Arrows show permitted travel direction; weights represent quantities such as kilometres. In the directed example A → B → C has weight 2 + 3 = 5, less than the direct A → C edge of weight 8.</p><svg aria-label="Directed edges A to B weight 2, B to C weight 3, A to C weight 8" role="img" viewbox="0 0 320 180"><defs><marker id="vm-arrow" markerheight="8" markerwidth="8" orient="auto" refx="7" refy="4"><path d="M0 0L8 4L0 8Z" fill="#654c70"></path></marker></defs><g marker-end="url(#vm-arrow)" stroke="#654c70" stroke-width="2"><path d="M53 125L145 43"></path><path d="M175 43L267 125"></path><path d="M60 140H260"></path></g><g fill="#f0e6f5" stroke="#654c70"><circle cx="40" cy="140" r="18"></circle><circle cx="160" cy="30" r="18"></circle><circle cx="280" cy="140" r="18"></circle></g><g fill="#50404b" text-anchor="middle"><text x="40" y="145">A</text><text x="160" y="35">B</text><text x="280" y="145">C</text><text x="90" y="75">2</text><text x="230" y="75">3</text><text x="160" y="158">8</text></g></svg></article><label style="display:block;padding:16px;background:#f2e9f6;border-radius:12px;margin:18px 0"><input id="vm-complete" type="checkbox"/> Mark lesson as complete</label><p id="vm-status" role="status"></p></main><script>(()=>{const key='viorosa:year11:introduction-to-networks:split-v1';let state={rose:[],violet:[]};try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.rose)&&Array.isArray(x.violet))state=x}catch{};const pct=k=>Math.min(100,Math.round((k==='rose'?state.rose.filter(x=>x.startsWith('lesson:')).length:state.violet.length)/(k==='rose'?6:20)*100));window.vmGrow=(k,id)=>{try{const latest=JSON.parse(localStorage.getItem(key));if(latest)for(const k of ['rose','violet'])state[k]=[...new Set([...state[k],...(Array.isArray(latest[k])?latest[k]:[])])]}catch{};if(!state[k].includes(id)){state[k].push(id);try{localStorage.setItem(key,JSON.stringify(state))}catch{};if(!document.querySelector('#vm-complete'))draw()}};const slug=location.pathname.split('/').pop().replace('.html','');const complete=document.querySelector('#vm-complete');if(complete){const id='lesson:'+(complete.dataset.lesson||slug);const update=()=>{complete.checked=state.rose.includes(id);complete.disabled=complete.checked;document.querySelector('#vm-status').textContent=complete.disabled?'Lesson completed. Your rose has grown.':''};complete.addEventListener('click',()=>{vmGrow('rose',id);update()});update();return}const garden=document.createElement('div');garden.className='vm-garden';document.querySelector('.wrap').prepend(garden);function flower(k){const p=pct(k),rose=k==='rose',h=25+p*2.05,scale=Math.max(.12,p/100),petals=Array.from({length:5},(_,i)=>`<ellipse cy="-13" rx="${rose?17:12}" ry="${rose?21:19}" transform="rotate(${i*72})" fill="${rose?'#dca0b0':'#a18ac5'}" stroke="${rose?'#c38a9a':'#8f76b7'}" stroke-width=".7"/>`).join('');return `<div class="vm-flower ${rose?'left':'right'}" role="img" aria-label="${rose?'Knowledge':'Confidence'} ${p}%"><svg viewBox="0 0 100 310"><ellipse cx="50" cy="292" rx="23" ry="3" fill="#e6dccc"/><path d="M50 290 Q${rose?35:65} ${290-h/2} 50 ${290-h}" stroke="#839b74" stroke-width="2" fill="none"/>${[.25,.5,.75].map((t,i)=>p>=10+i*20?`<path d="M50 ${290-h*t} q${i%2?30:-30} -32 ${i%2?34:-34} -24 q${i%2?-5:5} 20 ${i%2?-34:34} 24" fill="#9fb18b"/>`:'').join('')}<g transform="translate(50 ${290-h}) scale(${scale})" opacity="${p>=25?1:0}">${petals}${rose?'<path d="M-12 0 Q-20 -17 3 -19 Q24 -9 12 9 Q-4 20 -10 3 Q-12 -8 4 -9 Q15 -2 3 6" fill="#edb8c5" stroke="#b9758d" stroke-width="1.5"/>':'<circle r="5" fill="#e9cb7d"/>'}</g></svg>${rose?'Knowledge':'Confidence'} · ${p}%</div>`}function draw(){garden.innerHTML=flower('rose')+flower('violet');document.querySelectorAll('.vm-note-card').forEach(a=>a.dataset.complete=state.rose.includes('lesson:'+a.href.split('/').pop().replace('.html','')))}draw();function attach(){document.querySelectorAll('#skills .question[data-q],#exam .question[data-q],#mini .question[data-q]').forEach(q=>{if(q.querySelector('.vm-done'))return;const b=document.createElement('button');b.type='button';b.className='btn secondary vm-done';const id='bank:'+q.dataset.q;const update=()=>{b.disabled=state.violet.includes(id);b.textContent=b.disabled?'Practice completed':'Mark attempted and reviewed'};b.onclick=()=>{vmGrow('violet',id);update();attach()};(q.querySelector('.toolbar')||q).append(b);update()})}attach();document.addEventListener('click',()=>attach());document.addEventListener('change',()=>attach());})();
</script></body></html>
