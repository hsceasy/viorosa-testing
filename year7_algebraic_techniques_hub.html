 factorising</option><option>Applications</option></select></label><label>Skill <select id="skill"></select></label><label>Difficulty <select id="difficulty"><option>All</option><option>Foundation</option><option>Core</option><option>Extension</option></select></label></div><button id="newtest" hidden>New mini-test</button><div id="questions"></div></main><script>const bank=[{"id": "VM-ALG-001", "section": "Skill practice", "group": "Language", "skill": "Algebraic language and notation", "prompt": "Write 2 × x × x using algebraic notation.", "answer": "2x<sup>2</sup>", "solution": "Write the numerical factor first. Two factors of x give x<sup>2</sup>.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-002", "section": "Skill practice", "group": "Language", "skill": "Writing algebraic expressions", "prompt": "Write an expression for 3 less than 2 times x.", "answer": "2x − 3", "solution": "Multiply x by 2, then subtract 3.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-003", "section": "Skill practice", "group": "Language", "skill": "Terms, coefficients and constants", "prompt": "Identify the coefficient of x and the constant in −2x + 3.", "answer": "−2; 3", "solution": "The signed multiplier is −2; the term without a variable is 3.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-004", "section": "Skill practice", "group": "Simplifying", "skill": "Collecting like terms", "prompt": "Write and simplify the expression represented by these tiles. <svg role=\"img\" aria-label=\"Algebra tiles: long rectangles represent x and small squares represent one\" viewBox=\"0 0 320 100\" width=\"320\"><rect x=\"8\" y=\"8\" width=\"42\" height= ne common nonzero variable factor.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-007", "section": "Skill practice", "group": "Substitution and fractions", "skill": "Substitution", "prompt": "Evaluate 2x<sup>2</sup> − 3 when x = −4.", "answer": "29", "solution": "Substitute using brackets: 2 × (−4)<sup>2</sup> − 3 = 32 − 3.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-008", "section": "Skill practice", "group": "Substitution and fractions", "skill": "Expressions involving fractions", "prompt": "Simplify <span class=\"frac\"><span>2x</span><span>3</span></span> + <span class=\"frac\"><span>3x</span><span>3</span></span>.", "answer": "<span class=\"frac\"><span>5x</span><span>3</span></span>", "solution": "The denominators match, so add the numerators: (2 + 3)x.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-009", "section": "Skill practice", "group": "Expanding and factorising", "skill": "Expanding single brackets", "prompt": "Use the area model to expand 3(x + 4). <svg role=\"img\" aria-label=\"Rectangle of height 3, split into widths x and 4\" viewBox=\"0 0 320 140\" width=\"320\"><rect x=\"40\" y=\"35\" width=\"170\" height=\"85\" fill=\"#c7dac0\" stroke=\"#526b55\"/><rect x=\"210\" y=\"35\" width=\"85\" height=\"85\" fill=\"#f5c8d7\" stroke=\"#8c5269\"/><g text-anchor=\"middle\" fill=\"#493843\"><text x=\"125\" y=\"25\">x</text><text x=\"252\" y=\"25\">4</text><text x=\"20\" y=\"80\">3</text><text x=\"125\" y=\"80\">?</text><text x=\"252\" y=\"80\">?</text></g></svg>", "answer": "3x + 12", "solution": "Multiply each width by the height: 3 × x = 3x and 3 × 4 = 12. Add the areas.", "difficulty": "Foundation", "review_s nswer": "Eight less than five times a.", "solution": "Multiply a by five before subtracting eight.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-015", "section": "Skill practice", "group": "Language", "skill": "Terms, coefficients and constants", "prompt": "Identify the coefficient of y and the constant in −3y + 4.", "answer": "−3; 4", "solution": "The signed multiplier is −3; the term without a variable is 4.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-016", "section": "Skill practice", "group": "Simplifying", "skill": "Collecting like terms", "prompt": "Simplify 3y + 4 − 5y + 3.", "answer": "−2y + 7", "solution": "Combine variable coefficients: 3 − 5 = −2. Combine constants: 4 + 3 = 7.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-017", "section": "Skill practice", "group": "Simplifying", "skill": "Multiplying algebraic terms", "prompt": "Simplify 3y × 4y.", "answer": "12y<sup>2</sup>", "solution": "Multiply coefficients: 3 × 4 = 12. Multiply the variables.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-018", "section": "Skill practice", "group": "Simplifying", "skill": "Dividing algebraic terms", "prompt": "Simplify <span class=\"frac\"><span>12y<sup>2</sup></span><span>3y</span></span> for y ≠ 0.", "answer": "4y", "solution": "Divide coefficients: 12 ÷ 3 = 4. Cancel one common nonzero variable factor.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-019", "section": "Skill practice", "group": "Substitution and fractions", "skill": "Generating number patterns", "prompt": "List the first five terms of 3n + 2 for n = 1, 2, 3, 4, 5.", "answer": "5, 8, 11, 14, 17", "solution": "Substitute each value of n. Each increase of one in n adds three.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-020", "section": "Skill practice", "group": "Substitution and fractions", "skill": "Expressions involving fractions", "prompt": "Simplify <span class=\"frac\"><span>3y</span><span>3</span></span> + <span class=\"frac\"><span>4y</span><span>3</span></span>.", "answer": "<span class=\"frac\"><span>7y</span><span>3</span></span>", "solution": "The denominators match, so add the numerators: (3 + 4)y.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-021", "section": "Skill practice", "group": "Expanding and factorising", "skill": "Expanding single brackets", "prompt": "Expand −3(y − 4).", "answer": "−3y + 12", "solution": "Multiply each term by −3. The product of two negative numbers is positive.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-022", "section": "Skill practice", "group": "Expanding and factorising", "skill": "Factorising common factors", "prompt": "Factorise 12y + 15 fully.", "answer": "3(4y + 5)", "solution": "The highest common factor is 3, since 4 and 5 are consecutive. Divide each term by 3.", "difficulty": "Foundation", "review_status": "mathematics_reviewed", "curriculum_candidates": ["NSW Stage 4 algebraic techniques (provisional)"]}, {"id": "VM-ALG-023", "section": "Skill practice", "group": "Applications", "skill": "Practical formulae", "prompt": "Use F = <span class=\"frac\"><span>9</span><span>5</span></ or(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}test=a.slice(0,10);}function render(){for(const b of $('nav').children)b.setAttribute('aria-pressed',b.textContent===section);$('newtest').hidden=section!=='Mini-tests';let qs=section==='Mini-tests'?test:pool().filter(q=>q.section===section);$('questions').replaceChildren();for(const q of qs){let a=document.createElement('article');let h=document.createElement('small');h.textContent=q.skill+' · '+q.difficulty;let p=document.createElement('div');p.innerHTML=q.prompt;let d=document.createElement('details');let sm=document.createElement('summary');sm.textContent='Show worked solution';let w=document.createElement('p');w.innerHTML=q.solution+' <strong>Answer:</strong> '+q.answer;d.append(sm,w);if(section==='Worked examples')d.open=true;a.append(h,p,d);$('questions').append(a);}if(!qs.length)$('questions').textContent='No questions match these filters.';}for(const s of sections){let b=document.createElement('button');b.textContent=s;b.onclick=()=>{section=s;if(s==='Mini-tests')sample();render();};$('nav').append(b);}for(const s of ['All',...new Set(bank.map(q=>q.skill))])$('skill').add(new Option(s,s));for(const id of ['skill','difficulty','group'])$(id).onchange=()=>{if(section==='Mini-tests')sample();render();};$('newtest').onclick=()=>{sample();render();};$('move').onclick=draw;draw();render();</script></html>
