<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equations Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year8_equations_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Equations</h1><p>Answer all 24 questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"skill":"Two-step equations","prompt":"Solve 3x + 3 = 12.","answer":"3","solution":"Subtract 3, then divide 9 by 3.","options":["3","4","9","-3"],"level":"Foundation","id":"VM-EQ-181"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 3 = 2x + 6.","answer":"3","solution":"Subtract 2x and add 3: 3x = 9.","options":["3","5","9","-3"],"level":"Foundation","id":"VM-EQ-182"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 4.","answer":"10","solution":"Multiply by 3: x + 2 = 12. Subtract 2.","options":["10","14","2","12"],"level":"Foundation","id":"VM-EQ-187"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 4 cm. Its perimeter is 24 cm. Find its width.","answer":"4 cm","solution":"2w + 2(w + 4) = 24; 4w = 16; w = 4.","options":["4 cm","8 cm","12 cm","5 cm"],"level":"Foundation","id":"VM-EQ-188"},{"skill":"Two-step equations","prompt":"Solve 3x + 5 = 20.","answer":"5","solution":"Subtract 5, then divide 15 by 3.","options":["5","6","15","-5"],"level":"Foundation","id":"VM-EQ-189"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 5 = 2x + 10.","answer":"5","solution":"Subtract 2x and add 5: 3x = 15.","options":["5","7","15","-5"],"level":"Foundation","id":"VM-EQ-190"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 6.","answer":"16","solution":"Multiply by 3: x + 2 = 18. Subtract 2.","options":["16","20","4","18"],"level":"Foundation","id":"VM-EQ-195"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 6 cm. Its perimeter is 36 cm. Find its width.","answer":"6 cm","solution":"2w + 2(w + 6) = 36; 4w = 24; w = 6.","options":["6 cm","12 cm","18 cm","7 cm"],"level":"Foundation","id":"VM-EQ-196"},{"skill":"Two-step equations","prompt":"Solve 3x + 7 = 28.","answer":"7","solution":"Subtract 7, then divide 21 by 3.","options":["7","8","21","-7"],"level":"Core","id":"VM-EQ-197"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 7 = 2x + 14.","answer":"7","solution":"Subtract 2x and add 7: 3x = 21.","options":["7","9","21","-7"],"level":"Core","id":"VM-EQ-198"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 8.","answer":"22","solution":"Multiply by 3: x + 2 = 24. Subtract 2.","options":["22","26","6","24"],"level":"Core","id":"VM-EQ-203"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 8 cm. Its perimeter is 48 cm. Find its width.","answer":"8 cm","solution":"2w + 2(w + 8) = 48; 4w = 32; w = 8.","options":["8 cm","16 cm","24 cm","9 cm"],"level":"Core","id":"VM-EQ-204"},{"skill":"Two-step equations","prompt":"Solve 3x + 9 = 36.","answer":"9","solution":"Subtract 9, then divide 27 by 3.","options":["9","10","27","-9"],"level":"Core","id":"VM-EQ-205"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 9 = 2x + 18.","answer":"9","solution":"Subtract 2x and add 9: 3x = 27.","options":["9","11","27","-9"],"level":"Core","id":"VM-EQ-206"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 10.","answer":"28","solution":"Multiply by 3: x + 2 = 30. Subtract 2.","options":["28","32","8","30"],"level":"Core","id":"VM-EQ-211"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 10 cm. Its perimeter is 60 cm. Find its width.","answer":"10 cm","solution":"2w + 2(w + 10) = 60; 4w = 40; w = 10.","options":["10 cm","20 cm","30 cm","11 cm"],"level":"Core","id":"VM-EQ-212"},{"skill":"Two-step equations","prompt":"Solve 3x + 11 = 44.","answer":"11","solution":"Subtract 11, then divide 33 by 3.","options":["11","12","33","-11"],"level":"Extension","id":"VM-EQ-213"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 11 = 2x + 22.","answer":"11","solution":"Subtract 2x and add 11: 3x = 33.","options":["11","13","33","-11"],"level":"Extension","id":"VM-EQ-214"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 12.","answer":"34","solution":"Multiply by 3: x + 2 = 36. Subtract 2.","options":["34","38","10","36"],"level":"Extension","id":"VM-EQ-219"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 12 cm. Its perimeter is 72 cm. Find its width.","answer":"12 cm","solution":"2w + 2(w + 12) = 72; 4w = 48; w = 12.","options":["12 cm","24 cm","36 cm","13 cm"],"level":"Extension","id":"VM-EQ-220"},{"skill":"Two-step equations","prompt":"Solve 3x + 13 = 52.","answer":"13","solution":"Subtract 13, then divide 39 by 3.","options":["13","14","39","-13"],"level":"Extension","id":"VM-EQ-221"},{"skill":"Unknown on both sides","prompt":"Solve 5x − 13 = 2x + 26.","answer":"13","solution":"Subtract 2x and add 13: 3x = 39.","options":["13","15","39","-13"],"level":"Extension","id":"VM-EQ-222"},{"skill":"Fractional equations","prompt":"Solve <span class=\"frac\"><span>x + 2</span><span>3</span></span> = 14.","answer":"40","solution":"Multiply by 3: x + 2 = 42. Subtract 2.","options":["40","44","12","42"],"level":"Extension","id":"VM-EQ-227"},{"skill":"Word problems","prompt":"A rectangle has width w and length w + 14 cm. Its perimeter is 84 cm. Find its width.","answer":"14 cm","solution":"2w + 2(w + 14) = 84; 4w = 56; w = 14.","options":["14 cm","28 cm","42 cm","15 cm"],"level":"Extension","id":"VM-EQ-228"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
