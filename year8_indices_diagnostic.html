<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indices and Powers Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year8_indices_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Indices and Powers</h1><p>Answer all eight questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"prompt":"Evaluate 3⁴.","answer":"81","options":["81","12","64","27"],"solution":"3 × 3 × 3 × 3 = 81.","skill":"Powers","id":"VM-IND-025"},{"prompt":"Simplify x³ × x⁵.","answer":"x⁸","options":["x⁸","x¹⁵","x²","2x⁸"],"solution":"Add indices with the same base.","skill":"Index laws","id":"VM-IND-026"},{"prompt":"Simplify (a³)².","answer":"a⁶","options":["a⁶","a⁵","a⁹","2a³"],"solution":"Multiply the indices.","skill":"Index laws","id":"VM-IND-027"},{"prompt":"Evaluate 7⁰.","answer":"1","options":["1","0","7","70"],"solution":"A nonzero base to power zero equals 1.","skill":"Zero index","id":"VM-IND-028"},{"prompt":"Find ∛125.","answer":"5","options":["5","25","15","−5"],"solution":"5³ = 125.","skill":"Roots","id":"VM-IND-029"},{"prompt":"Evaluate (−2)⁴.","answer":"16","options":["16","−16","8","−8"],"solution":"Four negative factors give a positive product.","skill":"Powers","id":"VM-IND-030"},{"prompt":"Simplify b⁹ ÷ b⁴, b ≠ 0.","answer":"b⁵","options":["b⁵","b¹³","b³⁶","b⁴"],"solution":"Subtract the indices.","skill":"Index laws","id":"VM-IND-031"},{"prompt":"Which is equal to 2⁶?","answer":"4³","options":["4³","4²","8³","6²"],"solution":"Both 2⁶ and 4³ equal 64.","skill":"Powers","id":"VM-IND-032"},{"skill":"Powers","prompt":"Evaluate 2³.","answer":"8","options":["8","4","10","9"],"solution":"2 × 2 × 2 = 8.","level":"Foundation","id":"VM-IND-038"},{"skill":"Index laws","prompt":"Simplify x<sup>6</sup> ÷ x<sup>2</sup>, x ≠ 0.","answer":"x⁴","options":["x⁴","x<sup>8</sup>","x²","x⁰"],"solution":"Subtract exponents: 6 − 2 = 4.","level":"Intermediate","id":"VM-IND-039"},{"skill":"Powers of products","prompt":"Simplify (2a²)³.","answer":"8a⁶","options":["8a⁶","9a⁶","8a⁵","8a⁸"],"solution":"Cube 2 and multiply the exponent of a by 3.","level":"Intermediate","id":"VM-IND-040"},{"skill":"Roots","prompt":"Find the positive square root of 81.","answer":"9","options":["9","8","10","18"],"solution":"9 × 9 = 81.","level":"Foundation","id":"VM-IND-041"},{"skill":"Powers","prompt":"Evaluate 3³.","answer":"27","options":["27","9","29","28"],"solution":"3 × 3 × 3 = 27.","level":"Foundation","id":"VM-IND-042"},{"skill":"Index laws","prompt":"Simplify x<sup>7</sup> ÷ x<sup>3</sup>, x ≠ 0.","answer":"x⁴","options":["x⁴","x<sup>10</sup>","x²","x⁰"],"solution":"Subtract exponents: 7 − 3 = 4.","level":"Intermediate","id":"VM-IND-043"},{"skill":"Powers of products","prompt":"Simplify (3a²)³.","answer":"27a⁶","options":["27a⁶","28a⁶","27a⁵","27a⁸"],"solution":"Cube 3 and multiply the exponent of a by 3.","level":"Intermediate","id":"VM-IND-044"},{"skill":"Roots","prompt":"Find the positive square root of 100.","answer":"10","options":["10","9","11","20"],"solution":"10 × 10 = 100.","level":"Foundation","id":"VM-IND-045"},{"skill":"Powers","prompt":"Evaluate 4³.","answer":"64","options":["64","16","66","65"],"solution":"4 × 4 × 4 = 64.","level":"Foundation","id":"VM-IND-046"},{"skill":"Index laws","prompt":"Simplify x<sup>8</sup> ÷ x<sup>4</sup>, x ≠ 0.","answer":"x⁴","options":["x⁴","x<sup>12</sup>","x²","x⁰"],"solution":"Subtract exponents: 8 − 4 = 4.","level":"Intermediate","id":"VM-IND-047"},{"skill":"Powers of products","prompt":"Simplify (4a²)³.","answer":"64a⁶","options":["64a⁶","65a⁶","64a⁵","64a⁸"],"solution":"Cube 4 and multiply the exponent of a by 3.","level":"Intermediate","id":"VM-IND-048"},{"skill":"Roots","prompt":"Find the positive square root of 121.","answer":"11","options":["11","10","12","22"],"solution":"11 × 11 = 121.","level":"Foundation","id":"VM-IND-049"},{"skill":"Powers","prompt":"Evaluate 5³.","answer":"125","options":["125","25","127","126"],"solution":"5 × 5 × 5 = 125.","level":"Foundation","id":"VM-IND-050"},{"skill":"Index laws","prompt":"Simplify x<sup>9</sup> ÷ x<sup>5</sup>, x ≠ 0.","answer":"x⁴","options":["x⁴","x<sup>14</sup>","x²","x⁰"],"solution":"Subtract exponents: 9 − 5 = 4.","level":"Intermediate","id":"VM-IND-051"},{"skill":"Powers of products","prompt":"Simplify (5a²)³.","answer":"125a⁶","options":["125a⁶","126a⁶","125a⁵","125a⁸"],"solution":"Cube 5 and multiply the exponent of a by 3.","level":"Intermediate","id":"VM-IND-052"},{"skill":"Roots","prompt":"Find the positive square root of 144.","answer":"12","options":["12","11","13","24"],"solution":"12 × 12 = 144.","level":"Foundation","id":"VM-IND-053"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
