<meta name="description" content="Explore visual reasoning resources for Year 10 mathematics."><style>body{font:16px system-ui;background:#faf5f8;color:#493b49;margin:0}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #e6d5e2;border-radius:18px;padding:20px}h1{color:#80516a}label{display:block;margin:12px 0}input{width:100%;accent-color:#a65d87}select,button{font:inherit;padding:8px;max-width:100%}svg{width:100%;height:auto}output{display:block;background:#f5eaf1;padding:16px;border-radius:10px}a{color:#80516a}</style><main><p><a href="../index.html">Back to Year 10 Core</a></p><small>VIOROSA MATHS · YEAR 10 CORE</small><h1>Visual reasoning gallery</h1><p><a href="index.html">Back to original visual lab</a></p><label for="mode">Activity</label><select id="mode"></select><section><h2 id="heading"></h2><label for="a" id="la"></label><input type="range" id="a"><label for="b" id="lb"></label><input type="range" id="b"><svg id="pic" viewBox="0 0 400 300" role="img" aria-labelledby="heading"></svg><output id="out" aria-live="polite"></output><p id="task"></p><button id="reset">Reset values</button></section></main><script>
const $=id=>document.getElementById(id), f=n=>Number(n.toFixed(3)), rad=n=>n*Math.PI/180;
const cfg=[['Bearings','Bearing (degrees)',0,359,1,60,'Distance (km)',1,20,1,10],['Exponential growth and decay','Initial value',1,10,1,4,'Multiplier',0.5,1.5,0.1,1.2],['Composite L-shaped area','Outer width (cm)',5,12,1,8,'Cut-out width (cm)',1,4,1,3],['Rectangular prism net','Length (cm)',2,8,1,5,'Width (cm)',2,6,1,3],['Parallel lines and transversals','Acute angle (degrees)',20,80,1,50,'Parallel line separation',40,90,5,60],['Probability without replacement','Pink counters',2,10,1,4,'Purple counters',2,10,1,6]];
const line=(x,y,X,Y,d='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="#80617e" stroke-width="2" ${d}/>`;const txt=(x,y,t)=>`<text x="${x}" y="${y}" font-size="12" fill="#493b49">${t}</text>`;const rect=(x,y,w,h,c='#ead8e9')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" stroke="#80617e" stroke-width="1.5"/>`;
function draw(){let i=+$('mode').value,a=+$('a').value,b=+$('b').value,s='',o='',q='';$('la').textContent=cfg[i][1]+': '+a;$('lb').textContent=cfg[i][6]+': '+b;switch(i){case 0:{let r=5*b,x=200+r*Math.sin(rad(a)),y=150-r*Math.cos(rad(a));s=line(200,150,200,25)+txt(195,18,'N')+line(200,150,x,y)+`<circle cx="${x}" cy="${y}" r="4" fill="#a65d87"/><path d="M200 115 A35 35 0 ${a>180?1:0} 1 ${200+35*Math.sin(rad(a))} ${150-35*Math.cos(rad(a))}" fill="none" stroke="#a65d87" stroke-width="2"/>`+txt(210,145,'O')+txt(15,275,`${String(a).padStart(3,'0')}° clockwise from north`);o=`East displacement: ${f(b*Math.sin(rad(a)))} km; north displacement: ${f(b*Math.cos(rad(a)))} km. Negative values indicate west or south.`;q='Predict the reverse bearing before calculating it: add 180° and reduce modulo 360°.';break;}case 1:{let max=Math.max(a,a*b**5),X=x=>45+60*x,Y=y=>245-200*y/max;s=line(45,245,350,245)+line(45,245,45,40);for(let j=0;j<=5;j++){s+=txt(X(j)-3,263,j)+txt(5,Y(max*j/5)+4,f(max*j/5));}s+=`<polyline points="${Array.from({length:101},(_,j)=>`${X(j/20)},${Y(a*b**(j/20))}`).join(' ')}" fill="none" stroke="#a65d87" stroke-width="3"/>`;o=`y = ${a} × ${b}^x; y at x = 5 is ${f(a*b**5)}. ${b>1?'Growth':b<1?'Decay':'Constant value'}.`;q='What happens to the graph when the multiplier is below 1?';break;}case 2:{let k=20,w=a*k,h=6*k,c=b*k,d=3*k;s=`<polygon points="60,60 ${60+w},60 ${60+w},${60+h-d} ${60+w-c},${60+h-d} ${60+w-c},${60+h} 60,${60+h}" fill="#ead8e9" stroke="#80617e" stroke-width="2"/>`+txt(60+w/2,50,a+' cm')+txt(10,120,'6 cm')+txt(60+w-c,60+h-d+16,b+' cm')+txt(60+w+5,60+h-d+30,'3 cm');o=`Area = ${a} × 6 − ${b} × 3 = ${6*a-3*b} cm².`;q='Find the area by splitting the shape into two rectangles instead.';break;}case 3:{let k=12,l=a*k,w=b*k,h=3*k,x=30,y=115;s=rect(x,y,l,h)+rect(x+l,y,w,h,'#dce9f3')+rect(x+l+w,y,l,h)+rect(x+2*l+w,y,w,h,'#dce9f3')+rect(x,y-w,l,w,'#e4eedc')+rect(x,y+h,l,w,'#e4eedc')+txt(x+4,y+20,`${a} × 3`)+txt(x+l+4,y+20,`${b} × 3`)+txt(x+4,y-w+18,`${a} × ${b}`);o=`Surface area = 2(${a} × ${b} + ${a} × 3 + ${b} × 3) = ${2*(a*b+3*a+3*b)} cm².`;q='Identify the three pairs of matching faces.';break;}case 4:{let y1=100,y2=100+b,dx=120,dy=dx*Math.tan(rad(a)),scale=Math.min(1,130/dy),xx=dx*scale,yy=dy*scale,mid=(y1+y2)/2;s=line(25,y1,375,y1)+line(25,y2,375,y2)+line(200-xx,mid+yy,200+xx,mid-yy);let x1=200+(mid-y1)/Math.tan(rad(a)),x2=200+(mid-y2)/Math.tan(rad(a));s= line(25,y1,375,y1)+line(25,y2,375,y2)+line(200-(mid-30)/Math.tan(rad(a)),30,200+(270-mid)/Math.tan(rad(a)),270);s=line(25,y1,375,y1)+line(25,y2,375,y2)+`<defs><clipPath id="cl"><rect x="10" y="10" width="380" height="280"/></clipPath></defs><g clip-path="url(#cl)">`+line(200+(mid-10)/Math.tan(rad(a)),10,200+(mid-290)/Math.tan(rad(a)),290)+'</g>'+txt(x1+8,y1-8,a+'°')+txt(x2+8,y2-8,a+'°');o=`Corresponding acute angles = ${a}°; adjacent obtuse angles = ${180-a}°.`;q='Explain why changing the separation does not change the angles.';break;}case 5:{let n=a+b;let probs=[a/n,b/n,(a-1)/(n-1),b/(n-1),a/(n-1),(b-1)/(n-1)];s=line(25,150,125,75)+line(25,150,125,225)+line(125,75,280,35)+line(125,75,280,115)+line(125,225,280,185)+line(125,225,280,265)+txt(45,95,`${a}/${n}`)+txt(45,215,`${b}/${n}`)+txt(185,45,`${a-1}/${n-1}`)+txt(185,110,`${b}/${n-1}`)+txt(185,185,`${a}/${n-1}`)+txt(185,260,`${b-1}/${n-1}`)+txt(290,35,'PP')+txt(290,115,'PQ')+txt(290,185,'QP')+txt(290,265,'QQ');o=`P = pink, Q = purple. Probability of two pink counters = ${a*(a-1)}/${n*(n-1)} ≈ ${f(probs[0]*probs[2])}. Probability of different colours ≈ ${f(2*a*b/(n*(n-1)))}.`;q='Why does the denominator decrease on the second draw?';break;}}$('pic').innerHTML=s;$('out').textContent=o;$('task').textContent=q;}
function setup(){let c=cfg[+$('mode').value];$('heading').textContent=c[0];for(let [id,j] of [['a',1],['b',6]]){let e=$(id);e.min=c[j+1];e.max=c[j+2];e.step=c[j+3];e.value=c[j+4];}draw();}cfg.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=c[0];$('mode').append(o)});$('mode').onchange=setup;$('a').oninput=$('b').oninput=draw;$('reset').onclick=setup;setup();</script></html>
