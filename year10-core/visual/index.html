<meta name="description" content="Explore Year 10 mathematics with interactive visual learning tools."><style>body{font:16px system-ui;color:#493b49;background:#faf5f8;margin:0}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #e6d5e2;border-radius:18px;padding:20px}select,button{font:inherit;padding:10px;max-width:100%}label{display:block;margin-top:16px}input{width:100%;accent-color:#a65d87}svg{width:100%;height:auto;background:#fff;border-radius:10px}output{display:block;background:#f5eaf1;padding:16px;border-radius:10px}h1{color:#80516a}</style><main><p><a href="../index.html">Back to Year 10 Core</a></p><small>VIOROSA MATHS · YEAR 10 CORE</small><h1>Interactive visual lab</h1><p><a href="gallery.html">Explore six additional visual activities</a></p><label for="topic">Learning hub</label><select id="topic"></select><section><h2 id="heading"></h2><label for="a"><span id="alabel"></span>: <span id="av"></span></label><input id="a" type="range"><label for="b"><span id="blabel"></span>: <span id="bv"></span></label><input id="b" type="range"><svg id="diagram" viewBox="0 0 400 280" role="img" aria-label="Interactive mathematical diagram"></svg><output id="result" aria-live="polite"></output><p><button id="reset">Reset values</button></p></section></main><script>const configs=[["FIN", "Financial Mathematics B", "Compound growth", "Initial balance ($)", 100, 2000, 100, 500, "Annual rate (%)", 0, 15, 1, 5], ["LIN", "Linear Relationships B", "Gradient and intercept", "Gradient", -4, 4, 1, 2, "Intercept", -5, 5, 1, 1], ["NLI", "Non-linear Relationships B", "Quadratic transformations", "Coefficient a", -3, 3, 1, 1, "Vertical shift", -5, 5, 1, 0], ["TRG", "Trigonometry B", "Right triangle explorer", "Horizontal distance (m)", 2, 20, 1, 8, "Angle (degrees)", 10, 70, 1, 35], ["ARE", "Area and Surface Area A", "Cylinder surface area", "Radius (cm)", 1, 10, 1, 3, "Height (cm)", 1, 15, 1, 7], ["VOL", "Volume A", "Rectangular prism", "Base side (cm)", 1, 10, 1, 4, "Height (cm)", 1, 15, 1, 6], ["GEO", "Properties of Geometrical Figures A", "Similar triangles", "Original base (cm)", 2, 10, 1, 4, "Scale factor", 1, 3, 0.25, 1.5], ["DAT", "Data Analysis B", "Scatter plot and association", "Trend slope", -2, 2, 0.25, 1, "Scatter amplitude", 0, 5, 0.5, 1], ["PRO", "Probability A", "Two independent trials", "Success probability (%)", 0, 100, 5, 40, "Second success probability (%)", 0, 100, 5, 60]]; const $=id=>document.getElementById(id); const fmt=x=>Number(x.toFixed(3)).toString(); const svg=$('diagram'); const line=(x,y,X,Y,c='#80617e')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${c}" stroke-width="2"/>`; const label=(x,y,t)=>`<text x="${x}" y="${y}" font-size="13" fill="#493b49">${t}</text>`; const poly=(pts)=>`<polygon points="${pts}" fill="#e9d8ec" stroke="#80617e" stroke-width="2"/>`; const ellipse=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#e9d8ec" stroke="#80617e" stroke-width="2"/>`; function graph(fn,xmin,xmax,ymin,ymax,dots=false){let X=x=>45+320*(x-xmin)/(xmax-xmin),Y=y=>245-205*(y-ymin)/(ymax-ymin);let s=line(45,245,365,245)+line(45,40,45,245);if(xmin<0&&xmax>0)s+=line(X(0),40,X(0),245,'#aaa');if(ymin<0&&ymax>0)s+=line(45,Y(0),365,Y(0),'#aaa');for(let i=0;i<=4;i++){let x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;s+=label(X(x)-8,263,fmt(x))+label(4,Y(y)+4,fmt(y));}let pts=[];for(let i=0;i<=(dots?9:100);i++){let x=xmin+(xmax-xmin)*i/(dots?9:100),y=fn(x,i);pts.push(`${X(x)},${Y(y)}`);if(dots)s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="4" fill="#80617e"/>`;}return s+(dots?'':`<polyline points="${pts.join(' ')}" fill="none" stroke="#a65d87" stroke-width="3"/>`);}
function draw(){let k=$('topic').value,a=+$('a').value,b=+$('b').value,s='',t='';$('av').textContent=a;$('bv').textContent=b;switch(k){case 'FIN':{let end=a*(1+b/100)**5;s=graph(x=>a*(1+b/100)**x,0,5,0,Math.max(end,1));t=`Balance after 5 years = $${end.toFixed(2)}; interest = $${(end-a).toFixed(2)}. Horizontal axis: years; vertical: dollars.`;break;}case 'LIN':s=graph(x=>a*x+b,-5,5,-25,25);t=`y = ${a}x + (${b}); gradient = ${a}; y-intercept = ${b}.`;break;case 'NLI':s=graph(x=>a*x*x+b,-4,4,-55,55);t=a===0?`y = ${b}: horizontal line, not a parabola.`:`y = ${a}x² + (${b}); vertex (0, ${b}).`;break;case 'TRG':{let h=a*Math.tan(b*Math.PI/180),f=190/Math.max(a,h),w=a*f,v=h*f;s=poly(`65,235 ${65+w},235 ${65+w},${235-v}`)+label(65,252,`${a} m`)+label(75,222,`${b}°`)+label(70+w,235-v/2,`${fmt(h)} m`);t=`Height = ${a} × tan(${b}°) = ${fmt(h)} m.`;break;}case 'ARE':{let r=12+5*a,h=25+8*b;s=`<rect x="${200-r}" y="65" width="${2*r}" height="${h}" fill="#e9d8ec" stroke="#80617e"/>`+ellipse(200,65+h,r,12)+ellipse(200,65,r,12)+line(200,65,200+r,65)+label(205,55,`r=${a}`)+label(210+r,65+h/2,`h=${b}`);t=`Total surface area = 2πr² + 2πrh = ${fmt(2*Math.PI*a*(a+b))} cm².`;break;}case 'VOL':{let w=30+10*a,h=20+8*b,d=w*.35;s=poly(`80,235 ${80+w},235 ${80+w},${235-h} 80,${235-h}`)+poly(`80,${235-h} ${80+d},${235-h-d} ${80+w+d},${235-h-d} ${80+w},${235-h}`)+poly(`${80+w},235 ${80+w+d},${235-d} ${80+w+d},${235-h-d} ${80+w},${235-h}`)+label(80,252,`base ${a} × ${a}`)+label(85+w+d,220-h/2,`h=${b}`);t=`Volume = ${a}² × ${b} = ${a*a*b} cm³.`;break;}case 'GEO':{let f=110/Math.max(a*b,a),w=a*f;s=poly(`15,235 ${15+w},235 15,${235-w*.75}`)+poly(`180,235 ${180+w*b},235 180,${235-w*b*.75}`)+label(15,255,`${a} cm`)+label(180,255,`${fmt(a*b)} cm`);t=`Corresponding base = ${a} × ${b} = ${fmt(a*b)} cm; area scale factor = ${fmt(b*b)}.`;break;}case 'DAT':{let noise=[.2,-.8,.6,-.3,1,-.7,.4,-1,.7,-.1];s=graph((x,i)=>a*x+b*noise[i],0,9,-24,24,true);t=`Ten illustrative paired observations. Trend slope ${a}; scatter amplitude ${b}. Increasing scatter can obscure association.`;break;}case 'PRO':{let p=a/100,q=b/100;s=line(35,140,145,65)+line(35,140,145,215)+line(145,65,285,35)+line(145,65,285,95)+line(145,215,285,185)+line(145,215,285,245)+label(70,90,fmt(p))+label(70,205,fmt(1-p))+label(200,40,fmt(q))+label(200,100,fmt(1-q))+label(200,180,fmt(q))+label(200,250,fmt(1-q))+label(290,35,'SS '+fmt(p*q))+label(290,95,'SF '+fmt(p*(1-q)))+label(290,185,'FS '+fmt((1-p)*q))+label(290,245,'FF '+fmt((1-p)*(1-q)));t=`P(both successes) = ${fmt(p*q)}; P(at least one) = ${fmt(1-(1-p)*(1-q))}. S = success, F = failure.`;break;}}svg.innerHTML=s;$('result').textContent=t;}function setup(){let c=configs.find(c=>c[0]===$('topic').value);$('heading').textContent=c[2];for(let [id,i] of [['a',3],['b',8]]){let e=$(id);$(id+'label').textContent=c[i];e.min=c[i+1];e.max=c[i+2];e.step=c[i+3];e.value=c[i+4];}draw();}for(let c of configs){let o=document.createElement('option');o.value=c[0];o.textContent=c[1];$('topic').append(o);}$('topic').onchange=setup;$('a').oninput=$('b').oninput=draw;$('reset').onclick=setup;setup();</script></html>
