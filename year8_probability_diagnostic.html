<!DOCTYPE html>
<html lang="en-AU"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Probability Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link href="viorosa-theme.css" rel="stylesheet"/><main class="wrap"><a href="year8_probability_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Probability</h1><p>Answer all eight questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"prompt": "Fair die: probability of rolling greater than 4?", "answer": "<span class=\"frac\"><span>1</span><span>3</span></span>", "options": ["<span class=\"frac\"><span>1</span><span>3</span></span>", "<span class=\"frac\"><span>1</span><span>6</span></span>", "<span class=\"frac\"><span>1</span><span>2</span></span>", "<span class=\"frac\"><span>2</span><span>3</span></span>"], "solution": "Two favourable outcomes out of six.", "skill": "Simple probability", "id": "VM-PRO-233"}, {"prompt": "Probability of an impossible event?", "answer": "0", "options": ["0", "1", "0.5", "−1"], "solution": "Impossible events have probability zero.", "skill": "Scale", "id": "VM-PRO-234"}, {"prompt": "If P(rain) = 0.3, P(no rain)?", "answer": "0.7", "options": ["0.7", "0.3", "1.3", "0.03"], "solution": "1 − 0.3 = 0.7.", "skill": "Complement", "id": "VM-PRO-235"}, {"prompt": "Two fair coins: probability of two heads?", "answer": "<span class=\"frac\"><span>1</span><span>4</span></span>", "options": ["<span class=\"frac\"><span>1</span><span>4</span></span>", "<span class=\"frac\"><span>1</span><span>2</span></span>", "<span class=\"frac\"><span>1</span><span>3</span></span>", "<span class=\"frac\"><span>3</span><span>4</span></span>"], "solution": "HH is one of four equally likely outcomes.", "skill": "Sample space", "id": "VM-PRO-236"}, {"prompt": "A spinner lands on red 18 times in 60 spins. Relative frequency?", "answer": "0.3", "options": ["0.3", "0.18", "0.6", "0.42"], "solution": "18 ÷ 60 = 0.3.", "skill": "Experimental probability", "id": "VM-PRO-237"}, {"prompt": "Bag: 3 red and 5 blue counters. Probability of blue?", "answer": "<span class=\"frac\"><span>5</span><span>8</span></span>", "options": ["<span class=\"frac\"><span>5</span><span>8</span></span>", "<span class=\"frac\"><span>3</span><span>8</span></span>", "<span class=\"frac\"><span>5</span><span>3</span></span>", "<span class=\"frac\"><span>1</span><span>5</span></span>"], "solution": "Five blue out of eight total.", "skill": "Simple probability", "id": "VM-PRO-238"}, {"prompt": "A fair coin is tossed 80 times. Expected heads?", "answer": "40", "options": ["40", "80", "20", "60"], "solution": "80 × 0.5 = 40.", "skill": "Expected frequency", "id": "VM-PRO-239"}, {"prompt": "Two fair coins: probability of exactly one head?", "answer": "<span class=\"frac\"><span>1</span><span>2</span></span>", "options": ["<span class=\"frac\"><span>1</span><span>2</span></span>", "<span class=\"frac\"><span>1</span><span>4</span></span>", "<span class=\"frac\"><span>3</span><span>4</span></span>", "1"], "solution": "HT and TH are two of four outcomes.", "skill": "Sample space", "id": "VM-PRO-240"}, {"skill": "Theoretical probability", "prompt": "A bag contains 2 red and 5 blue counters. One is chosen at random. Find P(red).", "answer": "<span class=\"frac\"><span>2</span><span>7</span></span>", "options": ["<span class=\"frac\"><span>2</span><span>7</span></span>", "<span class=\"frac\"><span>5</span><span>7</span></span>", "<span class=\"frac\"><span>2</span><span>8</span></span>", "<span class=\"frac\"><span>3</span><span>7</span></span>"], "solution": "2 favourable outcomes out of 7 equally likely counters.", "level": "Foundation", "id": "VM-PRO-247"}, {"skill": "Expected frequency", "prompt": "A fair spinner has 6 equal sectors, one green. Estimate green results in 120 spins.", "answer": "20", "options": ["20", "10", "40", "6"], "solution": "Divide 120 by 6.", "level": "Intermediate", "id": "VM-PRO-248"}, {"skill": "Complements", "prompt": "The probability of rain is 20%. Find the probability of no rain.", "answer": "80%", "options": ["80%", "21%", "85%", "100%"], "solution": "100% − 20% = 80%.", "level": "Intermediate", "id": "VM-PRO-249"}, {"skill": "Two-way tables", "prompt": "Of 40 students, 10 play chess, 12 play tennis and 4 play both. How many play neither?", "answer": "22", "options": ["22", "18", "14", "26"], "solution": "At least one: 10+12−4 = 18. Subtract from 40.", "level": "Advanced", "id": "VM-PRO-250"}, {"skill": "Theoretical probability", "prompt": "A bag contains 3 red and 6 blue counters. One is chosen at random. Find P(red).", "answer": "<span class=\"frac\"><span>3</span><span>9</span></span>", "options": ["<span class=\"frac\"><span>3</span><span>9</span></span>", "<span class=\"frac\"><span>6</span><span>9</span></span>", "<span class=\"frac\"><span>3</span><span>10</span></span>", "<span class=\"frac\"><span>4</span><span>9</span></span>"], "solution": "3 favourable outcomes out of 9 equally likely counters.", "level": "Foundation", "id": "VM-PRO-251"}, {"skill": "Expected frequency", "prompt": "A fair spinner has 7 equal sectors, one green. Estimate green results in 140 spins.", "answer": "20", "options": ["20", "10", "40", "7"], "solution": "Divide 140 by 7.", "level": "Intermediate", "id": "VM-PRO-252"}, {"skill": "Complements", "prompt": "The probability of rain is 30%. Find the probability of no rain.", "answer": "70%", "options": ["70%", "31%", "75%", "100%"], "solution": "100% − 30% = 70%.", "level": "Intermediate", "id": "VM-PRO-253"}, {"skill": "Two-way tables", "prompt": "Of 50 students, 15 play chess, 12 play tennis and 4 play both. How many play neither?", "answer": "27", "options": ["27", "23", "19", "31"], "solution": "At least one: 15+12−4 = 23. Subtract from 50.", "level": "Advanced", "id": "VM-PRO-254"}, {"skill": "Theoretical probability", "prompt": "A bag contains 4 red and 7 blue counters. One is chosen at random. Find P(red).", "answer": "<span class=\"frac\"><span>4</span><span>11</span></span>", "options": ["<span class=\"frac\"><span>4</span><span>11</span></span>", "<span class=\"frac\"><span>7</span><span>11</span></span>", "<span class=\"frac\"><span>4</span><span>12</span></span>", "<span class=\"frac\"><span>5</span><span>11</span></span>"], "solution": "4 favourable outcomes out of 11 equally likely counters.", "level": "Foundation", "id": "VM-PRO-255"}, {"skill": "Expected frequency", "prompt": "A fair spinner has 8 equal sectors, one green. Estimate green results in 160 spins.", "answer": "20", "options": ["20", "10", "40", "8"], "solution": "Divide 160 by 8.", "level": "Intermediate", "id": "VM-PRO-256"}, {"skill": "Complements", "prompt": "The probability of rain is 40%. Find the probability of no rain.", "answer": "60%", "options": ["60%", "41%", "65%", "100%"], "solution": "100% − 40% = 60%.", "level": "Intermediate", "id": "VM-PRO-257"}, {"skill": "Two-way tables", "prompt": "Of 60 students, 20 play chess, 12 play tennis and 4 play both. How many play neither?", "answer": "32", "options": ["32", "28", "24", "36"], "solution": "At least one: 20+12−4 = 28. Subtract from 60.", "level": "Advanced", "id": "VM-PRO-258"}, {"skill": "Theoretical probability", "prompt": "A bag contains 5 red and 8 blue counters. One is chosen at random. Find P(red).", "answer": "<span class=\"frac\"><span>5</span><span>13</span></span>", "options": ["<span class=\"frac\"><span>5</span><span>13</span></span>", "<span class=\"frac\"><span>8</span><span>13</span></span>", "<span class=\"frac\"><span>5</span><span>14</span></span>", "<span class=\"frac\"><span>6</span><span>13</span></span>"], "solution": "5 favourable outcomes out of 13 equally likely counters.", "level": "Foundation", "id": "VM-PRO-259"}, {"skill": "Expected frequency", "prompt": "A fair spinner has 9 equal sectors, one green. Estimate green results in 180 spins.", "answer": "20", "options": ["20", "10", "40", "9"], "solution": "Divide 180 by 9.", "level": "Intermediate", "id": "VM-PRO-260"}, {"skill": "Complements", "prompt": "The probability of rain is 50%. Find the probability of no rain.", "answer": "50%", "options": ["50%", "51%", "55%", "100%"], "solution": "100% − 50% = 50%.", "level": "Intermediate", "id": "VM-PRO-261"}, {"skill": "Two-way tables", "prompt": "Of 70 students, 25 play chess, 12 play tennis and 4 play both. How many play neither?", "answer": "37", "options": ["37", "33", "29", "41"], "solution": "At least one: 25+12−4 = 33. Subtract from 70.", "level": "Advanced", "id": "VM-PRO-262"}, {"skill": "Sample spaces", "kind": "Fluency", "prompt": "How many outcomes for a fair coin?", "answer": "2", "options": ["2", "1", "3", "4"], "solution": "S = {H, T}<br>Count = 2", "id": "Y8-probability-25", "level": "s4"}, {"skill": "Theoretical probability", "kind": "Fluency", "prompt": "Find probability of rolling greater than 4.", "answer": "<span class=\"frac\"><span>1</span><span>3</span></span>", "options": ["F[1", "2]", "F[2", "3]", "F[1", "6]", "<span class=\"frac\"><span>1</span><span>3</span></span>"], "solution": "Outcomes: 5, 6<br>P = <span class=\"frac\"><span>2</span><span>6</span></span><br>= <span class=\"frac\"><span>1</span><span>3</span></span>", "id": "Y8-probability-26", "level": "s4"}, {"skill": "Complementary events", "kind": "Fluency", "prompt": "P(win) = 0.25. Find P(not win).", "answer": "0.75", "options": ["0.5", "1", "0.75", "0.25"], "solution": "1 − 0.25<br>= 0.75", "id": "Y8-probability-27", "level": "s4"}, {"skill": "Unequal spinner sectors", "kind": "Fluency", "prompt": "Find probability of a 120° sector.", "answer": "<span class=\"frac\"><span>1</span><span>3</span></span>", "options": ["F[1", "2]", "F[2", "3]", "<span class=\"frac\"><span>1</span><span>3</span></span>", "F[1", "4]"], "solution": "P = <span class=\"frac\"><span>120</span><span>360</span></span><br>= <span class=\"frac\"><span>1</span><span>3</span></span>", "id": "Y8-probability-28", "level": "s4"}, {"skill": "Two-stage experiments", "kind": "Fluency", "prompt": "Find probability of two heads.", "answer": "<span class=\"frac\"><span>1</span><span>4</span></span>", "options": ["<span class=\"frac\"><span>1</span><span>4</span></span>", "F[1", "2]", "F[3", "4]", "1"], "solution": "Favourable: HH<br>P = <span class=\"frac\"><span>1</span><span>4</span></span>", "id": "Y8-probability-29", "level": "s4"}, {"skill": "Tables of outcomes", "kind": "Fluency", "prompt": "Find probability of sum 12.", "answer": "<span class=\"frac\"><span>1</span><span>36</span></span>", "options": ["F[1", "6]", "F[2", "36]", "F[1", "12]", "<span class=\"frac\"><span>1</span><span>36</span></span>"], "solution": "Only (6, 6) gives sum 12<br>P = <span class=\"frac\"><span>1</span><span>36</span></span>", "id": "Y8-probability-30", "level": "s4"}, {"skill": "Mutually exclusive events", "kind": "Fluency", "prompt": "Find P(2 or 3) on a fair die.", "answer": "<span class=\"frac\"><span>1</span><span>3</span></span>", "options": ["6]", "F[1", "2]", "F[2", "3]", "<span class=\"frac\"><span>1</span><span>3</span></span>", "F[1"], "solution": "P = <span class=\"frac\"><span>1</span><span>6</span></span> + <span class=\"frac\"><span>1</span><span>6</span></span><br>= <span class=\"frac\"><span>2</span><span>6</span></span><br>= <span class=\"frac\"><span>1</span><span>3</span></span>", "id": "Y8-probability-31", "level": "s4"}, {"skill": "Experimental probability", "kind": "Fluency", "prompt": "A spinner lands red 12 times in 30 spins.", "answer": "0.4", "options": ["0.3", "0.4", "0.6", "0.12"], "solution": "P ≈ <span class=\"frac\"><span>12</span><span>30</span></span><br>= <span class=\"frac\"><span>2</span><span>5</span></span><br>= 0.4", "id": "Y8-probability-32", "level": "s4"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
