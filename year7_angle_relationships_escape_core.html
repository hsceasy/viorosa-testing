</head><body><main><nav><a href="year7_angle_relationships_hub.html">← Angle Relationships hub</a></nav><p>VIOROSA MATHS · Confidence that grows</p><h1>The Angle Academy</h1><p>Unlock six training stations to graduate from the academy.</p><section class="panel"><p id="status"></p><progress id="progress" max="6" value="0" aria-label="Locks opened"></progress><h2 id="question" tabindex="-1"></h2><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="hint">Show hint</button> <button id="next" hidden>Next lock</button> <button id="restart">Restart</button></section></main><script>const questions=[["A training dial turns through 135°. What type of angle is this?", ["acute", "obtuse", "reflex"], 1, "An obtuse angle is greater than 90° and less than 180°."], ["Two complementary angles include 37°. Find the other angle.", ["53°", "143°", "63°"], 0, "90 − 37 = 53°."], ["Two adjacent angles on a straight line include 116°. Find the other.", ["74°", "116°", "64°"], 2, "180 − 116 = 64°."], ["Three angles around a point are 95°, 130° and x°. Find x.", ["135°", "125°", "145°"], 0, "360 − 95 − 130 = 135°."], ["Two lines intersect. One angle is 83°. Find its vertically opposite angle.", ["97°", "83°", "107°"], 1, "Vertically opposite angles are equal."], ["A triangle has angles 48°, 67° and x°. Find x.", ["75°", "115°", "65°"], 2, "180 − 48 − 67 = 65°."]];let i=0,solved=false;const $=id=>document.getElementById(id);function render(){solved=false;$('progress').value=i;$('status').textContent=i+' of 6 locks opened';$('feedback').textContent='';$('choices').replaceChildren();$('next').hidden=true;$('hint').hidden=i===6;if(i===6){$('question').textContent='Escape complete! All six locks opened.';$('question').focus();return;}const q=questions[i];$('question').textContent='Lock '+(i+1)+': '+q[0];q[1].forEach((option,j)=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>{if(solved)return;if(j!==q[2]){$('feedback').textContent='Not quite. Try another answer or use the hint.';return;}solved=true;$('progress').value=i+1;$('status').textContent=(i+1)+' of 6 locks opened';$('feedback').textContent='Unlocked! '+q[3];$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('hint').hidden=true;$('next').hidden=false;$('next').textContent=i===5?'Finish escape':'Next lock';$('next').focus();};$('choices').append(b);});$('question').focus();}const hints=["Compare the angle with 90° and 180°.", "Complementary angles sum to 90°.", "Angles on a straight line sum to 180°.", "Angles around a point sum to 360°.", "Opposite angles at an intersection are equal.", "Triangle angles sum to 180°."];$('hint').onclick=()=>{$('feedback').textContent=hints[i];};$('next').onclick=()=>{if(solved){i++;render();}};$('restart').onclick=()=>{i=0;render();};render();</script></body></html>
