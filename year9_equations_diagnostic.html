<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equations Diagnostic | Viorosa Maths</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link rel="stylesheet" href="viorosa-theme.css"><main class="wrap"><a href="year9_equations_hub.html">← Learning hub</a><header><span class="pill">YEAR 9 · DIAGNOSTIC</span><h1>Equations A</h1><p>Answer all 24 questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"id": "VM-EQ-342", "skill": "Three-step equations", "prompt": "Solve 4x + 12 − 15 = 49.", "answer": "13", "solution": "Combine constants: 4x − 3 = 49. Add 3: 4x = 52. Divide by 4: x = 13.", "level": "Diagnostic", "source_paragraph": 167, "options": ["12", "14", "13", "15"]}, {"id": "VM-EQ-343", "skill": "Unknown on both sides", "prompt": "Solve 6x + 12 = 4x + 38.", "answer": "13", "solution": "Subtract 4x and 12 from both sides: 2x = 26. Divide by 2: x = 13.", "level": "Diagnostic", "source_paragraph": 168, "options": ["13", "15", "14", "12"]}, {"id": "VM-EQ-344", "skill": "Grouping symbols", "prompt": "Solve 4(x + 12) = 100.", "answer": "13", "solution": "Divide by 4: x + 12 = 25. Subtract 12: x = 13.", "level": "Diagnostic", "source_paragraph": 169, "options": ["14", "12", "13", "15"]}, {"id": "VM-EQ-345", "skill": "Verification", "prompt": "Which value of x satisfies 4x − 12 = 40? Verify by substitution.", "answer": "13", "solution": "Substitute x = 13: 4 × 13 − 12 = 40, equal to the right-hand side.", "level": "Diagnostic", "source_paragraph": 170, "options": ["14", "15", "12", "13"]}, {"id": "VM-EQ-346", "skill": "Fractional equations", "prompt": "Solve <span class=\"frac\"><span>x + 12</span><span>4</span></span> = 25.", "answer": "88", "solution": "Multiply both sides by 4: x + 12 = 100. Subtract 12: x = 88.", "level": "Diagnostic", "source_paragraph": 172, "options": ["87", "88", "89", "90"]}, {"id": "VM-EQ-347", "skill": "Formula substitution", "prompt": "The formula P = 2l + 2w gives a rectangle’s perimeter. Find l when P = 50 and w = 12.", "answer": "13", "solution": "Substitute: 50 = 2l + 24. Subtract 24: 2l = 26. Divide by 2: l = 13.", "level": "Diagnostic", "source_paragraph": 174, "options": ["14", "13", "12", "15"]}, {"id": "VM-EQ-348", "skill": "Word problems", "prompt": "A delivery costs $12 plus $4 per kilometre. The total is $64. How many kilometres were travelled?", "answer": "13", "solution": "Let x be the distance in kilometres. 12 + 4x = 64. Subtract 12, then divide by 4: x = 13 km.", "level": "Diagnostic", "source_paragraph": 176, "options": ["14", "13", "12", "15"]}, {"id": "VM-EQ-349", "skill": "Word problems", "prompt": "A rectangle is 12 cm longer than it is wide. Its perimeter is 76 cm. Find its width in centimetres.", "answer": "13", "solution": "Let x be the width. 2x + 2(x + 12) = 76. Simplify: 4x + 24 = 76. Subtract 24, then divide by 4: x = 13 cm.", "level": "Diagnostic", "source_paragraph": 176, "options": ["12", "15", "14", "13"]}, {"id": "VM-EQ-350", "skill": "Three-step equations", "prompt": "Solve 5x + 13 − 16 = 67.", "answer": "14", "solution": "Combine constants: 5x − 3 = 67. Add 3: 5x = 70. Divide by 5: x = 14.", "level": "Diagnostic", "source_paragraph": 167, "options": ["16", "14", "15", "13"]}, {"id": "VM-EQ-351", "skill": "Unknown on both sides", "prompt": "Solve 7x + 13 = 5x + 41.", "answer": "14", "solution": "Subtract 5x and 13 from both sides: 2x = 28. Divide by 2: x = 14.", "level": "Diagnostic", "source_paragraph": 168, "options": ["13", "16", "14", "15"]}, {"id": "VM-EQ-352", "skill": "Grouping symbols", "prompt": "Solve 5(x + 13) = 135.", "answer": "14", "solution": "Divide by 5: x + 13 = 27. Subtract 13: x = 14.", "level": "Diagnostic", "source_paragraph": 169, "options": ["15", "13", "14", "16"]}, {"id": "VM-EQ-353", "skill": "Verification", "prompt": "Which value of x satisfies 5x − 13 = 57? Verify by substitution.", "answer": "14", "solution": "Substitute x = 14: 5 × 14 − 13 = 57, equal to the right-hand side.", "level": "Diagnostic", "source_paragraph": 170, "options": ["14", "16", "13", "15"]}, {"id": "VM-EQ-354", "skill": "Fractional equations", "prompt": "Solve <span class=\"frac\"><span>x + 13</span><span>5</span></span> = 27.", "answer": "122", "solution": "Multiply both sides by 5: x + 13 = 135. Subtract 13: x = 122.", "level": "Diagnostic", "source_paragraph": 172, "options": ["123", "124", "122", "121"]}, {"id": "VM-EQ-355", "skill": "Formula substitution", "prompt": "The formula P = 2l + 2w gives a rectangle’s perimeter. Find l when P = 54 and w = 13.", "answer": "14", "solution": "Substitute: 54 = 2l + 26. Subtract 26: 2l = 28. Divide by 2: l = 14.", "level": "Diagnostic", "source_paragraph": 174, "options": ["16", "15", "13", "14"]}, {"id": "VM-EQ-356", "skill": "Word problems", "prompt": "A delivery costs $13 plus $5 per kilometre. The total is $83. How many kilometres were travelled?", "answer": "14", "solution": "Let x be the distance in kilometres. 13 + 5x = 83. Subtract 13, then divide by 5: x = 14 km.", "level": "Diagnostic", "source_paragraph": 176, "options": ["15", "14", "13", "16"]}, {"id": "VM-EQ-357", "skill": "Word problems", "prompt": "A rectangle is 13 cm longer than it is wide. Its perimeter is 82 cm. Find its width in centimetres.", "answer": "14", "solution": "Let x be the width. 2x + 2(x + 13) = 82. Simplify: 4x + 26 = 82. Subtract 26, then divide by 4: x = 14 cm.", "level": "Diagnostic", "source_paragraph": 176, "options": ["16", "15", "13", "14"]}, {"id": "VM-EQ-358", "skill": "Three-step equations", "prompt": "Solve 2x + 14 − 17 = 27.", "answer": "15", "solution": "Combine constants: 2x − 3 = 27. Add 3: 2x = 30. Divide by 2: x = 15.", "level": "Diagnostic", "source_paragraph": 167, "options": ["16", "14", "17", "15"]}, {"id": "VM-EQ-359", "skill": "Unknown on both sides", "prompt": "Solve 4x + 14 = 2x + 44.", "answer": "15", "solution": "Subtract 2x and 14 from both sides: 2x = 30. Divide by 2: x = 15.", "level": "Diagnostic", "source_paragraph": 168, "options": ["16", "17", "15", "14"]}, {"id": "VM-EQ-360", "skill": "Grouping symbols", "prompt": "Solve 2(x + 14) = 58.", "answer": "15", "solution": "Divide by 2: x + 14 = 29. Subtract 14: x = 15.", "level": "Diagnostic", "source_paragraph": 169, "options": ["16", "17", "14", "15"]}, {"id": "VM-EQ-361", "skill": "Verification", "prompt": "Which value of x satisfies 2x − 14 = 16? Verify by substitution.", "answer": "15", "solution": "Substitute x = 15: 2 × 15 − 14 = 16, equal to the right-hand side.", "level": "Diagnostic", "source_paragraph": 170, "options": ["14", "15", "16", "17"]}, {"id": "VM-EQ-362", "skill": "Fractional equations", "prompt": "Solve <span class=\"frac\"><span>x + 14</span><span>2</span></span> = 29.", "answer": "44", "solution": "Multiply both sides by 2: x + 14 = 58. Subtract 14: x = 44.", "level": "Diagnostic", "source_paragraph": 172, "options": ["44", "43", "45", "46"]}, {"id": "VM-EQ-363", "skill": "Formula substitution", "prompt": "The formula P = 2l + 2w gives a rectangle’s perimeter. Find l when P = 58 and w = 14.", "answer": "15", "solution": "Substitute: 58 = 2l + 28. Subtract 28: 2l = 30. Divide by 2: l = 15.", "level": "Diagnostic", "source_paragraph": 174, "options": ["16", "15", "17", "14"]}, {"id": "VM-EQ-364", "skill": "Word problems", "prompt": "A delivery costs $14 plus $2 per kilometre. The total is $44. How many kilometres were travelled?", "answer": "15", "solution": "Let x be the distance in kilometres. 14 + 2x = 44. Subtract 14, then divide by 2: x = 15 km.", "level": "Diagnostic", "source_paragraph": 176, "options": ["15", "17", "14", "16"]}, {"id": "VM-EQ-365", "skill": "Word problems", "prompt": "A rectangle is 14 cm longer than it is wide. Its perimeter is 88 cm. Find its width in centimetres.", "answer": "15", "solution": "Let x be the width. 2x + 2(x + 14) = 88. Simplify: 4x + 28 = 88. Subtract 28, then divide by 4: x = 15 cm.", "level": "Diagnostic", "source_paragraph": 176, "options": ["15", "16", "17", "14"]}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
