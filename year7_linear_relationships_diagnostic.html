nchor=\"middle\" font-size=\"10\">-2</text><text x=\"140\" y=\"192\" text-anchor=\"end\" font-size=\"10\">-2</text><path d=\"M126 20 V260 M30 164 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"126\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-1</text><text x=\"140\" y=\"168\" text-anchor=\"end\" font-size=\"10\">-1</text><path d=\"M150 20 V260 M30 140 H270\" stroke=\"#625563\" fill=\"none\"/><path d=\"M174 20 V260 M30 116 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"174\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">1</text><text x=\"140\" y=\"120\" text-anchor=\"end\" font-size=\"10\">1</text><path d=\"M198 20 V260 M30 92 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"198\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">2</text><text x=\"140\" y=\"96\" text-anchor=\"end\" font-size=\"10\">2</text><path d=\"M222 20 V260 M30 68 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"222\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">3</text><text x=\"140\" y=\"72\" text-anchor=\"end\" font-size=\"10\">3</text><path d=\"M246 20 V260 M30 44 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"246\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">4</text><text x=\"140\" y=\"48\" text-anchor=\"end\" font-size=\"10\">4</text><path d=\"M270 20 V260 M30 20 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"270\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">5</text><text x=\"140\" y=\"24\" text-anchor=\"end\" font-size=\"10\">5</text><text x=\"280\" y=\"136\">x</text><text x=\"158\" y=\"15\">y</text><circle cx=\"222\" cy=\"188\" r=\"4\" fill=\"#9568aa\"/></svg>", "options": ["(−2, 3)", "(−3, 2)", "(3, −2)", "(3, 2)"], "correct": 2, "why": "Move 3 right and 2 down."}, {"skill": "Coordinates", "prompt": "Which point lies on the y-axis?", "options": ["(0, −5)", "(−5, 0)", "(1, 5)", "(5, 1)"], "correct": 0, "why": "Every point on the y-axis has x = 0."}, {"skill": "Patterns and tables", "prompt": "Find the next term: 19, 15, 11, 7, …", "options" 40\" y=\"120\" text-anchor=\"end\" font-size=\"10\">1</text><path d=\"M198 20 V260 M30 92 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"198\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">2</text><text x=\"140\" y=\"96\" text-anchor=\"end\" font-size=\"10\">2</text><path d=\"M222 20 V260 M30 68 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"222\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">3</text><text x=\"140\" y=\"72\" text-anchor=\"end\" font-size=\"10\">3</text><path d=\"M246 20 V260 M30 44 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"246\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">4</text><text x=\"140\" y=\"48\" text-anchor=\"end\" font-size=\"10\">4</text><path d=\"M270 20 V260 M30 20 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"270\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">5</text><text x=\"140\" y=\"24\" text-anchor=\"end\" font-size=\"10\">5</text><text x=\"280\" y=\"136\">x</text><text x=\"158\" y=\"15\">y</text><polyline points=\"54,92 150,92 246,92\" fill=\"none\" stroke=\"#9568aa\" stroke-width=\"3\"/><circle cx=\"54\" cy=\"92\" r=\"4\" fill=\"#9568aa\"/><circle cx=\"150\" cy=\"92\" r=\"4\" fill=\"#9568aa\"/><circle cx=\"246\" cy=\"92\" r=\"4\" fill=\"#9568aa\"/></svg>", "options": ["y = 2", "x = 2", "y = 2x", "y = −2"], "correct": 0, "why": "The y-coordinate is always 2."}, {"skill": "Graphs", "prompt": "Which point lies on x = −3?", "options": ["(3, −3)", "(0, −3)", "(−2, 3)", "(−3, 4)"], "correct": 3, "why": "Every point on this vertical line has x = −3."}, {"skill": "Graphs", "prompt": "Which relationship is non-linear?", "options": ["y = 3x + 1", "y = x²", "y = −x", "y = 4"], "correct": 1, "why": "Squaring x gives a changing rate of change."}, {"skill": "Graphs", "prompt": "Which point belongs to y = 2x − 1?", "options": ["(2, 5)", "(−1, 1)", "(3, 5)", "(0, 1)"], "correct": 2, "why": "2 × 3 − 1 = 5."}, {"skill": "Rules", "prompt": "Find the rule for x: 0, 1, 2 and y: 6, 10, 14.", "options": ["y = 4x + 6", "y = 6x + 4", "y = 4x", "y = x + 6"], "correct": 0, "why": "The starting value is 6 and each unit increase adds 4."}, {"skill": "Rules", "prompt": "Find the rule for this graph.<svg viewBox=\"0 0 300 280\" width=\"300\" role=\"img\" aria-label=\"Cartesian grid with plotted points\"><path d=\"M30 20 V260 M30 260 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"30\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-5</text><text x=\"140\" y=\"264\" text-anchor=\"end\" font-size=\"10\">-5</text><path d=\"M54 20 V260 M30 236 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"54\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-4</text><text x=\"140\" y=\"240\" text-anchor=\"end\" font-size=\"10\">-4</text><path d=\"M78 20 V260 M30 212 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"78\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-3</text><text x=\"140\" y=\"216\" text-anchor=\"end\" font-size=\"10\">-3</text><path d=\"M102 20 V260 M30 188 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"102\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-2</text><text x=\"140\" y=\"192\" text-anchor=\"end\" font-size=\"10\">-2</text><path d=\"M126 20 V260 M30 164 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"126\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">-1</text><text x=\"140\" y=\"168\" text-anchor=\"end\" font-size=\"10\">-1</text><path d=\"M150 20 V260 M30 140 H270\" stroke=\"#625563\" fill=\"none\"/><path d=\"M174 20 V260 M30 116 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"174\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">1</text><text x=\"140\" y=\"120\" text-anchor=\"end\" font-size=\"10\">1</text><path d=\"M198 20 V260 M30 92 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"198\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">2</text><text x=\"140\" y=\"96\" text-anchor=\"end\" font-size=\"10\">2</text><path d=\"M222 20 V260 M30 68 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"222\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">3</text><text x=\"140\" y=\"72\" text-anchor=\"end\" font-size=\"10\">3</text><path d=\"M246 20 V260 M30 44 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"246\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">4</text><text x=\"140\" y=\"48\" text-anchor=\"end\" font-size=\"10\">4</text><path d=\"M270 20 V260 M30 20 H270\" stroke=\"#ddd5df\" fill=\"none\"/><text x=\"270\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">5</text><text x=\"140\" y=\"24\" text-anchor=\"end\" font-size=\"10\">5</text><text x=\"280\" y=\"136\">x</text><text x=\"158\" y=\"15\">y</text><polyline points=\"102,44 150,92 198,140 246,188\" fill=\"none\" stroke=\"#9568aa\" stroke-width=\"3\"/><circle cx=\"102\" cy=\"44\" r=\"4\" fill=\"#9568aa\"/><circle cx=\"150\" cy=\"92\" r=\"4\" fill=\"#9568aa\"/><circle cx=\"198\" cy=\"140\" r=\"4\" fill=\"#9568aa\"/><circle cx=\"246\" cy=\"188\" r=\"4\" fill=\"#9568aa\"/></svg>", "options": ["y = x + 2", "y = −2x", "y = −x − 2", "y = −x + 2"], "correct": 3, "why": "The line falls 1 per unit and crosses the y-axis at 2."}, {"skill": "Rules", "prompt": "Is x: 0, 2, 5 and y: 3, 7, 13 a linear relationship?", "options": ["No, the y differences differ", "Yes, y increases by 2 per unit of x", "No, x intervals differ", "Yes, y is constant"], "correct": 1, "why": "The changes are 4 over 2 and 6 over 3: both rates equal 2."}, {"skill": "Applications", "prompt": "A hire shop charges $9 plus $4 per hour. What is the cost for 5 hours?", "options": ["$20", "$45", "$29", "$13"], "correct": 2, "why": "9 + 4 × 5 = 29 dollars."}, {"skill": "Applications", "prompt": "A walker is 300 m from home at both 5 and 10 minutes, with a horizontal graph segment between these times. What does the graph show?", "options": ["Distance from home stays constant", "The walker returns home", "Distance increases by 300 m", "The walker is at home"], "correct": 0, "why": "A horizontal segment means the measured distance is unchanged."}, {"skill": "Applications", "prompt": "A tank starts with 36 L and loses 6 L each minute. When is it empty?", "options": ["30 min", "5 min", "42 min", "6 min"], "correct": 3, "why": "36 − 6t = 0, so t = 6 minutes."}];const quiz=document.getElementById('quiz'), feedback=document.getElementById('feedback'),progress=document.getElementById('progress');function render(){quiz.innerHTML=questions.map((q,i)=>`<article><fieldset><legend>Question ${i+1} · ${q.skill}</legend><p>${q.prompt}</p>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</fieldset></article>`).join('');update()}function update(){progress.textContent=quiz.querySelectorAll('input:checked').length+' of 16 answered';feedback.hidden=true}quiz.addEventListener('change',update);quiz.addEventListener('submit',e=>e.preventDefault());document.getElementById('mark').onclick=()=>{let answers=questions.map((q,i)=>quiz.querySelector(`input[name=q${i}]:checked`));feedback.hidden=false;if(answers.some(a=>!a)){feedback.textContent='Please answer all 16 questions before marking.';return}let total=0,skills={};let review=questions.map((q,i)=>{let ok=Number(answers[i].value)===q.correct;total+=Number(ok);let a=skills[q.skill]??=[0,0];a[0]+=Number(ok);a[1]++;return `<p><strong>Q${i+1}: ${ok?'Correct':'Incorrect'}</strong> — ${q.options[q.correct]}. ${q.why}</p>`});feedback.innerHTML=`<h2>Score: ${total}/16 (${Math.round(total/16*100)}%)</h2><h3>Revision priorities</h3>${Object.entries(skills).map(([k,[a,b]])=>`<p><strong>${k}: ${a}/${b}</strong> — ${a===b?'Keep practising to consolidate.':'Revisit this topic in the hub.'}</p>`).join('')}<p><a href="year7_linear_relationships_hub.html">Return to practice hub</a></p><h3>Answer review</h3>${review.join('')}`;feedback.scrollIntoView({block:'start'})};document.getElementById('reset').onclick=()=>{quiz.reset();update();window.scrollTo(0,0)};render();</script></html>
