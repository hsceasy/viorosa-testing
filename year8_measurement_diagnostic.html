<meta name="description" content="Check your understanding of Year 8 Measurement with a free maths diagnostic test from Viorosa Maths."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link href="viorosa-theme.css" rel="stylesheet"/><main class="wrap"><a href="year8_measurement_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Measurement</h1><p>Answer all eight questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"prompt": "Area of a triangle with base 12 cm and perpendicular height 7 cm?", "answer": "42 cm²", "options": ["42 cm²", "84 cm²", "19 cm²", "38 cm²"], "solution": "Half of 12 × 7 is 42.", "skill": "Area", "id": "VM-ME-213"}, {"prompt": "Circumference of a circle of diameter 10 cm?", "answer": "10π cm", "options": ["10π cm", "20π cm", "25π cm", "100π cm"], "solution": "C = πd.", "skill": "Circles", "id": "VM-ME-214"}, {"prompt": "Convert 2.5 m² to cm².", "answer": "25 000 cm²", "options": ["25 000 cm²", "250 cm²", "2500 cm²", "250 000 cm²"], "solution": "Multiply by 100².", "skill": "Units", "id": "VM-ME-215"}, {"prompt": "Volume of a prism with cross-sectional area 15 cm² and length 8 cm?", "answer": "120 cm³", "options": ["120 cm³", "23 cm³", "60 cm³", "120 cm²"], "solution": "Multiply area by length.", "skill": "Volume", "id": "VM-ME-216"}, {"prompt": "Area of a circle of radius 6 cm?", "answer": "36π cm²", "options": ["36π cm²", "12π cm²", "6π cm²", "144π cm²"], "solution": "A = πr².", "skill": "Circles", "id": "VM-ME-217"}, {"prompt": "Convert 3500 mL to litres.", "answer": "3.5 L", "options": ["3.5 L", "35 L", "0.35 L", "350 L"], "solution": "Divide by 1000.", "skill": "Units", "id": "VM-ME-218"}, {"prompt": "Surface area of a cube of side 4 cm?", "answer": "96 cm²", "options": ["96 cm²", "64 cm²", "16 cm²", "24 cm²"], "solution": "Six faces each have area 16.", "skill": "Surface area", "id": "VM-ME-219"}, {"prompt": "Area of a trapezium with parallel sides 6 and 10 cm, height 5 cm?", "answer": "40 cm²", "options": ["40 cm²", "80 cm²", "30 cm²", "50 cm²"], "solution": "Half of (6 + 10) × 5.", "skill": "Area", "id": "VM-ME-220"}, {"skill": "Capacity", "prompt": "Convert 2500 mL to litres.", "answer": "2.5 L", "options": ["2.5 L", "25 L", "0.25 L", "250 L"], "solution": "Divide millilitres by 1000.", "level": "Foundation", "id": "VM-ME-226"}, {"skill": "Cylinder volume", "prompt": "A cylinder has radius 2 cm and height 7 cm. Find its exact volume.", "answer": "28π cm³", "options": ["28π cm³", "56π cm³", "14π cm³", "32π cm³"], "solution": "V = πr²h = π × 2² × 7.", "level": "Intermediate", "id": "VM-ME-227"}, {"skill": "Composite area", "prompt": "A 10 cm by 8 cm rectangle has a 2 cm by 3 cm corner removed. Find the remaining area.", "answer": "74", "options": ["74", "80", "86", "76"], "solution": "Subtract 6 from 80.", "level": "Intermediate", "id": "VM-ME-228"}, {"skill": "Volume and capacity", "prompt": "A tank holds 6 L. Its base area is 600 cm². Find the water depth in cm.", "answer": "10", "options": ["10", "100", "4", "20"], "solution": "Convert to 6000 cm³ and divide by 600.", "level": "Intermediate", "id": "VM-ME-229"}, {"skill": "Capacity", "prompt": "Convert 3750 mL to litres.", "answer": "3.75 L", "options": ["3.75 L", "37.5 L", "0.375 L", "375 L"], "solution": "Divide millilitres by 1000.", "level": "Foundation", "id": "VM-ME-230"}, {"skill": "Cylinder volume", "prompt": "A cylinder has radius 3 cm and height 7 cm. Find its exact volume.", "answer": "63π cm³", "options": ["63π cm³", "126π cm³", "21π cm³", "72π cm³"], "solution": "V = πr²h = π × 3² × 7.", "level": "Intermediate", "id": "VM-ME-231"}, {"skill": "Composite area", "prompt": "A 11 cm by 8 cm rectangle has a 3 cm by 3 cm corner removed. Find the remaining area.", "answer": "79", "options": ["79", "88", "97", "82"], "solution": "Subtract 9 from 88.", "level": "Intermediate", "id": "VM-ME-232"}, {"skill": "Volume and capacity", "prompt": "A tank holds 9 L. Its base area is 600 cm². Find the water depth in cm.", "answer": "15", "options": ["15", "150", "6", "30"], "solution": "Convert to 9000 cm³ and divide by 600.", "level": "Intermediate", "id": "VM-ME-233"}, {"skill": "Capacity", "prompt": "Convert 5000 mL to litres.", "answer": "5 L", "options": ["5 L", "50 L", "0.5 L", "500 L"], "solution": "Divide millilitres by 1000.", "level": "Foundation", "id": "VM-ME-234"}, {"skill": "Cylinder volume", "prompt": "A cylinder has radius 4 cm and height 7 cm. Find its exact volume.", "answer": "112π cm³", "options": ["112π cm³", "224π cm³", "28π cm³", "128π cm³"], "solution": "V = πr²h = π × 4² × 7.", "level": "Intermediate", "id": "VM-ME-235"}, {"skill": "Composite area", "prompt": "A 12 cm by 8 cm rectangle has a 4 cm by 3 cm corner removed. Find the remaining area.", "answer": "84", "options": ["84", "96", "108", "88"], "solution": "Subtract 12 from 96.", "level": "Intermediate", "id": "VM-ME-236"}, {"skill": "Volume and capacity", "prompt": "A tank holds 12 L. Its base area is 600 cm². Find the water depth in cm.", "answer": "20", "options": ["20", "200", "8", "40"], "solution": "Convert to 12000 cm³ and divide by 600.", "level": "Intermediate", "id": "VM-ME-237"}, {"skill": "Capacity", "prompt": "Convert 6250 mL to litres.", "answer": "6.25 L", "options": ["6.25 L", "62.5 L", "0.625 L", "625 L"], "solution": "Divide millilitres by 1000.", "level": "Foundation", "id": "VM-ME-238"}, {"skill": "Cylinder volume", "prompt": "A cylinder has radius 5 cm and height 7 cm. Find its exact volume.", "answer": "175π cm³", "options": ["175π cm³", "350π cm³", "35π cm³", "200π cm³"], "solution": "V = πr²h = π × 5² × 7.", "level": "Intermediate", "id": "VM-ME-239"}, {"skill": "Composite area", "prompt": "A 13 cm by 8 cm rectangle has a 5 cm by 3 cm corner removed. Find the remaining area.", "answer": "89", "options": ["89", "104", "119", "94"], "solution": "Subtract 15 from 104.", "level": "Intermediate", "id": "VM-ME-240"}, {"skill": "Volume and capacity", "prompt": "A tank holds 15 L. Its base area is 600 cm². Find the water depth in cm.", "answer": "25", "options": ["25", "250", "10", "50"], "solution": "Convert to 15000 cm³ and divide by 600.", "level": "Intermediate", "id": "VM-ME-241"}, {"skill": "Length conversions", "kind": "Fluency", "prompt": "Convert 3.6 m to cm.", "answer": "360 cm", "options": ["360 cm", "36 cm", "3600 cm", "0.036 cm"], "solution": "3.6 × 100<br>= 360 cm", "id": "Y8-measurement-25", "level": "s4"}, {"skill": "Area conversions", "kind": "Fluency", "prompt": "Convert 2 m² to cm².", "answer": "20000 cm²", "options": ["200 cm²", "2000 cm²", "20 cm²", "20000 cm²"], "solution": "2 × 100²<br>= 20000 cm²", "id": "Y8-measurement-26", "level": "s4"}, {"skill": "Composite perimeter", "kind": "Fluency", "prompt": "Find perimeter of a 12 by 9 cm rectangle with a 3 by 2 cm corner removed.", "answer": "42 cm", "options": ["48 cm", "108 cm", "42 cm", "32 cm"], "solution": "P = 12 + 7 + 3 + 2 + 9 + 9<br>= 42 cm", "id": "Y8-measurement-27", "level": "s4"}, {"skill": "Composite area", "kind": "Fluency", "prompt": "Find area of a 12 by 9 cm rectangle with a 3 by 2 cm corner removed.", "answer": "102 cm²", "options": ["96 cm²", "102 cm²", "108 cm²", "114 cm²"], "solution": "A = 12 × 9 − 3 × 2<br>= 108 − 6<br>= 102 cm²", "id": "Y8-measurement-28", "level": "s4"}, {"skill": "Triangle area", "kind": "Fluency", "prompt": "Find area for base 10 cm and height 6 cm.", "answer": "30 cm²", "options": ["30 cm²", "60 cm²", "16 cm²", "15 cm²"], "solution": "A = <span class=\"frac\"><span>10 × 6</span><span>2</span></span><br>= <span class=\"frac\"><span>60</span><span>2</span></span><br>= 30 cm²", "id": "Y8-measurement-29", "level": "s4"}, {"skill": "Trapezium area", "kind": "Fluency", "prompt": "Parallel sides 5 and 9 cm, height 6 cm. Find area.", "answer": "42 cm²", "options": ["84 cm²", "30 cm²", "54 cm²", "42 cm²"], "solution": "A = <span class=\"frac\"><span>5 + 9</span><span>2</span></span> × 6<br>= 7 × 6<br>= 42 cm²", "id": "Y8-measurement-30", "level": "s4"}, {"skill": "Volume conversions", "kind": "Fluency", "prompt": "Convert 3 m³ to cm³.", "answer": "3000000 cm³", "options": ["30000 cm³", "3000 cm³", "3000000 cm³", "300 cm³"], "solution": "3 × 100³<br>= 3000000 cm³", "id": "Y8-measurement-31", "level": "s4"}, {"skill": "Capacity", "kind": "Fluency", "prompt": "Convert 3200 cm³ to litres.", "answer": "3.2 L", "options": ["0.32 L", "3.2 L", "32 L", "320 L"], "solution": "3200 ÷ 1000<br>= 3.2 L", "id": "Y8-measurement-32", "level": "s4"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
