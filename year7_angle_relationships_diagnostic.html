<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angle Relationships Diagnostic | Viorosa Maths</title><style>body{margin:0;background:#fff9f4;color:#493843;font:17px system-ui}main{max-width:900px;margin:auto;padding:24px}h1{font-family:Georgia;color:#a45070}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:10px 16px;border:1px solid #d9b4bc;border-radius:12px;background:#fbe6df;color:inherit;cursor:pointer}select{font:inherit;max-width:100%;padding:8px}article{overflow-wrap:anywhere}button[aria-pressed=true]{background:#f4dda0}article{background:white;border:1px solid #ecd8d0;border-radius:16px;padding:20px;margin:16px 0}label{display:block;padding:8px}summary{cursor:pointer} .notice{background:#f9edc9;padding:12px;border-radius:10px}img,svg{max-width:100%} .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac>*:first-child{border-bottom:1px solid} .filters{display:flex;flex-wrap:wrap;gap:8px} button:focus-visible,select:focus-visible{outline:3px solid #8563a6} .choices{display:flex;flex-wrap:wrap;gap:8px} article small{color:#854661} h2{font-family:Georgia} .score{font-weight:bold} *{box-sizing:border-box}body{background:linear-gradient(#fff8f2,#fff);line-height:1.55}main{max-width:1220px;padding:22px 20px 80px}.hero{background:linear-gradient(112deg,#ffe4d8,#f9edc9 55%,#f0e6f5);border-radius:30px;padding:38px 40px}.hero h1{font:800 clamp(2.5rem,5vw,4.5rem)/1.1 system-ui;letter-spacing:-.055em;margin:12px 0;color:#50404b}.eyebrow{font-size:.84rem;letter-spacing:.15em;font-weight:800;color:#87465a}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:26px 0}nav button{min-height:64px;background:white;font-weight:750;border-radius:17px}nav button[aria-pressed=true]{background:#a64e65;color:white;border-color:#a64e65}article{border-radius:20px;padding:23px 25px;box-shadow:0 3px 14px #6755890a}article details{background:#f9f1e5;border-radius:12px;padding:12px;margin-top:14px} .choices{display:grid;grid-template-columns:1fr}.choices button{text-align:left;background:white}.choices button[aria-pressed=true]{background:#f0e6f5;border:2px solid #a64e65}.guide{border:1px solid #eadbd3;border-radius:18px;background:white;padding:18px;margin:20px 0}.guide summary{font-weight:750;color:#87465a}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.formula-grid section{background:#fff9f4;border:1px solid #ecd8d0;border-radius:12px;padding:14px}.formula-grid h3{font-size:1rem;margin:0;color:#87465a}.formula-grid p{margin:8px 0}.frac{line-height:1.2;margin:0 .15em}.frac>span{padding:2px 4px}article svg{height:auto}article table{max-width:100%;border-collapse:collapse}article td,article th{border:1px solid #eadbd3;padding:6px}article div{overflow-x:auto} @media(max-width:650px){main{padding:12px}.hero{padding:28px 22px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}nav button{font-size:.9rem;padding:10px 5px}article{padding:18px}.formula-grid{grid-template-columns:1fr}.filters label{max-width:100%}}.frac{line-height:1.15;margin:0 .15em;white-space:nowrap}.frac>span{padding:0 .2em}article svg{display:block;height:auto;max-width:100%;margin:12px auto}article svg text{font-family:system-ui,sans-serif}[hidden]{display:none!important}.network-scroll{overflow-x:auto;max-width:100%}.network-scroll svg{min-width:680px;width:100%;max-width:none} @media(min-width:850px){.network-scroll svg{min-width:0;max-width:100%}}input{font:inherit;display:block;width:150px;max-width:100%;padding:8px;border:1px solid #d9b4bc;border-radius:8px}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #eadbd3;white-space:nowrap}caption{font-weight:bold} .links{display:flex;flex-wrap:wrap;gap:12px}.links a{background:#e9eee3;padding:12px;border-radius:12px;color:#493843} .line{width:100%;height:auto} .question-diagram{display:block;width:min(100%,300px);height:auto;margin:12px 0}label:has(input[type=radio]){border:1px solid #eadbd3;border-radius:10px;margin:8px 0;cursor:pointer}input[type=radio]{display:inline;width:auto;margin-right:10px}fieldset{border:0;padding:0;min-width:0}legend{font-weight:650}label:has(input:checked){background:#f0e6f5}</style><main><a href="year7_angle_relationships_hub.html">← Angle Relationships Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7 · STAGE 4</p><h1>Angle Relationships Diagnostic</h1><p>Confidence that grows.</p></header><p>Choose one answer for each question, then mark your diagnostic to find your revision priorities.</p><form id="quiz"></form><p id="progress" aria-live="polite"></p><button id="mark">Mark diagnostic</button> <button id="reset">Start again</button><article id="feedback" hidden aria-live="polite"></article></main><script>const questions=[{"skill": "Classifying and measuring angles", "prompt": "How is an angle of 218° classified?", "options": ["Obtuse", "Reflex", "Straight", "Acute"], "correct": 1, "why": "A reflex angle is greater than 180° and less than 360°."}, {"skill": "Classifying and measuring angles", "prompt": "A protractor has its baseline aligned with the right-hand ray. The scale starting at 0° on the right reads 38°; the other scale reads 142°. What is the angle?", "options": ["142°", "104°", "180°", "38°"], "correct": 3, "why": "Read the scale that starts at zero on the aligned ray."}, {"skill": "Complementary and supplementary angles", "prompt": "Find the complement of 37°.", "options": ["53°", "143°", "63°", "37°"], "correct": 0, "why": "Complementary angles sum to 90°: 90° − 37° = 53°."}, {"skill": "Complementary and supplementary angles", "prompt": "Two adjacent angles on a straight line are 116° and x°. Find x.", "options": ["116°", "244°", "64°", "74°"], "correct": 2, "why": "Angles on a straight line sum to 180°: 180° − 116° = 64°."}, {"skill": "Angles around a point and vertically opposite angles", "prompt": "Three angles around a point are 95°, 128° and x°. Find x.", "options": ["137°", "223°", "43°", "127°"], "correct": 0, "why": "Angles around a point sum to 360°: 360° − 95° − 128° = 137°."}, {"skill": "Angles around a point and vertically opposite angles", "prompt": "Two straight lines intersect. One angle is 67°. What is its vertically opposite angle?", "options": ["113°", "293°", "67°", "23°"], "correct": 2, "why": "Vertically opposite angles are equal."}, {"skill": "Corresponding and alternate angles", "prompt": "A transversal crosses two parallel lines. One angle is 124°. Find its corresponding angle.", "options": ["56°", "124°", "236°", "62°"], "correct": 1, "why": "Corresponding angles on parallel lines are equal."}, {"skill": "Corresponding and alternate angles", "prompt": "Two parallel lines are crossed by a transversal. One interior angle is 73°. Find its alternate interior angle.", "options": ["107°", "17°", "146°", "73°"], "correct": 3, "why": "Alternate interior angles on parallel lines are equal."}, {"skill": "Co-interior angles and parallel line reasoning", "prompt": "Two co-interior angles between parallel lines are 112° and x°. Find x.", "options": ["112°", "68°", "248°", "78°"], "correct": 1, "why": "Co-interior angles on parallel lines sum to 180°."}, {"skill": "Co-interior angles and parallel line reasoning", "prompt": "A transversal crosses two lines. A pair of corresponding angles measure 61° and 64°. What can you conclude?", "options": ["The lines are parallel", "The angles must sum to 180°", "The lines are not parallel", "The lines are perpendicular"], "correct": 2, "why": "If the lines were parallel, corresponding angles would be equal. They are not equal."}, {"skill": "Triangle angles", "prompt": "A triangle has angles 48°, 76° and x°. Find x.", "options": ["56°", "124°", "236°", "66°"], "correct": 0, "why": "Triangle interior angles sum to 180°: 180° − 48° − 76° = 56°."}, {"skill": "Triangle angles", "prompt": "An isosceles triangle has a vertex angle of 46°. Find each base angle.", "options": ["134°", "46°", "77°", "67°"], "correct": 3, "why": "The equal base angles share 180° − 46° = 134°, giving 67° each."}, {"skill": "Quadrilateral angles", "prompt": "Three interior angles of a quadrilateral are 84°, 103° and 92°. Find the fourth.", "options": ["101°", "81°", "279°", "91°"], "correct": 1, "why": "Quadrilateral interior angles sum to 360°: 360° − 279° = 81°."}, {"skill": "Quadrilateral angles", "prompt": "One interior angle of a parallelogram is 118°. Find an adjacent interior angle.", "options": ["118°", "242°", "72°", "62°"], "correct": 3, "why": "Adjacent interior angles of a parallelogram are supplementary."}, {"skill": "Multi-step angle reasoning", "prompt": "Two angles on a straight line are x° and (3x + 20)°. Find x.", "options": ["40°", "45°", "160°", "50°"], "correct": 0, "why": "x + 3x + 20 = 180, so 4x = 160 and x = 40."}, {"skill": "Multi-step angle reasoning", "prompt": "An exterior angle of a triangle is 132°. One non-adjacent interior angle is 57°. Find the other non-adjacent interior angle.", "options": ["48°", "123°", "75°", "105°"], "correct": 2, "why": "The exterior angle equals the sum of the two non-adjacent interior angles: 132° − 57° = 75°."}];const quiz=document.getElementById('quiz'), feedback=document.getElementById('feedback'),progress=document.getElementById('progress');function render(){quiz.innerHTML=questions.map((q,i)=>`<article><fieldset><legend>Question ${i+1} · ${q.skill}</legend><p>${q.prompt}</p>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</fieldset></article>`).join('');update()}function update(){progress.textContent=quiz.querySelectorAll('input:checked').length+' of 16 answered';feedback.hidden=true}quiz.addEventListener('change',update);quiz.addEventListener('submit',e=>e.preventDefault());document.getElementById('mark').onclick=()=>{let answers=questions.map((q,i)=>quiz.querySelector(`input[name=q${i}]:checked`));feedback.hidden=false;if(answers.some(a=>!a)){feedback.textContent='Please answer all 16 questions before marking.';return}let total=0,skills={};let review=questions.map((q,i)=>{let ok=Number(answers[i].value)===q.correct;total+=Number(ok);let a=skills[q.skill]??=[0,0];a[0]+=Number(ok);a[1]++;return `<p><strong>Q${i+1}: ${ok?'Correct':'Incorrect'}</strong> — ${q.options[q.correct]}. ${q.why}</p>`});feedback.innerHTML=`<h2>Score: ${total}/16 (${Math.round(total/16*100)}%)</h2><h3>Revision priorities</h3>${Object.entries(skills).map(([k,[a,b]])=>`<p><strong>${k}: ${a}/${b}</strong> — ${a===b?'Keep practising to consolidate.':'Revisit the related skills in the hub using the Skill filter.'}</p>`).join('')}<p><a href="year7_angle_relationships_hub.html">Return to practice hub</a></p><h3>Answer review</h3>${review.join('')}`;feedback.scrollIntoView({block:'start'})};document.getElementById('reset').onclick=()=>{quiz.reset();update();window.scrollTo(0,0)};render();</script></html>
