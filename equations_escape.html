ht:auto;margin:12px 0}</style><main><a href="year7_equations_hub.html">← Equations Hub</a><header class="hero"><p class="eyebrow">VIOROSA MATHS · YEAR 7</p><h1>The Balance Vault</h1></header><p>Unlock each room by entering its numerical code. Use the units specified in each question.</p><article id="room"><h2 id="progress"></h2><p id="question"></p><label>Code <input id="code" inputmode="decimal"></label><button id="check">Unlock</button> <button id="help">Show hint</button><p id="hint"></p><p id="feedback" aria-live="polite"></p></article><article id="done" hidden><h2>You escaped!</h2><p>All six rooms unlocked.</p><button id="restart">Play again</button></article></main><script>const rooms=[["Solve x + 16 = 29.", "13", "Subtract 16 from both sides."], ["Solve x − 8 = −11.", "-3", "Add 8 to both sides."], ["Solve 6x = 54.", "9", "Divide both sides by 6."], ["Solve <span class=\"frac\"><span>x</span><span>5</span></span> = 7.", "35", "Multiply both sides by 5."], ["Solve 3x + 8 = 29.", "7", "Subtract 8, then divide by 3."], ["A notebook and three identical pens cost $17. The notebook costs $5. Enter the price of one pen in dollars.", "4", "Solve 3x + 5 = 17."]];let i=0;const el=id=>document.getElementById(id);function show(){el('progress').textContent='Room '+(i+1)+' of '+rooms.length;el('question').innerHTML=rooms[i][0];el('code').value='';el('feedback').textContent='';el('hint').textContent=''}el('check').onclick=()=>{if(el('code').value.trim()===''||Number(el('code').value)!==Number(rooms[i][1])){el('feedback').textContent='Not quite. Check your calculation.';return}i++;if(i===rooms.length){el('room').hidden=true;el('done').hidden=false}else show()};el('help').onclick=()=>el('hint').textContent=rooms[i][2];el('code').addEventListener('keydown',e=>{if(e.key==='Enter')el('check').click()});el("restart").onclick=()=>{i=0;el("room").hidden=false;el("done").hidden=true;show()};show();</script></html>
