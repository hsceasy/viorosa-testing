<meta name="description" content="Check your understanding of Year 8 Data Analysis with a free maths diagnostic test from Viorosa Maths."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(140deg,#f8e0ec,#e9eee3 55%,#fff9f3);color:#50404b;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.sub{color:#776b72;line-height:1.6}.panel{background:#fffffff2;border:1px solid #fff;border-radius:23px;padding:25px;margin:16px 0;box-shadow:0 10px 32px #34475a16}.pill{display:inline-block;border-radius:20px;background:#f0e6f5;color:#a64e65;padding:6px 12px;font-size:.8rem;font-weight:750}.button{background:#a64e65;color:#fff;border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:#f0e6f5;color:#a64e65}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,input:focus-visible{outline:3px solid #e6a93d;outline-offset:2px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #ffe4d8;background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:58px}.option.selected{border-color:#a64e65;background:#f0e6f5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#776b72}.progress{height:11px;border-radius:20px;background:#f0e6f5;overflow:hidden}.progress>div{height:100%;background:#a64e65;transition:width .2s}.skills{display:grid;gap:13px}.skill{border:1px solid #f0e6f5;border-radius:13px;padding:13px}.skill .bar{height:9px;background:#ffe4d8;border-radius:10px;overflow:hidden;margin-top:8px}.skill .bar>div{height:100%;background:#80b6a3}.notice{background:#fff5df;border-radius:13px;padding:14px;line-height:1.55}.qtitle{font-size:1.3rem;line-height:1.5}.hide{display:none!important}a{color:#a64e65}.small{font-size:.9rem}.question-type{color:#776b72;font-weight:650}.solution{padding:12px 14px;background:#f0e6f5;border-radius:12px;margin-top:9px;line-height:1.55}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:19px}}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.92em;margin:0 .13em}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .16em .08em}.frac span:last-child{padding:.08em .16em 0}</style><link href="viorosa-theme.css" rel="stylesheet"/><main class="wrap"><a href="year8_data_hub.html">← Learning hub</a><header><span class="pill">YEAR 8 · DIAGNOSTIC</span><h1>Data Analysis</h1><p>Answer all eight questions, then review your results.</p></header><section class="panel" id="test"></section></main><script>const questions=[{"prompt": "Mean of 2, 4, 6, 12?", "answer": "6", "options": ["6", "5", "4", "8"], "solution": "24 ÷ 4 = 6.", "skill": "Mean", "id": "VM-DA-233"}, {"prompt": "Median of 9, 2, 5, 7?", "answer": "6", "options": ["6", "5", "7", "5.75"], "solution": "Order: 2, 5, 7, 9; average middle values.", "skill": "Median", "id": "VM-DA-234"}, {"prompt": "Mode of 1, 2, 2, 3, 5?", "answer": "2", "options": ["2", "3", "1", "5"], "solution": "2 occurs most often.", "skill": "Mode", "id": "VM-DA-235"}, {"prompt": "Range of 12, 18, 7, 15?", "answer": "11", "options": ["11", "18", "25", "5"], "solution": "18 − 7 = 11.", "skill": "Range", "id": "VM-DA-236"}, {"prompt": "Which is continuous data?", "answer": "Height", "options": ["Height", "Number of siblings", "Eye colour", "Postcode"], "solution": "Height can take any value in an interval.", "skill": "Data types", "id": "VM-DA-237"}, {"prompt": "Best graph for frequencies of favourite colours?", "answer": "Bar chart", "options": ["Bar chart", "Scatterplot", "Line graph", "Histogram"], "solution": "Colours are categorical.", "skill": "Displays", "id": "VM-DA-238"}, {"prompt": "Which measure is most affected by an extreme value?", "answer": "Mean", "options": ["Mean", "Median", "Mode", "None of these"], "solution": "The mean uses every value in the sum.", "skill": "Interpretation", "id": "VM-DA-239"}, {"prompt": "Which sample is least biased for a whole-school survey?", "answer": "Random students from every year", "options": ["Random students from every year", "Only friends", "Only Year 8", "Only sports team"], "solution": "Sampling across years improves representation.", "skill": "Sampling", "id": "VM-DA-240"}, {"skill": "Mean", "prompt": "Find the mean of 2, 4, 6, 8.", "answer": "5", "options": ["5", "4", "6", "8"], "solution": "Sum = 20; divide by 4.", "level": "Foundation", "id": "VM-DA-246"}, {"skill": "Median", "prompt": "Find the median of 11, 2, 5, 3, 7.", "answer": "5", "options": ["5", "3", "7", "11"], "solution": "Order: 2, 3, 5, 7, 11. The middle value is 5.", "level": "Intermediate", "id": "VM-DA-247"}, {"skill": "Range", "prompt": "A set of temperatures has minimum −2°C and maximum 12°C. Find the range.", "answer": "14", "options": ["14", "10", "12", "13"], "solution": "Maximum minus minimum: 12 − (−2) = 14.", "level": "Intermediate", "id": "VM-DA-248"}, {"skill": "Missing values", "prompt": "Five scores have mean 12. Four scores are 9, 10, 12, 13. Find the fifth.", "answer": "16", "options": ["16", "12", "14", "17"], "solution": "Total is 60; subtract 44.", "level": "Advanced", "id": "VM-DA-249"}, {"skill": "Mean", "prompt": "Find the mean of 3, 5, 7, 9.", "answer": "6", "options": ["6", "5", "7", "9"], "solution": "Sum = 24; divide by 4.", "level": "Foundation", "id": "VM-DA-250"}, {"skill": "Median", "prompt": "Find the median of 12, 3, 6, 4, 8.", "answer": "6", "options": ["6", "4", "8", "12"], "solution": "Order: 3, 4, 6, 8, 12. The middle value is 6.", "level": "Intermediate", "id": "VM-DA-251"}, {"skill": "Range", "prompt": "A set of temperatures has minimum −3°C and maximum 13°C. Find the range.", "answer": "16", "options": ["16", "10", "13", "15"], "solution": "Maximum minus minimum: 13 − (−3) = 16.", "level": "Intermediate", "id": "VM-DA-252"}, {"skill": "Missing values", "prompt": "Five scores have mean 13. Four scores are 10, 11, 13, 14. Find the fifth.", "answer": "17", "options": ["17", "13", "15", "18"], "solution": "Total is 65; subtract 48.", "level": "Advanced", "id": "VM-DA-253"}, {"skill": "Mean", "prompt": "Find the mean of 4, 6, 8, 10.", "answer": "7", "options": ["7", "6", "8", "10"], "solution": "Sum = 28; divide by 4.", "level": "Foundation", "id": "VM-DA-254"}, {"skill": "Median", "prompt": "Find the median of 13, 4, 7, 5, 9.", "answer": "7", "options": ["7", "5", "9", "13"], "solution": "Order: 4, 5, 7, 9, 13. The middle value is 7.", "level": "Intermediate", "id": "VM-DA-255"}, {"skill": "Range", "prompt": "A set of temperatures has minimum −4°C and maximum 14°C. Find the range.", "answer": "18", "options": ["18", "10", "14", "17"], "solution": "Maximum minus minimum: 14 − (−4) = 18.", "level": "Intermediate", "id": "VM-DA-256"}, {"skill": "Missing values", "prompt": "Five scores have mean 14. Four scores are 11, 12, 14, 15. Find the fifth.", "answer": "18", "options": ["18", "14", "16", "19"], "solution": "Total is 70; subtract 52.", "level": "Advanced", "id": "VM-DA-257"}, {"skill": "Mean", "prompt": "Find the mean of 5, 7, 9, 11.", "answer": "8", "options": ["8", "7", "9", "11"], "solution": "Sum = 32; divide by 4.", "level": "Foundation", "id": "VM-DA-258"}, {"skill": "Median", "prompt": "Find the median of 14, 5, 8, 6, 10.", "answer": "8", "options": ["8", "6", "10", "14"], "solution": "Order: 5, 6, 8, 10, 14. The middle value is 8.", "level": "Intermediate", "id": "VM-DA-259"}, {"skill": "Range", "prompt": "A set of temperatures has minimum −5°C and maximum 15°C. Find the range.", "answer": "20", "options": ["20", "10", "15", "19"], "solution": "Maximum minus minimum: 15 − (−5) = 20.", "level": "Intermediate", "id": "VM-DA-260"}, {"skill": "Missing values", "prompt": "Five scores have mean 15. Four scores are 12, 13, 15, 16. Find the fifth.", "answer": "19", "options": ["19", "15", "17", "20"], "solution": "Total is 75; subtract 56.", "level": "Advanced", "id": "VM-DA-261"}, {"skill": "Mean", "kind": "Fluency", "prompt": "Find mean of 3, 5, 7, 9.", "answer": "6", "options": ["6", "5", "7", "24"], "solution": "Mean = <span class=\"frac\"><span>3+5+7+9</span><span>4</span></span><br>= <span class=\"frac\"><span>24</span><span>4</span></span><br>= 6", "id": "Y8-data-25", "level": "s4"}, {"skill": "Median", "kind": "Fluency", "prompt": "Find median of 9, 3, 7, 5.", "answer": "6", "options": ["5", "7", "9", "6"], "solution": "Ordered: 3, 5, 7, 9<br>Median = <span class=\"frac\"><span>5+7</span><span>2</span></span><br>= 6", "id": "Y8-data-26", "level": "s4"}, {"skill": "Mode and range", "kind": "Fluency", "prompt": "Find range of 4, 5, 5, 10.", "answer": "6", "options": ["10", "4", "6", "5"], "solution": "Range = 10 − 4<br>= 6", "id": "Y8-data-27", "level": "s4"}, {"skill": "Frequency tables", "kind": "Fluency", "prompt": "Values 2, 4 occur 3, 1 times. Find mean.", "answer": "2.5", "options": ["10", "2.5", "3", "4"], "solution": "Total = 2 × 3 + 4 × 1<br>= 10<br>Count = 3 + 1 = 4<br>Mean = <span class=\"frac\"><span>10</span><span>4</span></span><br>= 2.5", "id": "Y8-data-28", "level": "s4"}, {"skill": "Dot plots", "kind": "Fluency", "prompt": "Which set has greater range: A: 2, 4, 6; B: 3, 4, 5?", "answer": "A", "options": ["A", "B", "Equal", "Neither"], "solution": "A range = 6 − 2 = 4<br>B range = 5 − 3 = 2<br>A", "id": "Y8-data-29", "level": "s4"}, {"skill": "Stem-and-leaf plots", "kind": "Fluency", "prompt": "Key 3:2 = 32. Leaves for stem 3 are 2, 5, 9. Find median.", "answer": "35", "options": ["32", "39", "5", "35"], "solution": "Values: 32, 35, 39<br>Middle value = 35", "id": "Y8-data-30", "level": "s4"}, {"skill": "Histograms", "kind": "Fluency", "prompt": "Frequencies 4, 6, 2. Find total.", "answer": "12", "options": ["10", "24", "12", "6"], "solution": "Total = 4 + 6 + 2<br>= 12", "id": "Y8-data-31", "level": "s4"}, {"skill": "Distribution shape", "kind": "Fluency", "prompt": "Most values are large with a few very small values. Identify shape.", "answer": "Negatively skewed", "options": ["Uniform", "Negatively skewed", "Positively skewed", "Symmetrical"], "solution": "Tail extends left.<br>Negatively skewed.", "id": "Y8-data-32", "level": "s4"}];let i=0, responses=[];const test=document.getElementById('test');function show(){if(i===questions.length){let score=responses.filter((r,j)=>r===questions[j].answer).length;test.innerHTML=`<h2>Result: ${score} / ${questions.length}</h2>`+questions.map((q,j)=>`<div class="skill"><strong>${q.id} · ${q.skill} · ${responses[j]===q.answer?'Correct':'Review'}</strong><p>${q.prompt}</p><p>Your answer: ${responses[j]}</p><p>Correct answer: ${q.answer}</p><p>${q.solution}</p></div>`).join('')+'<p><button class="button" onclick="location.reload()">Try again</button></p>';return;}let q=questions[i], opts=q.options.slice();for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}test.innerHTML=`<p>Question ${i+1} of ${questions.length}</p><div class="progress"><div style="width:${100*i/questions.length}%"></div></div><h2 class="qtitle">${q.prompt}</h2><p>${q.id}</p><div class="options"></div>`;for(const opt of opts){let b=document.createElement('button');b.className='option';b.innerHTML=opt;b.onclick=()=>{responses.push(opt);i++;show();};test.querySelector('.options').append(b);}}show();</script></html>
